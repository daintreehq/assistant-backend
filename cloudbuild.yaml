# Continuous deployment for the Daintree Assistant Server.
#
# Fired by the `deploy-main` Cloud Build trigger on every push to `main`; the
# trigger, service accounts, secrets, and registry are created by
# infra/gcp/bootstrap.sh. Nothing here is built on a developer machine — this is
# what "release" means in this repo, and .claude/skills/release drives it.
#
# The commit SHA is the only version this system has (see CLAUDE.md, "Versioning"):
# it tags the image, is baked into the container as BUILD_SHA, and is what
# `/version` reports back. That round trip is how a release is confirmed — the
# smoke step below refuses to promote a revision whose /version disagrees with
# the commit that triggered the build.
#
# Rollout is two-phase on purpose. A new revision is deployed with NO traffic
# behind the `candidate` tag and smoke-tested on its own URL; only a revision
# that answers /readyz gets promoted to 100%. Readiness covers failures that are
# invisible at build time — a missing or weak secret, a malformed prompt
# template, an unparseable skill file — so those turn into a red build instead
# of a broken production service.

substitutions:
  _SERVICE: daintree-assistant
  _REGION: us-central1
  _AR_REPO: daintree
  _RUNTIME_SA: daintree-assistant-run
  # State-signing key ids. A signed state token carries the kid it was signed
  # with, and verification selects the key by that kid — so a rotation only
  # preserves in-flight sessions if the OUTGOING key is mounted under the kid its
  # tokens actually name. Both are substitutions because both change on a
  # rotation, and a hardcoded current kid makes the previous one useless: the old
  # tokens say `state-prod`, the new key is also `state-prod`, and the previous
  # key is never selected.
  #
  # Rotating (a single release, then a second one once the old TTL has expired):
  #   1. copy the live key to a `state-signing-key-previous` secret
  #   2. write the new key to `state-signing-key-current`
  #   3. deploy with
  #      --substitutions=_CURRENT_KID=state-prod-2,_PREVIOUS_KID=state-prod
  #   4. after the token TTL, delete the previous secret and deploy again
  #
  # _PREVIOUS_KID is EMPTY by default and the deploy fails closed if the previous
  # secret exists without one — a plausible-but-wrong placeholder would silently
  # verify nothing, which presents as every session losing its skills at once.
  _CURRENT_KID: state-prod
  _PREVIOUS_KID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# The image build is a full `pip install` of the pinned runtime deps, so the
# 10-minute default is too tight to be safe.
timeout: 1800s

steps:
  # ---- Build ---------------------------------------------------------------
  # BUILD_SHA is a Dockerfile ARG that becomes a runtime ENV, so /version reports
  # a real commit rather than an empty string.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=BUILD_SHA=$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  # Pushed explicitly rather than via the top-level `images:` key, which only
  # runs after every step and would leave the deploy below with no image.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  # ---- Deploy the release candidate ---------------------------------------
  - id: deploy-rc
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"

        # Signing-key rotation: the PREVIOUS key rides alongside the current one so
        # a token issued before the rotation still verifies for the rest of its
        # TTL, rather than forcing a re-selection on every in-flight session.
        #
        # Mounted only when the secret exists, because --set-secrets fails the
        # deploy outright on a missing one and this secret does not exist outside a
        # rotation window. BOTH HALVES OR NEITHER: `Settings.missing_secrets`
        # rejects "STATE_SIGNING_KEY_PREVIOUS and STATE_SIGNING_KID_PREVIOUS must
        # be set together", so mounting the secret alone would fail the candidate's
        # /readyz and abort the release.
        ENV_FLAGS="ENVIRONMENT=production,LOG_LEVEL=INFO,STATE_SIGNING_KID=${_CURRENT_KID}"
        SECRET_FLAGS="STATE_SIGNING_KEY_CURRENT=state-signing-key-current:latest,STATE_SALT=state-salt:latest"

        # `describe` distinguishes ABSENT from FORBIDDEN. Treating every failure as
        # "no previous key" would turn a missing IAM grant into a silently
        # rotation-less deploy — the one outcome that looks fine and drops every
        # live session's state token.
        PREV_STATUS=0
        gcloud secrets describe state-signing-key-previous \
          --project="$PROJECT_ID" >/dev/null 2>/workspace/secret_err || PREV_STATUS=$$?
        if [ "$$PREV_STATUS" -eq 0 ]; then
          if [ -z "${_PREVIOUS_KID}" ]; then
            echo "ERROR: state-signing-key-previous exists but _PREVIOUS_KID is empty."
            echo "       Deploy with --substitutions=_CURRENT_KID=<new>,_PREVIOUS_KID=<old>"
            echo "       so tokens signed with the old kid still verify."
            exit 1
          fi
          if [ "${_PREVIOUS_KID}" = "${_CURRENT_KID}" ]; then
            # StateCodec installs the current key first and `setdefault`s the
            # previous ones, so a shared kid means the previous key is never
            # selected — the rotation would look configured and do nothing.
            echo "ERROR: _PREVIOUS_KID and _CURRENT_KID are both '${_CURRENT_KID}'."
            echo "       They must differ, or the previous key can never be selected."
            exit 1
          fi
          echo "Previous signing key found — mounting it as kid '${_PREVIOUS_KID}'."
          SECRET_FLAGS="$$SECRET_FLAGS,STATE_SIGNING_KEY_PREVIOUS=state-signing-key-previous:latest"
          ENV_FLAGS="$$ENV_FLAGS,STATE_SIGNING_KID_PREVIOUS=${_PREVIOUS_KID}"
        elif grep -qi 'not found\|NOT_FOUND' /workspace/secret_err 2>/dev/null; then
          echo "No previous signing key — deploying with the current key only."
        else
          # Permission denied, a transient API error, anything else. Failing closed
          # here costs a re-run; failing open ships a deploy that silently dropped
          # the rotation overlap.
          echo "ERROR: could not determine whether state-signing-key-previous exists:"
          cat /workspace/secret_err >&2
          exit 1
        fi

        # --set-* rather than --update-*: the deployed configuration is exactly
        # what this file says. A flag removed here is removed from the service
        # on the next release instead of lingering invisibly from an old one.
        #
        # min-instances=1 keeps one instance warm so no turn pays a cold start —
        # Python startup plus prompt and catalog load — on the first request
        # after a quiet spell. It buys that with a bill that now runs around the
        # clock rather than only while serving. --cpu-boost stays: it still
        # covers the SECOND instance and every scale-out above it, which are
        # cold by definition.
        #
        # Memory stays at 1Gi rather than dropping to 512Mi, but the reasoning
        # changed with the always-warm instance: idle memory is billed
        # continuously now, so this is a real recurring cost rather than the
        # rounding error it was under scale-to-zero. It is still the right
        # trade — the process holds the prompt templates and every skill body
        # resident, and an OOM restart costs more than the difference.
        #
        # timeout=420 is a CUSHION over the app's own 300s total turn deadline
        # (services/deadlines.py TOTAL), not an independent limit. It was 1800 —
        # six times the app budget — which made the platform limit unable to catch
        # anything: a request that escaped the app's own accounting would hold a
        # concurrency slot for half an hour before Cloud Run noticed. 420 leaves
        # two minutes of headroom for connection setup and response flush while
        # still bounding the pathological case. The app deadline stays the one
        # that fires in normal operation, so a client sees the typed
        # `turn_deadline_exceeded` error rather than a bare platform 504.
        #
        # Probes: the startup probe is generous (10 x 3s) because readiness waits
        # on prompt and catalog load; liveness talks to /healthz, which Cloud Run
        # reaches directly inside the container (its frontend only intercepts that
        # path from OUTSIDE). Liveness deliberately does NOT use /readyz —
        # readiness fails on configuration AND could be made to depend on an
        # upstream, and a transient provider blip must never restart a healthy
        # process mid-turn.
        FLAGS=(
          --image="$$IMAGE"
          --region="${_REGION}"
          --service-account="${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com"
          --port=8080
          --cpu=1
          --memory=1Gi
          --cpu-boost
          --concurrency=8
          --min-instances=1
          --max-instances=10
          --timeout=420
          --ingress=all
          --startup-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=3,timeoutSeconds=3,failureThreshold=10
          --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3
          --set-env-vars="$$ENV_FLAGS"
          --set-secrets="$$SECRET_FLAGS"
          --labels=commit-sha=$SHORT_SHA
          --quiet
        )

        if gcloud run services describe "${_SERVICE}" --region="${_REGION}" >/dev/null 2>&1; then
          # The tag must be at least 3 characters and a valid DNS label —
          # Cloud Run rejects a 2-character tag like "rc" outright.
          echo "Deploying $COMMIT_SHA as a no-traffic 'candidate' revision."
          gcloud run deploy "${_SERVICE}" "$${FLAGS[@]}" --no-traffic --tag=candidate
          gcloud run services describe "${_SERVICE}" --region="${_REGION}" --format=json \
            | python3 -c 'import json,sys; print(next(t["url"] for t in json.load(sys.stdin)["status"]["traffic"] if t.get("tag")=="candidate"))' \
            > /workspace/rc_url
          echo "Release candidate URL: $$(cat /workspace/rc_url)"
        else
          # First ever deploy: Cloud Run rejects --no-traffic when there is no
          # prior revision to keep serving, and the service is still IAM-private
          # until bootstrap.sh grants allUsers invoker — so an unauthenticated
          # smoke curl would get a platform 403 rather than an app response.
          # Create it, take traffic directly, and let bootstrap.sh finish up.
          echo "No existing service — creating ${_SERVICE} and routing traffic to it."
          gcloud run deploy "${_SERVICE}" "$${FLAGS[@]}"
          : > /workspace/skip_smoke
        fi

  # ---- Smoke-test the candidate before it can take traffic -----------------
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        if [ -f /workspace/skip_smoke ]; then
          echo "First deploy: no public invoker binding yet, skipping the smoke test."
          echo "Run infra/gcp/bootstrap.sh again to grant it, then re-release."
          exit 0
        fi
        URL="$$(cat /workspace/rc_url)"

        # Note /healthz is NOT used here. Google's frontend reserves that path
        # and serves its own HTML 404 for it, so the request never reaches the
        # container and `curl -fsS` would fail every release. The endpoint is
        # still fine for Cloud Run's own liveness probe, which talks to the
        # container directly. /readyz is the right external gate regardless: it
        # proves the app is up AND correctly configured.

        # gcloud run deploy already waited for the revision to report Ready, so
        # this retry is for network flakiness rather than slow startup.
        for attempt in 1 2 3 4 5; do
          if curl -fsS --max-time 20 "$$URL/readyz" >/dev/null 2>&1; then
            break
          fi
          echo "readyz not answering yet (attempt $$attempt/5)"
          sleep 5
        done

        # The real gate. A 503 fails the build and the candidate never gets
        # traffic; the reason is deliberately withheld from the response in a
        # hardened environment, so read the Cloud Run logs for the detail.
        echo "--- /readyz ---"
        curl -fsS --max-time 30 "$$URL/readyz"; echo

        # Proves the running container is built from the commit that triggered
        # this build, rather than a cached or mis-tagged image.
        echo "--- /version ---"
        curl -fsS --max-time 20 "$$URL/version"; echo
        BUILT="$$(curl -fsS --max-time 20 "$$URL/version" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_sha",""))')"
        if [ "$$BUILT" != "$COMMIT_SHA" ]; then
          echo "ERROR: serving build_sha=$$BUILT but this build is $COMMIT_SHA"
          exit 1
        fi
        echo "Candidate is ready and serving $COMMIT_SHA."

  # ---- Promote to 100% -----------------------------------------------------
  - id: promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        if [ -f /workspace/skip_smoke ]; then
          echo "First deploy already carries all traffic."
          exit 0
        fi
        # Drops the rc tag in the same call so tags do not accumulate one per
        # release; the previous revision stays available for rollback.
        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" --to-latest --remove-tags=candidate --quiet
        echo "Promoted $COMMIT_SHA to 100% of traffic."
