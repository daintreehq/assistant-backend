name: diag-selector
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c requirements.lock
      - run: lscpu | grep -iE "model name|flags" | head -2
      - run: python scripts/diag_setwise.py
