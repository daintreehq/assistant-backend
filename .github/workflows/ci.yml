name: CI

on:
  push:
    # develop is included because a release fast-forwards it into main and every
    # push to main deploys (see cloudbuild.yaml). Without a run on develop there
    # would be no green signal to gate the release on.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # `submodules: true` fetches the pinned `cli/` snapshot, which the runbook
      # hygiene tests read as the authority on which tools exist.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The local runbook selector (two ONNX encoders + head + tokenizers) is
          # Git LFS. The app loads it at startup, so without real bytes every
          # search test would feed ONNX Runtime a 130-byte pointer file.
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (dev) against the pinned lock
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements.lock

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy --strict src

      - name: Pytest (with coverage)
        run: pytest -q --cov --cov-report=term:skip-covered

      # Free, offline, non-zero on a routing gap: every runbook must have a
      # benchmark case that REQUIRES it, so a new runbook cannot enter the
      # catalog unrouted and untested.
      - name: Runbook-selection routing coverage
        run: python -m benchmarks.runbook_selection.bench coverage

      # The shipped selector over every routing case, graded against measured
      # floors (benchmarks/runbook_selection/quality.py). This is what says a
      # runbook edit or a retrain did not make search worse.
      - name: Runbook-selection routing quality
        run: python -m benchmarks.runbook_selection.bench local --no-save
