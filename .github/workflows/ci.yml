name: CI

on:
  push:
    # develop is included because a release merges it into main and every push to
    # main deploys (see cloudbuild.yaml). Without a run on develop there would be
    # no green signal to gate the release on, and the deploy would race CI.
    branches: [main, develop]
  pull_request:
    # develop as well as main. Work lands on develop, so a PR gated only against
    # main is a PR gated against nothing: it merges, and the failure is then
    # discovered on the branch by whoever pushes next. The push trigger above
    # already runs there — this just moves the signal to before the merge, where
    # it can still prevent something.
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (dev) against the pinned lock
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements.lock

      - name: Ruff
        run: ruff check .

      # tools/ is in scope: it holds the coverage-floor and baseline gates, and a
      # type error there would weaken a gate silently rather than fail loudly.
      - name: Mypy (strict)
        run: mypy --strict src tools

      # Coverage is measured on the same run rather than a second pass: the
      # suite takes ~40s under coverage and duplicating it to keep a bare `-q`
      # run would double CI for no signal.
      - name: Pytest (with coverage)
        run: pytest -q --cov --cov-report=json --cov-report=term:skip-covered

      # A global percentage stays green while exactly the code that must not
      # regress does — a thousand covered lines elsewhere absorb the loss. These
      # floors name auth, error mapping, the state token, retries, provider
      # parsing, validation, deadlines and redaction individually.
      - name: Coverage floors (security/reliability modules)
        run: python -m tools.coverage_floors coverage.json

      # benchmarks/ imports src but sits outside `mypy --strict src` and pytest's
      # testpaths, so a signature change in the assembler rotted this suite silently
      # (render_integrations lost an argument; every run raised TypeError). The
      # deterministic mode needs no API key and no network, so it gates cheaply.
      - name: Benchmarks (deterministic only)
        run: python -m benchmarks.dashboard.bench run --deterministic-only
