    steps:
      - say: |-
          Have {host_a} make a run/{run}-clean branch with a CHANGELOG entry and push it, and a run/{run}-dirty branch with another entry, committed but not pushed. Have {host_b} do the same with run/{run}-b-clean and run/{run}-b-dirty. Launch any agents with model haiku.
