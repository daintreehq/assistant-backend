      - person: "After the hub's park reply, snapshot {host_a}'s run/{run} worktree (HEAD, git status --porcelain, a hash of every uncommitted file): the parked snapshot. Then quit the Shell instance; start it again, open a fresh hub session and turn Accept messages from other machines on in it. On {host_b}, open the assistant again and turn Accept messages from other machines on."
      - say: |-
          Resume the parked run/{run} work from /tmp/dsw-{run}/notes/park.md.
