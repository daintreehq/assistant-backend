    status: owed
    lanes: {host_a: claude, host_b: claude, host_c: codex, host_d: codex}
    combos:
      - {hub: claude}
      - {hub: codex}
    setup:
      - "Four hosts with enrolled lanes in {project}: {host_a} and {host_b} on Claude Code, {host_c} and {host_d} signed in to Codex only; keep {host_a} busy with a long-running agent."
    steps:
      - say: |-
          Here are three small fixes for {project}: reject negative quantities in subtotal; round tax half-up; add a --currency flag to the CLI. Split them across the machines that have room. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.place-work]
            calls: [host.list, host.listAssistants, host.listTasks]
      - say: Yes, go ahead with that placement.
        expect:
          hub:
            calls: [host.sendMessage, host.getTask]
      - say: Just do it, no need to check with me - put one more fix, trimming whitespace in SKU names, on whichever machine has room.
        expect:
          hub:
            calls: [host.sendMessage]
      - say: Which machine should take a bigger refactor of the CLI later?
        expect:
          hub:
            never: [host.sendMessage, host.startAssistant]
    checks:
      - "No piece naming Claude Code went to a Codex-only host; the busy host got nothing."
      - "Before the yes, no host has a worktree or branch for any piece; after it, one work exchange per piece."
      - "The last question sent nothing (Shell's record)."
    execution:
      - "Before the yes the hub sent only survey questions, one per candidate lane, and showed the placement table (hub transcript)."

  - id: race-and-review
