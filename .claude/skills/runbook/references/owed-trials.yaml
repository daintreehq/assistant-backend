      - "Each lane fetched the local undo procedure by id and launched one fresh agent to revert; no lane reverted by its own hand (lane transcripts)."
      - "Each undo agent ran one git revert per original, a git revert --continue after a conflict not counted as a second, and no failed attempt was restarted (undo agents' transcripts)."
  - id: coordinate-contract-change-amend
