      - "The question closed by reference: one follow-up to {host_a} naming the asking task, and that task reads completed afterwards."
      - "The push question reached the person before any assistant.reply on its inbox task; exactly one reply after their answer."
      - "{host_b} got at most one narrow follow-up, sent only after {host_a} was in; the report states what was seen (state, minutes), with no guessed cause."
      - "Each reported SHA equals git ls-remote {remote} for that host's branch; anything unverified is marked so."
    execution:
      - "No waitMs and no polling loop between updates (hub transcript); a Claude Code hub sets at most one native wakeup if its tools list one; a Codex hub tells the person what it waits on and ends its turn."


