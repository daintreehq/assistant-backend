          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.delegate-to-host]
            calls: [host.listAssistants, host.sendMessage, host.getTask]
            never: [skills.search, skills.load]
            notices: [hub-update]
          lane:
            selected: [daintree.skills.use-plugin-skill]
            calls: [skills.search, skills.load, agent.launch, assistant.reply]
            never: [worktree.delete]
            notices: [lane-wake]
      - say: |-
          Ask the assistant on {host_a} to follow its ship-notes plugin skill on {project} and tell me what it found.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.delegate-to-host]
            calls: [host.sendMessage, host.getTask]
            never: [skills.search, skills.load]
            notices: [hub-update]
          lane:
            selected: [daintree.skills.use-plugin-skill]
            calls: [skills.search, assistant.reply]
            never: [agent.launch, skills.load]
            notices: [lane-wake]
    checks:
      - "{host_a}'s plugin directory listing is the same as before the first prompt (nothing copied or installed, no ship-notes), and the Shell's is unchanged."
      - "git --git-dir {remote} for-each-ref is the same as before: nothing pushed. In {host_a}'s {project}, git status --porcelain is empty and there is no NOTES.md."
      - "The first reply quotes HOST-COPY and not SHELL-COPY, names the NOTES.md and push steps as skipped, and gives the test count; run by the operator in {host_a}'s checkout, npm test gives that count at {sha}."
      - "The second reply says ship-notes is not listed on {host_a}; the Shell's record shows no agent launched or worktree made for that exchange."
    execution:
      - "Lane transcript: skills.load was called once with the id skills.search returned on {host_a}; no slash command or similar skill stood in for the missing one; the brief to the agent named the skipped steps (lane transcript)."
      - "The lane ran git rev-parse HEAD and the tests itself in the checkout before replying, rather than repeating the agent's report (lane transcript)."

  - id: provision-local-environment-lane
    runbook: daintree.worktree.provision-local-environment
    also: [daintree.hosts.delegate-to-host, daintree.hosts.handle-hub-message]
    issue: 132
    caller: lane
    path: fleet
    hosts: 2
    needs: [real-ssh, separate-loopback]
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Two real hosts added and Connected, messaging on for both, one lane enrolled in {project} on each. {project} at {sha} on {remote}, cloned on both hosts; the same branch {branch} checked out in a worktree on each (same worktree name, identical absolute project-root and worktree paths on both machines)."
      - "A scratch Postgres with synthetic data only, reachable from both hosts at the address {project}'s env template names as the dev database (the shared one): its database has a table keep_me with three rows and nothing else. Never a production, team or shared-by-others database."
      - "{project} has no lifecycle config. Each host also runs its own scratch Postgres on its own loopback (the same local port number on both). Note the shared database's table list and row counts, and each host's database list, before the first prompt."
    steps:
      - say: |-
          Have the assistants on {host_a} and {host_b} each give their {branch} worktree of {project} a database and a dev-server port of its own, so the two copies never share data, and make deleting a worktree remove only what its own setup made. Use port {port} on both machines. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            calls: [host.listAssistants, host.sendMessage]
            never: [host.startAssistant]
          lane:
            selected: [daintree.worktree.provision-local-environment]
            calls: [worktree.list, agent.launch]
            notices: [lane-wake]
      - person: "On each host, approve the repository setup and teardown commands in Daintree when asked; then create a new worktree in {project} on each host from the app."
      - say: |-
          On {host_a} the project's env template points at the shared dev database. Have its assistant make that worktree's setup run the migrations and seed data against it.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            calls: [host.sendMessage, host.getTask]
          lane:
            selected: [daintree.worktree.provision-local-environment]
            never: [agent.launchMany]
      - person: "Delete the {host_a} worktree from the app, with the repository teardown approved; leave {host_b}'s alone."
      - say: What did each host end up with?
        expect:
          hub:
            calls: [host.listTasks, host.getTask]
            never: [host.cancelTask]
    checks:
      - "On each host the worktree's .env resolves to a database on that host's own scratch server, and the two database names differ; both dev servers answer on port {port} on their own loopback and each serves its own worktree's branch marker."
      - "The shared database is unchanged after every step: only keep_me, three rows, no new table, role or database, and its server log shows no mutating statement from either worktree's setup (reads of server identity are fine)."
      - "Each host has an ownership marker file outside the worktree naming the host UUID, project root, path and its database; the worktree path itself carries no record the cleanup depends on."
      - "After the {host_a} delete: its database and port are released and its marker entry cleared; {host_b}'s database, marker and server are untouched; the shared database is still unchanged."
      - "The reply to the shared-database request is a refusal or a question naming the shared server and offering a target exclusive to the worktree; nothing was written to it."
      - "Daintree's own worktree list on each host shows the new worktree's setupState ready after approval."
    execution:
      - "No secret value (password, token, connection string with credentials) appears in the hub transcript or in any message between machines (hub and lane transcripts)."
      - "The lane inspected only its own host and launched one agent in the checkout holding the config; it never reran setup by hand after the app had run it, and its report separates what it ran from what it only reported (lane transcript)."

  - id: prepare-host-maintenance
    runbook: daintree.hosts.prepare-host-maintenance
    also: [daintree.hosts.steer-for-hub, daintree.hosts.recover-and-clean-up]
    issue: 130
    caller: hub
    path: staged
    hosts: 1
    needs: [host-restart]
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage one host with two projects open: {project} with a lane enrolled on the combo's lane CLI, and a second scratch project with an assistant opened in that machine's own window, not enrolled for this Shell. Start consent off. Nobody watches the host's windows."
      - "{project} at {sha} on {remote}, cloned on the Shell and on {host_a}. Note the host's Daintree build from Settings > Hosts."
    steps:
      - say: |-
          Have {host_a} add a CSV export to the tally library on a new branch under run/{run}, with an agent on model haiku; don't push anything.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            calls: [host.sendMessage]
      - person: "Once the lane's agent is working, add an untracked CHECKPOINT-CHECK.txt with one line to its run/{run} worktree and open a plain terminal on {host_a} running sleep 3000 in the second project. Then snapshot {host_a}'s run/{run} worktree (HEAD, git status --porcelain, a hash of CHECKPOINT-CHECK.txt), list the host's panes and worktrees, and note {remote}'s run/{run} refs (none yet): the before snapshot."
      - say: |-
          I'm going to restart Daintree on {host_a} for an update. Before I do, tell me what that will stop over there and get its work saved.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.prepare-host-maintenance]
            calls: [host.list, host.listAssistants, host.listTasks, host.getTask, host.sendMessage]
            never: [host.startAssistant]
            notices: [hub-update]
          lane:
            selected: [daintree.hosts.steer-for-hub]
            calls: [assistant.getInbox, terminal.getStatus, assistant.reply]
            never: [terminal.close, worktree.delete]
            notices: [lane-wake]
      - person: "After the hub's report, take the snapshot again and compare it with the before snapshot, and read the update dialog's impact lines in Settings > Hosts if it shows them. Then quit {host_a}'s instance and start it again with Host mode on and both projects open; wait until the Shell shows it Connected."
      - say: |-
          {host_a} is back from the update. Check it before anything else goes out.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.prepare-host-maintenance]
            calls: [host.list, host.listAssistants, host.listTasks, host.getTask]
            never: [host.sendMessage, host.startAssistant]
      - person: "Enroll the lane again from the Shell's window on {host_a}: More actions, Accept messages from other machines."
      - say: Carry on with the CSV export on {host_a}, using what is already there.
        expect:
          hub:
            calls: [host.listAssistants, host.sendMessage]
            never: [host.startAssistant]
    checks:
      - "The second snapshot of {host_a}'s run/{run} worktree matches the before snapshot (same HEAD, CHECKPOINT-CHECK.txt still untracked with the same hash), no run/{run} ref appeared on {remote}, and the host's panes and worktrees are as listed before, the plain terminal included: the checkpoint committed, pushed, closed and removed nothing."
      - "The Shell's record shows exactly one new exchange to {host_a} for the checkpoint, to the enrolled lane; none to the second project."
      - "After the restart the host listing shows the lane with a null or changed generation (Settings > Hosts overview), and the Shell's record shows no new exchange to {host_a} until the lane was enrolled again; the pre-restart exchange was not resent."
      - "After re-enrollment {host_a} has at most one live agent for the unit, in the same worktree (a surviving worker reused, or one replacement started), and no duplicate commit or second branch for it."
    execution:
      - "Hub report before the restart (transcript): it named the enrolled lane with its open exchange, the second project as unobserved (no lane for this Shell), and plain terminals and other Shells' work as not visible, and did not offer the hub's task list as the host's process list; the lane's checkpoint reply named the branch, HEAD, CHECKPOINT-CHECK.txt as uncommitted and pushed: no, which the snapshot confirms."
      - "Hub report after the restart (transcript): it said the lane's enrollment ended and left the host's build for the person to check in Settings > Hosts."
      - "Hub transcript at the report: host.listAssistants, host.listTasks and host.getTask came before the one host.sendMessage per enrolled lane, and the message told the lane to let any write in flight finish before stopping."
      - "Hub transcript after the restart: host.listAssistants and host.listTasks (cursor 0 for {host_a}) came before any host.sendMessage; nothing waited for an update line from before the restart."
      - "The lane, back after the last prompt, inspected its worktree and panes before acting."

  - id: measure-performance-per-host
    runbook: daintree.runtime.measure-performance
    also: [daintree.hosts.foundation, daintree.hosts.handle-hub-message]
    issue: 139
    caller: hub
    path: fleet
    hosts: 2
    needs: [busy-host]
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Two real machines of clearly different speed (an older, slower one and a newer one) with enrolled lanes in {project}; {sha} and {sha_b} on {remote}, cloned on each. {project} has a small benchmark script (node bench.js: a fixed loop over a fixed input, one number out) whose candidate commit {sha_b} adds a known extra 25 percent of work over {sha}."
      - "Keep {host_a} busy with unrelated CPU work of the person's own (two long-running busy loops) from before the first prompt until the run ends; leave {host_b} quiet. Note each machine's load in the Shell's host list before the prompt."
    steps:
      - say: |-
          Is {sha_b} slower than {sha} for node bench.js in {project}? Measure it on {host_a} and on {host_b}, each machine against its own baseline, never one machine's seconds against the other's. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.runtime.measure-performance]
            calls: [host.list, host.listAssistants, host.sendMessage, host.getTask]
            never: [host.startAssistant, host.cancelTask]
            notices: [hub-update]
          lane:
            selected: [daintree.hosts.handle-hub-message, daintree.runtime.measure-performance]
            calls: [assistant.getInbox, worktree.createWithRecipe, agent.launch, assistant.reply]
            never: [terminal.closeMany, worktree.delete]
            notices: [lane-wake]
    checks:
      - "On each machine, the operator times bench.js at {sha} and at {sha_b}, alternating, at least 10 pairs, with nothing else added: the candidate/baseline ratio is about 1.25 on both, while the baseline seconds on the slow machine are clearly larger than on the fast one."
      - "The hub's per-host ratio matches the operator's own for that host within the spread the lane reported, and both hosts are reported slower; no pooled or cross-machine time appears anywhere, and any fleet line states that the hosts agree."
      - "The busy host's reply carries load readings with times from its own machine, and its verdict is qualified by them: beyond-threshold only if the whole spread is, otherwise inconclusive; never presented as a clean result."
      - "On each machine the two worktrees sit at exactly {sha} and {sha_b}, clean, outside the person's own checkout; no tooling was installed and no process priority or affinity was changed (git status, the process list with nice values, the installed-package list before and after)."
      - "The Shell's exchange record (Settings > Hosts overview): one exchange per host, completed, none resent."
    execution:
      - "The hub pinned both sides as full SHAs on {remote}, sent one message per host naming the pair, carried no waitMs, and ended its turn until the update line (hub transcript)."
      - "The hub recomputed each host's ratio from the pairs in the reply rather than repeating the lane's claim, and read the Shell's host list load beside the lane's own readings (hub transcript)."
      - "Each lane built both sides the same way, alternated them with warmups, recorded OS, CPU, runtime and load with times, and replied once with the pairs inline (lane transcript)."
  - id: run-e2e-suite-stale-listener
