            never: [terminal.closeMany, worktree.delete]
            notices: [lane-wake]
    checks:
      - "The unrelated listener on {port} (the other checkout's, started before the run) is still alive and has the same pid; nothing the run started still listens (lsof on {host_a})."
      - "The reply does not call the run a pass unless the listener it names has the {branch} worktree as its directory and its /version answers {sha}; a run that reached the stale listener, or served the old dist/, is reported as rejected or unproven with the reason."
      - "Exactly one spec ran (the report lists e2e/health.spec.ts only); git status in the worktree shows no source edit, only build and report artifacts."
