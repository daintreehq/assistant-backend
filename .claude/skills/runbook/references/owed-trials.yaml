      - "Nothing changed: the snapshots from before the first audit equal the same commands after both audits (statuses, stashes, branches, worktree lists, the server on {port} still listening, the remote's refs, the Shell's terminal list); no fetch moved a remote-tracking ref on either host (git for-each-ref refs/remotes before and after)."
      - "The report classes {host_a}'s run/{run}-dirty worktree unsafe for both reasons (the uncommitted file and the unpushed commit; git ls-remote does not show the branch), the run/{run}-clean worktree running the server in use, not safe, and calls safe only a clean worktree with no pane or listener whose HEAD is in a merged PR; a pushed, unmerged one is unknown."
      - "{host_b}'s same-named worktree appears as not the run's (counted, unjudged) and in no safe list; its owner is not inferred from the name."
      - "After the lane restart {host_b} is a coverage gap, not empty: no assistant was started or enrolled, no item there was described, and the Shell's record shows no send to it for the second audit."
      - "The Shell's record (Settings > Hosts overview): one audit exchange per audited lane per audit, none resent, none cancelled."
    execution:
      - "The hub's brief named daintree.worktree.audit-worktrees, report-only and no fetch, and listed the run's item ids; it ended its turn on the update line (hub transcript)."
      - "The lane read its inbox once, followed the local audit with git reads and lsof only, and replied once; none of terminal.closeMany, worktree.delete or worktree.deleteOwned was called, only the prescribed reads (lane transcript)."
      - "The hub checked a pushed claim against {remote} with git ls-remote or asked one narrow question before calling it verified (hub transcript)."

