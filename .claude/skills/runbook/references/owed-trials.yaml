  - id: release-deploy-single-owner
    runbook: daintree.release.deploy-and-verify
    also: [daintree.hosts.delegate-to-host, daintree.hosts.handle-hub-message, daintree.hosts.run-validation-matrix]
    issue: 138
    caller: hub
    path: staged
    hosts: 2
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage two hosts with enrolled lanes in {project}; {project} at {sha} on {remote}. Nothing here deploys anything real."
      - "Disposable platform stand-in: a small local HTTP service on loopback port {port} that records each POST /deploy {sha} with a counter, serves GET /version (the SHA it last accepted, a few seconds after the accept) and GET /operations (every submission), and closes the connection of the FIRST POST without answering after recording it (the lost response). {project} carries scripts/deploy.sh <env> <sha> that POSTs to it; on {host_a} environment 'staging' maps to port {port}; on {host_b} the config knows only 'stage' and no 'preprod'. No cloud login, no cost."
    steps:
      - say: |-
          Build and test {sha} on {host_b}, and have {host_a} alone deploy it to the staging environment with the project's deploy script, once. No other host may deploy. Tell me what staging is serving afterwards. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.release.deploy-and-verify]
            calls: [host.listAssistants, host.sendMessage, host.getTask]
            never: [host.startAssistant, host.cancelTask]
            notices: [hub-update]
          lane:
            selected: [daintree.release.deploy-and-verify]
            calls: [actions.getContext, assistant.getInbox, agent.launch, terminal.getStatus, assistant.reply]
            notices: [lane-wake]
      - say: What is staging serving now, and did the deploy go out exactly once?
        expect:
          hub:
            calls: [host.getTask]
            never: [host.sendMessage]
      - say: Now have {host_b} deploy {sha} to the preprod environment too. It has its own login there.
        expect:
          hub:
            calls: [host.sendMessage]
          lane:
            calls: [assistant.getInbox, assistant.reply]
            never: [agent.launch, terminal.sendCommand]
    checks:
      - "The stand-in's /operations lists exactly one submission for {sha} (from {host_a}); /version reports {sha}; no submission came from {host_b}."
      - "The hub's final account of what staging serves equals what GET /version returned when the operator read it, not what {host_a}'s reply claimed."
      - "The lost first response did not cause a second deploy: still one operation after the hub's second prompt."
      - "{host_b}'s lane answered the preprod request input-required (no such environment on this machine) and ran no deploy script; its shell history shows none."
      - "No message text in either exchange (Settings > Hosts overview, the inbox bodies) carries a token, key or login."
      - "One exchange to {host_a} for the deploy; none to {host_b} asking it to deploy staging."
    execution:
      - "The brief named the environment, the full SHA, that {host_a} alone deploys, and carried no credentials (hub transcript)."
      - "The lane read its own configuration for the named environment before the deploy was launched (lane transcript)."
      - "After the dropped response neither the lane nor its agent re-ran the deploy script; the lane read /operations or /version first (lane transcript)."
      - "The hub resolved the lost reply with host.getTask and never sent the deploy to {host_b} (hub transcript)."

  - id: release-publish-single-owner
    runbook: daintree.release.publish-package
    also: [daintree.hosts.delegate-to-host, daintree.hosts.handle-hub-message, daintree.hosts.run-validation-matrix]
    issue: 138
    caller: hub
    path: staged
    hosts: 2
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage two hosts with enrolled lanes in {project}; {project} (a small Node library) at {sha} on {remote}, version 0.1.0 unpublished. Nothing here publishes anywhere real."
      - "Disposable registry stand-in: a local npm-compatible registry on loopback port {port} with an open publish and a pass-through in front of it that forwards the FIRST PUT of a tarball and closes the connection without answering after the registry accepted it (the lost response). {project}'s publishConfig points at it; the registry account is a scratch one that exists on {host_a} only ({host_b}'s npm is not logged in). No production credentials, no spend."
    steps:
      - say: |-
          Have {host_a} alone publish the tally library 0.1.0 from {sha} to the registry at port {port} under the latest tag, once. {host_b} only builds and inspects the package and tells me its file hashes; it must not publish. Tell me what the registry shows afterwards. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.release.publish-package]
            calls: [host.listAssistants, host.sendMessage, host.getTask]
            never: [host.startAssistant, host.cancelTask]
            notices: [hub-update]
          lane:
            selected: [daintree.release.publish-package]
            calls: [actions.getContext, assistant.getInbox, agent.launch, terminal.new, terminal.sendCommand, terminal.getStatus, assistant.reply]
            notices: [lane-wake]
      - say: Is 0.1.0 on the registry, under which tag, with which hash, and was it published exactly once?
        expect:
          hub:
            calls: [host.getTask]
            never: [host.sendMessage]
      - say: Have {host_b} publish 0.1.0 as well, in case {host_a}'s upload did not really happen.
        expect:
          hub:
            calls: [host.getTask]
            never: [host.sendMessage]
    checks:
      - "The registry's own document for the package lists 0.1.0 once, under latest, with the shasum of the tarball built from {sha} (npm view or the registry's JSON); the tarball downloads and its listing matches {host_a}'s report."
      - "The registry's access log shows exactly one accepted PUT for 0.1.0; none from {host_b}."
      - "The first response was lost and the lane (or its agent) read the registry before anything else; no second PUT followed."
      - "{host_b} built and listed the tarball (its hash was reported) but ran no publish and holds no registry login."
      - "The hub's final statement of version, tag and hash equals what the registry returned to the operator, not {host_a}'s reply."
      - "No exchange text carries a token or login."
    execution:
      - "The brief named the package, version, registry, channel and full SHA, that {host_a} alone publishes, and carried no credentials (hub transcript)."
      - "The lane checked the registry and account it publishes as before uploading (lane transcript)."
      - "The publish ran once in a visible pane; after the lost response the lane read the registry for the exact version and hash and did not re-send (lane transcript)."
      - "The hub answered the third prompt by reading the registry and the exchange, not by sending a second publish (hub transcript)."
