      - daintree.hosts.ask-host-assistant
      - daintree.hosts.handle-hub-message
      - daintree.edits.spawn-visible-agent
    issue: 142
    caller: hub
    path: staged
    hosts: 1
    discovery: entry
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage one host (hub-lane-trials.md, Staged path); start consent off."
      - "Settings > Daintree Assistant > Behavior: Follow runbooks on in BOTH instances (the app writes its search rule into a session only while it is on), then start a fresh assistant conversation in each, after the host shows Connected."
      - "Enroll a lane in {project} on {host_a} with the combo's lane CLI; the hub with the hub CLI."
      - "{project} at {sha} on {remote}, cloned on the Shell and on {host_a}."
    steps:
      - say: Get the assistant on {host_a} to add a --json option to the tally CLI that prints the total as JSON, with a test, on a new branch {branch}, and push that branch to origin. Launch any agents with model haiku.
        expect:
          hub:
            selected: [daintree.hosts.delegate-to-host]
            calls: [host.listAssistants, host.sendMessage, host.getTask]
            never: [host.startAssistant]
            notices: [hub-update]
          lane:
            selected: [daintree.hosts.do-delegated-work]
            calls: [assistant.getInbox, worktree.createWithRecipe, agent.launch, assistant.reply]
            notices: [lane-wake]
      - say: Ask the assistant on {host_a} which branch {project} is checked out on there.
        expect:
          hub:
            selected: [daintree.hosts.ask-host-assistant]
            calls: [host.listAssistants, host.sendMessage]
            notices: [hub-update]
          lane:
            selected: [daintree.hosts.handle-hub-message]
            calls: [assistant.getInbox, assistant.reply]
            never: [worktree.createWithRecipe, agent.launch]
            notices: [lane-wake]
      - person: "In the lane's own window on {host_a}, type: Have an agent fix the typo in the tally README in a new worktree on this machine, with model haiku. Nothing is sent from the Shell for this step."
    checks:
      - "git --git-dir {remote} rev-parse {branch} equals the commit in the hub's final reply to the first prompt, and only the CLI and a test changed."
      - "The second reply names the branch git -C <host project> branch --show-current prints, and made no worktree or pane."
      - "The Shell's exchange record (Settings > Hosts overview) shows exactly two exchanges, both completed; the person's own request in the lane's window made none."
      - "The README fix is in a worktree on {host_a} made for the person's request, with no run or unit id of a hub exchange on its branch."
    execution:
      - "Hub transcript: the first Daintree call after the first prompt is search_runbooks, one sentence of 8 to 15 words without the branch, file or project names (record the query). No search means the app's role-entry rule did not reach the hub: record it as APP, with the session's prompt."
      - "Lane transcript, first prompt: the first line is the wake line and it carries no task. Record whether the lane searched after reading assistant.getInbox (query and result), fetched the brief's named procedure by id instead, or did neither. Only a search on the lane's own initiative counts as discovery; the rest is an APP finding for the addendum, never a pass."
      - "Lane transcript, second prompt: it loaded no procedure that creates a worktree or launches an agent, and answered with assistant.reply once."
      - "Lane transcript, the person's own request: it searched for the work as a local request and was not handed any procedure for a hub's request (no assistant.reply, no exchange)."

  - id: hosts-foundation
    runbook: daintree.hosts.foundation
    also: [daintree.hosts.ask-host-assistant]
    issue: 86
    caller: hub
    path: staged
    hosts: 1
    status: owed
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage one host with an enrolled lane; set the hub's Tool set to Core before its session starts."
    steps:
      - say: |-
          How do I talk to the assistant on my other Mac from here, and is it set up already?
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.foundation]
            calls: [host.list, host.listAssistants]
            never: [host.startAssistant]
      - person: "Set the hub's Tool set to Full, restart its conversation, and turn Accept messages from other machines on again in it."
      - say: Send the assistant on {host_a} a note asking which branch {project} has checked out, and tell me what it says.
        expect:
          hub:
            selected: [daintree.hosts.ask-host-assistant]
            calls: [host.sendMessage, host.getTask]
          lane:
            selected: [daintree.hosts.handle-hub-message]
            calls: [assistant.getInbox, assistant.reply]
            notices: [lane-wake]
      - person: "Restart the hub's conversation (More actions > Restart conversation) and turn Accept messages from other machines on again in it."
      - say: Did the assistant on {host_a} ever answer what I asked it earlier?
        expect:
          hub:
            calls: [host.listTasks, host.getTask]
            never: [host.sendMessage]
    checks:
      - "At Core the hub sent nothing and named Tool set = Full as the fix (no exchange in the Shell's record before step 2)."
      - "Exactly one exchange in the record, and the answer reported after the restart is the reply that exchange holds."
    execution:
      - "After the restart the hub read host.listTasks and host.getTask instead of waiting for a notice, mapping the host-side id to its taskId."
      - "The branch the hub relayed matches git -C <host project> branch --show-current on {host_a}."

  - id: ask-host-assistant
