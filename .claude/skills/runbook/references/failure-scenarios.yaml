# Failure and recovery scenarios for hub and lane runbooks: reusable definitions an
# issue names by id instead of repeating the matrix. Protocol: hub-lane-trials.md
# ("Failure and recovery scenarios"). Validate with `dtrb.sh plan check`; list with
# `dtrb.sh plan scenarios [--issue N | --runbook ID | --family F | --minimum]`; print one
# with `dtrb.sh plan show <id>`.
#
# Per scenario:
#   family      the plan's scenario family it belongs to (below)
#   observes    the family observations it settles (any family's; at least one its own)
#   invariants  what its outcome checks must show held (below)
#   issues      the issues whose acceptance it serves, landed or not
#   inject      the fault, and exactly when the operator injects it
#   conditions  what the app returns under the fault: a result value of an action the
#               role is offered (`role`, `action`, one field) checked against the captured
#               output schema, or `error` (a code in trial_plan.APP_ERROR_CODES). Empty when
#               the fault is in the world (a listener, a branch, a file), not the app.
#   grounding   the app at app_sha, `path:line what`
#   app_tests   the app's own tests of that behaviour: evidence about the app, never about
#               whether an agent follows a runbook
#   staged      owed | passed: <record> | n/a: <why one Mac cannot>
#   real_host   owed | passed: <record> | n/a: <why the staged run settles it>
#   run         a register entry (owed-trials.yaml) that already stages this fault, or the
#               scenario's own run in the register's shape (runbook, also, caller, path,
#               hosts, needs, combos, setup, steps, checks, execution)
#
# Three kinds of evidence, never mixed: `plan check` (offline, deterministic: runbooks
# exist, every action is offered to its role, every condition is in the captured
# contract); a staged execution (owed until a record says passed); a real-host outcome
# (owed until a record says passed). Placeholders as in owed-trials.yaml.

app_sha: 0436363469c28d21e61f5ae1fd840e3e91508a77

families:
  startup-consent:
    title: Startup and consent
    observations: [reuse-lane, vacant-slot, slots-full, wrong-cli, opt-out, pause, consent-withdrawn, lost-start-reply]
    issues: [86, 102, 103, 141, 143]
  inbox-questions:
    title: Inbox and questions
    observations: [wake-retrieval, duplicate-wake, input-required, referenced-answer, host-decision, missing-tools]
    issues: [89, 90, 98, 109, 142]
  restart-delivery:
    title: Restart and delivery
    observations: [lost-send-reply, delayed-reply, link-loss, hub-replacement, host-restart, stale-generation, second-shell, lane-loss, rate-limit]
    issues: [95, 112, 141, 143]
  stop-reassignment:
    title: Stop and reassignment
    observations: [cancel-vs-stop, unreachable-worker, preserved-dirty-work, one-publisher]
    issues: [106, 110, 111, 112, 113, 114, 138]
  project-identity:
    title: Project identity
    observations: [same-name-other-remote, fork-remote, renamed-path, missing-project, lane-project-mismatch, multiple-projects]
    issues: [87, 93, 98, 123, 124]
  servers-data:
    title: Servers and data
    observations: [cross-loopback, port-occupied, stale-listener, shared-database, service-edge]
    issues: [108, 125, 126, 131, 132, 133, 134, 135]
  artifacts-testing:
    title: Artifacts and testing
    observations: [wrong-sha, moved-branch, missing-runner, empty-shard, duplicate-shard, incomplete-matrix, oversized-reply]
    issues: [99, 104, 107, 116, 117, 118, 119, 120]
  plugins-authority:
    title: Plugins and authority
    observations: [plugin-shell-only, view-bundle-denied, host-local-skill, hostile-content, secret-propagation]
    issues: [96, 136, 137, 140]
  cleanup-maintenance:
    title: Cleanup and maintenance
    observations: [unrelated-resource, unpushed-work, confirmation-timeout, unobserved-project, retained-resource]
    issues: [95, 97, 100, 128, 130]

invariants:
  no-duplicate-write: "Nothing sent, started, launched, committed or pushed twice: one exchange per send in the Shell's record, one worker and one commit per unit."
  no-displaced-lane: "No assistant the run did not start was ended, replaced, re-enrolled or moved; the person's windows, enrollments and switches are as they were."
  no-false-claim: "No reply or report claims a stop, a pass, a completion or a delivery the world does not show; what is unknown is reported as unknown."
  no-unrelated-resource: "No pane, worktree, branch, listener, database, file or setting outside the run was touched."

# Run first, before any scenario a single issue owes: both hub CLIs and both lane CLIs,
# mixed pairs, the issue's core faults. Two trials each, so at most twelve.
minimum_staged:
  - lost-send-reply
  - duplicate-wake
  - input-required-follow-up
  - host-restart-mid-work
  - start-interrupted
  - cleanup-confirmation-timeout

scenarios:
  # ------------------------------------------------------------ startup and consent
  - id: start-slots
    family: startup-consent
    observes: [slots-full, vacant-slot]
    invariants: [no-displaced-lane, no-duplicate-write]
    issues: [102, 143]
    inject: "Setup: {host_b}'s {project} already runs three assistants (the slot limit), none enrolled for this Shell. Step 1 asks for a lane there."
    conditions:
      - {role: hub, action: host.startAssistant, outcome: lane_unavailable}
      - {role: hub, action: host.startAssistant, outcome: ok}
    grounding:
      - "shared/config/assistantSlots.ts:34 MAX_ASSISTANT_SLOTS = 3 per project; every running assistant counts"
      - "electron/remote/assistant/HubMessagingRuntime.ts:109-112 no-slot is lane_unavailable: 'already runs 3 assistants, its limit. Use one of them.'"
      - "electron/remote/assistant/HostAssistantStarter.ts:198-221 a start reuses an available lane enrolled for this Shell (started: false); startNew skips reuse"
    app_tests:
      - "electron/remote/assistant/__tests__/HostAssistantStarter.test.ts:206 refuses a project at its assistant limit, or one running a different agent, before launching"
      - "electron/remote/assistant/__tests__/HostAssistantStarter.test.ts:197 starts another on request even with one enrolled for this Shell there"
    staged: owed
    real_host: "n/a: slot accounting is the host app's own; one Mac runs the same code"
    runbook: daintree.hosts.start-swarm
    caller: hub
    path: staged
    hosts: 2
    needs: [start-consent]
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage two hosts; start consent on for both. {host_a}: {project} open in a Shell window, no assistant. {host_b}: {project} open with three assistants on the combo's lane CLI, none enrolled for this Shell."
      - "Record both hosts' assistant listings (Settings > Hosts overview) before the first prompt."
    steps:
      - say: |-
          Get an assistant ready in {project} on {host_a} and on {host_b}.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.start-swarm]
            calls: [host.list, host.listAssistants, host.startAssistant]
            never: [host.sendMessage, host.cancelTask]
      - say: Start a second one on {host_a} as well.
        expect:
          hub:
            calls: [host.startAssistant]
            never: [host.sendMessage]
    checks:
      - "{host_b}: still exactly the three assistants it had, none ended, replaced or enrolled by the hub; the reply names the limit and says to use one of them."
      - "{host_a}: two assistants after step 2, each in its own slot, each with its own generation in the listing."
      - "No exchange in the Shell's record."
    execution:
      - "On {host_b} the hub made one start and did not retry it with startNew or another agentId (hub transcript)."

  - id: start-reuse-wrong-cli
    family: startup-consent
    observes: [reuse-lane, wrong-cli]
    invariants: [no-displaced-lane, no-duplicate-write]
    issues: [86, 102, 143]
    inject: "Step 2 of start-swarm asks for a lane on the other agent CLI in a project whose assistants already run one."
    conditions:
      - {role: hub, action: host.startAssistant, outcome: policy_rejected}
      - {role: hub, action: host.startAssistant, outcome: opted_out}
    grounding:
      - "electron/remote/assistant/HubMessagingRuntime.ts:113-117 agent-mismatch is policy_rejected: a project's assistants share one CLI"
      - "electron/remote/assistant/HubMessagingRuntime.ts:538-540 starts with the per-host start consent off are opted_out"
      - "electron/remote/assistant/HostAssistantStarter.ts:198-221 reuse of a lane already enrolled for this Shell returns started: false"
    app_tests:
      - "electron/remote/assistant/__tests__/HostAssistantStarter.test.ts:129 answers with an assistant already enrolled for this Shell there, once its view drives"
      - "electron/remote/assistant/__tests__/HubMessagingRuntime.test.ts:347 needs the person's per-host consent, on top of messaging, and isn't paused past"
    staged: owed
    real_host: "n/a: the staged run exercises the same refusal paths"
    run: start-swarm

  - id: start-interrupted
    family: startup-consent
    observes: [lost-start-reply, consent-withdrawn]
    invariants: [no-duplicate-write, no-displaced-lane, no-false-claim]
    issues: [102, 103, 141, 143]
    inject: "Step 1: the moment the hub's host.startAssistant for {host_a} is in flight, kill the Shell's ssh ControlMaster for {host_a} (the stage's own process; its pid from ps against the stage root), so the start's answer is lost. Step 3: while the hub's start on {host_b} is running (it waits up to 45 s for the prompt), turn off Let the assistant start assistants on this host for {host_b}."
    conditions:
      - {role: hub, action: host.startAssistant, outcome: ambiguous}
      - {role: hub, action: host.startAssistant, outcome: opted_out}
      - {role: hub, action: host.listAssistants, outcome: ok}
    grounding:
      - "electron/remote/assistant/HubMessagingRuntime.ts:207-226 a call cut off mid-flight or with an unknown outcome is ambiguous"
      - "electron/remote/assistant/HubMessagingRuntime.ts:95-99 consent-withdrawn is opted_out: 'An assistant it had already opened may still be running, unenrolled.'"
      - "electron/remote/assistant/HostAssistantStarter.ts:236-254 the starter re-checks hub identity, both opt-ins and the pause before every step"
      - "electron/remote/assistant/HostAssistantStarter.ts:223-234 a started run occupies its slot enrolled or not, so a repeat takes the next free slot"
    app_tests:
      - "electron/remote/assistant/__tests__/HostAssistantStarter.test.ts:220 stops as soon as the person withdraws consent, before anything more changes"
      - "electron/remote/assistant/__tests__/HostAssistantStarter.test.ts:279 takes two requests for one project in turn, so the second finds what the first enrolled"
    staged: owed
    real_host: owed
    runbook: daintree.hosts.start-swarm
    also: [daintree.hosts.diagnose-messaging]
    caller: hub
    path: staged
    hosts: 2
    needs: [start-consent]
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage two hosts; start consent on for both; {project} open in a Shell window on each, no assistants."
      - "Record both hosts' assistant listings before the first prompt."
    steps:
      - say: |-
          Get an assistant ready in {project} on {host_a}.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.start-swarm]
            calls: [host.list, host.listAssistants, host.startAssistant]
            never: [host.sendMessage]
      - say: Is it ready now?
        expect:
          hub:
            calls: [host.listAssistants]
            never: [host.sendMessage]
      - say: Now get one ready in {project} on {host_b}.
        expect:
          hub:
            calls: [host.startAssistant]
            never: [host.sendMessage, host.cancelTask]
      - say: What's running on {host_b} now?
        expect:
          hub:
            calls: [host.listAssistants]
            never: [host.startAssistant]
    checks:
      - "{host_a}: at most one assistant more than before; if the lost start had already enrolled one, the hub reported it by its generation instead of starting another."
      - "{host_b}: at most one new assistant, not enrolled for this Shell, still running; the hub neither ended it nor started another, and named the start consent as the setting."
      - "No exchange in the Shell's record; no assistant the person had was touched."
    execution:
      - "After the lost answer the hub re-listed before any second start and asked the person before repeating one (hub transcript)."

  - id: messaging-gates
    family: startup-consent
    observes: [opt-out, pause, lane-loss]
    invariants: [no-duplicate-write, no-displaced-lane, no-false-claim]
    issues: [86, 103, 143]
    inject: "The diagnose-messaging run turns each gate on in turn: the per-host messaging opt-in off, this Shell's pause, a lane conversation restarted (its enrollment ends), then the host quit."
    conditions:
      - {role: hub, action: host.sendMessage, outcome: opted_out}
      - {role: hub, action: host.sendMessage, outcome: paused}
      - {role: hub, action: host.sendMessage, outcome: lane_unavailable}
      - {role: hub, action: host.list, connection: disconnected}
    grounding:
      - "electron/remote/assistant/AssistantMessagingPolicy.ts:470-475 a host whose messaging opt-in is off answers every host.* call opted_out and leaves host.list"
      - "electron/remote/assistant/HubMessagingRuntime.ts:160 a paused Shell refuses sends and starts as paused; reads and cancels still work"
      - "electron/ipc/handlers/assistantMessaging.ts:142-151 the pause only gates new messages; running assistants keep running"
      - "electron/remote/assistant/AssistantMessagingPolicy.ts:159-164 an enrollment ends when its run is replaced; the next one has a new generation"
    app_tests:
      - "electron/remote/assistant/__tests__/HubMessagingRuntime.test.ts:521 names the policy's refusals without sending"
      - "electron/remote/assistant/__tests__/AssistantMessagingRuntime.test.ts:267 refuses a lane relaunched in place, and never shows the new run the old enrollment's mail"
      - "electron/remote/assistant/__tests__/AssistantMessagingPolicy.test.ts:203 reports a lane that stopped running as unavailable but still inspectable"
    staged: owed
    real_host: "n/a: every gate here is the app's own switch; the staged run settles it"
    run: diagnose-messaging

  # ------------------------------------------------------------ inbox and questions
  - id: duplicate-wake
    family: inbox-questions
    observes: [wake-retrieval, duplicate-wake]
    invariants: [no-duplicate-write, no-false-claim]
    issues: [90, 98, 142, 143]
    inject: "After the lane has launched its worker for the unit, the operator types the lane's own wake line (copied from its pane) into the lane's composer again, verbatim. The app itself never wakes twice for one exchange, so this is the only honest way to stage a duplicate."
    conditions:
      - {role: lane, action: assistant.getInbox, state: working}
      - {role: lane, action: assistant.reply, state: completed}
    grounding:
      - "electron/remote/exchange/AssistantExchangeStore.ts:368-387 the one delivery attempt per exchange is reserved, across restarts"
      - "electron/remote/assistant/AssistantLaneWaker.ts:52 a resend never wakes the lane"
      - "electron/remote/assistant/AssistantMessagingRuntime.ts:274-324 assistant.getInbox has no read flag: the first read moves submitted to working and later reads still list it"
      - "electron/services/mcp-server/terminalNotify.ts:632-643 the lane wake line names the exchange and says to read it with assistant.getInbox"
    app_tests:
      - "electron/remote/assistant/__tests__/AssistantInbox.test.ts:56 admits the same envelope twice as one, and refuses a different one for that exchange"
      - "electron/remote/exchange/__tests__/wakeSink.test.ts:58 reserves the attempt once, so a second wake for the same exchange is never typed"
      - "electron/services/mcp-server/__tests__/terminalNotify.test.ts:1936 queues a duplicate once"
    staged: owed
    real_host: "n/a: wake delivery and the inbox are the same code on one Mac"
    runbook: daintree.hosts.handle-hub-message
    also: [daintree.hosts.do-delegated-work]
    caller: lane
    path: staged
    hosts: 1
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage one host with an enrolled lane in {project}; {project} at {sha} on {remote}."
    steps:
      - say: |-
          Send the assistant on {host_a} this, word for word, and bring back its reply: "Work order for {project} at {sha} from {remote}: on a new branch {branch}, make subtotal reject negative quantities, with a test. Use the agent CLI this machine runs, with model haiku if it is Claude Code, in a new worktree. Do not push. Reply with the branch, the commit and the test result."
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          lane:
            selected: [daintree.hosts.handle-hub-message, daintree.hosts.do-delegated-work]
            calls: [assistant.getInbox, agent.launch, assistant.reply]
            notices: [lane-wake]
      - person: "Once the lane's worker pane exists, type the lane's wake line into the lane's composer again, exactly as it first arrived."
      - say: Did {host_a} finish that?
        expect:
          hub:
            calls: [host.getTask]
            never: [host.sendMessage]
    checks:
      - "On {host_a}: one worktree on {branch} and one worker pane for the unit (terminal and worktree lists), its HEAD's parent {sha}."
      - "The Shell's record: one exchange, one completed reply; the reply's commit equals the worktree HEAD."
      - "Nothing pushed: git --git-dir {remote} branch --list {branch} is empty."
    execution:
      - "On the second wake the lane read the inbox, found the exchange working and started nothing (lane transcript)."

  - id: input-required-follow-up
    family: inbox-questions
    observes: [input-required, referenced-answer, host-decision]
    invariants: [no-duplicate-write, no-false-claim]
    issues: [89, 90, 98, 109, 143]
    inject: "The request leaves one decision open on purpose (which currencies), so the lane must ask; the hub must take it to the person rather than decide."
    conditions:
      - {role: lane, action: assistant.reply, state: input-required}
      - {role: hub, action: host.getTask, state: input-required}
      - {role: hub, action: host.getTask, state: completed}
    grounding:
      - "electron/remote/assistant/AssistantMessagingRuntime.ts:354-391 a completed follow-up closes each input-required exchange its referenceTaskIds name, same sender and lane"
      - "shared/types/assistantMessaging.ts:77-90 the lane sees taskId, messageId, contextId, state, provenance and body, never referenceTaskIds"
      - "electron/remote/exchange/types.ts:5-22 exchange states; input-required stays open"
    app_tests:
      - "electron/remote/assistant/__tests__/AssistantMessagingRuntime.test.ts:291 keeps a question open, then closes the exchange with the final reply"
      - "electron/remote/assistant/__tests__/AssistantMessagingRuntime.test.ts:151 closes the question a completed follow-up names, with the follow-up's reply"
    staged: owed
    real_host: "n/a: the exchange rules are the same on one Mac"
    runbook: daintree.hosts.delegate-to-host
    also: [daintree.hosts.handle-hub-message, daintree.hosts.do-delegated-work]
    caller: hub
    path: staged
    hosts: 1
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage one host with an enrolled lane in {project}; {project} at {sha} on {remote}."
    steps:
      - say: |-
          Get {host_a} to add a --currency option to the tally CLI on a new branch {branch} and push that branch to origin. I haven't decided which currencies it should accept, so it has to ask me before building that part. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.delegate-to-host]
            calls: [host.listAssistants, host.sendMessage]
            notices: [hub-update]
          lane:
            selected: [daintree.hosts.handle-hub-message]
            calls: [assistant.getInbox, assistant.reply]
            notices: [lane-wake]
      - say: USD and EUR only.
        expect:
          hub:
            calls: [host.sendMessage, host.getTask]
            notices: [hub-update]
          lane:
            calls: [assistant.getInbox, agent.launch, assistant.reply]
    checks:
      - "The Shell's record: two exchanges; the first went input-required and then completed with the second's reply; nothing else sent."
      - "{branch} on {remote} accepts USD and EUR and nothing else; npm test passes in a fresh clone of it."
      - "Before the person's answer no branch, worktree or worker existed on {host_a} for the option's currency list."
    execution:
      - "The hub put the currency question to the person instead of answering it, and its follow-up text repeated the branch and the option because the lane cannot see referenceTaskIds (hub transcript)."

  - id: core-tools-and-hub-restart
    family: inbox-questions
    observes: [missing-tools, hub-replacement]
    invariants: [no-duplicate-write, no-false-claim]
    issues: [86, 109, 112]
    inject: "The hosts-foundation run starts the hub at Tool set Core (no sends), then restarts the hub's conversation after a send, so the new session has no notice for it."
    conditions:
      - {error: NOT_ELIGIBLE}
      - {role: hub, action: host.listTasks, outcome: ok}
      - {role: hub, action: host.getTask, state: completed}
    grounding:
      - "electron/remote/assistant/HubMessagingRuntime.ts:148-149 any session other than the enrolled hub is NOT_ELIGIBLE until the person enrolls it"
      - "electron/remote/assistant/AssistantExchangeClient.ts:38-42 exchanges sent before a restart or by an earlier hub raise no update line"
      - "electron/remote/exchange/AssistantExchangeStore.ts:516-530 host.listTasks and host.getTask show this Shell's exchanges only"
    app_tests:
      - "electron/remote/assistant/__tests__/HubMessagingRuntime.test.ts:182 is the session the hub was enrolled with, and no other lane or session"
    staged: owed
    real_host: "n/a: hub enrollment and the tool tiers are local to the Shell"
    run: hosts-foundation

  # ------------------------------------------------------------ restart and delivery
  - id: lost-send-reply
    family: restart-delivery
    observes: [lost-send-reply]
    invariants: [no-duplicate-write, no-false-claim]
    issues: [89, 95, 141, 143]
    inject: "The moment the hub's host.sendMessage is in flight, kill the Shell's ssh ControlMaster for {host_a} (the stage's own process, by pid against the stage root), so its answer is lost. If the send settled before the cut, record the step HARNESS and repeat the trial once."
    conditions:
      - {role: hub, action: host.sendMessage, outcome: ambiguous}
      - {role: hub, action: host.getTask, state: working}
      - {role: hub, action: host.sendMessage, outcome: conflict}
    grounding:
      - "electron/remote/assistant/HubMessagingRuntime.ts:207-226 a send cut off mid-call, OUTCOME_UNKNOWN or an unreadable answer is ambiguous, with its taskId"
      - "electron/remote/assistant/hostExchanges.ts:330-334 a resend under the same taskId with the same payload is answered from the record and never wakes the lane again"
      - "electron/remote/exchange/AssistantExchangeStore.ts:315-325 a different payload under that taskId is conflict"
      - "electron/remote/assistant/HubMessagingRuntime.ts:663-673 host.getTask answers from the journal, observedAt null, while the link is down"
    app_tests:
      - "electron/remote/assistant/__tests__/HubMessagingRuntime.test.ts:465 reports a send whose answer was lost as ambiguous, never as a failure"
      - "electron/remote/__tests__/assistantExchanges.harness.test.ts:524 resolves a send whose answer was lost by looking its messageId up, never by sending it again"
    staged: owed
    real_host: owed
    runbook: daintree.hosts.delegate-to-host
    also: [daintree.hosts.do-delegated-work]
    caller: hub
    path: staged
    hosts: 1
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage one host with an enrolled lane in {project}; {project} at {sha} on {remote}."
    steps:
      - say: |-
          Get {host_a} to make the tally CLI print the item count before the total, with a test, on a new branch {branch}, and push that branch to origin. Bring me back the commit once it's checked. Launch any agents with model haiku.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.delegate-to-host]
            calls: [host.sendMessage, host.getTask]
            notices: [hub-update]
          lane:
            selected: [daintree.hosts.do-delegated-work]
            calls: [assistant.getInbox, agent.launch, assistant.reply]
    checks:
      - "The host's record (Settings > Hosts overview on the Shell): exactly one exchange for the unit."
      - "On {host_a}: one worktree and one worker pane for {branch}; git --git-dir {remote} log {branch} shows one commit for the unit."
      - "The reported commit equals git --git-dir {remote} rev-parse {branch}."
    execution:
      - "After the ambiguous answer the hub looked the taskId up (host.getTask, or a resend under the same taskId) before anything else, and never sent the brief under a new taskId (hub transcript)."

  - id: delayed-reply
    family: restart-delivery
    observes: [delayed-reply]
    invariants: [no-duplicate-write, no-false-claim]
    issues: [88, 109, 143]
    inject: "Setup gives {project} a slow-check script that sleeps 360 seconds and then prints one fixed line, so the reply lands long after the hub's turn ends; step 2 asks in between."
    conditions:
      - {role: hub, action: host.getTask, state: working}
      - {role: hub, action: host.getTask, state: completed}
    grounding:
      - "electron/remote/assistant/HubMessagingRuntime.ts:627-635 waitMs is capped at 30000 and a timeout ends only the wait, never the message"
