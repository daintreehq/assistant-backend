    grounding:
      - "electron/remote/assistant/AssistantMessagingPolicy.ts:159-164 a lane relaunched in place loses its enrollment and the generation the hub held"
      - "electron/remote/assistant/HubMessagingRuntime.ts:356-366 an assistant not enrolled for this Shell lists with generation null"
    app_tests:
      - "electron/services/mcp-server/__tests__/terminalNotify.test.ts:2152 drops a queued wake as unavailable when the lane's terminal exits"
    staged: owed
    real_host: "n/a: enrollment and panes behave the same on one Mac"
    runbook: daintree.hosts.recover-and-clean-up
    also: [daintree.hosts.clean-up-for-hub]
    caller: hub
    path: staged
    hosts: 2
    combos:
      - {hub: claude, lane: codex}
      - {hub: codex, lane: claude}
    setup:
      - "Stage two hosts with enrolled lanes in {project}. Each lane made one run/{run} worktree with a finished agent pane; on {host_a} that pane also runs npm run serve on {port}. Then restart {host_b}'s lane conversation from the Shell's window on {host_b} (its enrollment ends)."
    steps:
      - say: |-
          Clean up everything the run/{run} work left on both machines.
          Before acting, use search_runbooks from the daintree-runbooks MCP to find the procedure for this and follow it.
        expect:
          hub:
            selected: [daintree.hosts.recover-and-clean-up]
            calls: [host.list, host.listAssistants, host.sendMessage]
            never: [host.startAssistant]
          lane:
            selected: [daintree.hosts.clean-up-for-hub]
            calls: [assistant.getInbox, terminal.list, assistant.reply]
    checks:
      - "{host_a}: the run's pane closed and nothing listens on {port} afterwards (lsof), or the reply names the listener as kept and why; the person's panes are untouched."
      - "{host_b}: its run/{run} worktree and pane are untouched and come back to the person as needing them, with how the lane comes back; no assistant was started or re-enrolled there."
      - "One cleanup exchange per enrolled lane in the Shell's record; none to {host_b}'s old generation after it was found gone."
