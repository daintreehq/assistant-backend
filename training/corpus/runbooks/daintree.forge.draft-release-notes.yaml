# Training examples whose answer is `daintree.forge.draft-release-notes` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.forge.draft-release-notes
run: 2026-09-28-catalog-expansion
positives:
  - Draft release notes for v2.5.0 covering everything since v2.4.3, breaking changes first, into RELEASE_NOTES.md.
  - update CHANGELOG.md for the 3.1 release
  - what changed since the last tag? want it written up as user-facing notes
  - Create a draft GitHub release for tag v1.8.0 with notes built from what merged since v1.7.2; do not publish.
  - Write the 'What's new in 5.0' copy for the announcement from what's on release/5.0 versus 4.x.
  - Changelog entry for the upcoming 0.9.0 from main, Keep a Changelog format matching the existing file, left uncommitted.
  - summarise the merged PRs between v2.2 and v2.3 for the announcement post
  - Notes for the 4.0.0-rc.1 prerelease starting from 3.9.2, include the earlier rc tags in the range.
  - Release notes for mobile app 7.12, users only; drop CI and refactor churn and tell me what you left out.
  - The v10.0.0 tag was cut yesterday; write its notes against v9.4.1.
  - changelog v1.4.0..HEAD, group feat/fix/perf, cite PR numbers
  - 'Breaking-changes section of the 6.0 release notes: every breaking change and required migration since the last 5.x tag.'
  - the release PR for 2.7 is open - before anyone merges it, write the notes for what's going in
  - Which PRs landed between v3.3.0 and v3.4.0? Turn them into the changelog section for 3.4.0.
  - not my weekly update - I need the actual changelog for version 1.12 since 1.11
  - Draft notes for release/2026.10 against the previous calendar-version tag, with author credits since our changelog does that.
  - write whats new for 0.3.0 pls, same style as the other entries in CHANGELOG.md
  - Last tag is v2.9.1 and main becomes v2.10.0 next. Produce the release notes from first-parent history, dropping reverted PRs.
  - Prepare the GitHub release body for v5.2.0 as a draft; we'll press publish ourselves.
  - Hotfix 4.1.1 needs changelog lines for the fixes that went onto release/4.1 since 4.1.0.
  - Send an agent into the release-branch worktree to write the v3.0 release notes, no commit.
  - can you have codex write up the changelog for 1.5, just the file edit, no commit or tag
  - Release notes for SDK 0.20.0 with the renamed public APIs flagged at the top.
  - what's in this release vs the last one? need notes for the 2.6 announcement
  - Turn every merged PR since the v8.0.0 tag into customer-facing release notes; leave out internal chores and list the exclusions.
  - 'We''re about to merge #410 (release 3.2) - draft the changelog first, don''t merge it.'
  - Write release notes for the CLI v1.0 launch from v0.9.4, saved to docs/releases/1.0.md.
boundaries:
  - query: get an agent to write the changelog for 4.4 since the 4.3 tag
    confusable_with: [daintree.edits.spawn-visible-agent]
  - query: Have claude update CHANGELOG.md with the 0.8 release section.
    confusable_with: [daintree.edits.spawn-visible-agent]
  - query: Before merging the 2.5 release PR, write its release notes into CHANGELOG.md.
    confusable_with: [daintree.forge.land-pull-request]
  - query: 'Release PR #402 is approved - draft the GitHub release notes for it, don''t merge anything.'
    confusable_with: [daintree.forge.land-pull-request]
  - query: draft the v2.5 release on GitHub but don't publish it
    confusable_with: [daintree.forge.land-pull-request]
  - query: Write the CHANGELOG.md section for v4.2.0, starting from the previous tag.
    confusable_with: [daintree.git.summarize-activity]
  - query: which PRs shipped between v1.2 and v1.3? write them up as release notes
    confusable_with: [daintree.workflow.find-issue-work]
  - query: Find all merged PRs since the last tag and turn them into the changelog for 2.1.
    confusable_with: [daintree.workflow.find-issue-work]
  - query: write the CHANGELOG entry for 4.1.0 covering the new CLI flags
    confusable_with: [daintree.edits.sync-project-docs]
    run: 2026-09-28-round6
  - query: Draft the GitHub release notes for v3.2 from the PRs merged since v3.1.
    confusable_with: [daintree.edits.sync-project-docs]
    run: 2026-09-28-round6
  - query: what's new in 2.8? write it up for the announcement post
    confusable_with: [daintree.edits.sync-project-docs]
    run: 2026-09-28-round6
  - query: Write the release notes for 2.5 from the PRs merged since v2.4, into CHANGELOG.md
    confusable_with: [daintree.release.assess-readiness]
    run: 2026-09-28-round6
  - query: Write the CHANGELOG section for sdk 1.4.0 from the PRs merged since v1.3.0.
    confusable_with: [daintree.release.publish-package]
    run: 2026-09-28-round6
  - query: draft the github release notes for v2.0 of the npm package, breaking changes first
    confusable_with: [daintree.release.publish-package]
    run: 2026-09-28-round6
  - query: Write the v6.2 announcement from the commits between v6.1.4 and release/6.2, citing each user-facing change.
    confusable_with:
      - daintree.edits.spawn-visible-agent
      - daintree.edits.sync-project-docs
      - daintree.git.summarize-activity
    run: 2026-10-16-synthetic-audit
