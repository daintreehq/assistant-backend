# daintree.hosts.run-validation-matrix: from this Shell's hub, one exact commit put through the
# same checks under each environment the person asks for (OS, architecture, runtime versions) on
# the Remote Hosts able to meet it, one matrix back with a row per environment: passed, failed,
# incomplete or unavailable.
#
# Positives are invented situations in agent and user words, short and long, some with a social
# lead-in or an earlier turn; explanation questions carry docs: true. Boundaries are requests this
# runbook wins against a neighbour whose vocabulary they share: the same change built on every host
# (swarm-fan-out), a lane testing its one row (verify-for-hub), checks on this machine
# (run-local-checks), a ship verdict (assess-readiness), different pieces spread over hosts
# (place-work), one host (delegate-to-host), and the local runbooks the starting sweep picked
# (test-distributable, run-e2e-suite, provision-local-environment). Followups and topic shifts are
# the matrix as a second turn. Machine names are generic.
runbook: daintree.hosts.run-validation-matrix
run: runbook-2026-10-issue-117

positives:
  - does 9c4d2e1 hold up under python 3.10 and 3.12 on the ubuntu server and the macbook host? give me each combination
  - 'matrix please: node 18, 20 and 22 on whichever of my machines have them, same commit, tests only'
