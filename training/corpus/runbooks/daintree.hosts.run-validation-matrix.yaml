  - validate 0b7d3f2 on the x64 linux box and the arm64 mac before I tag it, and tell me which environments failed
  - does the cli still pass on python 3.9? have whichever host has 3.9 run it at this commit, with 3.12 as the control
  - is the current main commit green on linux and mac with bun 1.1? use the other machines, not this one
  - put the pinned commit through lint and unit tests under deno 1.46 and deno 2 on my hosts and show each result
  - the integration tests at e81f0aa against postgres 15 and postgres 16, spread over the remote hosts, one result per database version
  - run the windows, linux and mac rows of our test matrix at this sha on my machines, and say which ones never ran
  - Run the repository's test suite at one pinned SHA under each environment the user listed (Linux x64, macOS arm64) on the Remote Hosts and return a per-environment table of passed, failed and could-not-run
  - The user wants release candidate rc.4 checked under Node 20 and Node 22 on the hosts; put each environment on a host that has that runtime and report one row per environment
  - Hub task, verify the tagged revision across macOS and Linux hosts with Python 3.11 and 3.12, no edits, every requested environment shown even when no host can run it
  - Cross-host compatibility run for commit 4a0e9b2, the same lint and unit commands on every requested platform, each result bound to that SHA
  - The user wants go test results at the pinned commit for Go 1.22 and Go 1.23 from whichever of their hosts have those toolchains, tabulated per environment
  - User asked for a platform matrix of the build and tests at the release tag across their remote machines; a failure on one platform is that platform's finding, not a reason to fix anything
  - The user's library claims support for Node 18 through 22 and they want proof at the release commit from the Linux and Mac hosts, a row per version and platform
  - A contributor says the build breaks on arm64; the user wants the same commit tested on the arm64 Mac host and the x64 Linux host to compare, without anyone fixing it
  - 'We''re about to cut 3.0 and I don''t want a ship decision from you, just facts: run the unit and integration tests at the RC commit on the linux workstation and on the mac mini, node 20 on both and node 22 where it''s installed. Anything that can''t run should say so, not show up as green.'
  - 'The dependency bump landed as 6e2f1c9. Before I trust it I''d like the same checks on every platform my hosts cover, x64 and arm64. Nothing gets fixed or pushed; I just want one table of what passed, failed or couldn''t run.'
