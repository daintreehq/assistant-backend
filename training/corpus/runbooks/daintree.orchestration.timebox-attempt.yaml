# Training examples whose answer is `daintree.orchestration.timebox-attempt` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.timebox-attempt
run: 2026-09-28-catalog-expansion
positives:
  - Give codex 20 minutes on getting the websocket reconnect working, then stop it and tell me how far it got.
  - try the vite migration for 15 min max then report back where it got
  - Time-box a claude agent to 30 minutes on converting the settings page to server components; interrupt it at the deadline and check what it left on disk.
  - Let gemini have ten minutes at shrinking the Docker image, and when the time is up stop it and collect a progress report.
  - half an hour on the pdf export perf, no more. then i want to know where it stands
  - Spend at most 25 minutes of an agent's time on the i18n string extraction in the feat/i18n worktree; halt it at 25 and summarise what's done.
  - Start an agent on the ESLint flat-config migration now and cut it off after 20 minutes, then tell me what it finished.
  - Spawn claude on adding keyboard shortcuts to the editor but only give it 15 minutes; stop it then and check the partial diff.
  - Launch codex on the retry refactor with a hard 10-minute budget and interrupt it at the limit if it's still going.
  - Give one agent a fixed 20 minutes to see whether swapping axios for fetch is feasible here, then stop it and report.
  - 15-minute budget for an agent to attempt the Tailwind v4 bump in a throwaway worktree; stop it when time runs out and list what broke.
  - 'Timeboxed attempt: codex, 40 minutes, port the payments module from callbacks to async/await; report done, not done and next steps at the cutoff.'
  - got a meeting in 20 mins. let claude hack on the login redirect bug until then and stop it, i'll read the report after
  - Can an agent get the monorepo building on Bun in 30 minutes? Run it with that limit and report how far it got.
  - Have an agent work on the onboarding copy rewrite for just 10 minutes, then stop it with a report of what's left, panel left open so I can continue.
  - No agent is stuck; I just want a fresh codex attempt at the GraphQL N+1 fix capped at 20 minutes, stopped and reported at the cap.
  - 'Budget: 12 minutes. Agent tries removing the lodash dependency from utils/. Stop at budget and verify the partial changes against the starting commit.'
  - see how far claude gets on the mobile nav in 20 min
  - Kick off an agent right now on the CSV parser rewrite and pull the plug after 30 minutes with a status on where it is.
  - Try the Python 3.13 compatibility fixes with codex for a strict 15 minutes; at the end I want done/not done, confidence and any half-edited files.
  - one agent, 20 min timebox, attempt to get storybook running for the design-system package
  - Give claude-2 a fresh task, trimming the bundle size, with a 10-minute deadline, and interrupt it when the time's up.
  - 'quick 10 min experiment: can an agent get the e2e setup working with playwright''s new fixtures? stop it after and tell me'
  - Allow an agent up to 25 minutes to start the move off the deprecated Redis client in its own worktree; after that, stop it and check what compiles.
  - Have an agent add dark mode to the marketing site, but I only want to spend 15 minutes of its time on it. Stop and report at 15.
  - Put codex on the ffmpeg thumbnail bug with a 20-minute cap, then stop it and verify on disk what it changed.
boundaries:
  - query: Give Codex twenty minutes to try splitting the GraphQL schema, then interrupt it and report how far it got.
    confusable_with: [daintree.agents.steer-running-agent]
  - query: Launch codex on the hydration mismatch and interrupt it if it's still working after 20 minutes; get its report.
    confusable_with: [daintree.agents.steer-running-agent]
  - query: Start gemini on the feature-flag cleanup and stop its turn after ten minutes, keep the panel open, summary of what's done.
    confusable_with: [daintree.agents.steer-running-agent]
  - query: new agent on the queue retry logic, and stop it at the 25 min mark whether or not it's finished
    confusable_with: [daintree.agents.steer-running-agent]
  - query: Have claude fix the date parsing bug in utils/date.ts, but stop it after 15 minutes regardless.
    confusable_with: [daintree.edits.spawn-visible-agent]
  - query: spin up codex on the README restructure, cap it at 10 min
    confusable_with: [daintree.edits.spawn-visible-agent]
  - query: Launch an agent to add CSV export to the reports page with a 20-minute ceiling and a progress report at the end.
    confusable_with: [daintree.edits.spawn-visible-agent]
  - query: Give codex 20 minutes to try swapping moment for date-fns and stop it at the deadline if it isn't done.
    confusable_with: [daintree.orchestration.spike-options]
  - query: Start codex on the cache invalidation work and in 30 minutes stop it and tell me how far it got.
    confusable_with: [daintree.orchestration.watch-outcome]
  - query: Set claude going on the logger cleanup now; at 15:40 halt it and bring me its progress.
    confusable_with: [daintree.orchestration.watch-outcome]
  - query: Launch an agent on the form validation now and after 15 minutes interrupt it and report progress, even if unfinished.
    confusable_with: [daintree.orchestration.watch-outcome]
