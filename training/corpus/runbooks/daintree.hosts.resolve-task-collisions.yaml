# daintree.hosts.resolve-task-collisions: the hub finds that work it sent to its Remote Hosts
# overlaps by accident (two machines on the same issue, units touching the same files, two
# hosts pushing one branch), holds every side, verifies what each pushed and hears what each
# kept unpushed, gives the work one owner that alone publishes, and keeps the other attempt.
#
# Positives are invented situations in agent and user words, short and long, some with a
# social lead-in, a constraint or an earlier turn; two how-to questions carry docs.
# Boundaries are requests this runbook wins against a neighbour sharing its words: agents
# colliding on one machine (orchestration.resolve-task-collisions), a race the person asked
# for (race-and-review), a unit moved off a failing host (reassign-host-work), a plain stop
# (steer-swarm), combining branches (integrate-host-branches), an account of the hosts
# (recover-and-clean-up), a new hand-off (delegate-to-host), following a run
# (supervise-swarm), placing pieces (place-work). Followups and topic shifts are the overlap
# found after an account, a status table or a hold. Machine names are generic.
runbook: daintree.hosts.resolve-task-collisions
run: runbook-2026-10-issue-114

