      - 'assistant: Before I merge: #412 "fix(auth): drop the stale session probe", auth/session-probe -> develop. Roll-up conclusive and success, 4/4 required checks passing, reviewDecision APPROVED, mergeable true. Which method — merge, squash or rebase?'
