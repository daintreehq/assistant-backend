      - 'user: land the docs one'
      - 'assistant: Two open PRs mention docs. I mean #388 "docs: fix the retry-policy table", docs/retry-table -> main. Confirm that''s the target and I''ll go.'
    active: [daintree.forge.land-pull-request]
  - query: why does it still say review_required, it's literally got my approval on it now
    history:
      - 'user: approve 219'
      - 'assistant: Approved — review submitted, state APPROVED, commit c41f9ab. Re-read the PR afterwards and reviewDecision still reports REVIEW_REQUIRED.'
