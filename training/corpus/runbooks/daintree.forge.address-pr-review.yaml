  - 'Deal with the human reviewer''s inline comments on PR #71: fix them, push, then resolve the threads that were actually fixed.'
  - 'A Sonar bot and a teammate both commented on #1502; account for every unresolved thread - fixed, answered, or declined - and push the fixes.'
  - 'apply the review feedback on #19 and push it, the contributor''s fork allows maintainer edits'
  - 'address pr review comments #4410, fork branch, local commits only'
  - 'Two reviewers left contradicting comments on #95 about the cache TTL; work through the rest of their feedback and bring the conflict to me.'
  - 'Several review threads on #300 are marked outdated but still open - check which still apply to the current code, fix those, and explain the rest.'
  - hey, the review on my pr came back with a load of nits and a couple of real issues, just fix everything
  - 'The agent in the checkout-v2 worktree is idle; send it the unresolved GitHub review comments on #812, have it fix them, then push.'
  - 'Respond to the review on #58: make the requested changes and answer the reviewer''s questions in the threads.'
