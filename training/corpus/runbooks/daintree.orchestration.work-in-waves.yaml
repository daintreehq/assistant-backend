  - run the backlog in waves of four and don't start a wave until everything from the last one is merged into develop
  - 'keep cycling: launch the wave, wait for green CI on all of its PRs, have an agent run the merge in the main checkout, delete the wave''s worktrees, next wave'
  - 88 and 91 depend on 85, so they go in a second wave after 85 is merged; 85, 86 and 87 can go first. agent per issue, merge between waves
  - I've ordered these 12 tickets into 4 waves. take them through one wave at a time and merge in between
  - for each wave, use the Implement recipe on every issue, then when all of the wave's PRs pass, run /land-all in a fresh claude terminal at the repo root
  - carry on with wave 3
  - after every wave tear down its worktrees and branch the next wave from the freshly merged main
  - 'waves: three issues, merge, three issues, merge, until the list is empty'
  - sequence these in rounds so the later ones build on the merged earlier ones, one codex agent per issue
  - the first wave's PRs are all merged, go ahead with the second
boundaries:
  - query: start wave 1 of the approved breakdown, and once it's merged go on to wave 2
    confusable_with: [daintree.orchestration.decompose-work]
  - query: work through these 9 issues three at a time, but merge each group of three before starting the next group
    confusable_with: [daintree.orchestration.fan-out-work]
  - query: wave 2's PRs are all merged, so delete those worktrees and kick off wave 3
    confusable_with: [daintree.orchestration.workspace-cleanup]
  - query: this wave's PRs are green, get an agent merging them and start the next wave once they're in
    confusable_with: [daintree.git.integrate-agent-branches]
  - query: run phase 2 only after every phase 1 PR has merged; they're all issues, one agent each
    confusable_with: [daintree.orchestration.execute-durable-workflow]
followups:
  - query: yep retry those deletes and then kick off the merge
    history:
      - 'user: three waves of issues, worktree and agent each, merge every wave before the next'
      - 'assistant: Wave 1''s three PRs are green and clean. Two worktree deletes timed out on Daintree''s confirmation and the third worktree is gone. Retry the two, then start the merge?'
    active: [daintree.orchestration.work-in-waves]
