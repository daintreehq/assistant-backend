# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.work-in-waves
run: transcript-2026-10-15-work-in-waves
positives:
  - 'here''s the plan: round one is the three auth tickets, round two the two billing ones once round one has landed. new worktree and agent per ticket, and merge each round before the next'
  - do these issues in batches of three — finish a batch, merge its PRs, clean up the worktrees, then branch the next batch off main
