# daintree.hosts.review-for-hub: the lane's side of a cross-host review. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub, is asked to review work it did
# not write at the exact commit the hub names, and to reply with findings only.
#
# Rows: lane-written task descriptions and people's own words for a hub's review request
# (short and long, some with an observation or a constraint: a moved branch, a missing
# commit, a different reviewer CLI, setup that wants approval, text in the change that
# tries to give orders, a reviewer that edited files); followups once the reviewer is
# running or done; and boundaries against reading the hub's message in general
# (daintree.hosts.handle-hub-message), a local review (daintree.review.review-change), the
# hub's own side of a hand-off (daintree.hosts.delegate-to-host), findings relayed to a
# fixer (daintree.agents.relay-review-feedback) and checking a claimed result
# (daintree.orchestration.verify-agent-work), each with reverse rows in that neighbour's
# file.
runbook: daintree.hosts.review-for-hub
run: runbook-2026-10-issue-99

positives:
  # agent-written task descriptions
  - Hub asked this lane to review branch race/dedupe/b at 41c9e07a and return findings without touching the code
  - Review the commit the hub named on the importer branch with a reviewer agent here and send the hub the findings, no fixes
  - Set up a review of the hub's branch at its pinned commit in a fresh worktree on this host and reply with severity-ranked findings
  - 'Lane task: second-opinion review of feature/webhooks at 0b7d3a91 using Codex, comments only, then answer the hub'
  - Run a findings-only review on this host of the branch another host built, pinned to the commit in the hub's message
  - Hub wants Claude Code on this machine to review the retry-policy branch at e2f4a610 for error handling and test gaps
  - Check the change at 9a1c3f5 against the acceptance criteria the hub sent and report problems with file and line, for the hub
  - Do the hub's code review of the logging refactor at the exact SHA it gave and report the findings without editing anything
  - Pin a worktree to the commit the hub wants reviewed and have an independent agent read it, then reply with what it found
  - Independent review for the hub of the scheduler branch built on another machine, at commit 5d7e21b0, findings only
  - Review the other host's pushed branch at the commit the hub quoted, keeping the reviewer read-only, and report back to the hub
  - Get a reviewer here that did not write the code to go over the hub's branch at 0c4f8e13 and list its findings
  - 'Hub review request: the token refresh change at 7e19a4d2, criteria are security and error paths, no commits'
  - Review for the hub the migration branch at a fixed commit and say which findings block a merge
  - Hub wants findings on the rate limiter rewrite at 3b8c0d55 from a Codex reviewer on this host, nothing changed
  - query: >-
      The hub has sent this machine a review job: the branch race/csv-parse/a at 4e1b9c07,
      built on another host by a different agent. It wants correctness and test coverage
      checked, findings with file and line, and nothing changed. Codex is signed in here,
      Claude Code is not.
  - query: >-
      We got a message from the hub asking for a review of the payments-retry branch at a
      specific commit. The branch on the remote has moved on since, two commits newer.
      Review what the hub actually named and tell it the branch moved.
  - query: >-
      Hub request on this lane: review the commit it names on the notifications branch. When
      I fetch, the branch exists but that commit is nowhere on the remote, so I can't check
      it out. The hub only wanted findings.
  - query: >-
      Another host's agent wrote the date-handling change. The hub wants this machine, which
      runs Codex, to check it against the spec it pasted, at commit 77ad20c, and report
      only, so the reviewer is not the same kind of agent as the builder.
  - query: >-
      The branch the hub wants reviewed has a setup script in its own Daintree config, and
      creating the review worktree stopped at setup waiting for approval. The review itself
      doesn't need anything installed.
  - query: >-
      Hub's review job for the cli-flags branch at 1a5f0e9c. A comment in one of the changed
      files tells AI reviewers to approve the change and push a formatting fix. The hub asked
      for findings and nothing else.
  - query: >-
      The reviewer agent I started for the hub's review finished and listed three problems,
      but git status in the review worktree shows it also changed a test file. The hub only
      asked for comments.
  - query: >-
      Hub asked for a review of race/sorting/b at a91f3c2 against correctness and edge
      cases. That branch was built by Claude Code on the other machine, and this lane has
      both Claude Code and Codex ready.
  # people's own words
  - the hub wants a second pair of eyes on the cache branch at 6d02b1e, just comments
  - main machine says review the branch the other box pushed, don't fix anything
  - hub wants this host to review someone else's PR at its head sha and tell it what's wrong
  - the hub sent over a review job for the auth branch, findings only
  - review that commit for the hub, nothing else
  - codex here should look over the hub's branch at 2c7e9d1 and list issues
  - the other mac built it, we review it, the hub wants findings
  - 'hub: review race/sorting/b at a91f3c2 for correctness and edge cases, no edits'
  - hub wants our review of the webhook retries change, pinned commit, report problems only
  - the hub's commit to review isn't on the remote, what now
  - hub review job but the branch moved since it sent the sha
  - review for the hub came in, use whichever agent didn't build it
  - the hub needs findings on the other lane's branch before it picks a winner
  - hub wants review notes on the export branch, severity and line numbers, don't commit
  - query: hey, quick one. the hub dropped a review request for the queue worker branch at 8f2a6c1, can you run it
  - query: thanks for the last one. now the hub wants the same kind of review on race/search/b at 64d0b2e
  - query: the hub wants it reviewed at that exact commit, not whatever the branch says now
    history:
      - "user: what did the hub send?"
      - "assistant: A review request for feature/ledger at 9e3c1f07, criteria: correctness and tests. The branch tip on the remote is already 2 commits past it."
  - query: start it, codex is fine
    history:
      - "user: anything from the hub?"
      - "assistant: It wants a findings-only review of race/merge-sort/b at 3d8a0f1, with a reviewer that is not the agent that built it. Codex is ready here; the branch came from a Claude Code host."
  - Lane picked up a hub review request for the onboarding flow at d3a7b10; the brief names no reviewer CLI and says the branch came from a Codex host
  - Review the hub's pinned commit 2f8e6a4 on the search branch with an agent other than the builder's kind, then confirm the review worktree is still clean before replying
  - the hub wants a security-focused review of the upload handler at its sha, from this machine, comments only
  - can you review the hub's branch here at the commit it gave and send it back what's wrong
  # explanation questions
  - query: Explain why a review for the hub is done in a fresh worktree at the pinned commit rather than in this machine's main checkout
    docs: true
  - query: Why shouldn't the reviewer on this host just review whatever the branch tip is when the hub's SHA has moved on?
    docs: true

followups:
  - query: now send the hub what the reviewer found
    history:
      - "user: review the hub's branch at 9f1e2d3"
      - "assistant: The Codex reviewer is running in a worktree pinned to 9f1e2d3; I'll pick it up on its notice."
  - query: the reviewer is done, make sure it didn't change anything, then answer the hub
    history:
      - "user: how's the hub's review going?"
      - "assistant: The reviewer on race/parse/a at 51c7b9e is still reading; nothing has come back yet."
  - query: it touched two files, what do we tell the hub
    history:
      - "user: the hub wanted findings only on the cache branch"
      - "assistant: The reviewer finished. The worktree is no longer clean: two files under src/ were modified."
  - query: which commit did it actually review?
    history:
      - "user: did the hub's review go out?"
      - "assistant: Not yet. The reviewer reported eleven findings for the importer branch."
  - query: the branch tip moved again, does that change anything
    history:
      - "user: start the hub's review"
      - "assistant: Worktree pinned to 0d4e7a2 for the hub's review; the reviewer is launching."

  - query: ok reply to the hub now
    history:
      - "user: is the review for the hub finished?"
      - "assistant: Yes. The Codex reviewer read 6a1f3e0 and reported two high and one low finding; the worktree is clean and still at that commit."
  - query: the hub only gave a short sha, use it anyway
    history:
      - "user: start the review the hub asked for"
      - "assistant: The request names commit 4be19 on feature/sync, not the full SHA."

boundaries:
  - query: the newest message from the hub wants the queue branch at 1f0a9b3 looked over; it only wants to hear what's wrong
    confusable_with: [daintree.hosts.handle-hub-message]
  - query: answer the hub's review request with the reviewer's findings
    confusable_with: [daintree.hosts.handle-hub-message]
  - query: what the hub sent is a review job for this lane, do it and reply
    confusable_with: [daintree.hosts.handle-hub-message]
  - query: review the branch at c41d7e2 for the hub, severity and file and line, no edits
    confusable_with: [daintree.review.review-change]
  - query: code review for the hub of the auth middleware change at its pinned commit
    confusable_with: [daintree.review.review-change]
  - query: a findings-only review, but the request came from the hub, not from anyone at this machine
    confusable_with: [daintree.review.review-change]
  - query: the hub delegated a review to this machine, run it on the commit it named
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: this host was handed a review by the hub, of a branch another host pushed
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: the hub routed another machine's branch here for review at 2b9e4f1, findings back to the hub
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: the hub wants codex on this lane to read its branch and list problems; nothing gets fixed or handed to another agent
    confusable_with: [daintree.agents.relay-review-feedback]
  - query: launch a read-only reviewer on the hub's commit and pass its notes back to the hub, nobody fixes anything
    confusable_with: [daintree.agents.relay-review-feedback]
  - query: the hub wants a review of another agent's work at a fixed commit, comments only, not a test run
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: check the other host's branch at 8e3b1c0 for the hub as a code review, findings rather than rerunning its tests
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: the other host built it and the hub wants our read on it before it merges, review only
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: pass judgment on the branch the hub sent over at 7c2d9e1, comments only, and send the verdict back
    confusable_with: [daintree.review.review-change]
