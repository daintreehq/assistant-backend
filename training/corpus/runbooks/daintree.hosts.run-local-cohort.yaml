# daintree.hosts.run-local-cohort: a Remote Host's lane given SEVERAL pieces by the hub at once,
# a batch of independent units for this project or rival attempts the hub asked for, splits them
# across its own worktrees and visible agents within the hub's cap and this project's running
# agents, verifies each piece here, and answers the hub once with a row per piece.
#
# Rows: hub batches and hub-requested attempts in lane-written task descriptions and people's own
# words, short and long, some with a social lead-in or earlier turns; the situations inside a
# batch (a cap, agents already running, one CLI signed in, two units sharing a file, a queue);
# followups mid-batch; boundaries against one unit (daintree.hosts.do-delegated-work), the
# envelope (daintree.hosts.handle-hub-message), the person's own split
# (daintree.orchestration.fan-out-work, daintree.orchestration.competition,
# daintree.orchestration.spike-options, daintree.orchestration.decompose-work), the hub side
# (daintree.hosts.swarm-fan-out), checks of a commit (daintree.hosts.verify-for-hub) and agents
# already running for the hub (daintree.hosts.steer-for-hub).
# Reverse rows sit in those neighbours' files. Blind labels agreed on every row.
runbook: daintree.hosts.run-local-cohort
run: runbook-2026-10-issue-105
