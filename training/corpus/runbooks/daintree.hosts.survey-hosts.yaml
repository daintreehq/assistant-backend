# daintree.hosts.survey-hosts: the hub's read-only report on the Remote Hosts (connection,
# observed load and agents, projects and assistants, open exchanges, what needs the person).
# Positives are current overview requests with nothing restarted or sent. Boundaries hold it
# against the local fleet sweep, readying assistants, usage, messaging diagnosis, rebuilding
# sent work after a restart, following a run, a question for one host's assistant and
# adding a machine; the reverse rows live in each neighbour's file.
runbook: daintree.hosts.survey-hosts
run: runbook-2026-10-issue-87
positives:
  - 'The user has four Remote Hosts connected and is leaving for the day. They want one read-only picture before they go: which hosts are reachable, when each one''s load was last sampled, which of their projects have an assistant enrolled for this Shell and whether it is available, and any exchange still open. Nothing should be sent or started.'
  - The person is travelling and asks, from their laptop, what is going on across their other Macs. They have two Remote Hosts configured and want to know in one go what each is up to and whether anything needs them.
  - 'After a long meeting the user wants to see where all their remote machines stand before deciding what to do next: which are up, how loaded each is, and whether any host''s assistant asked them something. No work to send, no assistants to start.'
  - The user's second Mac dropped off the network earlier. They want to know which hosts are connected right now, what was last seen for the ones that are not, and whether an open exchange is sitting on a question for them.
  - 'The user is about to ask a colleague to cover for them and wants to know what that colleague could reach: every project open on each remote host, and which of them already have a Daintree assistant in them.'
  - Tell the person how many agents each remote host has working, waiting or idle and how hot or loaded each machine is, as last observed, in one report with the time of each reading.
  - 'Before dinner the user wants one quick current look at each of their remote hosts: whether it is connected, how busy it seems, which exchanges with it are open right now, and whether any is waiting for their input.'
  - The user asked whether anything on their other machines needs them. Look at each connected host's open exchanges and assistants and report what is waiting on a person, naming the host.
  - 'Put together a status page for the user''s remote hosts before their standup: connection, load, assistants and open exchanges per host, with a note of anything that could not be read.'
  - The user has a Mac mini and a Linux tower as Remote Hosts and has lost track of what each one is up to. Give one section per host with its projects, assistants and any open exchanges, and the time of every observation. Do not message either host.
  - Before the user decides which machine to trust with tonight's job, they want to look at every remote host's current load, thermal state and agent counts, and which assistants are up. Report what the tools show and what they do not.
  - I keep three remote hosts connected to this Shell and one of them has been quiet. Can you check how each looks right now, including which have assistants enrolled and which exchanges are still open, and flag whatever is waiting on me?
