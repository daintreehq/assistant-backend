    run: runbook-2026-10-issue-103
  - query: sorry to bug you again, the laptop host keeps refusing messages from here, which gate is it this time
    run: runbook-2026-10-issue-103
  - query: the old intel mac host answers unsupported to every send while my other hosts work fine; what's different about it?
