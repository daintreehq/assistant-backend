# Training examples whose answer is `daintree.release.deploy-and-verify` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.release.deploy-and-verify
run: 2026-09-28-round6
positives:
  - Deploy origin/main at its current SHA to staging with the repo's own deploy script, then confirm staging's /version reports that SHA.
  - ship v2.5 to production
  - put this build on staging and check it's up
  - Roll out tag api-v3.1.0 to the prod Cloud Run service through the project's Cloud Build pipeline and verify the new revision takes 100% of traffic. User explicitly authorized production.
  - Redeploy the worker from the release/1.8 tip to the qa environment; verify the served build sha and run the smoke script.
  - deploy develop to the dev env pls, and make sure the new version is actually live not just 'deploy succeeded'
  - Trigger the deploy-staging workflow for commit 4e1a9d0 and prove that commit is what staging serves.
  - push the marketing site to prod (yes prod, go ahead) and check the homepage renders
  - fly deploy of the ingest service to staging at a pinned SHA; confirm via fly releases and the health endpoint
  - Get 2.5.1 out to production, which I'm authorizing, and confirm the version endpoint reports it.
  - staging is still on last week's build, get main onto it and verify
  - Deploy hotfix tag v4.0.3 to production (explicitly approved) and run the smoke checks afterwards.
  - Deploy the api from tag v2.2.0 to the eu-west staging cluster using the Makefile target and check the rollout finished with the new image.
  - Put feature branch preview-auth at its current head onto the preview environment and confirm the build sha it serves.
  - redeploy the admin app from the release tag to prod, i've signed off. check /health and the version
  - One deploy of commit 81fe0c2 to the sandbox environment via scripts/deploy.sh, then verify the service reports 81fe0c2 and passes its smoke test.
  - ok ship it to staging and tell me when the right version is actually serving
  - 'PR #733 merged a few minutes ago and started the auto-deploy to staging; confirm the merge commit is what staging now serves and the smoke check passes.'
  - Run the project's staging deploy in a pane I can watch, then prove the new build is what's serving.
  - 'Staging is on the reverted build. Roll forward: deploy the fixed commit b72e10c to staging and verify it serves.'
  - The 3.4 go/no-go came back as a go; now deploy the 3.4 tag to production as agreed and confirm it's live.
  - The fix for the checkout 500s is merged. Ship main to prod (approved) and check checkout returns 200 on the new build.
  - 'Not the npm package: deploy the docs website built from v1.4.0 to production and confirm it serves 1.4.0.'
  - Deploy the container image built from tag v9.2 to the staging k8s namespace and check the rollout finished on that image.
  - checks are green on release/2.2, deploy it to preprod and verify the served sha matches
  - Deploy main to staging now, don't wait for tonight's scheduled run, and prove the new revision carries the traffic.
