    run: 2026-09-28-round6
  - query: ok new plan. the migration stuff can wait, get everyone except codex onto the login bug
    run: 2026-09-28-round6
  - query: 'boss just escalated #512, pause the docs agents and throw them at it'
    run: 2026-09-28-round6
  - query: stop the low priority stuff, the release blocker comes first. keep the api agent going tho
