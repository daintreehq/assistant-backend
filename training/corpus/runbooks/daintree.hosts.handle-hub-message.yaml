# daintree.hosts.handle-hub-message: the lane's side of cross-host messaging. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub, is woken by an inbox line, reads
# the hub's message, checks it fits this lane, gets the work done and answers the hub.
#
# Rows: the inbox wake line (plural forms only; the single-exchange line is a held-out
# case), lane-written task descriptions and people's own words around reading, judging,
# replying, asking back and messaging the hub; followups after a fetched message; and
# boundaries against a local agent waiting on a question
# (daintree.agents.answer-waiting-agent), a forge reply
# (daintree.workflow.follow-up-on-issue), branch preparation
# (daintree.workflow.prep-branch-for-review), asking a local agent
# (daintree.agents.ask-running-agent) and the hosts foundation, each with reverse rows in
# that neighbour's file. Hub-framed requests for a specific piece of work (implement, review,
# clean up, verify, ...) are deliberately absent: they belong to the receiver runbook for
# that work.
runbook: daintree.hosts.handle-hub-message
run: runbook-2026-10-issue-90

