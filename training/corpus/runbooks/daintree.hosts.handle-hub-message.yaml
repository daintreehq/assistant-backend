boundaries:
  - query: the hub's message is waiting for an answer in the inbox, deal with it
    confusable_with:
    - daintree.agents.answer-waiting-agent
  - query: an exchange from the hub is sitting there unanswered
    confusable_with:
    - daintree.agents.answer-waiting-agent
  - query: the hub asked me a question in its message, answer it
    confusable_with:
    - daintree.agents.answer-waiting-agent
  - query: send the findings back to the hub, not to the issue tracker
    confusable_with:
    - daintree.workflow.follow-up-on-issue
  - query: report back to the hub that CI is green on the branch it asked for
    confusable_with:
    - daintree.workflow.prep-branch-for-review
    - daintree.workflow.follow-up-on-issue
  - query: the work for the hub is committed already, just send it the SHA, no PR
    confusable_with:
    - daintree.workflow.prep-branch-for-review
  - query: ask the hub what it meant by the cache fix
    confusable_with:
    - daintree.agents.ask-running-agent
  - query: check with the hub before touching the other repo
    confusable_with:
    - daintree.agents.ask-running-agent
  - query: is the hub's message in my inbox something I'm allowed to act on
    confusable_with:
    - daintree.hosts.foundation
  - query: "the hub wants usage figures from here but doesn't say for which agent, ask it which one it means"
    confusable_with: [daintree.hosts.check-usage-limits]
    run: runbook-2026-10-issue-91
  - query: "tell the hub its usage request is stuck: claude code here is sitting on a login prompt"
    confusable_with: [daintree.hosts.check-usage-limits]
    run: runbook-2026-10-issue-91
  - query: 'a hub message came in that might be meant for the other repo open on this host; read it and say which'
    confusable_with: [daintree.hosts.do-delegated-work]
    run: runbook-2026-10-issue-98
  - query: 'the hub''s change is verified on its branch; send the completed answer with the SHA and the test results'
    confusable_with: [daintree.hosts.do-delegated-work]
    run: runbook-2026-10-issue-98
  - query: 'the brief needs Gemini, which isn''t installed here; put that back to the hub as a question'
    confusable_with: [daintree.hosts.do-delegated-work]
    run: runbook-2026-10-issue-98
  - query: 'the hub''s request is for a repository this lane doesn''t have open; send it back as a question'
    confusable_with: [daintree.hosts.do-delegated-work]
    run: runbook-2026-10-issue-98
