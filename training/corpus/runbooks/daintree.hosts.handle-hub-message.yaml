  - Fetch the pending hub request with assistant.getInbox, confirm it targets this lane's project, then carry it out and close the exchange with a completed reply
  - Process the hub's inbox message on this remote host and answer it with artifact references
  - Answer the hub's exchange with input-required because the branch it names does not exist on this machine
  - Ask the hub which repository it means before starting anything, keeping its exchange open
  - Reply completed to the hub's exchange with the worktree branch, commit SHA and pane id
