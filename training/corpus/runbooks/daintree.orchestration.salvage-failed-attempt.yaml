  - salvage the migration + fixtures from the failed postgres upgrade attempt into a new branch, dont touch the old worktree
  - The post-mortem on codex's failed run already listed the config loader and env-var validation as salvageable; build those into a fresh branch now.
  - No need to explain why the payments attempt failed; just get its currency-rounding module into a clean branch off main that passes on its own.
  - Of the eleven commits on the failed agent/refactor-auth branch, work out which are sound on their own and bring just those onto a new branch from main.
  - the codex branch is broken overall but commits 3 and 5 look fine to me. get them onto a fresh branch off main and make sure they pass without the rest
  - Don't revert anything in the failed worktree - copy the useful bits (the CSV parser and its tests) into a new branch off the base instead.
  - rather than rolling back claude's attempt, leave it as-is for reference and pull the good parts into a new wt
  - Codex hit a wall on the search indexer and its approach is wrong. Don't have another agent continue it; start clean off develop with only its tokenizer and those tests.
  - Claude's attempt at the plugin loader is abandoned. Give a builder a new worktree to carry over just the manifest-validation code and make it pass there.
  - The sync-engine attempt did not work - it deadlocks - but its conflict-resolution module is solid; move that alone onto a fresh branch with tests.
  - Nothing is lost, the failed worktree is still there - I just want its good parts, the S3 upload helper and tests, on a new branch from main.
  - Extract the salvageable subset of claude-2's failed Kotlin migration (data classes and serializers) into a new worktree off main; its checks must pass without the broken ViewModels.
  - gemini's attempt at the chart lib swap flopped. the axis formatting code it wrote was nice tho, keep that in a fresh branch
  - Keep the useful half of the failed monorepo-split attempt - the shared tsconfig and the build script - on a new branch off main; the failed worktree stays untouched.
  - 'Salvage the rate limiter and its load tests from the broken agent/api-gateway attempt: new branch, provenance recorded, no push.'
  - The 20-minute timeboxed attempt ended with a broken build; keep just its validation-schema changes on a fresh branch off develop.
