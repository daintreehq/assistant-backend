  - query: just give me pass/fail for tsc and eslint in the api worktree, I don't need to watch it
    confusable_with: [daintree.terminals.run-visible-command]
  - query: Run the build in the mobile worktree and report whether it passes; no panel needed.
    confusable_with: [daintree.terminals.run-visible-command]
  - query: Run lint and typecheck in the search-v2 worktree and report pass/fail per check; no panel needed.
    confusable_with: [daintree.terminals.run-visible-command]
  - query: run the checks before i push, i'll push and open the PR myself
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: Is feature/auth green locally? Run lint, types and tests; no commits.
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: Run the project's bounded lint check.
    confusable_with: [daintree.ci.diagnose-and-fix, daintree.worktree.manage-resource]
    run: pre-split
  - query: run the linter here
