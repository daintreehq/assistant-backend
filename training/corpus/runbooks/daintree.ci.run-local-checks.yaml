  - query: Run the test suite on feature/tax and report failing lines if there are any; fixing is a separate request.
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: run the test suite in the api worktree and tell me pass or fail
    confusable_with: [daintree.ci.hunt-flaky-test]
  - query: did the checks pass in every agent's worktree? just run them and report
    confusable_with: [daintree.ci.hunt-flaky-test]
  - query: run jest unit tests and tsc in wt checkout, no browser stuff
    confusable_with: [daintree.ci.run-e2e-suite]
  - query: run the tests and lint in my auth worktree before I push
    confusable_with: [daintree.git.test-pull-request-locally]
  - query: run the unit tests in the payments worktree and tell me what's red
    confusable_with: [daintree.orchestration.test-first-split]
  - query: No agent has reported anything; just run the tests in each agent worktree and say which pass.
