# Training examples whose answer is `daintree.ci.run-local-checks` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.ci.run-local-checks
run: 2026-09-28-catalog-expansion
positives:
  - Run pytest in the billing-refactor worktree and report the result at its current HEAD; fix nothing.
  - Run the test suite in each agent's worktree (claude-1, claude-2, codex) and tabulate which are green.
  - Does the monorepo still build after the tsconfig change on chore/ts-5.6? Run the build there and report.
  - List the test, lint, typecheck and build commands this project defines without running any of them.
  - 'cargo clippy + cargo test in the worktree for issue #812, report only, quote failing lines if any'
  - Run locally whatever .github/workflows/ci.yml runs, in the current worktree, and report each step's outcome.
  - Run go vet and go test ./... across the three agent worktrees one at a time, since they share a Postgres test database.
  - eslint on the api-gateway worktree only; report error count and file names
  - Typecheck all four worktrees and report which ones come back clean.
  - Run the Jest unit tests in feature/invoice-pdf, stopping at the first red check.
  - Run npm run build in the search worktree and report exit status, with the output tail if it fails.
  - Run mypy --strict and ruff on feature/export-csv; read-only, no fixes, no commits.
  - run the tests pls
  - can u run lint + tsc in the auth wt
  - does it still build?
  - before i push, run the checks on this branch
  - what test/lint commands does this repo even have
  - run phpunit in the wp-plugin worktree and tell me if its green
  - hey quick one - run rspec on my branch, dont touch anything
  - Nobody has claimed anything yet; just run the unit tests in all five agent worktrees and report green or red per worktree.
  - Rather than waiting on GitHub Actions, run the same lint and test jobs locally in the feature/webhooks worktree and report.
  - Run lint, types and tests on feature/sso before I open the PR myself; don't commit or push anything.
  - Run tsc and eslint in the mobile worktree and just give me pass/fail, no terminal panel needed.
  - Unit tests only in feature/cart - skip the Playwright suite - and report the result.
  - Nothing is known to be broken; run the build and unit tests now in wt payments and report what you see, fixing nothing.
  - query: run lint and typecheck in the auth worktree
    run: 2026-09-28-catalog-expansion-refine
boundaries:
