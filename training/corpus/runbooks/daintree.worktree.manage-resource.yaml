  - query: so theres no way to get a shell on it from in here at all?
    history:
      - 'user: ssh me into the devbox'
      - 'assistant: Connect is a UI-only action — it isn''t exposed to me, and I won''t guess an SSH command from the status endpoint. Use the connect control on the worktree card.'
