    active: [daintree.worktree.manage-resource]
  - query: dont fire it again, check first
    history:
      - 'user: provision the auth worktree'
      - 'assistant: The provision call timed out in transport. That doesn''t prove the project command did nothing, so I''m re-reading status before considering a retry.'
