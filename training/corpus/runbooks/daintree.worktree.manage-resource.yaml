      - 'assistant: Raw resource calls cannot be granted to timers.'
    active: [daintree.worktree.manage-resource]
  - query: Do not run it; tell me where the UI preview is.
    history:
      - 'user: Tear down the devbox.'
      - 'assistant: The assistant cannot preview the project-defined destructive commands.'
    active: [daintree.worktree.manage-resource]
  - query: Report that verification is unavailable and stop.
    history:
      - 'user: Check remote resource status.'
