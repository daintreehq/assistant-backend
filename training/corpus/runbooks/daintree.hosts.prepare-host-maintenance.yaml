# daintree.hosts.prepare-host-maintenance: the hub readying a Remote Host for a planned update,
# restart or reboot. Before it: an impact report per host (projects, enrolled assistants, open
# exchanges, and what the hub cannot see), then each enrolled assistant's acknowledged checkpoint
# (branch, SHA, pushed or not, uncommitted files, writes in flight). After the person restarts
# it: projects, assistants and exchanges reconciled before anything more is sent.
#
# Rows: planned-maintenance requests as people phrase them and as hub agents describe the task,
# short and long, some behind a social lead-in or a history turn, and the return turn after a
# restart; followups; and boundaries against catching up after an unplanned restart
# (daintree.hosts.recover-and-clean-up), putting a run on hold (daintree.hosts.park-swarm),
# stopping or changing a run (daintree.hosts.steer-swarm), a plain read of the hosts
# (daintree.hosts.survey-hosts), adding a host (daintree.hosts.connect-host), Daintree failing on
# this machine (daintree.diagnostics), following a run (daintree.hosts.supervise-swarm) and
# moving the hub role (daintree.hosts.hand-off-swarm), each with reverse rows in that
# neighbour's file.
runbook: daintree.hosts.prepare-host-maintenance
run: runbook-2026-10-issue-130

