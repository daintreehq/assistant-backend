boundaries:
  - query: Daintree on the lab server restarts for an update in an hour. Find out what it will interrupt before it happens.
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: I want the picture before I restart the host, not an account afterwards of what survived.
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: the update I prepared the host for is done. Reconcile it against the checkpoints you took.
    confusable_with: [daintree.hosts.recover-and-clean-up, daintree.orchestration.status-and-resume]
  - query: I'm not parking the run. I'm only restarting the host's Daintree for an update, so have its assistants save and stop at a safe point.
    confusable_with: [daintree.hosts.park-swarm]
  - query: pause the remote host's work just long enough to restart its Daintree; the other hosts carry on
    confusable_with: [daintree.hosts.park-swarm, daintree.hosts.steer-swarm]
  - query: the rest of the run keeps going. Just get the build server's assistants stopped safely before its restart.
    confusable_with: [daintree.hosts.steer-swarm]
  - query: list each remote host's projects and open exchanges, because I'm going to restart one of them tonight
    confusable_with: [daintree.hosts.survey-hosts]
  - query: show me what's on the mac mini and what the restart cuts off, not a general overview of my hosts
    confusable_with: [daintree.hosts.survey-hosts]
  - query: a host that already works for me needs a newer Daintree build. What will the update interrupt over there?
    confusable_with: [daintree.hosts.connect-host]
  - query: Daintree on the remote server needs a restart for an update. What would that interrupt?
    confusable_with: [daintree.diagnostics]
  - query: reboot the linux machine that hosts my Daintree projects tonight; what of my delegated work is on it
    confusable_with: [daintree.worktree.manage-resource]
  - query: keep following the run, but the build server restarts for an update at ten, so get its work saved first
    confusable_with: [daintree.hosts.supervise-swarm]
  - query: I'm only restarting the host, not replacing this hub conversation. Get the host's work saved and check it afterwards.
    confusable_with: [daintree.hosts.hand-off-swarm]
  - query: before the update, checkpoint what the assistants on the host have done and say what isn't covered
    confusable_with: [daintree.orchestration.execute-durable-workflow]
  - query: the host restarts for its update tonight; find which of its projects hold unpushed work from the swarm and get that saved first
    confusable_with: [daintree.hosts.audit-host-workspaces]

followups:
