# Training examples whose answer is `daintree.ci.hunt-flaky-test` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.ci.hunt-flaky-test
run: 2026-09-28-catalog-expansion
positives:
  - test_websocket_reconnect fails roughly one CI run in ten. Have an agent measure the rate under different seeds and worker counts and find the cause.
  - Run tests/api/test_orders.py::test_concurrent_checkout 50 times in the payments worktree and report the failure rate per condition.
  - this test is flaky af. cart_spec line 88. figure out why
  - the date picker spec only ever fails in CI, never on my machine. whats going on
  - Find which test is polluting test_user_cache; it only fails when it runs after the rest of tests/services.
  - Stabilise the intermittent upload-progress test at its source — no sleeps, no retries — and prove it with a consecutive-pass gate. Don't commit.
  - intermittent failure in pkg/queue TestDrainOrder — measure rate, isolate trigger, root cause at file:line, no fix
  - The notifications Jest suite fails now and then in parallel mode but never with --runInBand; quantify it and find the shared state.
  - can u get codex to hammer TestLeaderElection a few hundred times and see how often it falls over
  - Hunt down the race behind the Playwright checkout spec timing out on about 5% of CI runs and fix it properly, without raising timeouts.
  - test_schedule_next_run only fails around midnight UTC; have claude confirm it's clock-dependent and fix it with an injected clock.
  - Randomly failing pytest under pytest-randomly — take the seed from CI run 88213, replay that ordering and find the polluter.
  - rspec order-dependent failure again, seed 41822 breaks it. find the leaky spec
  - Last night's CI retried test_billing_cycle and it passed on the second attempt. Measure it 40 times to see whether it's genuinely unreliable.
  - The Go test TestCacheEviction fails with -race maybe once per 30 runs; find the data race and report where it lives, read-only.
  - 'flaky: test_pdf_render_hash, suspected locale/TZ dependency — vary TZ and LANG one at a time and report failures per setting'
  - our e2e smoke job goes red every few days on the same assertion with no code changes in between. find the root cause
  - Figure out why test_import_large_file fails only when the CI box is under load, and make it deterministic without widening tolerances.
  - CI went red on test_payment_webhook but a re-run passed. Don't just retry it — find out why it only fails some of the time.
  - The build job goes red at random on the snapshot test; fix the underlying nondeterminism so it stops failing intermittently.
  - 'The repro test the agent wrote for #640 is red 3 times out of 8. Dig into why it''s nondeterministic.'
  - Run the auth test file 30 times in a loop and tell me how many runs fail — it's been unreliable lately.
  - The Cypress login spec passes most runs but sometimes fails in CI; measure the failure rate and identify what triggers it.
  - test_export has been intermittent for about a week. First just measure how often it fails and under which conditions.
  - failing test on main? no — it's the same one that fails once in a while, test_quota_reset. get an agent to measure and explain it
  - Before we quarantine test_ws_heartbeat, get a real failure rate and a root cause for it so the fix is in the source.
