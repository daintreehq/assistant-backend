# Training examples whose answer is `daintree.terminals.run-visible-command` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.terminals.run-visible-command
run: 2026-09-28-catalog-expansion
positives:
  - start the dev server for the api-v2 worktree in a panel pls
  - Run `cargo build --release` in a visible Daintree terminal filed under the perf-tuning worktree; report rc plus an output tail.
  - Start the vite dev server for the dashboard worktree in a side terminal (no Dev Preview panel, the user has their own browser) and report the URL it prints.
  - tail -f storage/logs/laravel.log in a panel for the queue-fix wt
  - Launch the jest watcher (`npm test -- --watch`) in its own shell next to claude-2's worktree. Plain shell, no agent.
  - is the server you started earlier in the checkout-flow worktree actually up? what port
  - stop the rails server you started for me in the payments worktree
  - Run `docker compose up -d postgres redis` in a visible terminal in the main checkout and report whether it exited cleanly.
  - Visible shell, worktree grpc-refactor, command `make proto`. Report exit status and tail.
  - 'can you run `bundle exec rake assets:precompile` in a terminal i can see, in the #512 worktree'
  - 'Open two named shells in the monorepo-split worktree: one running `turbo dev --filter=web`, one tailing logs/api.log.'
  - 'Shell command, not an agent: run ./scripts/generate-fixtures.sh in the fixtures-v3 worktree where the user can follow along and report the rc.'
  - fire up `python manage.py runserver` for the django-orders branch in a terminal, i want to watch the request log
  - Kick off the production bundle (`npm run build`) in a visible panel for the auth-refresh worktree and report the rc and tail. Just run it, fix nothing.
  - what did the build you kicked off in the 'web build' terminal end with? rc?
  - Start `pnpm storybook` in a terminal under the design-tokens worktree and confirm from its output that it is listening.
  - Run `go test ./... -count=1` in a side terminal in the retry-backoff worktree so the user can watch it scroll by, and report the rc.
  - run `npx prisma generate` in a new shell in codex's worktree so i can see it
  - 'The notifications worktree needs a worker running: start `celery -A app worker -l info` in its own panel and quote the ready line.'
  - 'Watcher in a visible terminal: worktree feat/search-v2, `yarn tsc --watch`, report the first compile result.'
  - shut down the webpack watcher you spun up for me this morning, the one in the legacy-ui wt
  - 'The api server you started for me in the orders worktree: confirm it is serving that checkout and not main, and give the port.'
  - Run `php artisan queue:work` in a visible terminal in the mail-digest worktree and leave it running.
  - pls run `npm ci` in a new terminal under claude-3's worktree, want to see if the lockfile resolves
  - Run `./gradlew assembleDebug` in a Daintree terminal in the android-nav worktree with a sensible deadline and quote the tail.
  - Open a terminal in the main checkout and start `hugo server -D` for the docs; tell me the local URL once it's serving.
  - query: tail the server log in a side terminal
    run: 2026-09-28-catalog-expansion-refine
