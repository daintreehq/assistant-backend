followups:
  - query: and the review?
    history:
      - 'user: is the PR on 88 green?'
      - 'assistant: forge.getChecks on PR #91 reports state=success, 6 required checks passed, 0 failed, 0 pending. Caveat: that value is provider-cached and can lag ~a minute.'
    active: [daintree.workflow.follow-up-on-issue]
  - query: do the last page too, i want the newest one
    history:
      - 'user: did anyone reply on issue 231?'
      - 'assistant: commentCount is 7. Read the first page via forge.listIssueComments — comments come oldest first, so I have the earliest 5 so far.'
    active: [daintree.workflow.follow-up-on-issue]
  - query: ok tell the agent
    history:
      - 'user: what''s blocking #145'
      - 'assistant: PR #150 is open, reviewDecision CHANGES_REQUESTED, checks passing. The forge doesn''t return review bodies, so I don''t have the actual asks yet.'
