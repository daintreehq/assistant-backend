# Training examples whose answer is `daintree.workflow.follow-up-on-issue` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.workflow.follow-up-on-issue
run: pre-split
positives:
  - is that PR green yet
  - did ci pass on 412?
  - check the review state on the auth PR
  - 'what''s blocking #88'
  - anyone reply on that issue yet?
  - read the thread on 231 and tell me what they actually want
  - pull the check roll-up for the PR on that worktree — counts are fine, i don't need names
  - so the agent finished on issue 77 ages ago and opened a PR, can you go see whether the reviewer has actually looked at it and whether the checks came back ok, and just tell me where the whole thing is sitting right now
  - reviewDecision on 145?
  - comment on 92 saying it shipped and close it
  - close out that issue with a note pointing at the PR
  - did it get approved or are they asking for changes
  - wheres that pr at
  - now do the same for the other two issues
  - tell the agent what the reviewer asked for
  - forward the changes-requested plus the thread asks to whoever's still working on it
  - 'status of #310 on github'
  - checks red or green on the PR for the ratelimit ticket?
  - is there even a PR linked to 405
  - i pushed that branch about an hour ago and i'm honestly not sure the required checks have settled, go look at the PR and tell me where they're at
  - see where 88 stands, and if it merged close the issue
  - whats the ci sayin on that one
  - grab the comments on issue 12, the newest ones especially
  - any of my open PRs approved?
  - did anyone push back on what i proposed in that ticket
  - did ci pass on the pr the agent opened for 214?
  - and the second one, is that one green
  - 412 has been sitting there since tuesday. whats actually blocking it
  - did anyone approve 88 yet or is it still sitting in review
  - check pr 3110 i think? the one for the retry backoff. whats its status
  - status on issue 47
  - did the maintainer ever reply on that issue i filed
  - the fix shipped, comment on 214 with the pr link and close it
  - close 145, its a dupe of 130. leave a note saying so
  - just tell me if the checks are red on 412, dont fix anything yet
  - reviewer left changes requested on 88 — pull what they asked for and send it to the agent thats still on it
  - agent says its done and pushed. what does github actually say about the pr
  - has 412 merged yet
  - so i had two prs up last night, one for the parser and one for the config loader, i cant remember either number. can you work out where each stands, ci and review
  - chekcs on 88?
  - what did the reviewer actually write on 214, not just approved or not
  - 203 and 205 both shipped in that pr. comment on both and close them
  - you said 412 was green ten minutes ago but the merge button is greyed out. re-check
  - which pr belongs to issue 47
  - is ci still running on that branch or did it finish
  - whats the state of 91 right now, still open?
  - tell the claude tab working on 214 what the failing checks are
  - Could you check whether the review on PR 88 came back approved or with changes requested?
  - ci status?
  - anything new on 47 since yesterday? theres like 30 comments on it
  - close 176 as not planned and say why in a comment
  - quick pass over my open prs — which ones are green and which are waiting on a review
