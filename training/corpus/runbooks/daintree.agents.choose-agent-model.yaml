# Training examples whose answer is `daintree.agents.choose-agent-model` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.agents.choose-agent-model
run: runbook-2026-10-19-choose-agent-model
positives:
  - "pick a model for each of these jobs based on how hard they are"
  - "which model should I put on the flaky websocket reconnect bug"
  - "the changelog entry is trivial so give it a small model, the cache invalidation bug gets the big one"
  - "Decide which coding agent and model to launch for a schema migration, given what is installed"
  - "hey, before you start anything, which of my agents is the right fit for rewriting the billing module?"
  - "no need for opus on the docs tweak, pick something lighter"
  - "choose the reasoning effort for each agent based on how risky its change is"
  - "is this a job for codex or claude? you decide"
  - "go easy on the budget: smaller models for the boilerplate, a frontier one only for the tricky concurrency fix"
  - "what's the best model I've got here for a big refactor of the plugin loader"
  - "match agents to tasks: the css cleanup, the payment retry logic, and the readme"
  - "I don't care which agent does it, just pick the one most likely to get the parser rewrite right"
  - "recommend a model and effort for reviewing the auth changes, don't launch anything yet"
  - "Determine the appropriate agent CLI and model tier for each task in this list"
  - "use high reasoning only where it's actually needed"
  - "we've got antigravity, codex and claude installed, which one should take the frontend rebuild"
  - "for the review, pick a model from a different family than the one that wrote the change"
  - "low effort is fine for the rename, but have it think hard on the data migration"
  - "what model would you use for writing the API reference docs"
  - "size up these three tickets and give each the model it deserves"
  - "save the expensive model for the hard stuff"
  - "which agent should handle the terraform changes? you choose"
  - "pick models for the agents so we don't burn through the weekly codex allowance"
  - "scale the thinking level with how hard each task is"
  - "figure out which of the available models suits a long unattended migration"
  - "Choose agent and model per subtask according to complexity and cost before dispatching them"
  - "sol or astra for this kind of thing? just pick one"
  - "use the cheapest model that can still do the version bump properly"
  - "I'd like you to decide the model for this one, it's a nasty memory leak"
boundaries:
  - query: "small model for the renames, strongest model for the state machine rewrite"
    confusable_with: [daintree.orchestration.spike-options]
  - query: "give the easy tickets and the hard ticket different models, your call"
    confusable_with: [daintree.orchestration.spike-options]
  - query: "claude or codex for the importer? choose one, no bake-off"
    confusable_with: [daintree.orchestration.competition]
  - query: "which single agent should own the scheduler rewrite"
    confusable_with: [daintree.orchestration.competition]
  - query: "my claude plan is running low, so put the routine fixes on a cheaper model"
    confusable_with: [daintree.agents.check-usage-limits]
  - query: "pick models that won't eat the codex quota I have left"
    confusable_with: [daintree.agents.check-usage-limits]
  - query: "what model should the agent for the date parsing fix run on? you pick"
    confusable_with: [daintree.edits.spawn-visible-agent]
  - query: "before I start a reviewer agent, which model should it use"
    confusable_with: [daintree.agents.run-agent-command]
  - query: "which model is best placed to review this diff? just tell me, don't review it yet"
    confusable_with: [daintree.review.review-change]
  - query: "turn the effort down for the easy ones and up for the risky ones before you launch"
    confusable_with: [daintree.edits.spawn-visible-agent]
