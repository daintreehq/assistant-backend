# Training examples whose answer is `daintree.git.bisect-regression` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.git.bisect-regression
run: 2026-09-28-catalog-expansion
positives:
  - Find the commit that broke `npm run build` between tag v4.2.0 and main; bisect in a dedicated worktree and fix nothing.
  - Cold start of the Electron app went from 1.2s to 3.8s sometime in the last month. Identify the first commit responsible.
  - test_refresh_token passes on release-2.3 and fails on develop — get codex to git-bisect it and report the culprit and its PR.
  - 'bisect login redirect regression: good=v1.8.0 bad=origin/main, oracle=tests/e2e/login.spec.ts'
  - when did the dark mode toggle stop persisting? it definitely worked in 2.9
  - bisect it pls. good was last friday's main
  - which pr made the api container image double in size?
  - Pin the nested-list flattening regression in the markdown renderer to its first bad commit; tests/test_lists.py::test_nested already reproduces it.
  - Search the history between the March release and HEAD for the change that made the CLI's --json output drop the 'id' field.
  - 'Have claude run a bisect with the existing #412 repro script between v3.1.0 and main, capped at 15 steps.'
  - worked fine on 5.0.2, broken on 5.1.0. what changed? i want the exact commit
  - Which commit introduced the worker's memory growth? Median RSS over five runs above 400MB counts as bad; the last release is known good.
  - first-bad-commit hunt for type errors in packages/core after the tsconfig shuffle; good=a1b2c3d, bad=HEAD
  - The Android build started failing somewhere in the last 200 commits on main. Locate the commit; don't fix it.
  - someone broke the i18n fallback during the last sprint, can an agent work out whose commit it was
  - Go benchmarks show parse throughput halved versus v0.9 — find the commit in between that did it.
  - 'gemini: bisect between tags v6.0.0 and v6.1.0 for the change that stopped webhooks retrying, using scripts/check_retry.sh as the test'
  - Locate the commit on the payments branch that made the refund test start failing; it passed at the branch point.
  - CI on main has been red since sometime this week. Don't fix it yet — I only want the commit that turned it red.
  - 'We already have a failing test from the #640 repro; now find which commit introduced the bug, with v2.0 as the known-good revision.'
  - Main is measurably slower than v3.0 on the import benchmark; no need to re-measure, find the commit in that range that caused it.
  - Which merged PR broke CSV quoting? It worked in the January build; use tests/test_csv.py to decide good versus bad.
  - A regression QA spotted on staging reproduces locally with the checkout test — bisect between the last deployed tag and main to find its source.
  - Walk last week's commits for the one that broke the pagination test, using git bisect with that test as the oracle.
  - Before anyone fixes the broken Docker build, find which commit between the 2.1 tag and HEAD introduced it.
  - The thumbnail test now fails on every run but passed at v1.4 — bisect to the culprit, nothing else.
boundaries:
  - query: Why is the build broken? Not the fix — I need the commit between v4.2 and main that broke it.
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: The failing test_refresh_token passed two releases ago; identify the commit that made it fail, don't repair it.
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: CI is red on main since last Tuesday; tell me which commit did it before anyone touches the code
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: test_cache_ttl passed consistently at v2.0 and fails on every run now; find the commit that broke it.
    confusable_with: [daintree.ci.hunt-flaky-test]
  - query: The login test passes on v2.3 and fails on main locally; find which commit broke it.
    confusable_with: [daintree.debug.investigate-outage]
  - query: '#412 reproduces with test_export_last_row and it passed at v3.1; find which commit broke it.'
    confusable_with: [daintree.debug.reproduce-bug]
  - query: Find the code change that made the CLI stop printing the id field — which commit was it? it worked in March.
    confusable_with: [daintree.explore.repository]
  - query: when did we break the i18n fallback? find the first commit where it stopped working
    confusable_with: [daintree.explore.repository]
  - query: Find which commit on release/2.4 broke the login page.
    confusable_with: [daintree.git.cherry-pick-changes]
  - query: Startup was fast in v3.2 and is slow now. Find which commit made it slow.
    confusable_with: [daintree.orchestration.hypothesis-split]
  - query: The web app's settings page stopped saving the theme sometime after 3.2; find the commit that broke it.
    confusable_with: [daintree.runtime.debug-web-app]
  - query: which PR made the bundle jump by 400KB? bisect it
    confusable_with: [daintree.runtime.measure-performance]
  - query: Which PR broke CSV quoting? It worked in the January build — test commits rather than searching titles.
    confusable_with: [daintree.workflow.find-issue-work]
  - query: find the pr that made startup slow, bisect it between v2.0 and main
    confusable_with: [daintree.workflow.find-issue-work]
  - query: Track down the merged pull request that introduced the webhook retry regression by running the test across history.
    confusable_with: [daintree.workflow.find-issue-work]
