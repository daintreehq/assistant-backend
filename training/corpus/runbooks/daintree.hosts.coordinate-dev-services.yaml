followups:
  - query: now start the frontend against it
    history:
      - "user: start the API on the second host for the dev stack"
      - "assistant: The API is up on host two, listening on loopback port 4000. The frontend on host one is next."
  - query: can the frontend host reach it?
    history:
      - "user: bring up the backend on host two and the web client on host one"
      - "assistant: The backend is ready on host two, bound to loopback. Before starting the client I need an address it can use from host one."
  - query: send one request through the client to prove it
    history:
      - "user: get the web client and the API talking across the two hosts"
      - "assistant: Both services are up and each reported its commit. The address the client uses was reached from its own machine."
  - query: stop the dev stack, client first
    history:
      - "user: the web client and the API are running on their hosts and the request check passed"
      - "assistant: Verified end to end. The client listens on host one, the API on host two."
  - query: the address failed from the client host, what now?
    history:
      - "user: connect the frontend on host one to the API on host two"
      - "assistant: The API is ready, but the request from host one to its address was refused."
  - query: ok use the private address I gave you and retry
    history:
      - "user: wire the two dev servers across the hosts"
      - "assistant: That edge is blocked: the API only listens on loopback on host two. I can co-locate the services or use a private address you name."
  - query: Test the address from the browser that makes the call and match one marked request in the remote API log before declaring the stack connected.
    history:
      - 'user: connect the UI on one remote host to the API on another'
      - 'assistant: Both services report ready. The client-side fetch runs in the browser on this laptop, not in the UI host process.'
    active: [daintree.hosts.coordinate-dev-services, daintree.hosts.prepare-remote-demo]
    confusable_with: [daintree.hosts.prepare-remote-demo]
