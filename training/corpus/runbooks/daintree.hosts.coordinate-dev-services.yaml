  - query: the order service has to be up on one remote machine before the storefront on the other will run; start them in that order and check the storefront can really call it
    confusable_with: [daintree.hosts.execute-distributed-workflow]
  - query: the client and the API are on separate hosts and already agree on the endpoints; I just need both running and the client's base URL pointing at the right machine, with a request to prove it
    confusable_with: [daintree.hosts.coordinate-contract-change]
  - query: bring up the producer and the consumer dev services on their own hosts and show the consumer receiving a message from the producer through an address that works
    confusable_with: [daintree.hosts.coordinate-contract-change]
  - query: have the assistants on both machines start their dev servers and connect them, then tell me whether the client reaches the API
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: get the second host's assistant to run the backend and the first host's to run the frontend against it, and verify the connection yourself
