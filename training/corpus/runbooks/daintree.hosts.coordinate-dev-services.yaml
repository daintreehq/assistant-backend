  - query: the order service on one remote machine calls the stock service on another and needs its address during development, and nothing here is about worktrees on this machine
    confusable_with: [daintree.worktree.provision-local-environment]
  - query: my frontend and my API run on separate remote hosts, not different worktrees on this Mac. Wire them up and check they talk
    confusable_with: [daintree.worktree.provision-local-environment]
  - query: the client on host a calls localhost:3001 but the API runs on host b; which machine's localhost is that and what should the client call instead?
    confusable_with: [daintree.runtime.free-busy-port]
  - query: the frontend host gets connection refused calling the API host's address. is the API listening on a reachable address or only on loopback?
    confusable_with: [daintree.runtime.free-busy-port]
  - query: the web app on host a can't call the API on host b; start both properly and work out the address the app should use
    confusable_with: [daintree.runtime.debug-web-app]
  - query: the page on the first host fails to load data because the API on the second host is down or unreachable; bring the stack up and check the address the page uses
    confusable_with: [daintree.runtime.debug-web-app]
  - query: run the frontend project on one remote host and the backend project on another, not the same task everywhere, and verify they connect
