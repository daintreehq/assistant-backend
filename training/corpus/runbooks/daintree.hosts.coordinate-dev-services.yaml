  - query: bring up the full stack, web client on one remote machine and API on another, each through the assistant that owns that project, and make sure they connect
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: the web client on one of my hosts cannot reach the API dev server on another, find the right address
    confusable_with: [daintree.hosts.copy-portable-settings]
