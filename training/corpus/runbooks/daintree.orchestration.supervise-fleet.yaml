  - just the three review agents, how are they doing
  - some of them are stuck on questions i think — go through the lot, unblock what you can and tell me whats left
  - which of them are actually finished at this point
  - a couple of these are running with nothing watching them, adopt them
  - theres an agent still going from this morning that nobody picked up. its fine, just attach a supervisor and fold it in with the rest
  - arm the two backend tabs, im going to type the same thing into both
  - i have no clue whats armed right now. clear it all and arm just the auth one
  - stop sending what i type to everything
  - show me the next one thats waiting
  - hows evryone doign
  - nobody's said anything in half an hour. go check on them all
  - one of the tabs just went red. run through all of them and tell me what state each is in
  - i fanned out 8 issues an hour ago, do a sweep
  - my inbox has like 9 agent things in it, go through them and clear the ones youve already told me about
