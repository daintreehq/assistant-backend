# Training examples whose answer is `daintree.ci.diagnose-and-fix` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.ci.diagnose-and-fix
run: pre-split
positives:
  - tests are failing
  - why is ci red on this branch
  - the build broke, sort it out
  - pytest is throwing 14 failures under tests/unit and I have no idea when it started — work out what's actually wrong, get an agent on it, and don't tell me it's fixed until something other than that agent has run it
  - fix the failing test
  - is this flaky?
  - the typecheck job keeps failing but every test passes locally, figure out what's different
  - mypy --strict is red on src, get it clean
  - somethign is wrong with the lint step, it wont pass no matter what i do
  - do the same for the other failing check
  - that one's still red, keep going
  - PR 412 has two checks failing, diagnose both and get them green
  - check wont pass
  - suite passes locally but the CI run failed, what's actually different there
  - getting a segfault in the integration tests, dig into it
  - coverage gate is failing, we dropped under the floor somewhere — find what regressed and fix it
  - why did the docker build fail
  - test_selector keeps flapping, passes on rerun. is it genuinely broken or just flaky
  - somethign broke the golden tests after that last commmit, fnd it and fix it
  - get it green
  - the e2e suite is timing out on main and nobody knows why, put an agent on the diagnosis and then actually verify whatever fix comes out of it
  - ruff's complaining, fix
  - same thing on the other branch
  - the deploy build went red, what's the actual error in there
  - one assertion failing in test_state_codec, root cause it
  - ci red on develop
  - make it green
  - teh unit tests are failin after i merged main in, no idea why
  - so i pulled develop this morning and now three tests in the codec suite blow up with some signature mismatch, i havent touched that file in weeks, can you work out whats going on and get it back to green
  - that one's still red, sort it
  - PR 412 has a failing check, get it passing
  - this test passes like half the time whats up with that
  - mypy is screaming about the new provider module, fix it
  - ruff is failing in CI but its clean locally?? make it make sense
  - the coverage gate dropped us under the floor and the build wont pass, deal with it
  - snapshot tests all red after i changed the template. work out if thats expected or an actual break, then get it passing
  - docker build fails at the pip install step, have a look
  - the integration suite just hangs and then times out on the runner, never used to do that
  - before i head out id like the failing e2e spec looked at properly. evidence first please, dont just make the assertion go away
  - agent said its fixed but the suite is still red. take over and actually sort it
  - third time this check has failed. can you actually get to the bottom of it this time
  - the check called lint-and-types or whatever its actually named is red on my branch, fix it
  - renovate bumped pydantic and now half the contract tests explode. figure out whats needed
  - tests pass on my mac and fail on the linux runner. figure out why
  - two checks failing, i reckon its the same root cause. one fix if so, two rounds if not
  - rebased onto main and now the migration test fails. was fine before the rebase
  - before we call that failing test fixed i want it run by someone other than the agent that wrote the patch
  - spawn something to fix the broken auth test
  - review why the parser test broke
  - PR 88s checks are red. dig in and get them green
  - cant open the PR, the pre-push hook keeps dying on the type check
  - the test command errors out straight away with exit 127, nothing even runs
  - is this flaky or actually broken? dont patch anything until we know
  - the failure only shows up in the actions logs which i dont think you can read. work out what you can from here and tell me what youre guessing at
  - whatever it did fixed the one test and broke four others. unwind that and do it properly
