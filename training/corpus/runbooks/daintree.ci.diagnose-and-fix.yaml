followups:
  - query: how's it going?
    history:
      - 'user: the unit tests are failing on this branch, work out why and fix it'
      - 'assistant: Ran the suite in worktree wt-3 — 4 failures in tests/unit/test_selector.py, all from a changed catalog fixture. Explore agent t-14 is confirming the root cause before I put an edit agent on it.'
    active: [daintree.ci.diagnose-and-fix]
  - query: did you tell it to run the whole suite or just that one test?
    history:
      - 'user: ci is red on pr 412, get it green'
      - 'assistant: forge.getChecks reports 2 required checks failing. The exact error is a missing import in src/foo.py. Edit agent t-9 has the diagnosis and the failing command.'
    active: [daintree.ci.diagnose-and-fix]
  - query: ok also the lint one that just went red
    history:
      - 'user: three checks are failing on that PR, fix them'
      - 'assistant: Two share one root cause — a stale lockfile — so one agent covers both. The third is a genuine assertion failure and gets its own round.'
    active: [daintree.ci.diagnose-and-fix]
  - query: yep that's what I figured
    history:
      - 'user: the build broke right after the merge'
      - 'assistant: Confirmed. The docker build fails at the pip install step — requirements.lock disagrees with pyproject. Spawning an edit agent to regenerate it and rerun the build.'
    active: [daintree.ci.diagnose-and-fix]
  - query: which agent did you put on it?
    history:
      - 'user: pytest is failing on 6 tests, diagnose and fix'
      - 'assistant: Explore agent t-21 found it: a fixture path moved. Edit agent t-22 is applying the fix and will run both the narrow command and the full suite.'
      - 'user: how long is that going to take'
      - 'assistant: The full suite is about four minutes, so it''s on an async wait rather than blocking this turn.'
    active: [daintree.ci.diagnose-and-fix]
  - query: quarantine it for now
    history:
      - 'user: test_stream_body fails maybe one run in three, is it flaky?'
      - 'assistant: Ran it five times in the same worktree with no code change: 3 pass, 2 fail. That''s flaky, not a regression — the race is in the deadline timer. Do you want it stabilised or quarantined?'
    active: [daintree.ci.diagnose-and-fix]
  - query: don't just take its word for it
    history:
      - 'user: the golden tests are red, fix them'
      - 'assistant: Agent t-7 says it regenerated the snapshots and everything passes now.'
    active: [daintree.ci.diagnose-and-fix]
  - query: anything else still red while that runs
    history:
      - 'user: coverage gate is failing, find what regressed'
      - 'assistant: The per-module floor for state/codec.py dropped from 96 to 91 — three branches in the expiry path lost their tests in the last commit. Edit agent t-31 is restoring coverage there.'
    active: [daintree.ci.diagnose-and-fix]
