  - relieve the pressure on the overloaded remote host without killing anything
  - the swarm is hitting one machine's limits, rebalance it by measured load and not by guesswork
  - move the queued units off the host that ran out of codex and onto the ones that still have some
  - one machine stopped answering mid run while the others are fine, rebalance whatever it never started
  - the run is too heavy for the mini, dial it back and let the other hosts take up the slack
  - host load is all over the place in this swarm, level it out and tell me what's still throttled afterwards
