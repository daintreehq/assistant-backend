  - why is everything landing on one host? move the backlog around so the busiest machine isn't melting
  - throttle the swarm on the hot machine and redistribute what it hasn't started
  - one host is out of allowance and another is overheating, rebalance the remaining swarm work across the healthy ones
  - I need the swarm balanced again before this afternoon, the studio is way over capacity
  - the cohort on the mini is too big for it, have it run fewer at once and give the extra units to other hosts
