# daintree.hosts.supervise-swarm: the hub follows work already out on the Remote Hosts to the end
# of the run on its delegated exchange update lines: waits quietly, answers a host's question within
# the person's request, brings decisions to the person, verifies each finished unit by artifact, and
# checks once on a host left quiet after its peers are in.
#
# Positives are invented situations in agent and user words, short and long, some with a social
# lead-in or an earlier turn, plus the hub's own update line for work it sent (hex ids invented).
# Boundaries are requests this runbook wins against neighbours whose vocabulary they share: local
# watching and waiting (watch-outcome), the durable-plan owner the update line used to reach,
# answering local agents, a hung local agent, the lane's side of messaging, local fleet triage,
# the sending runbooks, the after-restart account, readiness and one-off questions. Followups and
# topic shifts are supervision asked for right after the work went out. Machine names are generic.
