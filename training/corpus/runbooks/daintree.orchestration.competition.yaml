followups:
  - query: how's it going?
    history:
      - 'user: run a contest — four agents, one interesting fact each, then they vote on the best'
      - 'assistant: Spawned four agents (Alpha, Bravo, Charlie, Delta), each asked for one fact. Waiting on all four now.'
    active: [daintree.orchestration.competition]
  - query: did they vote yet?
    history:
      - 'user: three agents, one design idea each, then blind peer vote'
      - 'assistant: All three entries are in. I''ve stripped the authors, tagged them Entry 1/2/3 with the order rotated per voter, and sent the ballots out.'
    active: [daintree.orchestration.competition]
  - query: charlie's stuck, take it out
    history:
      - 'user: get five agents to each submit a tagline and score each other'
      - 'assistant: Five spawned and submitting. I''ll relay the entries blind once they''re all in.'
    active: [daintree.orchestration.competition]
  - query: make sure nobody gets shown their own entry
    history:
      - 'user: run the fact competition with four agents'
      - 'assistant: Entries collected, ballots out, waiting on votes.'
    active: [daintree.orchestration.competition]
  - query: nice. close everything except the winner
    history:
      - 'user: contest — each agent pitches one refactor, then they peer vote'
      - 'assistant: Tally is in. Bravo wins with 3 votes; Alpha 1, Delta 0. Bravo proposed collapsing the two retry paths.'
    active: [daintree.orchestration.competition]
  - query: make it give a little acceptance speech
    history:
      - 'user: four agents, best one-liner about this repo wins, they vote'
      - 'assistant: Delta took it 2 votes to 1. Full tally and entries below.'
    active: [daintree.orchestration.competition]
  - query: actually add one more to the mix
    history:
      - 'user: spawn three agents, one idea each, peer scored'
      - 'assistant: Three are running now — Alpha, Bravo, Charlie. I''ll wait on all three before compiling the ballot.'
    active: [daintree.orchestration.competition]
  - query: what did entry 3 actually say again?
    history:
      - 'user: run a scored contest, each agent one submission, blind ballot'
      - 'assistant: Votes are read. It''s a 2-2 tie between Entry 1 (Alpha) and Entry 3 (Charlie) — reporting it as a tie rather than picking.'
      - 'user: hm ok'
    active: [daintree.orchestration.competition]
