  - one design idea each, they vote, and if it ends tied just tell me it's tied — don't pick one
  - each writes one test-strategy proposal, then peer review — everyone reads everyone's and picks a winner
  - whole fleet, one haiku each about our build system, then vote on the best
  - tally it up, tell me who won, and close everything except the winner's tab
