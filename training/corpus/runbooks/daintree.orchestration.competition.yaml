# Training examples whose answer is `daintree.orchestration.competition` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.competition
run: pre-split
positives:
  - spin up 4 agents, one fun fact each, then have them pick a winner
  - run a little contest between the agents — each one gives me an interesting fact, then they all read each other's and vote on the best one, and you tally it up at the end
  - can you have the three claudes each propose an approach and then peer-vote on which is best?
  - blind ballot peer scored contest, 3 entrants, tally and declare
  - i want a scored contest btwn the agents, blind ballot, no one shoud know whos entry is whos
  - do the same thing again but this time make them score each other's
  - each agent submits one idea. two points for the top pick, one for the runner up. tally it and tell me who won
  - have them all come up with a name for the project and then pick the best one between themselves
  - set up a bakeoff — 3 agents, each writes their own take on the caching layer, then a neutral judge agent picks the winner
  - ask 5 agents for the weirdest thing they know about this codebase then run a vote on the best one
  - do a peer judged competition with the pinned fleet
  - get each agent to write a one-liner joke and then have them judge each other blind
  - three agents, one design proposal each, blind peer vote, tally, declare a winner or a tie
  - who wins if we let them judge each other's answers?
  - spawn three agents, ask each for one improvement idea, then send everyone else's ideas around and have them rank them
  - lets do a little tournament, everyone submits a tagline and they score eachother
  - run the fact competition again but with six agents this time
  - ask each agent to pitch one refactor, then have a neutral judge agent read all the pitches and declare the winner
  - have the agents compete on who can explain the auth flow best, and let them vote
  - get 4 agents to each name their favourite tool in this repo, then award points from the votes
  - could you run a best-idea shootout across the cohort, peer scored, and tell me the tally?
  - each agent gives one hot take, then everyone picks their favourite that isnt their own, tally it up
  - now do that with those two as well — same submission then vote thing
  - 'i''ve got five agents open and i want something a bit fun: get each of them to write one sentence about what makes this codebase weird, then swap them around anonymously and have them vote for the best sentence, and at the end tell me the scores'
  - three of them are idle — get each one to give me one weird fact about this codebase, then they vote on the best
  - codex, claude, gemini and the local one — one name each for the ingest service, then blind vote, winner takes it
  - run a bake-off between them
  - get the 4 agnets to each wrtie one idea for the onboarding flow then have em pcik the best and tally it
  - each agent submits one perf idea. 2 points for my pick, 1 point per vote it gets from the others. tally and tell me who won
  - ok they've all answered — now send everyone the other three answers with the names stripped and get them to vote
  - spin up a fourth agent as a judge, give it all three proposals with no names on them, whatever it says goes
  - give all four of them the same flaky test and see who gets the cleanest fix, then have them judge each other's diffs
  - have each of the pinned agents pitch one API shape for the webhooks endpoint and then vote on each other's
  - no interviewer, just have them all submit and score each other, best writeup wins
  - same problem, all three, but I don't want them agreeing on one answer — separate submissions then a vote
  - no debate. one submission each, one vote each, highest score wins.
  - agent 2 is off the rails, pull it out of the contest and keep going with the rest
  - do that competition thing with these ones
  - run the fact contest with terminal 4, 7 and 9 — 9 might be dead, if it is just do it with the other two
  - I've got four agents up from earlier. I want each one to give me a single sentence describing what this repo actually does, no talking to each other. Then show them all four anonymised and have them pick the most accurate one, and tell me the score.
  - your tally's wrong, B got two votes not one. recount and give me the winner again
  - winner gets to write its own acceptance speech, send it over
  - two of them voted for their own entry. redo the ballot properly so nobody can see who wrote what
  - 'planning a little contest: 5 agents, one refactor idea each for the payments module, blind peer vote, winner''s idea is what we build'
  - each agent picks the most cursed line in this repo and then they vote on the worst one
  - claude vs codex — better commit message for this diff. they judge each other.
  - get three agents to each write one error message for the rate limit, anonymise them and have the agents pick
  - have each submit a one-paragraph migration plan then score them against each other and rank the lot
  - one design idea each, they vote, and if it ends tied just tell me it's tied — don't pick one
  - each writes one test-strategy proposal, then peer review — everyone reads everyone's and picks a winner
  - whole fleet, one haiku each about our build system, then vote on the best
  - tally it up, tell me who won, and close everything except the winner's tab
