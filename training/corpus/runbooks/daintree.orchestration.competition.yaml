# Training examples whose answer is `daintree.orchestration.competition` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.competition
run: pre-split
positives:
  - spin up 4 agents, one fun fact each, then have them pick a winner
  - run a little contest between the agents — each one gives me an interesting fact, then they all read each other's and vote on the best one, and you tally it up at the end
