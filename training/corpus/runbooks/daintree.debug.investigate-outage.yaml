    history:
      - 'user: split the investigation on the flaky sidebar render'
      - 'assistant: Two probes running: claude-2 on re-render storm, codex-3 on CSS transitions.'
    active: [daintree.orchestration.hypothesis-split]
    run: 2026-09-28-catalog-expansion-stateful
  - query: never mind the preview - production checkout is returning 500s since this morning's deploy
    history:
      - 'user: the dev preview shows a blank page'
      - 'assistant: claude-2 is looking at the preview console error in feat/cart.'
    active: [daintree.runtime.debug-web-app]
    run: 2026-09-28-catalog-expansion-stateful
  - query: since that went out the API error rate in prod has tripled - what changed that broke it?
    history:
      - 'user: merge #960'
      - 'assistant: Merged #960 into main an hour ago; the deploy pipeline picked it up.'
