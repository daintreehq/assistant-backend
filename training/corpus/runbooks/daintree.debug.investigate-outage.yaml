    run: 2026-09-28-catalog-expansion-stateful
  - query: scrap that, the prod deploy just broke login for everyone - help me triage
    history:
      - 'user: write my standup'
      - 'assistant: Launched compiler claude-2 for yesterday; ending the turn until it reports.'
