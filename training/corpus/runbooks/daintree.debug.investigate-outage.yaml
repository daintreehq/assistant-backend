    history:
      - 'user: prod is on fire - what changed that broke checkout?'
      - 'assistant: Suspect window 3d4e5f6..8a9b0c1 is 6 commits. Diff lens flagged #954 (Redis timeout 5s to 500ms). Logs and code-path lenses are still running.'
