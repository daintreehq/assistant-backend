    active: [daintree.debug.investigate-outage]
    run: 2026-09-28-catalog-expansion-stateful
  - query: tell the logs one to check whether it's only us-east1
    history:
      - 'user: errors spiked after the deploy, get some agents on it'
      - 'assistant: Logs lens (codex-2) reports: first error 14:08 UTC, ''pool exhausted'' in coupon-service, about 40/s. Diff and code-path lenses still out.'
    active: [daintree.debug.investigate-outage]
    run: 2026-09-28-catalog-expansion-stateful
