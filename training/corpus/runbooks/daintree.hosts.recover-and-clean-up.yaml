  - ok that cross-host run is done, have every machine clean up after itself
  - the cleanup on one host timed out on a confirmation, can we try that one again while I watch its window
  - just close the usage panes on the hosts, leave their worktrees alone
  - remove the leftover agent panes from the fan-out on each remote host and tell me what's still there
  - sorry to bug you again, but can you see whether the build host ever answered the question it asked before the app restarted
  - query: Before I sign off, make sure nothing I sent to the other machines is silently stuck since this morning's restart
  - query: I left four jobs running on the other Macs before my flight. The hub here was restarted by an update while I was gone, so it has no memory of them. Tell me which finished, which are still going, and which I need to deal with.
  - query: The swarm on the remote hosts is done and merged. Each machine still has two or three agent panes and a worktree for it. Clear those up through each host's assistant; one of them has a commit I never pushed, so check with me before anything with unpushed work goes.
  - query: I'm watching the second host's window now. Last time the worktree removal there timed out because nobody was around to approve it, so try that one again.

