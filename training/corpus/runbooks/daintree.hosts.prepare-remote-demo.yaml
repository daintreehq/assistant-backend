    confusable_with: [daintree.workflow.prepare-feature-demo, daintree.hosts.demo-for-hub]
  - query: I want to see the new reports page, but my laptop can't run it. Have the Linux host start it and tell me how to open it from my window
    confusable_with: [daintree.workflow.prepare-feature-demo]
  - query: demo of the order history screens, running on my remote machine rather than this one, and tell me how to look at it
    confusable_with: [daintree.workflow.prepare-feature-demo]
  - query: The team calendar demo should run on the remote host at the pushed commit; show me the way to it from this side
    confusable_with: [daintree.workflow.prepare-feature-demo]
  - query: the remote host's demo page comes up blank at localhost:3000 on my Mac, so what address does the Shell give me for it
    confusable_with: [daintree.runtime.debug-web-app]
  - query: the preview of the demo on the host isn't what I get here at the host's port, which commit is it and how do I open the right one
    confusable_with: [daintree.runtime.debug-web-app]
  - query: Get the remote host to serve the staff dashboard demo, even though my own machine already has something on port 4200, and tell me how to open it
    confusable_with: [daintree.runtime.free-busy-port]
  - query: A local server holds port 8080 on this Mac. The host's demo uses 8080 too; set the host's demo up and explain how my window gets to it anyway
    confusable_with: [daintree.runtime.free-busy-port]
  - query: Ask the other Mac's assistant to prepare a demo of the wishlist feature on seed data and tell me how to see it from here
    confusable_with: [daintree.hosts.ask-host-assistant]
  - query: Have the assistant on the build host get a demo of the refund flow running at the pushed commit, not just describe it, then tell me how I reach it
    confusable_with: [daintree.hosts.ask-host-assistant]
  - query: tell the remote assistant to leave a demo of the new onboarding up, at the tip of the branch I pushed, then show me how to look at it from this Mac
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: Delegate to the Linux host a running demo of the import wizard, verify the commit it says it serves, and tell me how to open it from here
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: send the studio machine's assistant the feature branch and have it stand the feature up for me to click through, then tell me how my Mac gets to it
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: From the Shell, ask the host's assistant for a demo of the new search at the pushed commit and walk the person through viewing it
    confusable_with: [daintree.hosts.demo-for-hub]
  - query: The person asked me, the hub, for a demo of the settings rewrite on the build machine; brief that host and then explain how the Shell reaches it
    confusable_with: [daintree.hosts.demo-for-hub]
  - query: I'm on the Shell and the person wants a demo hosted on a remote machine. Message the assistant there, check what it reports and tell the person the route in
    confusable_with: [daintree.hosts.demo-for-hub]

  # Moved from the delegate-to-host file, where they were labelled for the hub's side of handing work.
