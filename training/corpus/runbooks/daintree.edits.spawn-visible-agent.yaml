  - codex, in the api worktree, add validation to the upload endpoint
  - spawn one
  - kick off an agent to implement pagination on the search results, background it and ping me when it lands
  - get an agent to write the migration for the new users table
  - add rate limiting to the api. delegate it, don't do it yourself
  - there's a TODO in scheduler.go about the leaked ticker, put an agent on it
  - one agent, edit mode, auth worktree — task is delete the legacy session code and update whatever calls it
  - can u get an agent to bump the deps and fix whatever breaks
  - have an agent go clean up the type errors in the reporting module
  - i need the docs regenerated for the new endpoints, put someone on it
  - do that for the third one as well
  - shoud i just spawn an agnet for the logging cleanup or is that overkill
  - put claude on the rate limiter, it needs retry with backoff
  - webhook handler is eating events in staging and i need someone on it RIGHT NOW - spin an agent up in the api worktree
  - spwan an agnet to fix the null deref in payemnts/refund.go, its blowing up on partial refunds
  - yeah that one. get an agent on it in the checkout tree
  - have an agent bump the fetch timeout to 30s in http/client.ts. ONLY that. last time it reformatted half the file and i binned the diff
  - in wt-2, have codex add table tests for the date parser, the DST edge cases mainly
  - start an agent on the migration script
  - use claude-cod, or whatever the anthropic one is actually called - have it rewrite the csv importer to stream instead of loading the whole file
  - install steps in the README are wrong since we moved to uv. someone needs to fix that, put an agent on it
  - open a terminal with an agent digging through the events pipeline, i want to watch what it turns up and redirect it if it goes down a rabbit hole
  - kick off an agent to convert the remaining class components to hooks, im going to lunch, dont make me sit here watching it
  - so the config loader reads the env twice and im fairly sure thats why staging picks up the wrong bucket. i dont want to touch it myself today. can you get something onto it
  - agent. tests for the token refresh path. we have none
  - the same validation block is copy pasted in three handlers, have an agent pull it into one helper and update the callers
  - the last one gave up halfway through the parser work. dont bother resurrecting it, start a clean agent on the same job
  - Could you have an agent implement cursor-based pagination on /users? It should match how /orders already does it.
  - get an agent to make DELETE /sessions/:id idempotent, second call should come back 404 not a 500
  - the search-rewrite worktree already exists, just drop an agent into it and have it start on the tokenizer
  - put clod code on the settings panel, the toggle doesnt persist after reload
  - src/auth/session.ts - agent, kill all the `any` types in there and make sure it still typechecks
  - three TODOs in the uploader. one agent, all three, dont split it across terminals
  - theres no ticket for this, i just want the --dry-run flag added to the sync command. agent please
  - nobodys working that branch any more. spawn a fresh agent and have it fix the naming inconsistencies i listed above
  - have an agent work out where the retry logic actually lives and then make it exponential while its in there
  - no recipe, nothing fancy, launch one agent in the api worktree and have it wire up the /healthz endpoint
  - spawn an agent for the sqlite migration and background it with a watcher, im not sitting here for 40 minutes
  - dont write it yourself, delegate it. the throttle helper needs a max-attempts arg
  - spin up a read only agent in a tab and have it trace how a request gets from the router down to the db. leave it open, i'll follow along
