# Training examples whose answer is `daintree.orchestration.contract-first-split` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.contract-first-split
run: 2026-09-28-catalog-expansion
positives:
  - Build the new invoices endpoint and the React table that consumes it with two agents at once; pin down the JSON response shape first so they can't drift.
  - Agree the OpenAPI spec for /v2/orders, commit it, then have codex implement the Go handler while claude builds the Swift client against it concurrently.
  - one agent on the fastapi side one on the vue side for the export feature, same time, lock the pydantic schema first
  - Define the protobuf for the telemetry ingest service first, then run the Rust producer and the Python consumer as two simultaneous agents in separate worktrees.
  - Split the notifications feature across a backend agent and a frontend agent working simultaneously, with a shared TypeScript types file frozen up front.
  - Freeze the GraphQL schema for team invites, then codex on the resolvers and gemini on the Apollo client, in parallel, each in its own worktree.
  - 'Contract-first: commit the Kafka message schema for order.shipped, then a producer agent and a consumer agent build their halves at the same time.'
  - the sdk and the api both need the new pagination cursor. can you get two agents doing both halves together without them inventing different field names
  - Have claude-2 draft the plugin host interface (types, example payloads, error codes), get my sign-off, then put the host and the sample plugin on two agents in parallel.
  - 'Parallelise the billing webhook work: one agent on the Stripe webhook receiver, one on the dashboard that shows its events, both coding against a JSON schema committed first.'
  - Launch two agents concurrently for file uploads, the Express route and the Next.js uploader, after committing the request/response types and error cases on a contract branch.
  - i want api and ui built in parallel for the search filters. schema first pls, then both agents go
  - 'Library and consumer at once: design the public interface of the new rate-limiter crate, commit it, then one agent implements the crate while another wires the gateway to it.'
  - 'These aren''t independent tasks: the mobile app and the auth API both change for passkey login. Agree the endpoints first, then run an agent on each side at the same time.'
  - Get the backend and frontend of saved views built by separate agents against an agreed schema, then merge both halves and run a test across the boundary.
  - I don't want one implementer following a plan; I want the interface for audit exports approved by me, then codex on the server and claude on the client building simultaneously.
  - 'Not a phased rollout: the gRPC service and its CLI client can be built concurrently once the .proto is committed. Set that up with two agents.'
  - Add a comments feature, Django REST endpoint plus the Svelte component, two agents in parallel, contract committed first so their fixtures come from its example payloads.
  - contract/audit-log branch with shared types, then parallel api + web agents off it, integrate/audit-log to check both together
  - 'Thumbnail job: lock the queue message payload in a commit, then run an agent on the producer and one on the worker simultaneously.'
  - frontend and backend agents on the theme preference sync at the same time, dont let them drift on the payload
  - Put the export feature on two agents, server endpoint and client download button, but they share a response format, so commit that interface before either starts.
  - Design the event schema between the ingestion lambda and the analytics consumer, get it committed, and have two agents build the two sides in parallel worktrees.
  - Before anything gets merged, I want the API and web halves of refunds built simultaneously against one frozen types file, then combined and tested together.
  - 'Not TDD across agents: agree the interface between the payments service and the checkout page first, then have separate agents code both sides at once.'
  - Two worktrees branched from a commit holding only the CSV import endpoint types; claude builds the endpoint, codex builds the import wizard, same time.
