boundaries:
  - query: an urgent bug came in while my remote hosts are busy with the migration run, the local agents on this laptop are fine, make room on the other machines
    confusable_with: [daintree.orchestration.reprioritize-work]
  - query: this release blocker takes priority over the run I sent to the remote hosts, pause what gives way on those machines and put agents on the blocker
    confusable_with: [daintree.orchestration.reprioritize-work]
  - query: reshuffle the remote machines' agents for the urgent fix, the same way you would for my own panes, and keep track of what each host paused
    confusable_with: [daintree.orchestration.reprioritize-work]
  - query: take the nice-to-have tasks of the remote run down so the urgent patch has agents to use, leave the important ones alone
    confusable_with: [daintree.hosts.steer-swarm]
  - query: the blocker is more important than the docs and refactor work running on the hosts, so have those hosts give up their agents to it, and I will tell you which ones to restart afterwards
    confusable_with: [daintree.hosts.park-swarm]
  - query: pause part of the remote run with notes on where each task stopped so the urgent fix can have those agents, I will say when to resume
    confusable_with: [daintree.hosts.park-swarm]
  - query: the new task is urgent and every remote host is already busy, so pause whatever has to give way and then send the new task to a host that has the repo
    confusable_with: [daintree.hosts.place-work]
  - query: all hosts are loaded, the urgent task goes first, decide who gives up their slot and put it on the right machine
    confusable_with: [daintree.hosts.place-work]
  - query: I was following the remote run when an urgent bug landed. Change what the hosts are doing so the bug is first
    confusable_with: [daintree.hosts.supervise-swarm]
  - query: nothing is broken on the hosts, they are just busy, but the new blocker needs workers there before anything else
    confusable_with: [daintree.hosts.reassign-host-work]
  - query: an urgent production bug arrived and my remote hosts are running long tasks, free capacity there before anything else
    confusable_with: [daintree.debug.investigate-outage]
