# daintree.hosts.diagnose-host-differences: from this Shell's hub, why one commit passes on one
# Remote Host and fails on another. Each host's assistant checks its checkout against the pinned
# commit, reproduces without changes and reports a non-secret fingerprint; the hub compares and
# ranks the differences by evidence, fixing nothing.
#
# Positives are invented situations in agent and user words, short and long, some with a social
# lead-in or an earlier turn. Boundaries are requests this runbook wins against a neighbour whose
# vocabulary they share: a matrix of results (run-validation-matrix), a fix here
# (ci.diagnose-and-fix), one question to one host (ask-host-assistant), a lane testing a commit
# (verify-for-hub), messaging gates (diagnose-messaging), machine load
# (relieve-resource-contention), and the runbooks the starting sweep picked (swarm-fan-out,
# delegate-to-host, provision-local-environment). Followups are the diagnosis as a second turn.
# Machine names are generic.
runbook: daintree.hosts.diagnose-host-differences
run: runbook-2026-10-issue-119

positives:
  - compare the two remote hosts' environments to explain why the webhook tests fail on only one of them
  - 'cross-host discrepancy in the billing service: 12 tests fail on one host and none on the other at the same SHA; find the environmental cause'
  - investigate why the checkout service's tests fail on the arm remote host only, without modifying either machine
  - the laptop host fails the auth tests the desktop host passes, and nobody remembers pulling on the laptop this week; figure out which it is
  - the payments service passes its suite on one remote host and fails on another; gather what each host can tell us and pin down which difference matters
  - the docs site builds on the mini host and errors out on the linux host with a sass complaint, same commit; root-cause it read-only
  - explain why rev 4c1d0e7 passes lint on the studio host and fails it on the build host
  - triage a failure that only shows up on the second build machine, evidence from both, no fixes
  - my snapshot tests keep coming out different on the linux host than anywhere else, same branch. what's going on?
  - why does cargo test blow up on the arm box but not the intel box? same commit
  - works on the studio machine, broken on the laptop host. figure out why, don't change anything
  - the date tests only fail on the server host, everything else is the same. is it the timezone or something else?
  - same code, two machines, two results. find the difference
  - the build is green on one of my hosts and red on the other and I've been staring at it for an hour
  - pytest segfaults on one host only. both are on main. what differs between them?
  - before I start fixing anything, tell me why the linux host fails the e2e run when the mac host passes it
  - I think the ubuntu host has an older node and that's why its tests fail. can you confirm what's actually different?
  - could the build box just be behind on its checkout? it fails the tests the other host passes
  - the go tests deadlock on the arm host every time and never on the x64 one, same sha. what's different about the arm box?
  - find out why npm run build fails on the mini but works on the other host. no reinstalling anything
  - one host says 3 failures, the other says all green, same commit. which is right and why do they disagree?
  - lint passes on my laptop host but fails on the build host with the same config, why
  - the image tests produce slightly different output on the linux host than on the mac host at the same revision. what's causing it?
  - the migration test fails on just one of my machines, maybe a database version thing? check what differs before touching it
  - look at why my two hosts disagree about the test results for this commit
  - is it the OS or the checkout? the tests fail on the linux host and pass on the mac host, same branch
  - compare the toolchains on my two hosts, the rust crate builds on one and not the other
  - the python tests import fine on one host and throw ImportError on the other at the same sha, what differs
  - the ruby specs pass on the intel host and fail on the arm host. work out what's different without reinstalling gems
  - locale problem? a sorting test fails on the server host only. compare the two hosts' setups
  - why does the same commit produce a different bundle on each of my two hosts
  - only one host fails the checks for this PR's head commit; the other passes. what's the reason?
  - the java tests take twice as long on one host and hit the timeout, same commit as the fast host. why?
  - same lockfile, same commit, different results on two hosts. what's different?
  - the arm host and the x86 host give different results for the hashing tests, explain it
  - the release build only fails on one remote host; identify the environmental cause
  - 'morning! weird one: the arm server keeps failing the parser tests while the x64 one is fine on identical code. any idea why?'
  - ok this is driving me nuts. same sha, green on host one, red on host two. can you dig into what's different?
  - hey, quick favour, find out why the build only breaks on the older host
  - >-
    We pushed 3e9f0c1 last night. The nightly on the linux host went red with two failing tests in
    the currency formatter, but the same run on the mac host this morning was green. Nobody fixes
    anything yet; I want to know what's different between the two machines, starting with whether
    they really ran the same code.
  - >-
    The checkout service's integration suite times out after 120 seconds on the arm host but
    passes in about 40 seconds on the x64 host. Both claim to be on main. Get what you need from
    each host's assistant, versions, checkout state, whatever, and tell me which difference is
    most likely, with the evidence.
  - >-
    A project's end-to-end tests pass on one remote host and fail on another at the same SHA, and
    the person already ran both three times to rule out flakiness. Work out which difference
    between the two machines is responsible, without changing either of them.
  - >-
    Same branch on both hosts, but the linux one fails four snapshot tests the mac one passes. I
    suspect a font or locale difference but I don't actually know. Find out what really differs
    and don't reinstall or reconfigure anything while you look.

