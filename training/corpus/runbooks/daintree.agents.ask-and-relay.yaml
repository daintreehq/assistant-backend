# Training examples whose answer is `daintree.agents.ask-and-relay` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.agents.ask-and-relay
run: pre-split
positives:
  - ask claude what it makes of the retry logic in the provider adapter
  - get an agent to look at the auth middleware and tell me what it finds
  - can you spin up codex read-only and ask it whether our token bucket is actually thread safe? i just want to hear what it says, nothing changed on disk
  - spawn something to check whether the state token codec handles clock skew and report back
  - 'one agent, one question: is fail-open on the selector the right call? bring me the answer'
  - ask gemini somehting about the caching layer and tell me what it comes back with
  - could you get an agent to read services/chat_orchestrator.py and give me its honest take on how big _prepare_inner has gotten?
  - ask an agent a question — you pick it, something small and safe, i just want to see the round trip work
  - do the same thing but ask it about the selector prompt instead
  - have claude code take a look at the docs mcp client and tell me if it spots anything off. read only, dont let it touch files
  - ask codex about it
  - i want a second opinion from an agent on whether three active runbooks is the right cap — spawn one, ask, relay whatever it says
  - get claude's take on the provider routing policy please
  - spawn a read only explore agent in the backend worktree and ask it how the cache affinity session id is threaded through, then summarise its reply
  - quick one — pop open an agent and ask what python version we're pinned to
  - need an agent's read on the prompt assembly order. spawn, ask, relay.
  - ask one of the configured agents what it would name this module and just give me the answer
  - is there a way to get an agent to check if there's a race in the speculation handshake and just report back? i dont want it fixing anything
  - ask claude whether the awaitAll retry loop is correct. i want its verdict not a patch
  - 'put a question to one of the agents for me: does the golden snapshot flow make sense as written? want its answer this turn, not later'
  - ask an agent whats it think of our naming in the runbooks dir
  - spawn an agent, ask it to explain what this repo does in one paragraph, relay it verbatim
  - can you ask something read-only to confirm the coverage floors actually ratchet and tell me what it found?
  - get one of them to look at that file and tell me what it reckons
  - ask codex if the backoff in providers/openrouter.py is actually exponential
  - spin up gpt-whatsit, the fast one, and ask it why we have two config loaders. dont let it touch anything, just tell me what it says
  - Could you get a single agent to read through the migration scripts and tell me whether any of them are non-idempotent? Read-only, I just want its answer.
  - ask claude about that one
  - ask claude code where the rate limiting lives and paste me what it says
  - spwan an agnet and ask it wat the deal is wiht the sesion token expiry
  - spawn something read-only and ask it whatever you think is worth asking about this codebase, curious what it comes back with
  - in the auth-refactor worktree, ask an agent whether the new middleware is actually wired into the router. just the answer please
  - the flaky test thing again. dont fix anything — get one agent to look and just tell me what it reckons is going on
  - prod is behaving weird — quick, spawn an agent and ask it if the pool size changed in the last few commits. need the answer now
  - so ive been staring at this scheduler for an hour and i dont trust my own reading of it any more. can you fire up one of the agents, read only, and just ask it whether the tick loop can double fire if the timer resets mid flight? i literally only want its answer, nothing touched
  - get an agent's take on the error mapping and give me its exact wording, not a summary
  - ask claude what it'd pick between SSE and websockets for our streaming and relay the answer
  - i think the cache key includes the catalog revision. spawn an agent, ask it to confirm, one line back
  - ask claude what it thinks of my diff and just tell me what it said
  - just ask one agent, dont set a watcher or anything, ill sit here
  - 'codex: does turn_accounting double count usage on a retry? spawn it and report back'
  - spawn something and ask which package is pulling in lodash
  - ask one of the agents, doesnt matter which, whether pnpm or bun makes more sense here
  - ok now ask a fresh agent the same thing and see if it agrees with you
  - open a claude terminal on the websocket client, ask it if the reconnect has backoff, then close it out — nothing gets changed
  - ask an agent about the queue.resolve path
  - get an agent to skim the docs mcp module and give me the gist of how the timeout works
  - 'ask an agent to read the code behind #412 and tell me whether the fix is really in there'
  - 'One agent, read-only, single question: is the selector call cached per catalog revision or per session? Report back with whatever it says.'
  - get sonnet-mini to look at the state codec and tell me if the token is signed or just encoded
  - theres no agent up yet is there? spawn one and ask it whether we still need the legacy adapter
  - cba to read this whole file. get an agent to read it and report back what it does
