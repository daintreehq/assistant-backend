  - Walk the user through checking which setting categories on the Mac host differ from this laptop, then stop and ask before copying any of them
  - The person wants the same worktree path pattern and hibernation timing on the host as on this machine; preview that copy and apply it once they say so
  - The connection dropped while the person was copying settings to the host; work out where it stands and avoid a blind second copy
