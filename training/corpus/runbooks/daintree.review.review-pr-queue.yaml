  - 'Assess PRs #88, #90 and #93 independently - a separate reviewer on each - and flag any that break the public API.'
  - go through all the open prs and tell me what's mergeable
  - can you get a reviewer on each pr in the queue? there's like 7 of them, just want verdicts
  - review everything that came in against release/2.4 this week, one agent per pr please
  - we have 15 open prs and i have no time. which are good and which need work?
  - Go through the open pull requests from external contributors (leave the dependabot ones out) and give a per-PR verdict with the top findings; don't comment on any of them.
