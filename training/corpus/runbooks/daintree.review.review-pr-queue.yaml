  - 'Security-focused pass over every open PR touching the auth service: one read-only reviewer per PR, a verdict for each with evidence.'
  - 'Rather than just listing the open PRs, actually review them: each one gets its own reviewer and its own verdict.'
  - not asking you to merge anything yet - just review the 8 open prs one by one and tell me which are ready
  - Per-PR review verdicts for all open PRs on org/infra-terraform, with each PR's CI status reported alongside; read-only.
  - Assign one reviewer agent to each of the PRs waiting on my review and report findings per PR, most severe first.
  - i've got a pile of prs waiting for my review, can agents take a first look at each one
  - review queue pls - all open non-draft prs on develop
  - Work through the open pull requests with reviewers, at most 4 at a time, starting the next PR as each finishes; one verdict per PR.
  - 'PRs #55, #61 and #64 come from outside contributors - review each one diff-only, no installs, and return a verdict per PR.'
  - morning! 5 prs came in over the weekend, can you have each one reviewed and tell me which to merge
  - 'Give every PR in the review queue on the payments repo its own assessment: ready, needs changes, or couldn''t assess, with the head SHA reviewed.'
boundaries:
  - query: Review every open PR contributors opened this week and give me a verdict per PR.
    confusable_with: [daintree.forge.batch-dependency-updates]
  - query: which of the open PRs are ready to merge? review each one, but don't merge anything yet
    confusable_with: [daintree.forge.land-pull-request]
  - query: Before merging anything this sprint, get a verdict on each of the 5 open PRs.
    confusable_with: [daintree.forge.land-pull-request]
  - query: Review all the open PRs and give me a ready or needs-changes verdict for each.
    confusable_with: [daintree.git.prune-stale-branches]
  - query: review all 6 open PRs and tell me which are ready to merge
    confusable_with: [daintree.git.test-pull-request-locally]
  - query: One agent per open PR - reviewing, not implementing - and a verdict from each.
    confusable_with: [daintree.orchestration.fan-out-work]
  - query: Spread the 9 open PRs across review agents, 3 at a time, and report which are mergeable.
    confusable_with: [daintree.orchestration.fan-out-work]
  - query: give every PR in the review queue its own agent to assess it
    confusable_with: [daintree.orchestration.fan-out-work]
  - query: Put a reviewer agent on each of the 7 open PRs against develop and give me a verdict for each.
    confusable_with: [daintree.review.cross-review-cohort]
  - query: go through the review queue, which prs are ready to merge
    confusable_with: [daintree.review.cross-review-cohort]
  - query: review the open PRs - all seven of them - each on its own, and tell me which are good
    confusable_with: [daintree.review.review-change]
  - query: Code review every PR opened against develop this week, with a separate verdict per PR.
    confusable_with: [daintree.review.review-change]
  - query: Is any of the open PRs on the api repo any good? Review each one separately.
    confusable_with: [daintree.review.review-change]
  - query: Find the open PRs against develop and review each one - verdict per PR.
    confusable_with: [daintree.workflow.find-issue-work]
  - query: which open prs are actually good to merge? go through them
    confusable_with: [daintree.workflow.find-issue-work]
  - query: Search the PRs labelled needs-review and get each one reviewed.
    confusable_with: [daintree.workflow.find-issue-work]
