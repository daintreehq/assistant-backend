# Training examples whose answer is `daintree.orchestration.verify-agent-work` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.verify-agent-work
run: pre-split
positives:
  - did it actually do it?
  - check that the agent really made those changes, dont just read what it wrote
  - claude says it's done — verify before i merge
  - it claims the whole suite is green. confirm that.
  - i don't trust that result. prove it.
  - prove it landed
  - before we commit any of this i want you to actually check the agent did what the issue asked instead of taking its word for it — it has burned me twice today and i'm not doing that again
  - the agent's last message says all tests pass but the tail above it looks like it blew up. which is it?
  - confirm it hit the acceptance criteria we set at spawn
  - is that actually done or just claiming done
  - do the same check for the other two
  - that one too
  - verrify the seond agent's work before i close the issue
  - agent finished. evidence please, i'm about to push.
  - spot check the work in that worktree before i hand it off to the reviewer agent
  - can you validate what it produced against what i actually asked for, before i sign off on it?
  - run a real check yourself rather than trusting the agent's summary
  - gnna push this in a sec, sanity check the agent's work first
  - did the agent in the auth worktree actually add the tests it says it added, or did it just tell me it did
  - it says it implemented the retry backoff — does the tree actually show that?
  - confirm the migration really ran before we call this finished
  - when it wraps up i want it checked against a proper definition of done, not just a clean tree
  - tab 4 reports success. i want that independently confirmed before anything irreversible happens.
  - check its claim, then tell me verified or not
  - how do i know it didnt just stub the thing and declare victory
  - hang on before i push — did it actually add the middleware or just describe adding it
  - the overnight one says it finished the migration. i want that checked before i touch anything today
  - it claims all green. i dont beleive it. go check propelry
  - terminal 7f2a-claude says the refactor is complete, confirm that against the actual tree
  - i gave it three things to do. check it did all three and not just the easy one
  - its summary says tests pass but the last line i can see says 2 failed. which is it
  - verify before merge
  - 'im about to close #412 — is the work on it actually done or is it lying to me'
  - i want to hand this worktree to the review agent next but only if the first one really finished. check first
  - verify that
  - so it says its done and the tab went quiet but ive been burned by this before, last time it said done and the file was half written, can you actually establish whether the work is there
  - the one i called auth-fix, or auth-agent, whatever its actually named — did it finish what it said it finished
  - it swears it didnt touch anything outside src/payments. true?
  - check there are actually new tests in there and not just a claim that there are
  - everything reported done overnight. spot check the one on the billing branch before i trust the whole batch
  - watcher says its finished. is that real or did it just exit
  - its offering to open the pr. id rather confirm the work is genuinely done first
  - the agent told me ci went green. i want that confirmed independently, not its word for it
  - second agent says it fixed everything the reviewer flagged. did it?
  - this goes straight to prod once i say go. establish first that the agent did what the ticket asked
  - when you get a chance, could you confirm the work claimed by the agent in tab 2 actually landed? no rush at all
  - that finished way too fast. 40 seconds for a whole refactor. check what it actually did
  - did anything actually change on disk or did it just narrate at me for ten minutes
  - it says the readme and the changelog are both updated. confirm both
  - ok and that one — same thing, is it telling the truth
  - check this one properly, and from now on set a definition of done when you spawn them so we dont have to do this every time
  - it says there are zero references to LEGACY_CHECKOUT left anywhere. verify that
  - run whatever check this repo has instead of taking its word that lint is clean
