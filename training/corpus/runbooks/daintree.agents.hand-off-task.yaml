# Training examples whose answer is `daintree.agents.hand-off-task` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.agents.hand-off-task
run: 2026-09-28-catalog-expansion
positives:
  - Claude in wt-webhooks hit its usage limit mid-task; have Codex finish the webhook retry work in that same worktree.
  - The codex agent's context window is exhausted on the GraphQL migration. Start a fresh Codex session in the same checkout that picks up where it stopped.
  - claude-2 has looped on the same failing snapshot fix for an hour; give the task to Codex along with what it already tried.
  - 'Swap the Gemini agent on #611 for Claude and continue from its current uncommitted state.'
  - Transfer the half-done CSV export feature from codex-3 to a new Claude agent in the same worktree; it must not start over.
  - Stop the Claude agent on feat/i18n; the user wants you to finish its remaining work yourself in that worktree.
  - Codex hit its five-hour cap halfway through the rate-limiter refactor. Continue with Claude on the same branch, keeping its uncommitted edits.
  - Replace the agent on the payments worktree with a fresh Claude session; the current one's context is too muddled to be useful.
  - Hand the unfinished Postgres 16 upgrade from gemini to codex in the same worktree; gemini keeps retrying the same pg_dump flags.
  - Move the auth-middleware task off claude-1 onto Codex, with a handoff built from git status and its last messages so Codex skips the dead ends.
  - 'Switch the implementer on #1290 from Codex to Claude; Codex''s approach is fine but it keeps stalling on the TypeScript errors.'
  - Kimi ran out of credits halfway through the settings page. Continue with whichever agent is ready, same worktree.
  - Get a fresh session to continue the Rust parser rewrite where the current Claude left off; it's at 98% context.
  - Pass the partially implemented search filters from the Codex terminal to Claude, including which approaches failed and why.
  - Have a different agent finish the upload-service refactor Gemini started; leave Gemini's pane open for when its quota resets.
  - Relieve codex of the docs-site migration and let claude complete it in wt-docs, building on the files it already changed.
  - Claude's weekly usage is gone. I don't need the numbers, just get Codex to pick up its refactor in the same worktree.
  - Don't correct Claude again, it's had three corrections already; hand the pagination task to Codex instead.
  - The Claude agent isn't stuck, it has just used up its context. Start a new session that continues the export job.
  - 'Same worktree, different agent: Codex should take over Claude''s feature/billing work.'
  - Rather than compacting Claude, start a clean session and hand it the task with a proper brief of what's done.
  - Don't start dark mode from scratch; Claude already got halfway, have Gemini continue it.
  - claude's out of usage again. can codex finish it off
  - codex keeps flailing on the cron fix. let claude take it from here, same wt
  - context is full on the claude one, spin up a fresh session to carry on
  - you finish what claude started on the settings form, it's out of tokens
  - query: Claude hit its usage limit, have Codex finish the refactor
    run: 2026-09-28-catalog-expansion-refine
  - query: its context window is full, start a fresh session that carries on where it left off
    run: 2026-09-28-catalog-expansion-refine
