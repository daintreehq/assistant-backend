  - 'Create a worktree for PR #88 and run its smoke script in a visible terminal so I can watch it.'
  - 'Get PR #340''s head running on this machine so the designer''s layout changes can be poked at in the browser.'
  - 'External PR #58 touches package.json scripts; tell me what installing it would execute, then run the tests once I say go.'
  - 'does the fix in #612 actually work for me? i still see the bug on main'
  - 'pull #940 locally and make sure storybook still builds'
  - 'Test-drive PR #1310 (the new onboarding flow) on this machine: bring it up with the dev recipe and report whether the app starts cleanly.'
  - 'Validate PR #221 locally at its head commit - tests plus a manual run of bin/import --dry-run; nothing gets pushed or commented.'
  - 'hey can you get #88 running? want to try it before i approve'
  - 'Reproduce the bug described in #377''s PR body on the base branch, then confirm the PR head makes it go away.'
  - 'try out #640 from that fork for me - but check nothing sketchy runs on install first'
  - 'The code looks fine to me on GitHub, but I want #88 actually run: fresh worktree, full test suite, results bound to its head.'
  - 'Put the head of PR #1502 in a Daintree worktree and run pnpm test --filter web there; keep the worktree afterwards.'
