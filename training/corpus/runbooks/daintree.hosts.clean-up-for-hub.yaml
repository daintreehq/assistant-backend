# removing what it made for a run the hub names, safely and with nobody at the machine.
#
# Boundaries are the same cleanup words on the hub (recover-and-clean-up), at the
# person's own request on their machine (workspace-cleanup), a read-only verdict on
# worktrees (audit-worktrees), and the hub-message envelope (handle-hub-message). Reverse
# rows live in those runbooks' files.
