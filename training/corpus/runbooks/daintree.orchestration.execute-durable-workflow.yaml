# Training examples whose answer is `daintree.orchestration.execute-durable-workflow` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.execute-durable-workflow
run: pre-split
positives:
  - we're finally moving off the old auth service. it's roughly five phases and every one of them depends on the last — backfill the users table, turn on dual writes, flip reads, verify, then rip the old path out. i need that held somewhere real, not just in your head for one turn
  - migrate us from mongo to postgres. schema first, then the data copy, then reads, then writes, then we drop the old cluster.
  - build me a workflow graph for this
  - plan it out as a dependency graph — i want to see what can actually start now versus what's sat waiting on something
  - i'm going to have to stop halfway through this today. set it up so we pick back up at exactly the right spot tomorrow instead of me re-explaining the whole thing
  - reconcile it, three of those steps finished while i was out
  - what's runnable right now on wfg_8812
  - 'ordering matters on this one: bump the shared lib, wait for it to publish, then update the three consumers, then delete the vendored copy. do it in that order and don''t get ahead of yourself'
  - delegate each of these then check it actually landed before moving on. six changes and the last three won't build until the first ones are in
  - i want proper progress tracking on this. x of y done, what's blocked, not you just telling me it went fine at the end
  - set the plan up first before you touch a single file
  - can you actually do dependency tracking on something this size or is that not a thing here
  - the schema step failed. put it back to ready and try it again, don't tear the whole plan down and start over
  - scope just changed, we're doing both regions not only us-east. redo the plan on top of the one that's already there
  - attach that PR to whichever node it came from, i've lost track of which phase the agent was on
  - wfg_31a0, give me the full one — i want the actual edges not the summary
  - cancel the plan. leave the terminals alone though, i'm still using two of them.
  - big one this. we need billing pulled out of the monolith into its own package, every import updated, CI green, then a release cut. each bit gates the next and i'll be in and out all day so it has to survive me closing this thing.
  - give me completed versus total on the graph and which nodes are blocked
  - note down that i confirmed the backup finished by hand — there's no tool output for that anywhere
  - the async wait just came back. reconcile and tell me what's next.
  - ok so this is staged. feature flag goes in, that deploys, then 5%, watch it, then 50, then 100. i want the gates tracked properly not just remembered
  - is workflow intelligence even switched on in this build? if it is, plan this properly.
  - i'm fairly sure there's already an open plan for this. don't go creating a second one.
  - before anything else, write down what has to happen in what order so we don't do these out of sequence and wreck the branch
  - checkpoint this, i'm closing the laptop
  - i want the evidence trail kept on this one. when we come back i want to be able to see why each step got marked done rather than trusting it.
  - node 22 upgrade across all four services. can't be simultaneous, the shared client has to go first and the rest pick it up after.
  - make the plan, run whatever's runnable, and come back to me at the first thing that needs a decision from me
  - add a blocker — the data copy can't start until legal sign off comes through
  - deprecating the v1 API. announcement, then the deprecation headers ship, then 30 days, then we actually delete the handlers. track the whole thing.
  - link that worktree to the node it belongs to
  - three ordered changes, each one needs the previous merged before it makes sense. sequence them and keep it somewhere i can come back to.
  - we're rotating the signing keys. new key generated, both accepted for a week, clients migrated, old key revoked. i really don't want to lose track of where we are in that.
  - i keep losing the thread on this thing. can we track it properly with the dependencies written down instead of me re-deriving the order every morning
  - there's five chunks of work here but they aren't independent — the schema one has to land before the other four can even compile. sequence it, don't just throw five agents at the wall
  - i know you'd normally give each of these its own agent. these can't work like that. the API change blocks the client change blocks the docs.
  - six services need the same change but three of them import the one i'm touching first. work out the order then delegate.
  - don't parallelise this one, the steps stack
  - use agents if you like but step 3 doesn't start until step 2's PR is actually merged, and i want that tracked rather than you eyeballing it
  - four tickets in the batch but 512 has to merge before the other three will build. handle that properly.
  - we got through the first two phases yesterday. pick the plan back up and keep going.
  - resume the migration from wherever it stopped. and i mean actually push it forward, not just tell me where it is
  - catch me up on the graph and then run whatever's next in it
  - reconcile wfg_2f1 against what actually happened overnight and move it along
  - i was mid-rollout when i had to stop. reopen that plan and take the next step.
  - what's blocked on the cutover plan, and unblock whatever you can without me
  - the three agents are done. mark those steps complete and tell me what that unblocks.
  - agents are fine, i don't need a fleet report. i need to know which phase we're actually on and whether the next one can start.
  - yeah they're all running. what i care about is whether phase 2 is allowed to start yet.
  - sweep the agents if you have to but the real question is what the plan says comes after the schema node
  - when the build finishes i want the next three steps to actually happen, in order. not just a ping.
  - this runs all afternoon across several stages. i don't want a notification, i want the plan to still be there and still know what's left when i'm back.
  - if i set a timer will it actually run the rest of this or just poke me?
  - wake me is fine but the point is there are still four phases to get through in sequence after that
  - 'for each of these five: spawn, wait, check it landed, then start the next. and remember where we got to if i drop off.'
  - Plan and carry out this migration as a durable workflow with dependencies.
  - Track this multi-stage refactor so we can resume it tomorrow without repeating completed steps.
  - Create a workflow graph for delegate, verify, and report phases.
  - Execute this rollout in dependency order and preserve progress across restarts.
  - Break the task into durable nodes and keep exact agent and watcher resources attached.
  - Resume the existing workflow graph and reconcile what completed overnight.
  - Show what can run next in the tracked workflow and advance only ready nodes.
  - The workflow's async job finished; reconcile the graph and continue.
  - Record this test result as evidence on the verification node.
  - Attach the spawned terminal to the repair node in the durable plan.
  - Cancel only the obsolete node in this workflow graph.
  - The user changed the migration scope; replace the live graph with a replanned one.
  - Preview the reconcile patch before applying it to the workflow.
  - Run this ordered issue-to-implementation-to-verification plan across several turns.
  - Keep a durable record of blockers and the next checkpoint while agents work.
  - Use workflow intelligence to manage this long-running upgrade.
  - Plan the dependent phases, launch the agent work, wait asynchronously, and verify at the end.
  - Reconcile this stale graph against recent failures before doing anything again.
  - Link the PR and worktree to their exact workflow node.
  - Continue the wfg workflow from its stored next action, but re-check live state first.
