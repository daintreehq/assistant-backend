# daintree.hosts.shard-test-suite: the hub's side of one test suite split between Remote Hosts.
# This Shell's hub pins one commit, asks each host's assistant what its runner collects and
# supports, hands each host a disjoint shard, and merges the shard reports into one result
# checked against the suite's own test list (missing, empty, duplicate and retried shards,
# timeouts and skips named).
#
# Rows: hub agents' task descriptions and people's own words, short and long, with social
# lead-ins and how-to questions; follow-ups inside a sharded run (after discovery, an empty
# shard, a host that dropped, a duplicate); topic shifts from host checks; and boundaries
# against the same work on every host (daintree.hosts.swarm-fan-out), different pieces placed
# per host (daintree.hosts.place-work), checks on this machine (daintree.ci.run-local-checks),
# the lane running its one shard (daintree.hosts.verify-for-hub), local agents splitting work
# (daintree.orchestration.fan-out-work) and hosts' branches combined
# (daintree.hosts.integrate-host-branches), each with reverse rows in that neighbour's file.
runbook: daintree.hosts.shard-test-suite
run: runbook-2026-10-issue-118

