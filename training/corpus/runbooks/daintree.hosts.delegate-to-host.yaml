  - query: when it's pushed, have the mini start the client against that commit
    history:
      - 'user: get the linux box to add the orders endpoint and push a branch'
      - 'assistant: Sent to the assistant on the Linux host (orders project, slot 0). I''ll verify the branch on the remote when it replies.'
    active: [daintree.hosts.delegate-to-host]
  - query: did it actually push what it says? check before you tell me
    history:
      - 'user: have the other mac fix the date picker bug'
      - 'assistant: The other Mac''s assistant replied completed: branch fix/date-picker at 3f2a9c1, tests passed.'
    active: [daintree.hosts.delegate-to-host]
  - query: good, now hand the next part to the GPU box, starting from that commit
    history:
      - 'user: get the mini to add the feature flags module'
      - 'assistant: Verified: feature-flags-module is on the remote at 9b41e07, matching the mini''s report.'
    active: [daintree.hosts.delegate-to-host]
  - query: actually do that on the linux box instead of here
    history:
      - 'user: fix the flaky export test'
      - 'assistant: I can launch an agent in this worktree to fix it.'
  - query: now get them ready
    history:
      - 'user: which of my hosts are connected?'
