# Training examples whose answer is `daintree.agents.answer-waiting-agent` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.agents.answer-waiting-agent
run: pre-split
positives:
  - tell the agent yes
  - agent in tab 2 is asking something, answer it and tell me what it says
  - three of them are waiting on questions, unblock them all
  - claude is asking whether it should also refactor the tests — say no, keep it in scope
  - it's blocked on a prompt, just send y
  - so the agent in the auth worktree has stopped and it wants to know if it can force push the branch. tell it absolutely not, it should open a PR instead, and then stick with it until it's done and tell me what it ends up doing
  - can you go through the ones that are sitting on questions and answer them? anything that's an actual decision, come back to me before you send it
  - after that fan out I've got like four agents all parked on prompts. read what each one is asking, answer the obvious ones, and report back who still needs me
  - awaitAll came back with an askingQuestion array of 3 — pull each question by terminalId and send the protocol reply
  - roster shows waitingReason question on two terminals, unblock both
  - the agnet is asknig me somethign, tell it to go ahead
  - answr the waiting agnets pls
  - yes to that one, no to the second
  - reply yes to the permission prompt in the deploy tab, wait for it to finish, then give me the url it prints
  - there's an inbox item about an agent asking a question — deal with it
  - unblock anything waiting on input
  - whats it asking? answer it if its obvious
  - the agent wants to know which branch to base off — tell it develop
  - send yes to terminal 7, it's been waiting on me
  - answer the waiting agents and then give me each one's test results
  - it asked a follow up — tell it pnpm not npm
  - two of them are stuck on questions, read them out to me first and then send my answers
  - did any of the agents ask me anything? if so just answer them
  - both of those prompts are the same question, answer both with yes and re-await
  - claude in tab 2 wants to know if it should update the snapshot tests too — tell it no, stay in scope
  - 4 of the 6 issue agents are sitting on questions. unblock whatever you can and bring me the rest
  - it wants permission to run the migration against staging. yes.
  - tell it yes
  - one of them — the billing branch one i think — popped a prompt at me, deal with it
  - answer the prompt in terminal 7 with postgres, then give me the row count it prints at the end
  - teh agent is blockd on some prompt, unblokc it now pls we need this deploy out
  - there's an inbox item from the auth agent asking something. handle it and clear it off the queue
  - agents been stuck ten minutes on a y/n prompt. just say yes
  - check the three claude tabs and answer anything they're waiting on. nothing else, don't touch the rest
  - it's showing QUESTION_ID=q_4f2 with some question about the index — reply no to that
  - both are asking about the package manager. frontend one gets pnpm, the api one gets uv
  - so i started that worktree agent before lunch and it's stopped to ask whether it can bump the lockfile, which is fine, so tell it to go ahead and then let me know whether the build goes green after
  - it came back with another question, env file this time. .env.local
  - the agent asked whether to keep backwards compat — answer it yes and tell me what it does next
  - ok that one's answered, now put me on the next one that's still waiting
  - anything waiting on me? if it's a yes/no just say yes
  - it's asking to force push. tell it absolutely not, open a PR instead
  - reply to terminal 12 with 'skip the e2e suite' — or is it 11? whichever one is asking
  - say yes to the prompt then sit on it until the full test run finishes, however long that takes
  - could you answer the prompt agent-3 is showing please? the answer is main.
  - why does it keep asking me things. answer it and don't come back unless it's something that actually matters
  - they all want to know if they're allowed to install deps. yes to all of them
  - 'two waiting: the lint one is easy, say yes. the other one about dropping the old api endpoint i want to look at first'
  - yeah tell it to go with option b
  - unblock the deploy agent — the answer is prod — and then summarise whatever it does after that
  - it's asking me to confirm the tests passed before it commits. they did, tell it yes
  - the reviewer terminal is asking whether it should cover the tests as well. tell it yes, everything under src
  - agent asking abt branch name -> tell it feat/rate-limit
  - answer whatever the api-worker terminal is stuck on with the defaults, i don't want to be involved
