# Training examples whose answer is `daintree.orchestration.multi-agent` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.multi-agent
run: pre-split
positives:
  - spin up three agents to debate the caching strategy and come back with one answer
  - get two agents cross-checking each other on this bug and merge what they find
  - have claude and codex reconcile their answers, i only want one recommendation at the end
  - put 4 agents on the same perf problem and synthesize whatever they come up with into a single report
  - so i've got two different opinions on how the auth refactor should go and i don't want to just pick one — can you set up a couple of agents, let them argue it out between rounds, and keep relaying until they actually land on a shared plan?
  - can you get a couple of agents to hash out the schema design together and come back with one recommendation?
  - could you have three of them work the same repro and keep going until the diagnoses agree?
  - is it possible to have two agents iterate on this migration plan together until it stops changing?
  - fan three explore agents at the same stack trace and run convergence rounds until the diagnoses stop moving
  - set up a relay loop between terminal-2 and terminal-5 on the rate limiter design, 3 rounds, then synthesize
  - multi-agent cross-check on this diff, one merged verdict
  - spwan 3 agents to colaborate on one answer for the queue design
  - get the two agnets to cross check eachother and giv me the merged result
  - have them dabate it until they converge, i just want the fnal answer not the transcript
  - now have those two compare notes and settle on one answer
  - do that with the other pair as well, relay between them till they agree
  - get them to reconcile what they each said and give me the single version
  - take those three and make them work it out together, one answer
  - the interview's finished — now get the top two to collaborate on one final design
  - they disagreed in the poll. relay between them properly until they land somewhere
  - the three answers from that competition contradict each other, have the agents actually reconcile them and tell me the agreed position
  - have one agent draft the plan and the other tear it apart, then keep passing it back and forth until it settles
  - keep relaying between the two of them until the positions stop moving
  - i want a second and third opinion on this design but not separately — make them argue it out and converge
  - 3 agents same question, cross check, one synthesized answer pls
  - what if you had two of them iterate on the error handling together, would they converge on something usable?
  - get two claudes to hash out the caching strategy and give me one recommendation
  - terminal-7f2a and terminal-91bc disagree on the migration order — bounce it between them till they settle and tell me the answer
  - they've each given me a different plan. i dont want three plans. make them reconcile it
  - spin up 3 agnets to cross check teh rate limiter logic and merge waht they find into one list
  - ok so i've got codex and claude both looking at the same race condition and they've come to different conclusions, can you go back and forth between them a couple times until they actually agree on what the root cause is, i just want one answer at the end
  - now take the winner and the runner up and have them cross-check each other's designs, then give me the combined version
  - those two you just interviewed — put them back on the same question and get them to agree
  - make those two argue it out until they land on the same answer
  - get the gpt one and the claude one — i think it's terminal 4 and 6? — to reconcile their estimates and give me a single number
  - prod is down, i've got two agents with conflicting theories, ping between them fast and tell me which cause is real
  - before I commit to a schema, I'd like three agents to draft it independently and then iterate together into one final schema. can you run that?
  - converge them
  - same problem, both agents, two more rounds then summarize into one answer
  - would you mind having the two review agents compare notes and produce a single agreed list of issues?
  - agent A says the fix works, agent B says it doesn't. put them on each other and settle it
  - have claude and codex cross check each other's read of the auth flow and give me the consensus
  - three agents each wrote a findings list. dedupe it by making them argue over the overlaps, then one merged report
  - put three agents on the payment bug and have them work it together
  - ask all four what the root cause is, then send each of them the others' answers and see who changes their mind, i want one conclusion
  - take the reviewer's findings to the implementer AND bring the implementer's pushback back to the reviewer until they agree on the final list
  - let them talk it through but i need one decision at the end, not a chat log
  - have them debate the two approaches and hammer out one plan — no voting anyone off, just get to the merged plan
  - each of them wrote a version of the migration script. iterate them together until there's one script we all agree on
  - hm. i think if i had two models look at this dependency graph and then trade notes they'd catch what each other missed... can you do that and give me the union?
  - good, now round three — send each of them the other two's objections and ask for a final position
  - relay term-3's answer to term-8 and term-8's back to term-3, keep going till they stop changing their minds
  - can multiple agents work on the same problem at once and give me one answer? do that for the flaky test
  - set up a panel on the indexing question but i want a single recommendation out of it, not a discussion
  - claude wrote the migration plan. get another model to poke holes in it and keep passing it back until neither of them has objections left
  - they keep talking past each other. relay properly and get me one answer
