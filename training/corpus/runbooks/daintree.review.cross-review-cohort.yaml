# Training examples whose answer is `daintree.review.cross-review-cohort` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.review.cross-review-cohort
run: 2026-09-28-catalog-expansion
positives:
  - The three agents that each built a separate endpoint are done. Have each one review another's branch without telling it whose it is, then let each author fix what its reviewer found.
  - swap reviews between claude-1 and codex, then have them fix whatever the other one found
  - Rotate code reviews across the five fan-out worktrees so no agent checks its own work, with one round of fixes after.
  - 'Peer review round: gemini reviews the #88 branch, codex reviews #91, claude reviews #93, each one someone else''s, blind, then each author fixes.'
  - now that all 4 are finished can they check each others work? then fix
  - 'Cross-review the parallel agents'' units: each reviews a peer''s frozen commit read-only, and findings reach the authors only after they''re verified.'
  - before i merge anything get the agents to go over each others prs and fix what comes up
  - Rather than fresh reviewers, have the four agents that wrote the payment, shipping, tax and invoice modules review one another's diffs, then address the findings.
  - Three open PRs came from three different agents in this session. Have each of those agents review one of the other two PRs, then fix its own.
  - Pair up the six finished agents so each reviews a peer's worktree, and get the findings relayed to the right author for fixes.
  - 'One round only, no looping: every agent in the cohort reviews a peer''s unit, then each author fixes or rebuts once.'
  - The agents built different features, not rival versions, so no winner is needed. Just have them review each other's work and fix what's found.
  - codex and claude each did a separate half of the refactor in their own worktrees; have them trade and review the other's half, then fix.
  - 'Blind peer review across the cohort: shuffle the assignment, prefer a Codex reviewer for Claude-authored work and vice versa, then a fix round.'
  - after the fan-out finishes each agent should review a different agent's unit, nobody their own, and then address the comments
  - Get agents A, B and C to critique each other's implementations of their tickets and respond with fixes or rebuttals.
  - Mutual review between the frontend agent and the backend agent on each other's branch, then each applies the findings to its own.
  - can the 3 claudes review each other before we integrate? round robin
  - Have the finished worktree agents (wt-search, wt-filters, wt-export) cross-review each other read-only at their current commits, then send the confirmed findings back to each author.
  - Review the PRs my five agents opened today, but use the agents themselves as reviewers in rotation, each fixing its own PR afterwards.
  - Set it up so codex reviews claude's branch and claude reviews codex's, and each fixes what the other finds.
  - round of peer review among the agents that just finished their issues, fix whatever is valid
  - Each of the 4 agents should look over another's diff for bugs and missed acceptance criteria. Don't reveal authors; relay the confirmed findings back for one fix pass.
  - i want the agents to grade each others work and then fix whatever their grader found, no voting on a winner
  - 'Cross-check: codex-2 reviews claude-3''s worktree and claude-3 reviews codex-2''s, both read-only, then each patches its own branch.'
  - 'Set up reciprocal reviews among the agents that handled #201, #204, #207 and #210 and have each address the issues its reviewer raised.'
boundaries:
  - query: 'Pass review findings between the agents: each of the four reviews a peer''s unit and the findings go to that unit''s author to fix.'
    confusable_with: [daintree.agents.relay-review-feedback]
  - query: have codex and claude review each other's work and relay the findings both ways so each fixes its own
    confusable_with: [daintree.agents.relay-review-feedback]
  - query: 'Relay feedback in a ring: agent 1 reviews 2, 2 reviews 3, 3 reviews 1, and each author then addresses what it got.'
    confusable_with: [daintree.agents.relay-review-feedback]
  - query: The agents each built a different module. Have them judge each other's work; no winner, each fixes what its judge found.
    confusable_with: [daintree.orchestration.competition]
  - query: send each agent another agent's finished unit to critique, then have them fix. not a contest
    confusable_with: [daintree.orchestration.competition]
  - query: Peer-judging round among the cohort, but each worked a separate ticket, so the output is fixes per ticket rather than a ranking.
    confusable_with: [daintree.orchestration.competition]
  - query: Review the three agents' branches, but have each of those agents review another's branch, then fix its own.
    confusable_with: [daintree.review.review-change]
  - query: 'code review round for the fan-out work: the agents review each other, not new reviewers, and they fix what they''re told'
    confusable_with: [daintree.review.review-change]
  - query: Look over what the four agents wrote by having them review one another's diffs blind, then act on the verified findings.
    confusable_with: [daintree.review.review-change]
  - query: The three agents have finished their PRs - have each one review another agent's PR, then fix what its reviewer found.
    confusable_with: [daintree.review.review-pr-queue]
  - query: 'now that the four worktree agents are done, swap their work around for review and let each answer what its reviewer found'
    confusable_with: [daintree.hosts.race-and-review]
    run: runbook-2026-10-issue-94
  - query: Assign each of the four finished agents a different peer branch for blind review, then relay the verified findings for one fix round.
    confusable_with:
      - daintree.edits.spawn-visible-agent
      - daintree.review.review-pr-queue
      - daintree.review.review-change
    run: 2026-10-16-synthetic-audit
