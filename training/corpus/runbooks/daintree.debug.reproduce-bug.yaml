    history:
      - 'user: can you repro #412? the CSV export drops the last row'
      - 'assistant: Created worktree repro/412 from origin/main at 3f9c2e1 and launched claude-2 as "Repro: 412" with the report, harness rules and test-only scope. I''ll check its result when the notice arrives.'
