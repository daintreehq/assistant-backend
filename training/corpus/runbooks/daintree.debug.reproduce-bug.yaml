      - 'assistant: claude-3 finished in repro/640 on origin/main (e4d21b7) and reports could-not-reproduce.'
    active: [daintree.debug.reproduce-bug]
    run: 2026-09-28-catalog-expansion-stateful
  - query: red is good, but don't fix anything yet — I just want a smaller test I can attach to the issue
    history:
