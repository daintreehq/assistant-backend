# Training examples whose answer is `daintree.release.test-distributable` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.release.test-distributable
run: 2026-09-28-round6
positives:
  - Build the macOS .dmg from tag v0.9.0 and install it on a clean user profile; check first launch and opening a project.
  - npm pack the CLI at the head of main and install the tarball in a temp dir outside the repo, then run `acme --help` and `acme init`.
  - run the docker image we'd actually ship, not the compose dev setup. fresh container, only the documented env vars, hit /health
  - does the wheel work? build it, pip install into a brand new venv, import the package and run the cli entry point
  - 'Smoke-test the linux release binary from commit 4f2a9c1 in a scratch dir: --version, first-run defaults, the sync command.'
  - Package the Electron app with electron-builder from release/2.3 and start it with an empty userData dir; confirm migrations run and the welcome screen appears.
  - test the built pkg installer, not the checkout
  - 'dist smoke: build tarball @ v1.4.0, clean npm project, install, import + run bin, result per check'
  - Before we tag 3.0, make sure the packed sdist installs with no repo around; we've been bitten by missing package data before.
  - Tests and lint are green from source. I want the actual built docker image run cold with no bind mounts to see if it even starts.
  - 'Not the Playwright run against the dev server: start the production container image built from main and check the login and upload flows against it.'
  - 'Build the installer from 9c1e0d2 (what #612 merged as) and try it on a clean profile.'
  - 'One agent is enough: install the release build of the CLI in a clean temp dir and run the three core commands, pass or fail for each.'
  - npm pack and install the tarball in a fresh project to confirm it works. We are NOT publishing yet.
  - Check the wheel we'd upload to PyPI actually installs and imports in a clean venv, without uploading it.
  - make dist, then try the resulting binary with a fresh HOME. unit tests aren't the question here
  - does the built binary of our cli run on a setup without the dev toolchain installed?
  - Run the AppImage built from v2.1.0-rc1 with a fresh config dir and check it opens a file and saves it.
  - Build the container from the Dockerfile at abc1234, run it without the repo .env, and confirm migrations and static assets are inside the image and the service answers on 8080.
  - does the packaged .vsix of our extension install and activate in a clean VS Code profile?
  - pls test the prod build of the desktop app on a clean profile, I'll click through the GUI bits
  - Verify the pyinstaller standalone binary at tag v0.7.2 runs from a clean directory without the venv.
  - 'Don''t deploy anything: run the image we would deploy in a clean local container and check it serves /version.'
  - 'The integration tests only ever hit the localhost dev server. Exercise the shipped image instead: health, login, one report export.'
  - Install the built .tgz of @acme/ui into a fresh vite app and check the components render with the bundled css.
  - Run the installer we built last night from 7d3e21a on a fresh profile and check bundled fonts and default settings load.
boundaries:
  - query: Playwright passes against the dev server; now run the production image with only documented env vars and check sign-in works.
    confusable_with: [daintree.ci.run-e2e-suite]
  - query: forget the integration suite, install the built wheel in a new venv and run the import and the cli smoke
    confusable_with: [daintree.ci.run-e2e-suite]
  - query: Run the shipped container, not the worktree's dev server, and exercise the health and checkout endpoints against it.
    confusable_with: [daintree.ci.run-e2e-suite]
  - query: The unit tests pass; now check the packed npm tarball actually works once installed outside the repo.
    confusable_with: [daintree.ci.run-local-checks]
  - query: lint and build are green from source, but run the docker image we'd ship in a clean container and check it starts
    confusable_with: [daintree.ci.run-local-checks]
  - query: Instead of the test suite, build the release binary and run it from a temp dir with no config to see the defaults.
    confusable_with: [daintree.ci.run-local-checks]
  - query: '#340 works from source; build the installer from its head commit and try it on a clean profile.'
    confusable_with: [daintree.git.test-pull-request-locally]
  - query: take the release PR's head, build the npm tarball from it and install that in a fresh project outside the repo
    confusable_with: [daintree.git.test-pull-request-locally]
  - query: 'Rather than running #455 from the checkout, package it into the docker image we''d ship and start that cold.'
    confusable_with: [daintree.git.test-pull-request-locally]
  - query: Before the release, install the built binary in a fresh dir and smoke-test the three main commands.
    confusable_with: [daintree.orchestration.bug-bash]
  - query: no bug bash needed, just have one agent install the release dmg on a clean profile and check it launches
    confusable_with: [daintree.orchestration.bug-bash]
  - query: Check the built app bundle ships its assets and starts with an empty user-data dir.
    confusable_with: [daintree.orchestration.bug-bash]
  - query: run the Docker image we'd ship in a clean container and check it starts with the bundled assets
    confusable_with: [daintree.release.deploy-and-verify]
  - query: npm pack the cli and install the tarball in a temp dir to see if it runs. do NOT publish
    confusable_with: [daintree.release.publish-package]
  - query: Build the wheel from the release branch and try it in a fresh venv before we decide whether to release.
    confusable_with: [daintree.release.publish-package]
  - query: Install the built .dmg on a clean user profile and check the onboarding flow works from the artifact, not the source checkout.
    confusable_with: [daintree.workflow.prepare-feature-demo]
