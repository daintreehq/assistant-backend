    confusable_with: [daintree.context.curate-copytree-bundle]
  - query: an agent saved our Algolia admin key into CLAUDE.md as a remembered fact, and CLAUDE.md is committed. handle the leak
    confusable_with: [daintree.memory.manage-project-memory]
  - query: The prod DB password is now in AGENTS.md and got pushed to main; contain the exposure and get it out properly.
    confusable_with: [daintree.memory.manage-project-memory]
  - query: forget the api key I gave you earlier — it was our real OpenAI key pasted in by mistake, make sure it hasn't spread
    confusable_with: [daintree.memory.manage-project-memory]
  - query: 'The audit''s done; one finding needs action now: a live Twilio token committed in config/prod.yml and pushed. Contain it.'
