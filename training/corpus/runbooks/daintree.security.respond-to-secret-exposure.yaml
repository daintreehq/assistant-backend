  - 'Credential exposure: Twilio auth token visible in claude-2''s terminal scrollback and probably its session transcript. Read-only inventory, never echo the value.'
  - Leaked JWT signing secret — agents in the api-auth and api-billing worktrees may still be copying it around. Tell them to stop spreading it, then locate every copy.
  - An agent echoed the production Postgres password into the GitHub Actions log for run 88213; find where else it went and what is public.
  - ugh i just pasted our slack bot token into the chat with you. make sure none of the agents copied it anywhere
