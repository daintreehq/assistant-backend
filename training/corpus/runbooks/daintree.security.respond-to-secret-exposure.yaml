  - query: "the same task went to two hosts and its text had a password in it. contain the password first, the duplicate work can wait"
    confusable_with: [daintree.hosts.resolve-task-collisions]
    run: runbook-2026-10-issue-140
  - query: "after the restart I noticed a key in one of the tasks the hub sent to the hosts. find which exchanges carried it and contain them"
    confusable_with: [daintree.hosts.recover-and-clean-up]
    run: runbook-2026-10-issue-140
  - query: "the hub told this machine's assistant that a credential from one of its tasks may be in our project. contain it here"
    confusable_with: [daintree.hosts.handle-hub-message]
    run: runbook-2026-10-issue-140
  - query: "a credential rode along in a message to the remote hosts. Report back which hosts have acknowledged the containment and which are unresolved"
    confusable_with: [daintree.hosts.report-swarm-results]
    run: runbook-2026-10-issue-140
  - query: "scan the remote machines' workspaces for the leaked token I sent them and say where it is"
    confusable_with: [daintree.hosts.audit-host-workspaces]
    run: runbook-2026-10-issue-140
