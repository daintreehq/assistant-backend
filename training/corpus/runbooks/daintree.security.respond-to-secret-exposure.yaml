  - 'Secret leak: NPM_TOKEN written into .npmrc and committed on release/2.3. Check which tags and remote branches contain that commit.'
  - Purge the leaked Mailgun key from feat/newsletter's history and the PR description; it was pushed yesterday and the key has already been rotated.
  - leaked AWS creds in worktree fix-s3-upload (copied .aws/credentials into the repo dir). inventory + containment, read-only, no value printed
  - i think claude wrote our live stripe key into a checkpoint note and into CLAUDE.md. find everywhere the key ended up
  - 'The security audit flagged a committed Google Maps API key in the mobile app config and the repo is public. Contain that exposure: which branches, tags and remotes carry it?'
  - 'PR #402''s diff includes a Sentry auth token in sentry.properties. Don''t review the rest of it — handle the leaked token.'
  - Datadog API key exposed in docker-compose.override.yml, pushed to the fork remote 'jane'. Establish exposure status and coordinate owner-approved cleanup.
  - hey, codex just dumped the whole .env to its terminal while debugging, prod db password included. lock that down
