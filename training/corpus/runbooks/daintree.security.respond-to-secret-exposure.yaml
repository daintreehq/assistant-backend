  - 'Vault root token pasted into the body of issue #88 on a public repo. Exposure response, no reproduction of the token.'
  - Check whether the Cloudflare API token claude-1 hardcoded into scripts/deploy.sh went anywhere beyond the local worktree, and tell every running agent not to reuse it.
  - someone leaked our anthropic api key in the feat/llm-router branch — is it on origin, in any PR, in the agent logs? rotation's on me
  - query: "An AWS access key got pasted into the brief for the retry-logic task that went out to the Linux box and the Mac mini. Establish which hosts received that task, have each assistant keep it from spreading inside its own project, and give me the list of keys that need rotating."
