  - query: the diff claude-3 wrote has our prod redis password in plain text and it's already on origin. contain it
    confusable_with: [daintree.review.review-change]
  - query: 'Skip the code review: PR #88''s description has a live Slack webhook token pasted in. Work out the exposure.'
    confusable_with: [daintree.review.review-change]
  - query: "the work I sent to the other machines carried an API key in its brief. each assistant should keep it from spreading, and tell me what to rotate"
    confusable_with: [daintree.hosts.steer-swarm]
