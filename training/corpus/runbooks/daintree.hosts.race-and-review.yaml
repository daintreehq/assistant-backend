    confusable_with: [daintree.hosts.swarm-fan-out]
  - query: 'not a side-by-side table, a ranking: have the hosts each build it and get the attempts judged'
    confusable_with: [daintree.hosts.swarm-fan-out]
  - query: the mini already pushed its branch; have a different host review that commit, not the mini itself
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: one host builds the oauth fix and a second host reviews it, findings go back to the first
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: the hosts' attempts shouldn't be combined; pick the best one with an independent judge
    confusable_with: [daintree.hosts.integrate-host-branches]
  - query: both machines pushed rival versions of the same fix; don't merge them, rank them
    confusable_with: [daintree.hosts.integrate-host-branches]
  - query: skip the local worktrees this time; the contest should run on the other macs, then someone neutral compares what they produced
    confusable_with: [daintree.orchestration.competition]
  - query: run the contest across hosts instead of local worktrees, same task on two remote machines, then a blind verdict
    confusable_with: [daintree.orchestration.competition]
  - query: I don't want reviewers on this machine; have another of my hosts review the tower's pushed commit
    confusable_with: [daintree.review.review-change]
  - query: code review of the mini's branch, but done by a different remote host
    confusable_with: [daintree.review.review-change]
  - query: the mini wrote the cache layer; send it to whichever of my other hosts had no part in it for a review
