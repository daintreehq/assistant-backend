  - query: I'm on the shell; have the build box review the commit the tower pushed and tell me what it finds
    confusable_with: [daintree.hosts.review-for-hub]
  - query: spread the attempts over my machines, one attempt per host, and get the best one picked
    confusable_with: [daintree.hosts.run-local-cohort]
  - query: from my shell, have two hosts race the same fix rather than one machine running both attempts
