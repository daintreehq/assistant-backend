# Training examples whose answer is `daintree.worktree.compare-worktrees` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.worktree.compare-worktrees
run: 2026-09-28-catalog-expansion
positives:
  - How do the payments-v2 and checkout-redesign worktrees differ? Changed files per worktree and where they overlap.
  - Are claude-1, claude-2 and codex stepping on the same files in their worktrees?
  - Forecast whether feat/tax-rules and feat/invoice-pdf will conflict when merged. Trial merge only, touch no working tree.
  - five agent branches finished, what order should i merge them in to keep conflicts down
  - 'Read-only: for each pair of the four fan-out worktrees, list shared files and whether a trial merge reports conflicts.'
  - diff worktree ui-polish against worktree ui-perf
  - will the search worktree merge cleanly into develop right now? don't rebase it, just tell me
  - What did codex's branch do that claude's didn't? Show the diff from their fork point.
  - 'overlap check across all my worktrees: which files are being touched by more than one'
  - 'Compare the two migration worktrees: do both add a migration that touches the users table, and would they conflict?'
  - branches feat/a and feat/b, any conflicts between them? no merging
  - Per-worktree change summary for the six agent worktrees, plus which pairs would conflict.
  - is it safe to merge gemini's and codex's branches in either order, or will one conflict with the other
  - Conflict forecast for release-prep, feat/new-pricing and hotfix/rounding, pairwise and each against main.
  - What changed in the docs-overhaul worktree versus the api-rename worktree, and would they clash?
  - Check whether the uncommitted edits in the frontend worktree overlap with what the backend worktree has committed.
  - Don't merge anything yet. Tell me whether the four agent branches would conflict if integrated, and in what order to take them.
  - before I combine the fan-out results, which branches overlap and which merge cleanly pairwise?
  - don't rebase anything, just tell me whether feat/reporting conflicts with current main
  - Claude and Codex each worked in their own worktree and I'm keeping both; show what differs between the two branches, no winner needed.
  - 'Not a code review: just which files the auth and sessions branches both touch and whether they''d merge.'
  - Of my worktrees, which ones are touching the same files as each other?
  - claude-2 and claude-3 are in separate worktrees now; are their branches going to conflict with each other?
  - suggest a merge order for the 5 finished agent branches, nothing merged
  - Which of the three agent worktrees would conflict with origin/main as it stands? Report files, change no branch or index.
  - Predict collisions between feat/cart, feat/wishlist and the codex-refactor worktree before anyone merges.
boundaries:
  - query: Show me what differs between the hotfix worktree and my feature worktree, read-only.
    confusable_with: [daintree.git.cherry-pick-changes]
  - query: Will the three agent branches conflict if I merge them? Just tell me, don't merge anything.
    confusable_with: [daintree.git.integrate-agent-branches]
  - query: what order should i merge claude-1, claude-2 and codex's branches in? read only
    confusable_with: [daintree.git.integrate-agent-branches]
  - query: Will split/billing-3 conflict with feat/tax-rules when both merge? Forecast only, change nothing.
    confusable_with: [daintree.git.split-into-stacked-prs]
  - query: Forecast whether feature/oauth will conflict with main when merged; read-only, no rebase.
    confusable_with: [daintree.git.sync-with-base]
  - query: Claude's and Codex's worktrees both touched the router. Show which files overlap and whether they'd merge cleanly; I'm keeping both.
    confusable_with: [daintree.orchestration.competition]
  - query: diff the two agents' branches against each other so i can see what codex did that claude didn't
    confusable_with: [daintree.orchestration.competition]
  - query: Compare what each of the four agents changed in their worktrees, files and overlaps. No winner needed, all of it gets merged.
    confusable_with: [daintree.orchestration.competition]
  - query: Will the frontend and backend worktrees conflict if I merge them? Read-only, don't change anything.
    confusable_with: [daintree.orchestration.contract-first-split]
  - query: Look over the auth and billing worktrees and tell me which files both touched and whether they'll conflict. Not a code review.
    confusable_with: [daintree.review.review-change]
  - query: check the three agent branches for merge conflicts with each other before I merge them
    confusable_with: [daintree.review.review-change]
  - query: Review whether feat/a and feat/b collide when merged; trial-merge the pair and name the files.
    confusable_with: [daintree.review.review-change]
  - query: Will the auth and billing worktrees conflict if I merge both into main?
    confusable_with: [daintree.worktree.audit-worktrees]
  - query: Will the payments and refunds branches conflict if I merge them? Don't change anything.
    confusable_with: [daintree.git.resolve-semantic-conflict]
    run: 2026-09-28-round6
  - query: which files do codex's and claude's worktrees both touch
    confusable_with: [daintree.git.resolve-semantic-conflict]
    run: 2026-09-28-round6
  - query: Will the auth and billing worktrees conflict when merged? Suggest a merge order; change nothing.
    confusable_with: [daintree.orchestration.resolve-task-collisions]
    run: 2026-09-28-round6
  - query: Are any of my five agents' branches touching the same files? Just report the overlap.
    confusable_with: [daintree.orchestration.resolve-task-collisions]
    run: 2026-09-28-round6
  - query: Forecast whether the parser and lexer branches will conflict before I merge them.
    confusable_with: [daintree.orchestration.resolve-task-collisions]
    run: 2026-09-28-round6
  - query: Compare the auth, permissions and UI branches for overlapping changes and trial-merge conflicts, returning a merge order without integrating them.
    confusable_with: [daintree.edits.spawn-visible-agent, daintree.git.integrate-agent-branches]
    run: 2026-10-16-synthetic-audit
