#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.deps.upgrade-dependency
run: 2026-09-28-catalog-expansion
positives:
  - Upgrade the web app from Next 14 to Next 15 in a fresh worktree, record baseline checks first, then fix whatever the upgrade breaks.
  - Move the api service from Python 3.11 to 3.13, including .python-version, the Dockerfile base image and the CI matrix, and prove the tests pass on the new interpreter.
  - Bump SQLAlchemy 1.4 to 2.0 in the billing service; apply the official 2.0 migration guide and report which items were deferred.
  - Have claude upgrade vitest from 1.x to 3.x on a new branch off origin/develop and compare test results before and after.
  - Get an agent to take eslint to v9 with the flat config migration, without disabling any rules to make lint pass.
  - Upgrade Tailwind 3 to 4 across the marketing site, run the official upgrade codemod as its own commit, then fix the build.
  - 'Node 20 -> 22 upgrade for the monorepo: update .nvmrc, engines and the GitHub Actions images, then rerun build and tests.'
  - Upgrade Rails 7.1 to 7.2 on branch chore/rails-7.2; don't push, just report the before/after check matrix.
  - 'codex: bump pydantic to v2 in services/ingest and fix the validators that break; keep the tests honest, no skips.'
  - npm audit flags lodash 4.17.15 as critical; upgrade lodash to the patched release and verify build and tests still pass.
  - Refresh all minor and patch npm dependencies in the dashboard package and confirm nothing regressed against a baseline run.
  - Upgrade the Rust toolchain in rust-toolchain.toml from 1.78 to 1.82 and clear the new clippy warnings without allow attributes.
  - Take Django from 4.2 LTS to 5.1 in its own worktree, apply the deprecation removals from the release notes, and list what is left manual.
  - Upgrade TypeScript to 5.6 and fix the new type errors properly, no @ts-ignore and no any.
  - Webpack 4 to 5 in the legacy admin app, one agent, bump and fixes kept as separate commits.
  - Ignore the stale Renovate PR and do the date-fns 2 -> 4 upgrade ourselves in a new worktree, fixing what breaks.
  - Bump Spring Boot to 3.3 in the orders service and report which tests were already failing before the bump.
  - can we get react 19 in? fix whatever breaks pls
  - upgrade prisma to 6, the generator thing changed i think
  - move us off go 1.21 to 1.23
  - bump storybook to 8 and make sure it still builds
  - 'ok thanks. next: jest 29 -> 30 on the api, dont push anything'
  - we're stuck on vue 2, get an agent going on the vue 3 upgrade in a new wt
  - update the deps in packages/ui, minor versions only, and prove nothing broke
  - pnpm 8 to 9 plus the lockfile, ci still has to pass
  - upgrade playwright to latest, our e2e config probably needs changes
