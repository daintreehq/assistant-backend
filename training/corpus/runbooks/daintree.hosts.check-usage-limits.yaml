    confusable_with: [daintree.agents.check-usage-limits]
  - query: usage limits on the remote hosts please
    confusable_with: [daintree.agents.check-usage-limits]
  - query: compare my claude weekly limit across the remote machines
    confusable_with: [daintree.agents.check-usage-limits]
  - query: what's the weekly allowance on the other computer
    confusable_with: [daintree.agents.check-usage-limits]
  - query: how much of the 5-hour window is left on each host
    confusable_with: [daintree.agents.check-usage-limits]
