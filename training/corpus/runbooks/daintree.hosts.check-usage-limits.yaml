followups:
  - query: and claude on those same machines?
    history:
      - "user: what's the codex situation on the hosts"
      - "assistant: Both hosts replied. One has 72% of its Codex weekly limit left, resetting Friday 10:00; the other 18% left, resetting Tuesday 08:00."
    active: [daintree.hosts.check-usage-limits]
  - query: is that 41% used or left?
    history:
      - "user: how much claude allowance do the other machines have"
      - "assistant: The office host's assistant reports Claude Code at 41% for the week, resetting Monday 09:00 its time."
    active: [daintree.hosts.check-usage-limits]
  - query: check them again, the first one should have reset by now
    history:
      - "user: usage on every host please"
      - "assistant: Host one: Codex 5-hour window 96% used, resets 13:40. Host two: Claude weekly 22% used, resets Thursday."
