# daintree.hosts.do-delegated-work: a Remote Host's lane carrying out one unit of work the
# hub delegated, on this machine: the unit's worktree from the pinned base commit, the CLI
# the brief names launched there, its folder trust answered, the commit and the brief's
# checks verified by the lane, and the result ready to go back by reference.
#
# Rows: hub-delegated changes in lane-written task descriptions and people's own words,
# short and long; the situations inside a unit (a half-made worktree, an agent already on
# it, a base commit not yet fetched, a named project command, the trust prompt, a check that
# cannot run here); followups mid-unit; boundaries against reading and answering the
# message (daintree.hosts.handle-hub-message), the hub sending work
# (daintree.hosts.delegate-to-host), the same work from the person here
# (daintree.edits.spawn-visible-agent, daintree.workflow.start-work-on-issue), several
# units (daintree.orchestration.fan-out-work), a started task moved
# (daintree.agents.hand-off-task) and a plain worktree
# (daintree.worktree.create-plain-worktree). Reverse rows sit in those neighbours' files.
# Checking a finished agent's claim on its own, answering its question and correcting it
# stay with daintree.orchestration.verify-agent-work, daintree.agents.answer-waiting-agent
# and daintree.agents.steer-running-agent (blind labels agreed), so they are absent.
runbook: daintree.hosts.do-delegated-work
