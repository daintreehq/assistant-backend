boundaries:
- query: why did the claude run on my other machine rewrite half the repo, post-mortem the exchange with the remote host
  confusable_with: [daintree.agents.postmortem-run]
- query: the run split over two remote machines failed and I want a post-mortem of the whole exchange, not one pane
  confusable_with: [daintree.agents.postmortem-run]
- query: the hosts finished already, so no need to follow them. I want to know why the run went the way it did
  confusable_with: [daintree.hosts.supervise-swarm]
- query: the run on my remote hosts is over and I don't want to keep watching it; explain the stall and the duplicate work with the evidence
  confusable_with: [daintree.hosts.supervise-swarm]
- query: not where things stand, I already know that. I want to know why each exchange with the remote machines took as long as it did
  confusable_with: [daintree.hosts.recover-and-clean-up]
- query: the hosts all answered; what I don't understand is why the replies took hours and one named the wrong commit
  confusable_with: [daintree.hosts.recover-and-clean-up]
- query: messaging works fine now. what I need is to know why last night's run stalled for hours on one host
  confusable_with: [daintree.hosts.diagnose-messaging]
- query: we can reach every host today, but the run that failed yesterday still has to be explained from its records
  confusable_with: [daintree.hosts.diagnose-messaging]
- query: the work on both remote machines is finished and wrong; explain the whole run with a timeline, not just why the two checkouts differ
  confusable_with: [daintree.hosts.diagnose-host-differences]
- query: it wasn't a difference in the environments, one host just said it was done on a commit it was never told about. trace the run
  confusable_with: [daintree.hosts.diagnose-host-differences]
- query: this is not production, it is a finished run on my other machines that ended with wrong commits; write up what happened
  confusable_with: [daintree.debug.investigate-outage]
- query: no live incident here, just a post-mortem on a failed job across the remote hosts, with timings and what to change
  confusable_with: [daintree.debug.investigate-outage]
- query: don't revert or clean anything, only explain why the remote hosts' run went wrong and what is salvageable
  confusable_with: [daintree.hosts.undo-swarm-changes, daintree.hosts.recover-and-clean-up]
- query: nothing to stop or redirect on the remote hosts, the run already ended. I want the reasons it failed written down
  confusable_with: [daintree.hosts.steer-swarm]
- query: list what we should change after the failed run on the remote machines, and give me a way to reproduce each problem, not a memory note
  confusable_with: [daintree.memory.manage-project-memory]
- query: the run is dead and the work is spread over several hosts; what happened, in order, from the exchange records
  confusable_with: [daintree.hosts.recover-and-clean-up]
- query: no more waiting on the hosts. a retrospective of the failed run, per host, with what each claimed and what the remote shows
  confusable_with: [daintree.hosts.supervise-swarm, daintree.hosts.recover-and-clean-up]
- query: two hosts ended up doing the same issue last week and nothing is running now; I don't want it settled, I want to know how that happened
  confusable_with: [daintree.hosts.resolve-task-collisions]
