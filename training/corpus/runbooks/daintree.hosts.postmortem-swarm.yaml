# daintree.hosts.postmortem-swarm: the hub explaining WHY a finished run on the Remote Hosts went
# wrong or disappointed. It rebuilds a timestamped timeline per unit from the exchange records,
# this conversation and the shared remote, marks what was never observed, checks each host's
# claim by artifact, names the first evidenced divergence and its causes by class, and proposes
# fixes with a way to reproduce each. It resends, restarts, cancels, cleans up and files nothing.
#
# Rows: stalled, doubled, late and wrongly reported runs in people's own words and as hub agents
# describe them (short and long, with a social lead-in, with history), explanation questions with
# docs: true; boundaries against a local agent's post-mortem (daintree.agents.postmortem-run),
# following a live run (daintree.hosts.supervise-swarm), catching up and cleaning up
# (daintree.hosts.recover-and-clean-up), reachability now (daintree.hosts.diagnose-messaging),
# the same code differing between hosts (daintree.hosts.diagnose-host-differences) and a
# production incident (daintree.debug.investigate-outage), each with reverse rows in that
# neighbour's file; followups after a run has ended.
runbook: daintree.hosts.postmortem-swarm
run: runbook-2026-10-issue-121
