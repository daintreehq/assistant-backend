# daintree.hosts.steer-swarm: the hub stopping or correcting a run it already sent to one or
# several Remote Hosts. Messages no host has read are withdrawn; every host that has read its
# task gets a scoped stop or correction for its own assistant to carry out; each host is then
# reported as acknowledged, already finished, unresolved or disconnected from what its
# assistant answers, never from a canceled record.
#
# Rows: stop and correction requests in people's own words and as hub agents describe them,
# with the situations the procedure handles (unread and working tasks in one run, a host that
# dropped off, a cancel already pressed whose agent may still be running, messaging paused,
# hosts already finished, one host of several, dirty work that must survive, a push already in
# flight); followups after the run's state has been read; and boundaries against the
# receiving machine's own steering (daintree.hosts.steer-for-hub), local steering
# (daintree.agents.steer-running-agent), local parking (daintree.orchestration.park-work),
# sending new or reworked work (daintree.hosts.delegate-to-host,
# daintree.hosts.swarm-fan-out) and catching up on or cleaning up after a run
# (daintree.hosts.recover-and-clean-up), each with reverse rows in that neighbour's file.
runbook: daintree.hosts.steer-swarm
run: runbook-2026-10-issue-110

