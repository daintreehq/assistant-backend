# Training examples whose answer is `daintree.git.split-into-stacked-prs` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.git.split-into-stacked-prs
run: 2026-09-28-catalog-expansion
positives:
  - 'Break PR #612 (the 2,400-line billing rewrite) into a stack of smaller dependent PRs so reviewers can take it one layer at a time.'
  - feat/search-v2 is about 3k lines over 40 files; rebuild it as a chain of branches, each based on the one below and each passing tests alone. Leave the original branch untouched.
  - Propose how to carve the payments-refactor branch into reviewable layers. Plan only, create no branches yet.
  - my pr is way too big, reviewers keep bouncing it. can you split it up into like 3-4 stacked ones
  - 'Separate the mechanical file moves in refactor/monorepo-layout from the behaviour changes: two stacked PRs, moves at the bottom.'
  - 'Turn the 18 commits on claude-2''s branch agent/ingest-pipeline into a PR stack: schema first, then the parser, then the API wiring.'
  - stacked branches from feat/offline-sync, one concern per layer, checks green per layer, prove top == original tip. no push
  - '#733 got a ''please split this'' from the lead. break it into chunks that each build on the one below'
  - Split codex/rate-limiter into a bottom PR with the new token-bucket module and a second PR on top that wires it into the middleware.
  - Rework gp/i18n-everything into ordered branches split/i18n-1..n, each passing lint and unit tests on its own commit.
  - the migration + ORM changes + UI are all in one branch, pull those apart into stacked prs pls
  - Decompose the oversized react-19 upgrade PR into a dependent chain where every layer compiles by itself; open the PRs against each other once it's built.
  - split feature/audit-log into 3 stacked layers, verify the union equals the original, don't open PRs yet
  - How would you slice the 4,000-line graphql-migration branch into pieces? Show me the layering first and build it if it looks sane.
  - Carve the monolithic dashboard-v3 PR into shared types, data hooks, components and page, each its own branch stacked on the previous.
  - The split/billing-1..4 stack we built earlier is verified. Push the layers bottom-up and open the stacked PRs with chained bases.
  - Before feat/notifications goes up for review, cut it into a stack of smaller branches; it's far too big to open as a single PR.
  - Instead of one giant PR for feat/exports, split it into three stacked PRs and open those against each other.
  - wrap up the auth work for review but as stacked prs, not one massive one
  - 'Nobody can review #640 as it stands. Restructure it into a stack of smaller dependent PRs rather than reviewing it.'
  - 'a reviewer said #702 is unreviewable at 5k lines, split it into a reviewable stack'
  - 'Make #655 easier to review by splitting it: a bottom PR with the new interfaces, a top PR with the callers, stacked.'
  - Take the already-integrated branch integration/sprint-12 and unpick it into a stack of per-concern PRs, each passing CI on its own.
  - Rather than cherry-picking bits of feat/sso into separate PRs, rebuild the whole branch as an ordered stack of dependent branches.
  - Don't rebase feat/queue-workers onto the new main yet; first split it into stacked branches from its current fork point.
  - 'Reviewer on #690 asked for the renames to be split out: make a rename-only layer under the real change, as stacked PRs.'
boundaries:
  - query: Break feature/big-refactor into three stacked PRs.
    confusable_with: [daintree.git.sync-with-base]
  - query: 'PR #690 is too large to review; restructure it into a stack of smaller dependent PRs instead.'
    confusable_with: [daintree.review.review-change]
  - query: 'reviewers can''t get through #702, cut it into reviewable layers'
    confusable_with: [daintree.review.review-change]
  - query: Before anyone reviews feat/editor-rewrite, split it into stacked branches so each piece can be reviewed alone.
    confusable_with: [daintree.review.review-change]
  - query: Get the analytics branch ready for review, but it's 3,500 lines, so turn it into stacked PRs first and open those.
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: open prs for feat/tenant-isolation as a stack of three dependent ones instead of one
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: Prep gp/cache-layer for review by splitting it into a base refactor PR with the feature PR stacked on top.
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: 'Split #600 into three stacked PRs: migration, service layer, UI.'
    confusable_with: [daintree.forge.land-pull-request]
    run: 2026-09-28-catalog-expansion-late
  - query: My branch feat/reports is 3,000 lines — break it into a stack of reviewable PRs, schema first.
    confusable_with: [daintree.orchestration.decompose-work]
    run: 2026-09-28-catalog-expansion-late
