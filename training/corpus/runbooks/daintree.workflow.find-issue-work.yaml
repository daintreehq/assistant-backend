followups:
  - query: any of those small enough for an hour?
    history:
      - 'user: anything unassigned i could pick up?'
      - 'assistant: Ran `no:assignee` against open issues sorted by updated. Shortlist: #214 flaky selector test, #219 docs for watchers, #227 cache key collision. Excluded #201 (open linked PR) and #208 (you have a worktree on it).'
    active: [daintree.workflow.find-issue-work]
  - query: how many did you throw out and why
    history:
      - 'user: triage the backlog for me, small stuff only'
      - 'assistant: Pulled 30 open issues with `no:assignee -label:epic`. Three look contained — #77, #91, #104. Two more are possibly in flight.'
    active: [daintree.workflow.find-issue-work]
  - query: widen it — include stuff closed in the last month too, i want to see if any of these were already fixed
    history:
      - 'user: find me bugs nobody is on'
      - 'assistant: Query was `no:assignee label:bug`, sorted updated desc. Four hits, two already have linked PRs open.'
    active: [daintree.workflow.find-issue-work]
  - query: hows it going
    history:
      - 'user: what''s free in the tracker right now'
      - 'assistant: Searching now — reading the in-flight worktree rows first so I don''t propose something you''ve already got open.'
    active: [daintree.workflow.find-issue-work]
  - query: drop the third, too fiddly. give me another one instead
    history:
      - 'user: shortlist three issues i could do next'
      - 'assistant: #310 retry backoff, #318 stale cursor on paging, #325 rename the terminal tab helper. Each unassigned, none with a linked PR.'
    active: [daintree.workflow.find-issue-work]
  - query: do the same for the CLI repo while you're at it
