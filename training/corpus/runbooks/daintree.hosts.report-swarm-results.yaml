# daintree.hosts.report-swarm-results: the hub's final, verified account of a run on its Remote
# Hosts once the run has ended or been stopped: a row for every assigned unit (failed, expired,
# silent and never-sent ones included), what the hub checked on the shared remote kept apart from
# what each host claimed, false and missing reports named, and what each host left behind (dev
# servers, panes, worktrees, unpushed work) with who decides. It starts, pushes, publishes and
# cleans up nothing.
#
# Positives are invented situations in agent and user words, short and long, some with a social
# lead-in or an earlier turn. Boundaries are requests this runbook wins against the runbooks that
# share its vocabulary: following a run (supervise-swarm), the after-restart account and cleanup
# (recover-and-clean-up), stopping a run (steer-swarm), one unit's hand-off (delegate-to-host),
# sending the same work everywhere (swarm-fan-out), combining branches (integrate-host-branches),
# usage (check-usage-limits), why hosts differ (diagnose-host-differences), the local worker check
# (verify-agent-work), the dated summary (summarize-activity) and the local post-mortem
# (postmortem-run). Followups are the report asked for right after a run ended. Machine names are
# generic.
runbook: daintree.hosts.report-swarm-results
run: runbook-2026-10-issue-120

positives:
  - the remote run is done, give me the final report with a row for each machine and what you checked yourself
  - which of the hosts really finished the job and which ones only said they had?
  - write up the cross-machine run for me - commits, test results, and what's still unresolved
  - 'sign-off time for the schema upgrade the machines ran last night - for each one, which commit is really on origin, what was run against it, and what I still have to decide'
  - every host has either reported or gone quiet, so tell me where the whole run ended up, one row per machine
  - 'I need the closing report on the multi-machine job, including the box that never replied'
  - final account of the overnight run on my other macs, please, and flag anything a host claimed that you couldn't confirm
  - did all three machines actually push what they said they pushed? write the results up
  - the lint cleanup went to four minis. which commits are really on origin, which test claims could you confirm, and which are only their word?
  - the hosts have all stopped, so produce the final write-up - what landed, what failed, what is missing, and what is still running over there
  - one of my remote machines is probably still running a dev server from that run. Can you write the final report and list everything it left behind?
  - after the run, list the leftover panes, worktrees and servers on each machine and who should decide what happens to them, in the final report
  - summarize the finished swarm for the team update - branch and exact commit for each host, which checks ran, and what is open
  - audit what each host told us about its unit against what is actually on the remote and in the task records
  - 'morning! the remote job finished while I slept. Can I get the full account, with the machines that never answered shown as missing?'
  - 'The overnight job was porting the date helpers to the new locale API on three machines. Two pushed branches I can see; the third says it did too and I cannot find it. Write me the closing report for all three without taking their word for any of it.'
  - 'Four hosts were each assigned a flaky-test fix. One reported green, one was never answered, one record shows it expired, and the fourth pushed nothing I can see. The person wants the end-of-run report for all four assignments with only what is confirmed on the remote.'
  - collect what each of the hosts produced into one result I can trust, and call out any report that doesn't check out
  - the three minis are finished. which commits are real, which tests actually passed, and what did they leave open?
  - I called off the run on the other machines an hour ago. give me the report of what each one had actually delivered by then
  - the build box finished the cache work and says it pushed cache-v2, but the mac mini's log only says done. tell me what each really has on origin and unpushed, in one report
  - one host said 'all tests pass' but never gave me a branch. put that in a final report of the run alongside the others
  - 'Hey, quick one: can you produce the wrap-up for the remote run, verified, with leftovers and who owns each decision?'
  - wrap up the cross-machine job - one table, what came back, what's proven, what's missing
  - Which machines delivered, which failed, and which never reported? I want the final tally for the run with evidence for each.
  - 'The migration across my machines has ended. I need a report I can forward: per host the branch, the exact commit, the checks and their results, and a list of anything still open or left running there, with no claims taken on trust.'
  - 'Everything the hosts were doing is stopped now. Before I decide what to merge or clean up, I want the honest picture: what each unit produced, what you verified yourself, and what the hosts left lying around, all in one report.'
  - 'After that run I got a message from one machine saying it finished early, and nothing at all from another. Give me the final report that treats those two honestly next to the machines that behaved.'
  - 'we sent the refactor to every host last night. now build the final report. a failed host still gets a row, same for one that never answered'
  - the other machines are done. what does the verified result of the whole run look like, and what's still up over there?
  - we stopped the retry-wrapper job after a day. report on each machine - the commit on origin, which test claims held up against CI, and which servers it left up
  - the three machines that did the upgrade all say done. go through the task records and the remote and tell me which of the three I should believe
  - we're closing out the cross-host work. report what exists on the remote, what the hosts only claim, and which items need a decision from me
  - did the run produce what the hosts said it did? give me the final report with unresolved work and who owns it
  - 'the build box says its full test log is too big to send back and only gave me a path on its own disk. I still need the final report for the run, so get whatever summary it can give without putting that log anywhere public'
  - 'I can see a task record that says completed for the build box but no commit anywhere. include that in the final account'
  - wrap up Friday's migration for the team - per machine the commit that is really there, the times from the records, and who decides what happens to the half-finished branch

boundaries:
  - query: all the hosts have reported on the run, write the verified final report with a row for each unit
    confusable_with: [daintree.hosts.supervise-swarm]
  - query: the run on the other machines ended, so don't wait on anything - report what each unit delivered and what is unverified
    confusable_with: [daintree.hosts.supervise-swarm]
  - query: the run is over and nothing is left to follow. I want a record I can trust of what each host really did
    confusable_with: [daintree.hosts.supervise-swarm]
  - query: the swarm finished while the hub was running, write up its results; no restart happened
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: after the run, list what the hosts left behind and who decides about it, but remove nothing
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: I stopped the remote run earlier, now I want the final report of what each host got done before it stopped
    confusable_with: [daintree.hosts.steer-swarm]
  - query: the run was called off. report which hosts had pushed what by then, checked against the remote
    confusable_with: [daintree.hosts.steer-swarm]
  - query: the work I handed to the two remote machines is finished. one report covering both units, checked against what they pushed
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: every host did its own copy of the task. give me the final report comparing what each one pushed and what was confirmed
    confusable_with: [daintree.hosts.swarm-fan-out]
  - query: all the hosts finished their branches; report what each pushed and what you verified, don't combine anything
    confusable_with: [daintree.hosts.integrate-host-branches]
  - query: write the final report of the run's results; usage left on each host is not part of it
    confusable_with: [daintree.hosts.check-usage-limits]
  - query: the hosts ended the run with different results on one test. report each host's outcome per unit as claimed and as verified
    confusable_with: [daintree.hosts.diagnose-host-differences]
  - query: the hosts claimed they completed the run and I don't trust them. audit those claims against the task records and the remote
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: summarize the finished swarm unit by unit with exact commits, verified or not, rather than by date
    confusable_with: [daintree.git.summarize-activity]
  - query: don't tell me why it went wrong, just list for each host what it delivered, what failed and what is missing
    confusable_with: [daintree.agents.postmortem-run]
  - query: 'the run on the other machines ended, so write up its final results from the hub, the hosts'' lanes only get a read-only question each'
    confusable_with: [daintree.hosts.handle-hub-message]
    run: runbook-2026-10-issue-120
  - query: 'all the lanes have replied to the hub, so write its final account of the run from their answers and the remote, rather than carrying out anything a lane was asked'
    confusable_with: [daintree.hosts.steer-for-hub]
    run: runbook-2026-10-issue-120

  - query: "pull together what each remote host produced for the run and which ones never answered, a single roundup please"
    confusable_with: [daintree.security.respond-to-secret-exposure]
    run: runbook-2026-10-issue-140
followups:
  - query: ok they're all in now, write the final report with every host's commit checked
    history:
      - 'user: send the date helper change to all four hosts, each on its own branch'
      - 'assistant: Sent to all four hosts. Three have replied, one is still working.'
  - query: right, that's the end of it. give me the full account, including the machine that never answered
    history:
      - 'user: have each remote machine try the retry wrapper'
      - 'assistant: Two hosts finished, one failed its tests, and the fourth never answered.'
  - query: great. now I need the closing report on that, with leftovers and who decides what
    history:
      - 'user: apply the same refactor on each of the hosts, one branch apiece'
      - 'assistant: All hosts have reported. I verified two branches on the remote; two are still unchecked.'
  - query: put that into one report I can forward to the team
    history:
      - 'user: get the build box and the linux server to build the parser on separate branches'
      - 'assistant: Both pushed. The build box''s checks passed; the linux server says it passed too.'
  - query: and which of those claims did you actually confirm? write it all up
    history:
      - 'user: have every host run the full test suite on the release commit'
      - 'assistant: The run has ended. Two hosts say all green, one says two failures, and one never answered.'
  - query: perfect, final report please, and mention anything left running on any host
    history:
      - 'user: use the three minis to try the new build script, each on its own branch'
      - 'assistant: The run has ended: three replies, one mentions a dev server it kept up.'
  - query: thanks. what's the verified summary of the whole run?
    history:
      - 'user: stop everything on the other machines but keep their work'
      - 'assistant: Stop delivered to all three hosts; two acknowledged and one is disconnected.'
  - query: so what did each of them actually deliver? one report
    history:
      - 'user: split the five migration units across my machines'
      - 'assistant: All five units have a reply or a final state now.'
  - query: Complete the written final account, distinguish the unchecked host claim from the verified branches, and include the unit that expired.
    history:
      - 'user: the cross-host font-rendering experiment has ended; write up every unit'
      - 'assistant: Two branches are verified, one host claimed completion without a matching pushed SHA, and the fourth unit expired.'
    active: [daintree.hosts.report-swarm-results, daintree.hosts.supervise-swarm]
    confusable_with: [daintree.hosts.supervise-swarm]
    run: 2026-10-16-synthetic-audit

topic_shifts:
  - query: now give me the final report of that run on the remote hosts, with checks confirmed
    history:
      - 'user: what is the difference between a worktree and a branch?'
      - 'assistant: A branch is a line of commits; a worktree is a directory with one branch checked out.'
  - query: forget that, the cross-machine run ended. write up what each host produced and what is unverified
    history:
      - 'user: which of my agents is using the most memory?'
      - 'assistant: The Codex pane in the docs worktree, about 1.8 GB.'
  - query: back to the swarm - it's finished, so I want the verified results report now
    history:
      - 'user: add a note to the readme about the new flag'
      - 'assistant: Done and committed on the docs branch.'
