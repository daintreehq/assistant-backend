# daintree.hosts.verify-for-hub: a lane's verification of one revision for the hub. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub, is asked to put an exact commit (or a
# branch's head) through named checks without changing it, and to return evidence: commands,
# platform, counts and what could not run.
#
# Rows: hub-framed test and verification requests written by a lane and in people's own words,
# with the situations the procedure handles (a moved branch, a missing runner, one shard or a
# manifest, one environment row, a toolchain the machine lacks, a commit another host built);
# followups after the hub's request has been read; and boundaries against the envelope
# (daintree.hosts.handle-hub-message), the person's own checks (daintree.ci.run-local-checks), a
# local agent's claim (daintree.orchestration.verify-agent-work), findings
# (daintree.review.review-change), the hub's side (daintree.hosts.delegate-to-host), fixing
# (daintree.ci.diagnose-and-fix) and trying a PR here (daintree.git.test-pull-request-locally),
# each with reverse rows in that neighbour's file.
runbook: daintree.hosts.verify-for-hub
run: runbook-2026-10-issue-104

