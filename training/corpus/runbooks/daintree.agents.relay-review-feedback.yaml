# Training examples whose answer is `daintree.agents.relay-review-feedback` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.agents.relay-review-feedback
run: pre-split
positives:
  - send the reviewer's findings over to the implementer
  - tab 3 finished its review — forward it to the agent in tab 1
  - relay that review
  - so I've had codex sitting in one tab reviewing the auth branch and claude in another still hacking on it, and obviously they can't see each other, can you be the middleman here — read whatever codex ended up with and push the important parts across to claude so it stops going down the wrong path
  - can you take what the reviewer agent said and point the implementer at it?
  - could you grab the review output from the second terminal and hand it to the one actually doing the work?
  - relay the reviewer terminal's verdict into the implementer's terminal
  - extract the review verdict from the reviewer tab and sendCommand it to the implementer tab
  - read teh review in tab 2 and snd it to the agent thats fixing it
  - forwrad the reveiwers notes to the implemnter pls
  - do the same for the other two reviewers
  - now push that one over to it as well
  - forward those findings but tell it the reviewer is a weaker model so it should verify before ripping anything out
  - give claude the notes but make clear it doesn't have to take every suggestion
  - also tell that agent to report back whether the review was actually useful
  - gpt just finished reviewing, give claude the notes
  - point the implementer agent at the review sitting in tab 4
  - the reviewer flagged a couple of things — make sure the agent working on it knows
  - take the findings from terminal 5 and message them to terminal 2
  - the review agent is done. hand it off.
  - read what the reviewer wrote and summarise it into the agent thats doing the work, dont dump the whole scrollback on it
  - pass the review notes to the other agent and ask it to say which findings it thinks are wrong
  - tell the claude in the worktree what the codex reviewer found
  - give the fix agent the reviewer's punch list, and say treat it as low confidence input
  - one of my agents reviewed the other one's work — can you carry that across for me and tell the second one who wrote it?
  - codex is done ripping apart the auth patch. dump its notes into the claude tab
  - the left one just finished reviewing. give what it found to the other one
  - send that review over to the implementer but tell it the reviewer is a small model, verify before changing anything
  - forward the review to term-9f and ask it to tell me afterwards whether any of it was actually worth doing
  - the review is way longer than what's visible, page the whole thing and get all of it into the implementer not just the tail
  - take whatever tab 4b said — or 4d, whichever — and pass it to the one doing the migration
  - it clearly never saw the review, send it again
  - gemini reviewed the parser branch in one of these tabs somewhere. find it and hand the findings to whichever agent is editing parser.rs
  - tke the reivew form the reviwer tab n pass it to the impl agent
  - so i had opus do a pass over the payments refactor while sonnet was still working on it. opus flagged a couple of things about idempotency keys i think. can you pull that out and get it in front of sonnet before it gets much further
  - only forward the security findings, skip all the style nitpicks
  - opus reviewed, sonnet is implementing. connect them
  - pass the review along but warn it the reviewer is usually wrong about our async stuff, weigh it accordingly
  - quick before it commits — the reviewer caught a real bug, get it to the implementer now
  - make sure the coding agent knows about what the reviewer flagged before it goes any further
  - the agent in tab 4 reviewed the PR and wrote up its findings there. get those over to the one still pushing commits
  - tab 2 and tab 6 both looked over the schema change. merge what they said and send it to the agent implementing it
  - ask the implementer to look at what the reviewer already wrote in the other tab
  - there's a review sitting in the codex tab doing nothing. someone should actually act on it
  - send the findings to term-a12 and hang around til it acknowledges
  - when you get a chance, could you take the reviewer's summary from the second terminal and pass it to the implementer? no rush
  - hmm the reviewer's already got all this written up... rather than me copying it by hand can you just shove it into the other agent
  - tell it the review is advisory only, it doesn't have to do everything in there
  - term-8821 -> term-4417, the review
  - the implementer is off rewriting stuff the reviewer already said not to touch. get the review in there right now
