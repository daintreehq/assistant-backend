  - query: the reviewer terminal has its findings up — send them over to the implementer agent and tell it to take them seriously
    confusable_with: [daintree.agents.answer-waiting-agent]
  - query: take what the reviewer agent said in tab 2 and point the implementer agent at it
    confusable_with: [daintree.agents.ask-and-relay]
  - query: take the reviewer agent's notes and send them to the implementer, tell it the review is advisory
    confusable_with: [daintree.orchestration.multi-agent]
  - query: point terminal-9 at terminal-4's review and have it fix what's flagged
    confusable_with: [daintree.orchestration.multi-agent]
  - query: the reviewer agent found three problems — send them over to the implementer in tab 4
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: tell the coding agent what the review agent just said and have it deal with them
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: reviewer agent flagged stuff. forward it to the one that wrote the code and tell it the perf note matters most
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: take the reviewer agent's notes in tab 2 and send them to the implementer in tab 5, tell it to weigh them heavily
    confusable_with: [daintree.orchestration.interview]
  - query: the reviewer in tab 4 wrote up three problems. send those over to the agent doing the implementation and tell it to take them seriously
    confusable_with: [daintree.review.review-change]
  - query: forward what the review agent found to claude in the other worktree, but tell it the last point is optional
    confusable_with: [daintree.review.review-change]
  - query: take the review sitting in the reviewer terminal and send it over to the agent that wrote the code
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: point the implementer at the notes in tab 3 and tell it to take them seriously
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: codex in tab 2 finished its review, send it to the claude thats implementing
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: take the reviewer agents notes and point the implementer at them, tell it to weigh them lightly
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: read what that review terminal said and forward the useful bits to the other agent
    confusable_with: [daintree.workflow.follow-up-on-issue]
followups:
  - query: also tell it codex is a smaller model here so push back if something looks wrong
    history:
      - 'user: the codex agent in tab 4 just finished reviewing the auth branch, send its findings to the claude thats implementing in tab 2'
      - 'assistant: Read tab 4 (codex review, verdict: changes needed, 6 findings) and relayed a compact summary to tab 2 — who wrote it, the verdict, the four actionable risks, and where the raw notes are. Not waiting on a reply.'
    active: [daintree.agents.relay-review-feedback]
  - query: did it get it?
    history:
      - 'user: forward the reviewer''s notes to the agent thats fixing it'
      - 'assistant: Sent. Relayed the reviewer''s three blocking findings to the implementer terminal.'
    active: [daintree.agents.relay-review-feedback]
  - query: the payments one
    history:
      - 'user: take the review from the gpt tab and hand it to the claude one'
      - 'assistant: There are two Claude terminals open — one in the payments worktree and one in the api-refactor worktree. Which is the implementer?'
    active: [daintree.agents.relay-review-feedback]
  - query: now the other two
    history:
      - 'user: three reviewers finished, push the first one''s findings to the agent it reviewed'
      - 'assistant: Done — relayed reviewer A''s verdict and findings into the implementer in tab 2.'
    active: [daintree.agents.relay-review-feedback]
  - query: and once it's over there ask it to say whether the review was actually useful
    history:
      - 'user: read the review sitting in tab 5 and send it over to the implementer'
      - 'assistant: The extract only returned the visible tail and it points at a longer artifact — reading the full scrollback before I forward anything.'
      - 'user: yeah dont send it half the review'
    active: [daintree.agents.relay-review-feedback]
  - query: hang on which tab was the reviewer in again
    history:
      - 'user: relay the reviewer''s punch list to the fixer agent, tell it to treat it as advisory'
      - 'assistant: Relayed to the implementer in tab 3 with the calibration you asked for — advisory input, use judgement, verify before large changes.'
    active: [daintree.agents.relay-review-feedback]
  - query: ok good
    history:
      - 'user: send codex''s review to the claude thats working in the worktree'
      - 'assistant: Sent the gist plus the five findings to the Claude terminal in the feature worktree.'
    active: [daintree.agents.relay-review-feedback]
