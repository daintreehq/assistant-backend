  - query: Forward the review notes from the reviewer terminal to the implementer agent.
    confusable_with: [daintree.forge.land-pull-request]
  - query: note down what the reviewer agent said and send it over to the one doing the implementation
    confusable_with: [daintree.memory.manage-project-memory]
  - query: take what the reviewer agent said and send it over to the implementer, tell it not to weigh it too heavily
    confusable_with: [daintree.agents.ask-and-relay]
  - query: read what the reviewer agent wrote and point the implementer at it
    confusable_with: [daintree.orchestration.conversation]
  - query: take what the reviewer agent said and send it over to the one doing the implementation
    confusable_with: [daintree.orchestration.multi-agent]
  - query: point terminal 3 at the review sitting in terminal 1 and tell it to weigh it lightly
    confusable_with: [daintree.orchestration.multi-agent]
  - query: take the review findings sitting in terminal 4 and send them to the implementer
    confusable_with: [daintree.review.review-change]
  - query: point claude at what the reviewer said and tell it to fix the high severity ones
    confusable_with: [daintree.review.review-change]
  - query: forward that review to the agent that wrote the code
    confusable_with: [daintree.review.review-change]
  - query: the reviewer agent found three problems — send them over to the one that wrote the code
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: take what the review agent said about the auth work and point claude in tab 2 at it, tell it the last point is optional
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: forward those findings to the implementer and tell it to take them seriously
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: take the review the reviewer agent in tab 3 wrote and send it over to the implementer
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: pass claude's review notes from that terminal to the agent doing the fix, tell it they're advisory
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: the reviewer agent finished — forward what it found to the one still working
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: take the review sitting in the reviewer tab and point the implementer agent at it
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: forward codex's notes on that branch to the agent that wrote it and tell it to weigh them lightly
