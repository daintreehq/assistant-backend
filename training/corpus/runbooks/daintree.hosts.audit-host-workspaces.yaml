boundaries:
  - query: don't remove anything yet, just tell me what the run left on each remote host and what's safe
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: 'report only: the panes, worktrees and branches the swarm made on my other machines, and which I could clean up later'
    confusable_with: [daintree.hosts.recover-and-clean-up, daintree.hosts.clean-up-for-hub]
  - query: before the hosts tidy up their parts, I want an inventory of what each of them would be removing
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: Give me the leftovers per host with a safe, unsafe or unknown verdict. The cleanup itself waits for my go.
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: which worktrees on the other machines have unpushed or uncommitted work?
    confusable_with: [daintree.worktree.audit-worktrees]
  - query: audit the worktrees on my remote hosts, read only, and say which are merged
    confusable_with: [daintree.worktree.audit-worktrees]
  - query: classify the worktrees the swarm made on the remote hosts as in use, at risk or merged
    confusable_with: [daintree.worktree.audit-worktrees]
  - query: 'from my main machine: sort the leftovers on the hosts into the run''s own and other owners'', and just report, I''ll decide about removing'
    confusable_with: [daintree.hosts.clean-up-for-hub]
  - query: Ask every host's assistant what the run left in its project and compile one report; no one removes anything
    confusable_with: [daintree.hosts.clean-up-for-hub, daintree.hosts.handle-hub-message]
  - query: list what remains from the swarm on the remote machines before I decide whether to tear any of it down
    confusable_with: [daintree.orchestration.workspace-cleanup]
  - query: tell me which of the swarm's panes and servers on the other computers are still in use, I won't close anything today
    confusable_with: [daintree.orchestration.workspace-cleanup]
  - query: 'what does each remote host still have from the run: open panes, dirty worktrees, servers? no diagnosis needed'
    confusable_with: [daintree.hosts.diagnose-host-differences]
  - query: what has the parallel run left lying around on the remote machines, and is any of it safe to remove?
    confusable_with: [daintree.orchestration.status-and-resume]
  - query: list the leftovers from that cross-machine run, nothing deleted
    confusable_with: [daintree.orchestration.status-and-resume, daintree.hosts.recover-and-clean-up]
  - query: I know the hosts are connected. What I need to see is what the swarm left in their worktrees, panes and servers, read only
