# daintree.hosts.audit-host-workspaces: the hub's read-only inventory of what one run left on its
# Remote Hosts. Each host's own assistant inventories its own project (the local worktree audit plus
# listeners and any configured remote resource), the hub classes every item safe, unsafe or unknown
# from the evidence, names the hosts and projects it could not observe, and removes nothing.
#
# Rows: audit requests in people's own words and as hub agents describe them, with the situations the
# procedure handles (dirty and unpushed work, a squash-merged branch, a server still listening, a
# same-named worktree that belongs to someone else, a closed task, a host that could not be reached,
# a retained cloud resource); followups after a run finished or after an earlier audit had gaps; and
# boundaries against performing the cleanup (daintree.hosts.recover-and-clean-up), a lane's own
# removal (daintree.hosts.clean-up-for-hub), the local audit (daintree.worktree.audit-worktrees),
# local teardown (daintree.orchestration.workspace-cleanup), a why-do-hosts-differ diagnosis
# (daintree.hosts.diagnose-host-differences) and catching up on earlier sessions
# (daintree.orchestration.status-and-resume), each with reverse rows in that neighbour's file.
# Lane-side rows (a host asked by the hub for the inventory) live in daintree.hosts.handle-hub-message.yaml.

runbook: daintree.hosts.audit-host-workspaces
run: runbook-2026-10-issue-128

