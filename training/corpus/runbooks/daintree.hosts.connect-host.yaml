# daintree.hosts.connect-host: the person adds another Mac or Linux machine to Daintree as a
# Remote Host through Settings → Hosts (the SSH check, an exact-build install or update, Host
# mode and start at login), or gets an added host that will not connect working again, and
# hears what is ready before any assistant messaging or assistant start is switched on.
#
# Boundaries are the words this shares with Daintree's own health on this machine
# (diagnostics), a worktree's cloud devbox (manage-resource), messaging on a host that is
# already added (the hosts foundation), work handed to a connected host (delegate-to-host),
# and the "set up / onboarding" and "check failed" vocabulary that recipes and CI failures
# use. Reverse rows live in those runbooks' files.
runbook: daintree.hosts.connect-host
run: runbook-2026-10-issue-122

positives:
  - Walk the person through adding their office iMac as a Daintree Remote Host and tell them which settings are still off afterwards
  - Guide setup of a Linux workstation as a host for this Shell; Daintree has never been installed on it
  - The server being added only accepts password logins, so the host check's SSH row fails; explain what has to change on the person's side for Daintree to connect
  - Help the user bring a headless Ubuntu box into Daintree as a Remote Host and confirm its projects are listed on this Mac
  - The user wants the build server added as a host but does not want Daintree starting at login there; guide the Host mode step to match
  - A host saved yesterday reads "Daintree isn't running in Host mode there"; get it connecting again
  - Find out why the Remote Host added this morning can't connect and needs a compatible build, and get the two machines onto the same Daintree
  - The Linux host's install plan ends with a sudo command; tell the person exactly what they run on the host and what to press after
  - Onboard the user's second Mac as a remote host; they use an SSH agent from their password manager and want nothing about their keys changed
  - Confirm a just-added Remote Host is connected and that its project list is current, without enabling assistant messaging
  - Add an arm64 Linux mini PC to Daintree as a host and check it is a platform Daintree ships for
  - The person's host got a new hostname; change its SSH target in Daintree and tell them which permissions that resets
  - A Mac that was added as a host went unreachable after its user logged out; work out what Host mode needs on that machine
  - First time using Remote Hosts on this Shell; take the person from an empty Hosts page to a connected host
  - The host check could not resolve the machine's name on the home network; guide the person to try its .local name
  - Report what is ready on a newly connected host before the person decides whether to allow assistant messaging with it
  - Help connect a cloud VM the user rents, reachable over their tailnet, to Daintree as a Remote Host
  - Get the spare Mac in the studio running Daintree in Host mode so this laptop can open projects on it
  - The person clicked Skip at the Enable step and now the host shows not connected; finish turning on Host mode there
  - Update the Daintree build on an existing host that reads Different build, and warn the person what an update ends there
