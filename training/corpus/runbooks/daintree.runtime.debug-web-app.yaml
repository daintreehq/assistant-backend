wakes:
  - query: '[agent completed: frontend fix]'
    active: [daintree.runtime.debug-web-app]
  - query: '[wake: dev preview panel reported a navigation]'
    history:
      - 'user: reload the preview'
      - 'assistant: Reload requested; waiting for a newer navigation generation to appear.'
    active: [daintree.runtime.debug-web-app, daintree.foundation]
  - query: '[terminal.awaitAll returned: t_3301 finished]'
    history:
      - 'user: delegate the render-loop fix'
      - 'assistant: Edit agent up in t_3301 with the console error and acceptance criteria. I''ll reload the preview once it lands.'
    active: [daintree.runtime.debug-web-app]
