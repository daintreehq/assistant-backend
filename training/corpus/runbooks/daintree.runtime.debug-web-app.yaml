      - 'user: the preview''s blank, check the console'
      - 'assistant: Read 100 messages off panel dp_7a1 (worktree wt_3f). Two errors at navigationGeneration 4: an uncaught TypeError in ProductGrid.tsx:88, and a failed fetch to /api/inventory returning 500.'
    active: [daintree.runtime.debug-web-app]
  - query: reload it now
    history:
      - 'user: fix whatever''s throwing in the preview'
      - 'assistant: Console pointed at a null guard in ProductGrid. Spawned an edit agent in wt_3f (t-14) with the exact error and stack; it''s changed the guard and the narrow vitest run passed.'
    active: [daintree.runtime.debug-web-app]
  - query: only the new ones please, i don't care about the old red
    history:
      - 'user: did the reload fix it'
      - 'assistant: Re-read the console. It still shows 6 errors in aggregate, but that count covers retained history across generations.'
    active: [daintree.runtime.debug-web-app]
  - query: which worktree did you put it in
    history:
      - 'user: the preview is throwing on mount, get someone on it'
      - 'assistant: Spawned a visible edit agent with the console error and stack trace, plus the acceptance criteria that the page mounts clean.'
    active: [daintree.runtime.debug-web-app]
  - query: do the restart then, it's clearly wedged
    history:
      - 'user: reload the preview'
      - 'assistant: Reload dispatched to panel dp_7a1. The acknowledgement doesn''t prove the webview reloaded, and no message at a newer navigationGeneration has appeared since.'
    active: [daintree.runtime.debug-web-app]
  - query: so is it still broken or not
    history:
      - 'user: reload after that fix and tell me if it''s clean'
      - 'assistant: Reloaded. Nothing at a generation above the recorded baseline of 4 has come through yet, so I can''t prove the page reloaded or rendered.'
    active: [daintree.runtime.debug-web-app]
  - query: cant you just look at it yourself
    history:
      - 'user: does the layout look right now'
      - 'assistant: I can''t judge that. Screenshots come back as an MCP image block that this path drops before I see it, so I''d get dimensions and no pixels. Console is silent on the new generation, but silence isn''t visual correctness.'
    active: [daintree.runtime.debug-web-app]
  - query: what was the baseline generation again
    history:
      - 'user: check the preview console'
      - 'assistant: Panel dp_22c, worktree wt_9a, project prj_1. Errors are all from the current load.'
      - 'user: right, i''ll go fix that import myself'
      - 'assistant: Fine — tell me when it''s saved and I''ll reload and check only what''s new.'
    active: [daintree.runtime.debug-web-app]
  - query: run the narrow test in that worktree too while you're at it
    history:
      - 'user: something''s crashing the preview on /orders'
      - 'assistant: Console has a stack ending in useOrders.ts:41. Edit agent is on it in wt_9a.'
    active: [daintree.runtime.debug-web-app]
  - query: errors only, drop the warnings, theres too much noise
    history:
      - 'user: whats in the console on the preview'
      - 'assistant: 100 messages back and it''s mostly deprecation warnings from the dev server.'
    active: [daintree.runtime.debug-web-app]
  - query: same panel, do it again
    history:
      - 'user: reload the preview, i changed the css'
      - 'assistant: Reloaded dp_7a1. New generation came through clean.'
      - 'user: i tweaked one more thing'
      - 'assistant: Want me to reload again?'
    active: [daintree.runtime.debug-web-app]
  - query: the one on the billing worktree, not the other
    history:
      - 'user: debug whats wrong with my preview'
      - 'assistant: There are two dev-preview panels open — dp_101 on wt_billing and dp_209 on wt_search. I''m not going to guess which you mean; which one is showing the problem?'
    active: [daintree.runtime.debug-web-app]
  - query: I opened it now; inspect its console.
    history:
      - 'user: Debug the blank Dev Preview.'
      - 'assistant: No dev-preview panel is currently open.'
    active: [daintree.runtime.debug-web-app]
  - query: Reload and judge only generation 5 or newer.
    history:
      - 'user: Fix the runtime crash.'
      - 'assistant: The agent changed the source and the baseline generation was 4.'
    active: [daintree.runtime.debug-web-app]
  - query: Then report the visual limitation and verify console evidence only.
    history:
      - 'user: Confirm the layout visually.'
      - 'assistant: Screenshot image blocks do not reach this backend model.'
    active: [daintree.runtime.debug-web-app]
  - query: The process is wedged, so restart it and re-read the console.
    history:
      - 'user: Restart the dev preview.'
      - 'assistant: A reload is cheaper unless the process is wedged.'
    active: [daintree.runtime.debug-web-app]
  - query: Compare message generations instead of using the count.
    history:
      - 'user: The error count is still three after reload.'
      - 'assistant: Aggregate counts include old navigation history.'
    active: [daintree.runtime.debug-web-app]
  - query: Do not do that; use the already-open preview only.
    history:
      - 'user: Run the dev server through project.runCheck.'
      - 'assistant: That action forbids long-lived servers.'
    active: [daintree.runtime.debug-web-app]
