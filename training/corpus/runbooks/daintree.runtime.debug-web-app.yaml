# Training examples whose answer is `daintree.runtime.debug-web-app` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.runtime.debug-web-app
run: pre-split
positives:
  - dev preview is just a white screen
  - check the console on the preview panel
  - page is blank in preview, no idea why
  - grab whatever errors are in the console and tell me whats actually wrong
  - it just spins
  - somethings throwing in the browser. the app's open in the preview panel, can you go look
  - reload the preview, i pushed the css fix
  - i fixed the import path, reload it
  - app in dev preview died right after my last save
  - whats in the console
  - the preview panel's got a big red error overlay on it, deal with it
  - can you screenshot the preview and tell me if it looks right
  - start a dev preview for me
  - open a preview of the app so you can actually see it
  - restart the dev server behind the preview, i think its wedged
  - TypeError somewhere on load. check the preview console
  - the page renders but the nav bar isn't there. preview's open, go look
  - why is the preview broken
  - uncaught error in the console, fix it
  - i've got the app running in dev preview and clicking save does nothing at all. see what's erroring when i hit it
  - console is full of red, sort it out
  - hydration mismatch warning in the preview, can you chase that down
  - did that reload actually take? im still seeing the old error
  - the preview reloaded but i can't tell if the fix landed. only look at messages from the new load
  - look at the preview, fix whatever's crashing it, then reload and confirm
  - 404 on a js chunk in the preview console
  - cors error in the browser console of the preview, i can't get the api call through
  - ok so everything looks fine to me and the tabs load, but the preview panel goes completely empty on one route. two of the three routes are fine. the third one just doesn't paint anything at all. can you dig into that
  - the app crashes the second i navigate to /settings. its up in preview
  - can you visually check the preview looks ok before i show this to anyone
  - preview keeps serving a stale version even after i save. reload or restart, whichever
  - the overlay says failed to resolve import ./utils/date. preview panel is up
  - unit tests all pass but the actual page throws on load in the preview. start with the console
  - npm run build succeeds. the preview still white screens. whats going on
  - there's no failing test here, the thing just breaks in the browser when i click the tab
  - typecheck is clean, the preview is not. look at the runtime errors
  - i know CI is green, thats not the issue. the app itself errors in the preview panel
  - 'the suite doesn''t cover this. its only visible at runtime: cannot read properties of undefined reading map, preview''s open'
  - not a build failure. the bundle compiles and then explodes in the browser
  - should i be looking at the tests or the console here? preview goes blank after the router change
  - lint and tests are fine. the preview throws on mount. get the console evidence and get someone to fix it
  - jest passes because it mocks the fetch. in the real preview it 500s and the page dies. chase the browser side
  - console first, then run the narrow check in that worktree once the fix is in
  - storybook builds fine but the actual dev preview is throwing. console please
  - the failing thing isn't a check. its the page. its open in preview and it's throwing
  - the check runner says pass but the page is broken in preview. trust the browser, look at the console
  - where's this coming from — console says Cannot read x of null in CartSummary. preview is open
  - the preview is erroring inside the checkout component. find out why and fix it
  - i don't understand why this component blows up at runtime. its right there in the preview and the console has a stack
  - explain what's crashing on the dashboard page. its open in the preview panel and throwing
  - trace this stack trace from the preview console back to the source
  - which file is actually throwing? the console in the preview has the stack, use that
  - figure out how the modal works — actually no, it just errors when i open it in the preview. debug that instead
  - the console error mentions useAuth. whats going wrong there at runtime
  - something in the data fetching layer is throwing in the browser. preview's up, dig from the console down
  - i want to know why the page doesnt render. not a general tour of the code, the actual runtime failure in the preview
  - before you go reading the whole component tree — the console already has the stack. preview is open, start there
  - reading the source isn't going to tell you this one, it only shows up when the page actually runs. preview's loaded
  - The React app in Dev Preview is blank; inspect the runtime error and fix it.
  - Read the browser console from the existing dev preview and diagnose the crash.
  - Fix this frontend runtime exception, reload the preview, and verify new console output.
  - The app renders a white screen in Daintree Dev Preview.
  - Inspect console warnings and errors in the open preview panel.
  - Reload the existing preview after the agent's frontend fix.
  - Restart the dev-preview server because its process is wedged, then re-check the console.
  - Use the stack trace in Dev Preview to give an edit agent an exact task.
  - Confirm whether the runtime error recurs in the next navigation generation.
  - Take a screenshot of the preview and tell me whether the layout is correct.
  - Start a new Dev Preview and debug the page for me.
  - The preview console is empty but the page still looks broken.
  - Debug a hydration failure in the already-open Next.js preview.
  - Find the dev-preview panel id and read its latest error messages.
  - The console counts are still red after reload; determine whether they are stale history.
  - Run a bounded frontend build check after fixing the runtime exception.
  - Fix the JavaScript error shown in Daintree's preview console.
  - The existing dev server changed configuration; restart its preview deliberately.
  - Verify only messages from the new navigation after reloading.
  - Tell me what this Assistant can actually prove about the visual preview.
boundaries:
  - query: the preview is throwing console errors after the last change
    confusable_with: [daintree.orchestration.execute-durable-workflow]
  - query: the dev preview is blank, check the browser console
    confusable_with: [daintree.worktree.manage-resource]
  - query: reload the preview, i fixed the import error
    confusable_with: [daintree.worktree.manage-resource]
  - query: start a preview of the app so i can look at it
    confusable_with: [daintree.worktree.manage-resource]
  - query: Start the React development preview for this worktree.
    confusable_with: [daintree.worktree.manage-resource]
followups:
  - query: and the second one?
