  - query: the host doing the urgent login fix went down; get that unit onto another remote machine now
    confusable_with: [daintree.orchestration.reprioritize-work]
  - query: one remote host is unreachable and I want its task finished elsewhere, but make sure only one of them ends up publishing
    confusable_with: [daintree.orchestration.resolve-task-collisions]
  - query: the unit on the stuck host should move to another machine; first get it to stop if it still answers
