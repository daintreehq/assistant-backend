    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: after the restart the mini never came back as an assistant and its unit is half done, put it on the studio instead of waiting
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: the job I sent to the build box is stuck, rather than sending it to that box again give it to a different host
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: the piece you placed on the mini this morning is stuck, pick a different host for it and carry over its work
    confusable_with: [daintree.hosts.place-work]
  - query: one of the hosts from this morning's split went offline; give its unfinished piece to whichever remaining host has room
    confusable_with: [daintree.hosts.place-work]
  - query: the workstation dropped midway through its task, send what it was doing to the mini and carry on from its pushed commits
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: have the tower continue the unit the mini started before it went offline, from the mini's branch
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: claude ran out on the remote build box mid task, have a different machine carry it on
    confusable_with: [daintree.agents.hand-off-task]
  - query: the codex agent on the other mac is out of usage, move its unfinished work to another host rather than swapping agents there
    confusable_with: [daintree.agents.hand-off-task]
  - query: if the dead host's worker can still be reached stop it, then get the unit going on another machine
    confusable_with: [daintree.hosts.steer-for-hub]
  - query: the mini isn't answering messages at all; don't debug it, just move its task to another host
    confusable_with: [daintree.hosts.diagnose-messaging]
  - query: the remote host shows no reply since this morning and I can't get to it, have another host finish its task
    confusable_with: [daintree.hosts.connect-host]
  - query: the linux host is out of codex credit, move its unfinished task to a host that has credit left
