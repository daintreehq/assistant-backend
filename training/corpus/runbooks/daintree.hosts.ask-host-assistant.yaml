  - query: ask the mini's assistant whether it has room for one more job today
    confusable_with: [daintree.hosts.start-swarm]
  - query: "ask the build box's assistant whether the usage limit slowed down its test run yesterday"
    confusable_with: [daintree.hosts.check-usage-limits]
    run: runbook-2026-10-issue-91
