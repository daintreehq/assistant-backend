    confusable_with: [daintree.agents.ask-running-agent]
  - query: ask the mini how the changelog is coming along
    confusable_with: [daintree.agents.ask-running-agent]
  - query: get the remote host's assistant to look at the auth module and tell me what it finds
    confusable_with: [daintree.agents.ask-and-relay]
  - query: have the other machine's assistant tell me the risks in this migration
    confusable_with: [daintree.agents.ask-and-relay]
