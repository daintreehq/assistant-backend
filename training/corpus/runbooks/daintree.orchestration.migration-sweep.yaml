    confusable_with: [daintree.forge.batch-dependency-updates]
  - query: 'Multi-step, multi-agent job: convert every callback-style fs call to fs/promises across the codebase, partitioned by directory, integrated, and verified with a residual count of zero.'
    confusable_with: [daintree.orchestration.execute-durable-workflow]
  - query: 'big migration, maybe over several sessions: every @Input() decorator to signal inputs across all the angular libs, a few agents, same rule everywhere'
    confusable_with: [daintree.orchestration.execute-durable-workflow]
  - query: 'Plan and run the removal of the old `EventBus.emit` API from every module in parallel: one pattern repeated, ending with no remaining calls.'
    confusable_with: [daintree.orchestration.execute-durable-workflow]
  - query: 'Launch one agent per package to replace `import * as _ from ''lodash''` with per-method imports: the same transform in all 11 packages, and zero barrel imports left.'
    confusable_with: [daintree.orchestration.fan-out-work]
