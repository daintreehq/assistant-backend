# Training examples whose answer is `daintree.orchestration.migration-sweep` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.migration-sweep
run: 2026-09-28-catalog-expansion
positives:
  - Replace every call to the deprecated `logger.warnOnce` helper with `log.warn` across all 14 packages in the monorepo, split between four agents, and confirm nothing references the old helper afterwards.
  - Convert the whole test suite from Jest to Vitest, about 600 spec files under packages/*. Split it by package across several Codex agents, with one pilot package first.
  - migrate all our class components to hooks, theres like 200 of them, get a few agents on it by folder
  - 'Codemod sweep: swap `lodash/get` for optional chaining everywhere in apps/web and apps/admin, parallel agents, zero remaining imports at the end.'
  - Move off moment onto date-fns across the repo, one agent per workspace package, then merge it all into one branch with no moment imports left.
  - 'Roll the new no-floating-promises lint rule out across the backend services: enable it centrally once, have agents fix the violations per service in parallel, and finish with a clean lint run.'
  - Rename `User.fullname` to `User.displayName` in every consumer across the 9 services; pilot it on the billing service first so the other agents follow the same pattern.
  - we're dropping styled-components for tailwind classes in every component under src/ui, can you split that between agents and make sure nothing's left
  - Replace the old `httpGet` wrapper with `apiClient.get` at all ~180 call sites using several agents; integrate on a migrate/api-client branch.
  - swap all the old i18n t('key') calls for the typed msg.key accessor across the frontend. partition by route dir, pilot one first
  - Convert every Go handler registration from `http.HandleFunc` to the chi router form, one partition per service directory, and prove zero old-style registrations remain on the combined tree.
  - Convert all CommonJS `require` calls under packages/ to ESM imports with a few parallel agents; the shared tsconfig and package.json changes should land once up front.
  - Remove every use of the deprecated `FeatureFlags.isOn` API in favour of `flags.enabled()` across the monorepo with 5 agents, integrate their branches, and list anything that couldn't be converted.
  - hey can we get all the PropTypes out of the react components and into TS interfaces? it's every file in components/, farm it out
  - Wrap every raw `throw new Error(...)` in services/* with the new `AppError` class, split across agents, with a rulebook written from a pilot service.
  - Replace SCSS `@import` with `@use` in all 90 stylesheets, partitioned by feature folder across agents, with a residual search at the end.
  - The pydantic v2 bump is already merged; now sweep every model file for `.dict()` -> `.model_dump()` and `class Config` -> `model_config`, several agents by package, until the search count is zero.
  - Fan agents out across the 12 apps so each replaces the old react-query v3 `useQuery(key, fn)` calls with the v5 object form. Same change everywhere; pilot one app first.
  - Run the TypeScript enum-to-union conversion across all packages with parallel agents, merge their partitions into migrate/enums, and check the residual `enum ` count is zero on the combined branch.
  - 'Swap every `console.log` in src for the structured logger: about 900 hits across 40 dirs. Spread it over 4 agents and give me before/after counts.'
  - Migrate all 30 ORM model files from Sequelize `define()` to class-based models, split by domain between agents, same conversion for each.
  - 'Add explicit return types to every exported function in packages/core, packages/sdk and packages/cli: three agents, one per package, one shared rule for all.'
  - can u get agents to replace all the var with let/const across the legacy js dir, its huge
  - React Router v6 is already installed; convert every `<Switch>` and `useHistory` usage across the 60 route files, partitioned among agents with a golden example to copy.
  - 'repo-wide mechanical migration: unittest.TestCase classes -> pytest functions, tests/ split by subpackage, parallel agents, residual grep must be 0'
  - 'Last time each agent invented its own translation. Redo the `Result<T>` -> `Either<E,T>` migration properly: pilot one module, write the rules down, then do the remaining modules in parallel.'
