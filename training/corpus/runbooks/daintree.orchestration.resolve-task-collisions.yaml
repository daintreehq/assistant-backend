  - query: I didn't mean for claude and codex to both build the export; it was accidental. Keep the stronger one and redirect the other.
    confusable_with: [daintree.orchestration.competition]
    run: 2026-09-28-round6
  - query: turns out two agents are racing on the same issue by mistake. no contest wanted, just one owner
    confusable_with: [daintree.orchestration.competition]
    run: 2026-09-28-round6
  - query: Two agents duplicated the upload work by accident; judge the two diffs and tests and give the task to one of them.
    confusable_with: [daintree.orchestration.competition]
    run: 2026-09-28-round6
  - query: Compare the diffs of the two worktrees where claude and codex are both building the importer, and decide which agent keeps it.
    confusable_with: [daintree.worktree.compare-worktrees]
    run: 2026-09-28-round6
