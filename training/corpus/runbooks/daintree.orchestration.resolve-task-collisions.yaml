    run: 2026-09-28-round6
  - query: Three agents are all modifying the billing webhook handler for the same bug. Give it one owner and stand the others down.
    run: 2026-09-28-round6
  - query: Agents api-claude and sdk-codex are both writing input validation, each believing its layer owns it. Decide ownership and stop the loser.
    run: 2026-09-28-round6
  - query: two agents opened branches for the same feature flag service; decide which continues, which stops, keep both branches
    run: 2026-09-28-round6
  - query: wait, claude-2 and codex are both doing the rate limiter?? sort it out
    run: 2026-09-28-round6
  - query: 'oops i gave #231 to two agents. pick one and keep the other''s stuff around'
    run: 2026-09-28-round6
  - query: these two keep clobbering each other in the parser, make it stop
    run: 2026-09-28-round6
  - query: the ui agent and the api agent have different ideas about the response shape and they're both coding it, figure out who's right
    run: 2026-09-28-round6
  - query: looks like gemini and claude are duplicating the search work, just one of them pls
    run: 2026-09-28-round6
  - query: two agents on the same bug, one thinks it's the cache and one the index, both editing. choose
    run: 2026-09-28-round6
  - query: fyi both codex windows are implementing oauth refresh. don't delete anything, just decide who keeps it
    run: 2026-09-28-round6
  - query: hm the two workers are doing the same migration. which one's further along? keep that one going and stop the other
    run: 2026-09-28-round6
  - query: stop the double work on the settings page, the other agent should do something else
    run: 2026-09-28-round6
boundaries:
  - query: these two need splitting up, they're both hammering the same files
    confusable_with: [daintree.worktree.relocate-agents]
  - query: Hmm, codex and claude were both given the export task; let one of them keep it and move the other elsewhere.
    confusable_with: [daintree.agents.hand-off-task]
    run: 2026-09-28-round6
  - query: Tell whichever of the two agents duplicating the webhook fix is behind to stop, and let the other own it.
    confusable_with: [daintree.agents.steer-running-agent]
    run: 2026-09-28-round6
  - query: claude-2 and codex-1 are both on the same bug, stop one and keep the other
    confusable_with: [daintree.agents.steer-running-agent]
    run: 2026-09-28-round6
