  - query: claude-3 and codex-2 are both editing the same migration for the same task in one worktree; settle ownership and give the other agent its own checkout.
    run: 2026-09-28-round6
  - query: 'End the collision between the two agents refactoring AuthService: whichever has passing tests keeps it, the other moves to the session-expiry task.'
    run: 2026-09-28-round6
  - query: 'Two agents are simultaneously applying opposite fixes for #1011 (one removes the cache, one extends the TTL). Pick an owner with evidence and pause the other.'
    run: 2026-09-28-round6
