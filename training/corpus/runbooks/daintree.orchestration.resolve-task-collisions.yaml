    confusable_with: [daintree.worktree.compare-worktrees]
    run: 2026-09-28-round6
  - query: 'Check whether gemini''s and claude-3''s branches overlap; they were both assigned #412 and are still coding. Settle who owns it.'
    confusable_with: [daintree.worktree.compare-worktrees]
    run: 2026-09-28-round6
  - query: Two agents in the same checkout are both implementing the same caching layer; pick one owner and stop the other.
    confusable_with: [daintree.worktree.relocate-agents]
    run: 2026-09-28-round6
  - query: these two are colliding on the same feature, one should own it and the other should drop it
