  - 'Investigate the finished agent run in terminal t-7f3: find the earliest point it ignored an error and list which of its changes are worth keeping.'
  - Why did the agent stop halfway and leave a half-converted file? Its run is over. Classify the cause and suggest how we brief around it.
  - the agent i launched at 2am is finished and made a mess. what happened and what's salvageable
