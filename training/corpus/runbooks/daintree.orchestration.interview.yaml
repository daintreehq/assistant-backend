    history:
      - 'user: which of these should be my pair programmer? have one interview the rest'
      - 'assistant: Chose a verified interview since you want a real recommendation. The judge is reading the repo to check what each candidate claimed.'
    active: [daintree.orchestration.interview]
  - query: what did the second one actually say again?
    history:
      - 'user: interview them on the indexing subsystem and name a winner'
      - 'assistant: Two rounds in. The judge has narrowed to a top 2 and is asking each of them one last challenge question.'
    active: [daintree.orchestration.interview]
  - query: close the losers once it picks
    history:
      - 'user: one judge, three candidates, topic error handling'
      - 'assistant: Spawned and relayed round 1. Candidate C stalled on a permission prompt so I sent it Continue.'
      - 'user: fine'
      - 'assistant: Round 2 relayed, awaiting all three.'
    active: [daintree.orchestration.interview]
  - query: how many rounds is this going to take
    history:
