  - query: how's it going?
    history:
      - 'user: have one agent interview the other three about the caching layer and pick the best'
      - 'assistant: Spawned a judge (Interviewer) plus three candidates in explore mode and relayed the judge''s opening questions. Awaiting their answers now.'
    active: [daintree.orchestration.interview]
  - query: have it verify their claims against the code before it decides
    history:
      - 'user: run an interview, one judge and three candidates, topic is the auth refactor'
      - 'assistant: Round 1 done — all three answered. I''ve condensed the answers back to the judge and it''s drafting follow-ups.'
    active: [daintree.orchestration.interview]
  - query: add the fourth agent as a candidate too
    history:
      - 'user: pick a judge and have it grill the others on the test strategy'
      - 'assistant: Judge is on round 2 of questions. Candidate B gave the thinnest answer so far.'
    active: [daintree.orchestration.interview]
