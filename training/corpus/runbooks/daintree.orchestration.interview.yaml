# Training examples whose answer is `daintree.orchestration.interview` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.interview
run: pre-split
positives:
  - have one agent interview the other three and pick the best one
  - interview them
  - get claude to grill the rest of them about the caching layer and tell me who actually knows it
  - which of these agents should be my pair programmer? have one of them work it out
  - one judge, three candidates, topic = error handling. go
  - i want one agent interviewing the others on rust async and declaring a winner at the end
  - 'set up an interview: pick a judge from the fleet, have it question the others about this repo''s test strategy, then name a winner'
  - have the judge verify their claims against the actual code before it decides
  - interview them but make them prove it — no hand waving, the judge should go read the repo and check
  - narrow it down to a top 2 and then pick the winner
  - same thing but deeper this time — have it verify what they say and do follow ups
  - intrview the four agents and tell me which one actually understands the payment flow
  - have gpt5 quiz the claude instances on the migration plan and say who came out on top
  - job interview style — one agent asks the questions, the others answer, best candidate wins
  - pick a judge and have it ask them all hard questions until it can say who's strongest
  - who's the best of these three? get one of them to interview the rest and decide
  - run a verified interview on the indexing subsystem, judge checks their answers against the repo
  - have one of them do the interviewing and give me the winner plus its reasoning
  - i need to know which agent to keep around for this project. have one interview the others and report back who wins
  - do a light q and a interview across the fleet — one asks, rest answer, pick a winner
  - can you have an agent interview these three about the deploy pipeline and then tell me who to trust with it
  - have the interviewer ask follow ups if the answers are thin, then declare a winner
  - ok now do the same interview thing with the two agents on studio-02
  - have the judge challenge anything they claim thats not backed by the code, shortlist two finalists, then choose
  - which of these four should i actually pair with? get one of them to interview the rest and decide
  - have codex interview the others about how our billing module works, and make it actually check the code before it picks. don't let them bluff me
  - interview them and pick one
  - hve one of the agnts grill the othrs abt the migraiton stuff n tell me who wins
  - morning. i've got 3 claude tabs and a codex tab. put codex in the interviewer chair and have it work out which claude actually knows the payments code.
  - ok now that they're all done — have the first one question the other three about what they changed and pick whose work was strongest
  - run a hiring panel for a docs-writing agent. one interviewer, three candidates, i want a hire recommendation at the end
  - t-7 is the judge. t-2, t-3, t-9 are the candidates. topic is our test flakiness. go.
  - interview all five on concurrency, cut it down to a top 2, then one final round and have the judge choose
  - i keep handing db work to the wrong agent and losing an hour each time. set up a proper interview, judge and all, and just tell me which one to use for schema stuff.
  - get the gpt one — sol? whatever it's called — to question the other agents about the auth rewrite and name a winner
  - so i've got a few agents up and honestly i can't tell which one has actually read this repo and which one is just pattern matching. can you have one of them ask the others properly hard questions about it, chase them when the answers are vague, and tell me who came out on top?
  - quiz the agents on our event pipeline — one asks, the rest answer, best one wins
  - oral exam time. one examiner, three examinees, subject is the retry logic. who passes?
  - could you have one agent interview the others about the caching layer and let me know which one it rates highest?
  - i want to know which agent should be doing my reviews from now on. have one of them interrogate the rest and give me a verdict
  - run the interview but tell the judge to push back hard on anything that sounds like a guess
  - have the judge check whatever they claim against src/ before scoring anyone, then pick
  - poll them on the schema question, but have one of them ask the follow ups and call the winner at the end
  - score them, but the scoring should come out of an interview — one agent asking, the rest defending their answers
  - get them talking about the indexing approach, but one of them runs it and has to name a best at the end
  - have claude interview the other two agents about the parser and report back who it'd trust with it
  - do that interview thing with these three
  - screen the candidate agents on kubernetes knowledge and give me one name
  - 'before i hand #212 to anyone, have one agent interview the rest on the code that ticket touches and tell me who''s best equipped'
  - deep version this time please — judge verifies the claims, extra follow up round, then the call
  - one agent grills the rest on our deploy pipeline until it picks a winner. leave everyone's tabs open after, i want to read them
  - put one of them in the ref seat and have it question the rest about the websocket layer til it can call it
