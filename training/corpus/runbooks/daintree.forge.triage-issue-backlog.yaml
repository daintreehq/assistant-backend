      - 'assistant: Listed the 50 oldest open issues (hasMore true — the rest is a later pass). Launched 3 read-only checkers (triage-a, triage-b, triage-c) on the bug slices in the main worktree; waiting on their notices.'
    active: [daintree.forge.triage-issue-backlog]
    run: 2026-09-28-catalog-expansion-stateful
  - query: close the duplicates and the fixed ones, leave the needs-info rows for now
    history:
