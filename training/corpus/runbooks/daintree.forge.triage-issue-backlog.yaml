topic_shifts:
  - query: honestly the tracker's a mess — dedupe it and label everything untriaged first
    history:
      - 'user: what should I pick up next?'
      - 'assistant: Shortlist of 5 small unassigned bugs: #244, #251, #260, #262, #270.'
    active: [daintree.workflow.find-issue-work]
    run: 2026-09-28-catalog-expansion-stateful
  - query: while you're in there, go through all the needs-triage issues — dupes, labels, priority
    history:
      - 'user: log the export crash as an issue'
      - 'assistant: Filed #612 "CSV export crashes on empty rows" with label bug; read back.'
    active: [daintree.forge.manage-issue]
    run: 2026-09-28-catalog-expansion-stateful
  - query: there are probably loads like that — find which open bugs are already fixed and close them
    history:
      - 'user: comment on #300 that it''s fixed and close it'
      - 'assistant: Commented "Fixed by #298" and closed #300 as completed; read back.'
