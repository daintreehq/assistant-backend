      - 'assistant: Plan for 38 issues: 6 duplicate groups, 4 fixed (commits confirmed on main), 7 needs info, 21 still valid with proposed labels and priority. Nothing applied yet.'
    active: [daintree.forge.triage-issue-backlog]
    run: 2026-09-28-catalog-expansion-stateful
