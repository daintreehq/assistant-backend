# Training examples whose answer is `daintree.forge.triage-issue-backlog` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.forge.triage-issue-backlog
run: 2026-09-28-catalog-expansion
positives:
  - 'Triage the 38 open issues labelled needs-triage in acme/storefront: group duplicates, check which bugs still reproduce on main, propose labels and priority.'
  - go thru the untriaged issues on the cli repo and label them
  - Sweep open bugs older than six months in org/billing-api and say which are already fixed, naming the commit or PR that fixed each.
  - Find the duplicate crash reports in the tracker and close them against the canonical issue.
  - our issue tracker is a mess, like 120 open. can you clean it up? start with the oldest 50
  - 'Backlog grooming for the mobile repo: propose a P0-P3 priority for every open bug using only the priority labels that already exist.'
  - 'Check which of issues #210 through #245 are still valid on the default branch; close the already-fixed ones with a comment naming the fix.'
  - prioritise the backlog pls
  - Dedupe the 'login redirect loop' reports, there are at least five open issues describing the same thing.
  - Put read-only agents on the open bug reports in widgets/core, about ten bugs per agent, to check each against current main; bring back one triage plan before closing anything.
  - Label every unlabeled open issue in daintree/docs-site with the repo's area labels. Don't invent new label names.
  - 'which of these bugs are already fixed? #88 #91 #104 #117 #130'
  - Go through bug issues opened before 2025 and mark the ones missing reproduction steps needs-info, with a comment asking the reporter for them.
  - 'Triage pass on the rust-sdk tracker, read-only for now: just the plan, no labels or closures yet.'
  - close the dupes and the already-fixed ones in the tracker, leave everything else for me to decide
  - Many open issues in acme/api look like they were answered in the comments months ago; sweep them and propose which to close and why.
  - 'Tracker cleanup for acme/web before sprint planning: duplicate groups, fixed-already, needs-info, and a proposed priority for each remaining bug.'
  - hey, before planning tmrw can you triage what's open in the payments repo
  - Group the 30 open performance complaints by area, find the duplicates among them, and propose one canonical issue per group.
  - Apply area/* and priority/* labels to the untriaged issues in org/api, then read each issue back to confirm.
  - 'Not looking for something to work on. I want the backlog itself tidied: dupes closed, dead issues closed, the rest labelled.'
  - Check the needs-triage queue against closed issues too; some are probably duplicates of bugs we already fixed.
  - 'Issues only, not branches or PRs: close the open issues the v3 rewrite made obsolete, after showing me the list.'
  - 'Triage issues filed in org/infra in the last month: label, prioritise, and flag anything that needs more info from the reporter.'
  - Walk the oldest 50 open issues, have agents verify each bug against main, and close the confirmed duplicates. I've already approved closing those.
  - Rather than fixing anything, have a couple of agents check which of the open 'export fails' bugs still happen and give me a verdict per issue.
boundaries:
  - query: Label every open issue that has no labels yet with the right area label.
    confusable_with: [daintree.forge.manage-issue]
  - query: 'Close all the issues that are duplicates of #300 or of each other in the auth area.'
    confusable_with: [daintree.forge.manage-issue]
  - query: Go through the 40 issues in needs-triage and set a priority label on each.
    confusable_with: [daintree.forge.manage-issue]
  - query: which of our open bug issues are already fixed? close those
    confusable_with: [daintree.forge.manage-issue]
  - query: 'Clean up the issue tracker: close issues that are obsolete or already resolved, with evidence.'
    confusable_with: [daintree.git.prune-stale-branches]
  - query: Have a few read-only agents check which open bugs still reproduce on main, then give me a triage plan.
    confusable_with: [daintree.orchestration.fan-out-work]
  - query: Search the tracker for issues that duplicate each other and close the dupes.
    confusable_with: [daintree.workflow.find-issue-work]
  - query: Find which open bugs are already fixed on main and close them with the fixing PR.
    confusable_with: [daintree.workflow.find-issue-work]
  - query: look through the 40 oldest open issues and propose labels and priorities for each
    confusable_with: [daintree.workflow.find-issue-work]
  - query: Why are so many of these old bugs still open? Check which are actually fixed and close those.
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: Go through all the open issues waiting on reporters and comment asking for repro steps where they're missing.
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: did anyone ever reply on the 20 oldest issues? close the dead ones and label the rest
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: triage the backlog
    confusable_with: [daintree.workflow.find-issue-work]
    run: pre-split
  - query: half the backlog is probably stale. find open issues that already have a merged pr against them
    confusable_with: [daintree.workflow.find-issue-work]
    run: pre-split
  - query: Triage open issues with no labels in the mobile repo and group them by area
    confusable_with: [daintree.workflow.find-issue-work]
    run: 2026-09-28-agent-queries
  - query: triage the backlog for me, half of it must be stale by now
    confusable_with: [daintree.forge.manage-issue, daintree.workflow.find-issue-work]
    run: pre-split
  - query: triage the backlog for me, anything untouched since june
    confusable_with: [daintree.forge.manage-issue, daintree.workflow.find-issue-work]
    run: pre-split
  - query: Find stale issues with no reply in 60 days that could be closed
    confusable_with: [daintree.workflow.find-issue-work, daintree.workflow.follow-up-on-issue]
    run: 2026-09-28-agent-queries
  - query: Go through the 45 open issues labelled epic:checkout, group duplicates, mark which are already fixed and propose priorities.
    confusable_with: [daintree.orchestration.decompose-work]
    run: 2026-09-28-catalog-expansion-late
  - query: triage the open issues and close the duplicates
    confusable_with: [daintree.orchestration.decompose-work]
    run: 2026-09-28-catalog-expansion-refine
