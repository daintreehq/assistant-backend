# Training examples whose answer is `daintree.hosts.demo-for-hub` and nothing else.
#
# The lane's side of a hub-requested demo: the assistant enrolled on a Remote Host gets
# a feature running here at the hub's commit, with invented data, and tells the hub the
# revision, the host listener and how its Shell would reach it. Boundaries are mined
# from its "do not use for" clauses; the local demo, the message envelope, a port clash,
# the hub's own side and a broken preview each win their reverse rows in their own files.
runbook: daintree.hosts.demo-for-hub
run: runbook-2026-10-issue-108

positives:
  # Agent-written search_runbooks task descriptions.
  - Hub exchange asks this host to stand up the saved-filters feature at a given commit with fake data and report the listening port; prepare that demo
  - Prepare a demo on this machine of commit 4f2c9e1 from feat/team-invites for the hub, seeded with invented users, and report where it listens
  - 'Lane task: run the pricing page branch here as a demo the person will open from their Shell; return the SHA, the host port and the preview panel id'
  - Start the CSV importer demo in this host's worktree for the hub and confirm which process owns the port before replying
  - The hub's request is a running demo of the calendar sync work on this host; it wants the exact revision, the dev server port here and who tears it down
  - Get the audit log page running in a Dev Preview on this host for the hub, with synthetic records only, and report what the Shell would have to forward
  - Stand up a demo here at the SHA the hub sent, then tell it the host-side port and that the person's own forward may land on a different local port
  - Prepare the hub's requested demo of the onboarding checklist here and check the server answers before replying
  - Run a hub-requested demo of the reporting dashboard on this host with the seed going into the worktree's own SQLite file, not the shared one
  - Get the mobile web checkout running on this host as a demo for the hub and say which walkthrough steps were exercised and which need the person
  - Keep the hub's demo of the comments feature running on this host until it says otherwise, and report its host port and pane id
  - Bring up a demo of the referral program pages on this host for the hub and confirm the listener's working directory is the demo worktree
  - 'Demo request from the hub: the new tags editor at 7c0a4e2, running on this Remote Host, walkthrough included'
  - Set up the hub's demo of the team calendar on this machine without exposing it on the network, and report the host port only
  - Prepare a demo on this host of the branch the hub named, invented data only, then answer with the revision actually being served
  - The hub's asking for a demo here and a dev preview panel already exists in that worktree; reuse it and report the port it serves on
  - query: >-
      The hub sent an exchange asking this host to leave the notifications drawer running for
      the person to inspect tonight. Branch feat/notif-drawer at 9b1e07d. It wants seed data
      that is clearly fake, the port the server listens on here, and who should shut it down
      afterwards.
  - query: >-
      Exchange from the hub: prepare a demo of the password reset flow on this Remote Host.
      Constraints from the brief: the database must be this worktree's own, never the shared
      staging Postgres; only the web server should stay up; reply with SHA, host port, panel id
      and what was exercised versus what needs the person.
  - query: >-
      I'm the assistant on the Linux box and the hub wants the inventory screens demoed from
      here. The worktree for feat/inventory is already checked out at the commit it named. Get a
      preview going with made-up stock items, check the listener belongs to that worktree, and
      send the hub the port on this machine, not a localhost link it can't open.
  - query: >-
      The hub's message: the person wants to try the new invoice reminders tomorrow morning from
      their laptop, so get it running on this host with invented customers, keep only the app
      server up, and say how long it will stay up and who stops it.
  # Users' own words, short and long, some with a lead-in.
  - set up the demo the hub asked for and reply with the port it listens on here
  - the hub wants to see the dark mode toggle working, get it running on this box
  - hub message says get feat/export-v2 up on this host so the person can click around from the Shell, invented customers only
  - make the billing settings page demoable on this machine for the hub and report the host listener
  - the main mac wants a live demo of the search filters from this host, sort it out
  - hub asked me to demo the photo upload feature on this box. what port and sha do I send back
  - the person asked through the hub for the reports page to be running here so they can look later
  - query: morning! the hub dropped a request overnight to get the invoice PDF preview running here for a demo, can you handle it
  - query: thanks for the last one. now the hub wants the new signup page served from this machine so the person can try it, same deal, fake data
  - query: hey, quick one from the hub, it wants the wishlist page up on this host for a demo, do that and tell it where it's listening
  # Explanation questions; the correct answer is still this procedure.
  - query: How do I get the hub's demo running on this host so the person can open it from their Shell, and what do I tell the hub about the port?
    docs: true
  - query: The hub wants the demo up here; how do I report a port the Shell will forward to a different local number?
    docs: true
  # With history.
  - query: ok get it running then
    history:
      - "user: Daintree: assistant inbox has 3 new messages (exchanges 5c1f8a20-7d3e-4b61-9e02-a4c7d9f3b158, a07e2d4b-91c3-4f6a-b8d5-3e6c0f1a9b27, 4d9b6e13-0a2f-48c7-95e1-b2c8f7d3a640). Read them with assistant.getInbox."
      - "assistant: Two are answered already; the third asks for a demo of the bulk-edit feature on this host at 2d8e4f1, with sample data and the port to open."
  - query: go ahead, synthetic data only
    history:
      - "user: the hub wants the wishlist page demoed on this machine"
      - "assistant: The worktree feat/wishlist is at the SHA the hub named; nothing has been set up yet."
  - query: use the preview panel that's already there and tell the hub which port it is on
    history:
      - "user: hub wants the gallery feature running here for the person"
      - "assistant: There is already a dev-preview panel in the feat/gallery worktree, idle."

boundaries:
  # vs the local demo: the hub asked, the person is elsewhere.
  - query: "Receipts page: the hub would like it demoable on this host by tomorrow morning, listing what works and what is stubbed"
    confusable_with: [daintree.workflow.prepare-feature-demo]
  - query: get the feature the agents built here running for the person on the main machine, they asked through the hub
    confusable_with: [daintree.workflow.prepare-feature-demo]
  - query: Seed fake orders and start the preview for the hub's demo of the order history page on this host
    confusable_with: [daintree.workflow.prepare-feature-demo]
  - query: hub wants to click through the team settings feature tomorrow, prepare it on this host
    confusable_with: [daintree.workflow.prepare-feature-demo]
  # vs the message envelope: the exchange is already read and is a demo request.
  - query: The new exchange is a demo request for the profile editor; set up the demo on this host at the commit it names
    confusable_with: [daintree.hosts.handle-hub-message]
  - query: Carry out the hub's demo request for the upload progress bar and put the host port in the answer
    confusable_with: [daintree.hosts.handle-hub-message]
  - query: hub sent a demo ask for the billing history page, fake invoices, port back to it
    confusable_with: [daintree.hosts.handle-hub-message]
  # vs a port clash: the port question is part of reporting the demo.
  - query: For the hub's demo, find which port the preview actually listens on here and confirm it's the demo's before replying
    confusable_with: [daintree.runtime.free-busy-port]
  - query: Tell the hub which port the demo server serves on here and that its Shell may map it to another number
    confusable_with: [daintree.runtime.free-busy-port]
  # vs the hub's side: this host is the one asked.
  - query: the hub handed this machine a demo to prepare, get the feature running and tell it the SHA and port
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: As the lane on this host, prepare the demo of the subscription page the hub asked for
    confusable_with: [daintree.hosts.delegate-to-host]
  # vs a delegated unit of code: the code exists; the hub wants it shown.
  - query: The hub says the CSV export is finished on its branch and wants it running here so the person can try it, no code changes
    confusable_with: [daintree.hosts.do-delegated-work]
  - query: hub wants the search filters the agents built last night up on this host as a demo, with the sha it serves
    confusable_with: [daintree.hosts.do-delegated-work]
  - query: Rather than building anything, the hub asks for the merged billing page to be started on this machine with invented data and the host port reported
    confusable_with: [daintree.hosts.do-delegated-work]
  - query: the hub wants the reports feature that landed on main stood up here to show off, with a short walkthrough
    confusable_with: [daintree.hosts.do-delegated-work]
  # vs the lane's check of a commit: this leaves the commit running to be looked at.
  - query: The hub doesn't need test results; it wants the tagged release served from this host so the person can poke at it tonight
    confusable_with: [daintree.hosts.verify-for-hub]
  - query: hub wants the commit it sent running on this box afterwards, not just checked, and the port it is on
    confusable_with: [daintree.hosts.verify-for-hub]
  - query: Leave the hub's candidate build running here for the person to look over and report which revision is up
    confusable_with: [daintree.hosts.verify-for-hub]
  # vs a broken or bare preview: the preview is a means to the demo.
  - query: Start a dev preview of the hub's branch here so it can be demoed, and report the port it picked
    confusable_with: [daintree.runtime.debug-web-app]
  # vs a seed alone: seeding is one part of the demo.
  - query: The hub's demo needs invented users seeded into this worktree's own database and the app started; reply with the port
    confusable_with: [daintree.runtime.migrate-worktree-database]
  - query: seed the demo data for the hub's preview of the leaderboard, prove the database is this worktree's, then start it
    confusable_with: [daintree.runtime.migrate-worktree-database]
  - query: 'the last demo here was cleaned up, and the hub wants the onboarding branch served again for the person to try'
    confusable_with: [daintree.hosts.clean-up-for-hub]
    run: runbook-2026-10-issue-100
  - query: 'Hub request: leave the inventory service running on this host with fake data and reply with its listener and the commit it serves'
    confusable_with: [daintree.hosts.coordinate-dev-services]
    run: runbook-2026-10-issue-126
  - query: the hub wants the reporting API up here with sample rows so the person can poke at it; reply with the port and the SHA
    confusable_with: [daintree.hosts.coordinate-dev-services]
    run: runbook-2026-10-issue-126
  - query: start the dashboard branch on this machine for the hub and say how the Shell would reach it
    confusable_with: [daintree.hosts.coordinate-dev-services]
    run: runbook-2026-10-issue-126
  - query: "Hub request for this host: leave the checkout flow demo up on the dev preview, then tell it which port and commit it serves"
    confusable_with: [daintree.hosts.prepare-remote-demo]
    run: runbook-2026-10-issue-125
  - query: "The hub wants a demo of the invoicing branch running on this machine with fake customers; I'm the assistant here, how do I tell it the person has to forward the port"
    confusable_with: [daintree.hosts.prepare-remote-demo]
    run: runbook-2026-10-issue-125
  - query: "I'm the assistant on the build machine and a hub message asks me to prepare the inventory demo at 21fc90a; what do I reply about reaching it"
    confusable_with: [daintree.hosts.prepare-remote-demo]
    run: runbook-2026-10-issue-125
  - query: "Message from the hub asking this host to start the reports preview as a demo for the person at the Shell, with the SHA and host port in the reply"
    confusable_with: [daintree.hosts.prepare-remote-demo]
    run: runbook-2026-10-issue-125
  - query: "the hub needs the checkout of the search-revamp branch up and running here with demo data loaded, then tell it how the person can reach the app"
    confusable_with: [daintree.runtime.migrate-worktree-database]
    run: runbook-2026-10-issue-133
  - query: "demo for the hub: load the sample data into this worktree's own database and leave the app running on a port"
    confusable_with: [daintree.runtime.migrate-worktree-database]
    run: runbook-2026-10-issue-133

followups:
  - query: good, start the preview and check it serves that commit
    history:
      - "user: the hub wants the album sharing feature running on this host"
      - "assistant: The prep agent finished: install ok, 12 invented albums seeded into the worktree's own SQLite file, walkthrough drafted."
  - query: use whatever is actually listening and tell the hub that
    history:
      - "user: hub asked for the quotas page demo here"
      - "assistant: The preview panel is up, but the server listens on 5174, not the 5173 the prep agent reported."
  - query: leave it up and answer the hub with the details
    history:
      - "user: the hub wants the activity feed demo running here"
      - "assistant: The demo answers on port 3000 here, served from feat/activity at 1e4b7a9; the walkthrough's sign-in step needs the person."
  - query: the hub replied that it wants a few archived projects in the demo too, add them and keep it running
    history:
      - "user: prepare the projects list demo on this host for the hub"
      - "assistant: Replied to the hub: feat/projects-list at 6f02c3d, host port 4200, preview panel open, seeded with 8 invented projects."

topic_shifts:
  - query: different thing, the hub just asked for the wiki editor demo on this host, handle that
    history:
      - "user: rename the tabs after their branches"
      - "assistant: Renamed four tabs."
  - query: unrelated, the hub wants a demo of feat/quotas running here with the sha and port sent back
    history:
      - "user: did the lint agent finish?"
      - "assistant: Yes, it finished with no errors."
  - query: forget the cleanup for now, the hub needs the shipping rates page demoed on this machine first
    history:
      - "user: clean out the worktrees the last run left"
      - "assistant: Three worktrees look stale; none has uncommitted changes."

wakes:
  - query: "[agent 'Demo prep: invoices' finished: setup done, 20 invented invoices seeded, walkthrough drafted]"
    history:
      - "user: the hub wants the invoices demo on this host"
      - "assistant: Launched the prep agent in feat/invoices at 3e9a1c0; waiting on it before starting the preview."
    active: [daintree.hosts.demo-for-hub]
