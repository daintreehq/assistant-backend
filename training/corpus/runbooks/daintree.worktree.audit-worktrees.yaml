    active: [daintree.worktree.audit-worktrees]
    run: 2026-09-28-catalog-expansion-stateful
  - query: 'fix/login is merged though, #612 was squash-merged last week'
    history:
      - 'user: which of these are already merged?'
      - 'assistant: Merged: feat/onboarding (#598), chore/deps (#601). fix/login is parked: no PR found for that branch name.'
    active: [daintree.worktree.audit-worktrees]
    run: 2026-09-28-catalog-expansion-stateful
  - query: ok, just give me the proposed removal set, nothing else
    history:
      - 'user: audit my worktrees'
      - 'assistant: 11 rows classified with evidence. codex-1 is still working in feat/export so that one is in use; 2 are closed-unmerged.'
    active: [daintree.worktree.audit-worktrees]
    run: 2026-09-28-catalog-expansion-stateful
