# Training examples whose answer is `daintree.orchestration.review-until-approved` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.review-until-approved
run: 2026-09-28-catalog-expansion
positives:
  - Have Codex review Claude's changes to billing proration and send blocking findings back to Claude, repeating until Codex approves (max 3 rounds).
  - keep them going back and forth till codex is happy with the auth refactor
  - 'Review/fix loop in the feat/search-filters worktree: reviewer gemini, implementer claude-2, stop when approved or after 4 rounds.'
  - claude writes, codex reviews, repeat until there's nothing blocking. it's the websocket reconnect change
  - Run an iterative review loop on Claude's session-timeout change with Codex as the read-only reviewer; only correctness and security findings block, nits don't.
  - Iterate the CSV importer change between the implementer and a reviewer agent until the reviewer signs off; report each round's blocking findings.
  - don't stop until codex approves claude's changes to the migration script
  - 'Loop on the payments retry branch: the reviewer checks the current revision, the implementer fixes blocking issues, the reviewer re-checks. Cap at 3 rounds.'
  - claude just finished the rate limiter. have gemini review and keep bouncing fixes back until gemini says approved
  - Take Codex's review of the parser to Claude, have Claude fix, then Codex re-reviews; repeat until Codex has no blocking findings.
  - keep iterating till it passes codex's review. the date util rewrite in wt dates-v2
  - Have a reviewer agent other than Claude judge Claude's diff against main and send only the blocking issues back, looping until approval.
  - 'Code review until approved: Codex reviews the diff on the export-queue branch, Claude fixes, repeat.'
  - i want codex to sign off on claude's work before we move on. loop review and fixes until it does
  - Put the GraphQL resolver change through review rounds with Gemini until it's approved; Claude does the fixes and must not skip tests to get past a finding.
  - Launch Claude on adding request tracing, then have Codex review it and loop fixes until Codex approves.
  - review, fix, re-review cycle between claude-3 and codex on the cache key change, up to 5 rounds
  - before I trust that it's done, codex should review and claude should fix the blocking stuff until codex is satisfied
  - Get the terraform module changes approved by a reviewer agent through repeated review and fix rounds; the implementer terminal is claude-1.
  - codex keeps pushing back on claude's approach? fine, keep looping them till it approves or they stall, then tell me
  - 'Have Codex act as the gatekeeper on Claude''s pagination change: blocking findings go back to Claude, re-review, until APPROVED.'
  - Iterate between writer and reviewer agents on the onboarding email template code until the reviewer is happy; stop if the same finding survives two fixes.
  - have codex judge claude's refactor of the order service, send back only what blocks, and repeat until it passes
  - Loop Gemini's review of Claude's accessibility fixes in the settings screens until Gemini approves; collect nits but don't fix them.
  - Keep Claude and Codex in a review loop on the logging change, Claude fixing whatever Codex marks blocking, until Codex approves. Don't open a PR.
  - ok so claude's done with the upload handler. codex reviews, claude fixes, until clean. max 2 rounds
  - query: have Codex review Claude's change and keep looping until Codex is happy
    run: 2026-09-28-catalog-expansion-refine
