# daintree.hosts.steer-for-hub: a lane steering the hub's work on this host. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub, is asked to stop, pause or correct
# work it delegated here and that an agent this lane launched is running or already finished,
# and to tell the hub what each agent's actual state is.
#
# Rows: hub-framed stop, pause and correction requests written by a lane and in people's own
# words, with the situations the procedure handles (an agent mid-turn, one idle at its prompt,
# one that already finished, a cancelled exchange whose agent is still working, a similar name
# from another run, a pane that is the person's own, an interrupt that did not take, dirty
# work that must survive); followups after the hub's request has been read; and boundaries
# against the envelope (daintree.hosts.handle-hub-message), starting the unit
# (daintree.hosts.do-delegated-work), the person's own steering
# (daintree.agents.steer-running-agent), parking for the day (daintree.orchestration.park-work)
# a hung agent (daintree.agents.recover-agent), the run's cleanup (daintree.hosts.clean-up-for-hub)
# and the hub's own side (daintree.hosts.delegate-to-host), each with reverse rows in that
# neighbour's file.
runbook: daintree.hosts.steer-for-hub
