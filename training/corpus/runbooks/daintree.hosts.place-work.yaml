  - put the remaining tickets on whatever hosts are free; the mini is out, it's running the nightly
  - one of my hosts has most of its codex week left and the others are low, so spread the four migration issues accordingly
  - query: how do you decide which of my machines gets which issue? explain it, then split these six that way
    docs: true
  - query: what do you look at when choosing a host for a task, load or usage? then pick one for the logging cleanup
    docs: true
  - query: >-
      I've got eight issues in the ready column and four remote machines. Two of them only have
      Codex signed in, one is busy running a long benchmark, and the Claude week on the first
      host is nearly used up. Work out a sensible split, show me the table, and once I say go,
      send each issue to its host.
  - query: >-
      User asked to distribute twelve independent GitHub issues over their Remote Hosts. Hosts
      differ in CPU load, thermal state and which agent CLIs are signed in. Need to choose a host
      per issue, skip hosts that lack the repository, present the placement, then delegate each
      issue and track the PRs.
  - query: >-
      The build box is thermal throttling again and the laptop host keeps dropping its
      connection. I still need these five tickets worked on today. Put them on whichever machines
      can actually take them and leave the build box out of it.
  - query: >-
      thanks for sorting the hosts out yesterday. today there are four small bugs in the tracker,
      none of them related; get each one onto a machine that has room and the repo checked out,
      and tell me which went where
  - query: and the other three go wherever there's room, same as before
    history:
      - "user: put the auth refactor on whichever host is least loaded"
      - "assistant: Placed on the second host (Claude Code, 12% CPU); sent, waiting on its reply."

