    confusable_with: [daintree.hosts.survey-hosts]
    run: runbook-2026-10-issue-87
followups:
  - query: yes, go ahead with that split
    history:
      - "user: here are five bugs, place them on the hosts"
      - "assistant: Proposed: three on the first host (Claude Code), two on the Codex host. Send them?"
  - query: fine, use the other host for it then
    history:
      - "user: the dependency audit needs a home, pick a quiet machine for it"
      - "assistant: The quietest host has no assistant in this repository; the second host has one and 30% CPU."
  - query: swap the docs ticket onto the codex machine and then send them all
    history:
      - "user: spread these four issues over my remote machines"
      - "assistant: Placement table ready: docs ticket on host A, the rest split between B and C."
  - query: actually there are three more issues, place those as well
    history:
      - "user: I've got four tickets for the remote machines, share them out"
      - "assistant: Sent four issues to three hosts; replies pending."

topic_shifts:
  - query: ok, put these five issues on the hosts based on that
    history:
      - "user: check usage on all my hosts"
      - "assistant: The first host has 31% of its Claude week left, the second 100%."
  - query: now hand out these six tickets to whichever of them is least loaded
    history:
      - "user: get assistants ready on all the hosts in this repo"
      - "assistant: All four hosts have an assistant ready, with their generations."
  - query: then give the quiet one the auth refactor and spread the rest by load
    history:
      - "user: how are my remote machines doing"
      - "assistant: One host is at 85% CPU with serious thermal state, another is nearly idle."
  - query: put the issues that haven't started onto the remote hosts instead, whichever have room
    history:
      - "user: start agents here on these eight issues"
      - "assistant: Five are running; this machine is under memory pressure, three are not started."
