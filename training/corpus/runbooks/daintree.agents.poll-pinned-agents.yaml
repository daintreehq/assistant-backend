# Training examples whose answer is `daintree.agents.poll-pinned-agents` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.agents.poll-pinned-agents
run: pre-split
positives:
  - poll them
  - poll the pinned agents on this
  - second opinion from the fleet please
  - ask all my pinned agents whether we should switch the package manager to pnpm and tell me what they reckon
  - i want a consensus read from every configured agent on whether this schema change is safe to ship before i merge it
  - ask each of the configured agents which of these three designs is best, shuffle the order so nobody gets biased by position, then tally it up for me
  - what do the pinned agents think about dropping the retry wrapper?
  - which of these two approaches would the agents pick? ask them all
  - can you see my pinned agents?
  - how many pinned agents do i have and what are they called
  - get a vote from the fleet on A vs B
  - 'run a straw poll across the configured roster: ship it or hold?'
  - fan the question out to the whole pinned fleet and synthesize the majority verdict
  - poll evryone pinned and tell me the concensus
  - ask all pinned agnets independantly what they'd name this package
  - get indpendent verdicts frm the fleet on this diff, no debate, just each ones own take
  - run that past all the pinned ones too
  - ask them the same thing and see if they agree
  - put that question to the whole fleet instead
  - get independent opinions from claude, codex and gemini on this migration plan
  - spin up one terminal per pinned agent, ask them all the same question about the auth flow, bring back the majority view
  - ask the pinned agents to vote between option A and option B and count the votes
  - poll the fleet again but write the prompt neutrally this time, that last one was leading them
  - get short answers from all the pinned agents on what the biggest risk in this refactor is
  - have my agents rank these three ideas and tell me where they actually agree
  - quick vote across the fleet on whether the selector should stay non-thinking
  - poll the pinned agents — redis or postgres for the job queue? want a consensus
  - ask all my pinned agents whether we should call it `dispatch` or `submit`, then tell me what most of them said
  - ive been going round in circles on this. just ask everyone and tell me what wins
  - there are three schema options in docs/schema.md. put them to the fleet as A/B/C and tally the votes
  - poll teh configured agnets on wether we shoud drop py3.11 suport
  - can you actually see my pinned agents?
  - ask claude, codex and gemini separately what they'd do about the retry backoff and give me the consensus
  - poll the fleet on this
  - ok but i want other eyes on it — ask the pinned ones the same question and see if they agree with you
  - no dont dig through the code yourself, i asked you to ask the agents
  - that poll prompt was leading, you basically told them which one you liked. redo it neutral with fresh terminals
  - you put my favourite first for every one of them. shuffle the order per agent and run it again
  - quick — deploy is in 10 min. ask all the pinned agents if this migration is safe to run and give me the count
  - everyone gets the same stack trace, ask them independently what they think is causing it, then summarise where they agree
  - don't reuse the terminals that are already open, spawn a clean one per agent and ask them all the same thing
  - poll the pinned agents including that gemini-pro one i think i configured
  - so i've got two ways to do the cache invalidation and honestly both look fine to me. i'd rather not decide alone. can you put both to my pinned agents, no hints about which one i wrote, and tell me which way it lands
  - ask them all and i specifically want to know who disagreed and why
  - 'use every configured agent not just the pinned ones — same question to each: is this API shape stable enough to publish'
  - get recommendations from all the pinned agents on how to structure the workers dir and tell me the common thread
  - run that past all of them
  - how many of them ended up picking B? give me the split by agent
  - Could you please ask each of my pinned agents, independently, whether this error handling approach is sound, and summarise the consensus for me?
  - give all four agents the same two options and have them vote, then count it up
  - show the diff to all the pinned agents and ask each one, ship it or don't. i want the split
  - one terminal per pinned agent, same question to each, nobody talks to anybody — what should we name the module
  - two of the poll agents are still spinning, just go with the ones that answered and give me the tally
  - i don't want your opinion on the auth flow, i want the fleet's. ask them
