# Training examples whose answer is `daintree.review.audit-codebase` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.review.audit-codebase
run: 2026-09-28-catalog-expansion
positives:
  - 'Security audit of src/auth: authz on every route, injection, secrets in config. Findings only, don''t fix anything.'
  - threat model the webhook ingestion service
  - 'Accessibility audit of the settings screens under app/settings: labels, focus order, contrast, keyboard traps.'
  - find dead code in packages/legacy-billing
  - Check our Python deps for known vulnerabilities and anything not compatible with Apache-2.0. No upgrades.
  - Have codex and claude audit the payment path, one with a security lens and one with a performance lens.
  - Look for N+1 queries and unbounded payloads in the orders API as it stands on main.
  - audit the upload handler for path traversal and ssrf
  - Could anything in services/gateway leak secrets? Audit it as it is today, not a PR.
  - license check on the npm deps - we ship Apache-2.0, flag anything GPL-ish
  - 'Dead-code sweep of the old admin panel: which exports have no callers, dynamic imports and templates included?'
  - cargo audit the rust workspace and tell me which advisories are actually reachable, read-only
  - Put a read-only security reviewer on the GraphQL resolvers; I want severity and file:line per finding.
  - a11y pass on the checkout flow components, report only
  - 'How exposed is our session handling? Want a proper threat model: assets, entry points, trust boundaries, abuse paths.'
  - audit the api package pls
  - 'Performance audit of the report generator: blocking I/O on hot paths, missing indexes, loops over every row.'
  - pip-audit lists 40 advisories. Which ones hit code we actually run? Don't bump anything yet.
  - Check the existing crypto usage in lib/tokens for misuse - current code, not a change under review.
  - Before we open-source the repo, check it for committed secrets and dependencies with incompatible licences.
  - audit src/legacy for stuff nobody calls anymore so we can plan a cleanup - don't delete anything
  - Security and accessibility audit of the onboarding module in the develop worktree, a separate agent per lens.
  - Our SOC2 assessor wants a security review of the admin API as it is at HEAD, with exploit scenarios for each finding.
  - Scan the Go services for SQL and shell injection and confirm every hit in the source.
  - osv-scanner the monorepo and tell me which vulns matter
  - Check the React components for ARIA misuse and keyboard traps; findings only, nothing fixed and nothing filed.
