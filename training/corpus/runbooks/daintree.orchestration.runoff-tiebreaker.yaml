  - theres a tie, do a runof round pls
  - brake the tie with anotehr vote between the top two
  - tie brekaer between agnet 1 and agent 3
  - runoff on the original submissions, don't ask them for new ones — just have everyone revote between those two entries
  - nobody won, two-way tie. same agents, one more round.
  - still tied after that runoff, go again
  - three-way tie at the top, run the runoff across all three
  - have the tied agents submit one more each and let the original voters pick the winner
  - settle the tie
  - we need a winner — another vote round with just the top two, and dont spawn anything new
  - is there a way to break this tie without starting the whole contest over?
  - second one tied too — run it off same as before
  - the vote deadlocked at 2-2. rerun the ballot with just those two entries and tally it properly this time
  - 3-3. run it again with just those two
  - we got a tie betwen the claude one and the codex one, do a runof
  - runoff
  - ok so the vote came back 2 for entry A and 2 for entry B and I really don't want to be the one picking, can you get those two to write something new and then have all the same voters go again
  - term_9f2c and term_a41b both landed on 4 points — new submissions from each, same voters, tally it
  - those two tied, break it
  - your count was off, it's actually even. redo the vote properly this time
  - this is the second time it's come out level. just sort it out.
  - if the scores come out level when they're done, run a second round between whoever's on top and I'll take that as final
  - wasn't it gemini and the sonnet one that ended up equal? tiebreak between them please
  - nobody won, score the top two again with fresh entries
  - poll everyone again but only on the two that came out tied
  - we can't eliminate anyone, they're level — do another round on those two and vote again
  - the judge couldn't split them. get new answers from the top 2 and let the rest of them vote on it
  - the two that tied should each have another go and then the group picks a winner
  - tied again. this time spawn one fresh agent as the deciding vote and rerun the tiebreak
  - don't make them write anything new, just re-vote on the same two entries
  - still 2-2. go again.
  - not sure how you'd even do this but they're deadlocked, can you get an actual winner out of them
  - run the tiebreak but this time don't tell them who wrote which entry
  - do the runoff on the tied pair and then give me combined totals with the earlier points folded in
  - either break this tie or just tell me it's a draw, don't make something up
  - demo in like 5 min and the vote's stuck even, run the quick runoff now
  - same tiebreak as last time but nobody gets to vote for their own entry
  - three of them are on 3 points each. new entries from all three and everyone votes
  - yep, runoff between those two then
  - hang on, that wasn't a win, they were joint first. run the extra round
