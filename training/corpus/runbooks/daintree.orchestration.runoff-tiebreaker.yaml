# Training examples whose answer is `daintree.orchestration.runoff-tiebreaker` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.orchestration.runoff-tiebreaker
run: pre-split
positives:
  - break the tie
  - run a runoff between the two that tied
  - tiebreaker round with the same agents
  - those two are level, do a tie-breaker with the same crew
  - do that again but only with the two that tied
  - yeah go again between those two
  - ok so agent 2 and agent 4 both finished on three points so we dont actually have a winner. can you get one more fresh short answer out of each of them and then have the whole group vote again between just those two and tell me who takes it
