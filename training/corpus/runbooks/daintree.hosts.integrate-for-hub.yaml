# daintree.hosts.integrate-for-hub: a lane building the hub's integration branch. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub and chosen as its integrator, merges
# the exact commits the hub pinned from other hosts' and units' branches, in the hub's order,
# into one new branch here through a visible integrator agent, and answers with the result.
#
# Rows: hub-framed integration requests written by a lane and in people's own words, with the
# situations the procedure handles (a source branch that moved past its pin, a pinned commit
# gone from the remote, a conflict the brief does not settle, an acceptance clash after a clean
# merge, short hashes, a foreign remote, uncommitted work on another host, push or PR authority,
# an integration resumed after a restart or the hub's answer); followups inside the
# integration; docs questions; and boundaries against the envelope
# (daintree.hosts.handle-hub-message), one new unit (daintree.hosts.do-delegated-work), a test
# run (daintree.hosts.verify-for-hub), the person's own local integration
# (daintree.git.integrate-agent-branches), settling a clash locally
# (daintree.git.resolve-semantic-conflict) and copying single commits
# (daintree.git.cherry-pick-changes) and the hub's own side (daintree.hosts.delegate-to-host),
# each with reverse rows in that neighbour's file.
runbook: daintree.hosts.integrate-for-hub
