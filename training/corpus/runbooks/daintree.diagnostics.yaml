  - fleet stuff aside — my key. is my openrouter key actually working, or am i about to burn a turn for nothing?
  - query: why can't i use any of the tools right now?
    history:
      - 'user: mcp: connection refused (https://daintree.org/api/mcp)

        Please restart your terminal and try again.'
  - am I signed in properly, and will this burn credit if I'm not?
  - query: the watcher fired but nothing looks any different - is the watcher itself broken?
    history:
      - 'user: watch tab 5 and wake me if it stalls'
      - 'assistant: Stall watcher armed on tab 5.'
    active: [daintree.orchestration.watch-outcome, daintree.foundation]
  - query: nothing's responding in daintree at all now, no tools are showing up
    history:
      - 'user: merge 555'
      - 'assistant: Merged with a squash and confirmed on re-read.'
    active: [daintree.forge.land-pull-request, daintree.foundation]
  - query: the daintree link seems down, half the tools have vanished from this turn
    history:
      - 'user: reconcile the graph'
      - 'assistant: workflow.reconcile isn''t in the offered tools this turn.'
    active: [daintree.orchestration.execute-durable-workflow, daintree.foundation]
  - query: nothing is responding in daintree, no tools at all this turn
    history:
      - 'user: check the resource status'
      - 'assistant: The call didn''t come back — the MCP link looks down.'
    active: [daintree.worktree.manage-resource]
  - query: i'm writing this up as an issue. give me the connection details, tool count and the exact error text to paste in. obviously no key
    history:
      - 'user: sup'
      - 'assistant: Not much — nothing running. What do you need?'
  - query: why can't I get any of the git tools to fire
    history:
      - 'user: How are you?'
      - 'assistant: Good — thanks. Everything''s quiet here: worktree develop is stable, and one terminal is open. How can I help?'
  - query: context snapshot showed four worktrees an hour ago and now it shows none. i didn't delete anything
    history:
      - 'user: sup'
      - 'assistant: Not much — nothing running. What do you need?'
  - query: is my key working
    history:
      - 'user: yo'
      - 'assistant: Yo. What are we doing?'
  - query: nothing's responding
    history:
      - 'user: good morning'
      - 'assistant: Good morning. Everything''s idle. Where do we start?'
  - query: will this burn credit if im not signed in
    history:
      - 'user: yo'
      - 'assistant: Yo. What are we doing?'
  - query: before i kick off the overnight batch — is my key actually live? i don't want six agents burning against a dead key
    history:
      - 'user: hello'
      - 'assistant: Hello. Everything''s idle — what would you like to do?'
  - query: you renamed the tabs last turn and the titles are still the old ones. it didn't take. sort it out
    history:
      - 'user: you there?'
      - 'assistant: Here. What do you need?'
wakes:
  - query: '[watcher fired: MCP link back up]'
    history:
      - 'user: nothing is responding, whats wrong'
      - 'assistant: The MCP link is down. Told you the one step to fix it and armed a watch so I can confirm the moment it reconnects.'
    active: [daintree.diagnostics, daintree.foundation]
  - query: '[async wait returned: auth probe finished — 401]'
    history:
      - 'user: is my key actually working'
      - 'assistant: Running a minimal signed check so I can tell you for certain rather than guess. Waiting on it.'
    active: [daintree.diagnostics, daintree.foundation]
near_misses:
  - nothing is responding, is the mcp link dead?
  - why is nothing responding
docs:
  - query: "i shared a terminal out to the fleet and nobody on the other end sees it"
    run: 2026-09-22-docs-live-state
    docs: true
  - query: "shared a terminal with the other machines and nothing turned up over there"
    run: 2026-09-22-docs-live-state
    docs: true
  - query: "i pinned an agent and it never showed up in the queue on the other box"
    run: 2026-09-22-docs-live-state
    docs: true
  - query: "broadcast a terminal to the fleet, the other side is still empty"
