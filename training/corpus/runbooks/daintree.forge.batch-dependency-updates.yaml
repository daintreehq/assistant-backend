  - which of the bot PRs are safe to take?
  - Clear out the dependency-update PRs piling up on the api repo, about 20 from Renovate.
  - Combine the open Dependabot npm bumps into one PR and close the originals only after it merges.
  - 'Sort the Renovate PRs by risk: patch, minor, 0.x, major, security; CI state on each head; a disposition per PR. Read-only for now.'
  - dependabot opened like 9 PRs overnight, merge the green ones one at a time
  - Land the safe Renovate bumps on develop; anything that's a major or has red CI stays open with a note saying why.
  - Go through the bot PRs bumping our GitHub Actions versions and merge the ones with passing required checks.
  - 'Weekly dependabot pile for the python service (uv lock bumps for httpx, pydantic-core, ruff): batch them into one branch, don''t push yet.'
  - Several dependabot PRs now conflict on package-lock.json; have an agent merge them into one batch branch, regenerating the lockfile with npm rather than by hand.
  - renovate has 6 PRs open and 2 are failing, sort out which bumps are fine and which ones break the build
  - Look over the open dependabot PRs and tell me which are safe to merge and which need a proper upgrade.
  - Bundle the green Dependabot bumps into one PR. For the eslint 9 major just report the breaking changes it lists; don't attempt that upgrade.
  - Batch this week's Renovate minor updates for the monorepo, skipping anything that touches react or next.
  - 'Once the combined deps PR #812 has merged, close the Dependabot PRs it superseded.'
  - 'Get the dependency bot PRs off the PR list: take what''s safe, report what isn''t.'
  - gather open app/dependabot PRs on org/cli, rank by risk with security fixes first, propose a strategy and wait for my ok
  - merge all the green dependabot bumps
  - 'Renovate lockfile-maintenance and patch PRs: one batch branch in a new worktree, tests re-run on the final commit.'
  - Update our deps through the open Dependabot PRs rather than bumping anything by hand; take whatever is green.
  - there are 11 open bot PRs for cargo crates, clear them out, one combined PR is fine
  - Which of the open dependabot bumps are 0.x minors or majors that need a real look before merging?
  - 'Dependabot opened 4 security-fix PRs alongside the usual bumps: prioritise those, land them once green, then batch the rest.'
  - All the dependabot PRs went stale after the refactor merged; get the bot to rebase them and land them in turn.
