# Training examples whose answer is `daintree.review.audit-spec-coverage` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.review.audit-spec-coverage
run: 2026-09-28-round6
positives:
  - 'Audit docs/specs/billing-v2.md against main requirement by requirement: implemented, partial, missing or unverified, with file:line and test evidence.'
  - 'which acceptance criteria on #412 are actually done in the code right now?'
  - how much of the onboarding PRD is really built? be honest, i think a lot is stubbed
  - 'Grade RFC-0007 (streaming exports) coverage on feat/exports: status per requirement, citing tests that assert each.'
  - What's left of the search-v3 spec to implement? Read-only, change nothing.
  - Is every requirement in docs/rfc/rate-limits.md covered by a test that actually asserts it?
  - The PM says the notifications PRD is 90% shipped. Check that number requirement by requirement against the code.
  - spec coverage audit, SPEC.md sections 4-7, worktree api-main, read-only auditors, evidence per item
  - Before we set scope for 3.1, map which parts of the offline-sync design doc exist in the mobile app and which don't.
  - 'Compare issue #1187''s acceptance checklist with the current code on develop — which boxes are genuinely satisfied?'
  - Not one agent's work — several people built pieces of the auth PRD over a month. Which of its requirements are implemented and tested?
  - Map each requirement in docs/api-contract.md to its handler and test; flag the ones missing or only partly there.
  - 'gap analysis for the audit-log feature spec (docs/audit-log-spec.md): per requirement, does the code do it, with proof'
  - Don't break anything down yet — just tell me which of the 30 requirements in checkout-prd.md the code already meets.
  - 'coverage check of the i18n spec vs the web app: implemented/partial/missing, and what was searched for the missing ones'
  - Walk the plugin-loader design doc and report per requirement whether the code delivers it. No fixes.
  - Use read-only auditor agents to check sections 2 and 3 of the payments spec against the code, one auditor per section.
  - 'Epic #900''s child issues are all closed. Are its acceptance criteria actually met on main, or were the issues just closed?'
  - is the webhook retry spec actually implemented? docs/webhooks.md lists 9 behaviours, i want each one checked
  - Determine the implementation status of every MUST in spec/protocol.md within the proto-impl worktree; cite code and asserting tests.
  - How far along is the CSV import feature against its PRD? Numbered list with status and evidence for each.
  - Which of the accessibility requirements listed in the redesign spec's section 5 does the new UI actually satisfy?
  - 'Trace every requirement in the body of issue #512 (billing portal) to code and tests in the billing worktree.'
  - the client SOW lists 14 features in docs/sow-features.md — tell me which are really in the product and which are half done
  - Check the multi-tenant spec against the code instead of explaining how tenancy works — I need a status per requirement.
  - 'PR #640 said ''implements #640 spec'' and merged, but I doubt every criterion in the spec is covered. Grade the criteria against main.'
boundaries:
  - query: Check docs/billing-spec.md against the code requirement by requirement and say what's implemented and what's missing; change nothing.
    confusable_with: [daintree.edits.sync-project-docs]
  - query: don't explain the auth flow — tell me which of the auth spec's requirements the code actually satisfies
    confusable_with: [daintree.explore.repository]
  - query: Where is each requirement from docs/sso.md implemented, and which ones aren't there at all?
    confusable_with: [daintree.explore.repository]
  - query: find the code for every numbered requirement in the export RFC and say which have asserting tests
    confusable_with: [daintree.explore.repository]
  - query: 'Before any planning: how much of the payments PRD is already built?'
    confusable_with: [daintree.orchestration.decompose-work]
  - query: which pieces of the epic's spec are missing from the code today? just the status, no breakdown, no tickets
    confusable_with: [daintree.orchestration.decompose-work]
  - query: Tell me what of the migration design doc already exists, requirement by requirement.
    confusable_with: [daintree.orchestration.decompose-work]
  - query: No single agent to check here — grade the whole onboarding PRD against develop requirement by requirement.
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: Did we build everything in docs/billing.md? Status per requirement with code and test evidence.
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: forget checking any agent's report; across the entire spec, what's implemented, partial or missing?
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: How much of the payments RFC in docs/payments.md is actually built, requirement by requirement?
    confusable_with: [daintree.release.assess-readiness]
  - query: Audit the code against the requirements in docs/compliance-export.md — status per requirement, not a security review.
    confusable_with: [daintree.review.audit-codebase]
  - query: which requirements in the performance section of our spec does the code meet? per requirement with evidence
    confusable_with: [daintree.review.audit-codebase]
  - query: Grade how much of the SSO PRD is implemented rather than hunting for bugs in it.
    confusable_with: [daintree.review.audit-codebase]
  - query: rather than reviewing a diff, check the feature on main against every requirement in the PRD
    confusable_with: [daintree.review.review-change]
  - query: is everything in the RFC implemented and covered by tests? not a code review, a requirement-by-requirement status
    confusable_with: [daintree.review.review-change]
  - query: 'Don''t judge PR #640''s code quality; tell me which acceptance criteria of #640 exist in the code at all.'
    confusable_with: [daintree.review.review-change]
  - query: 'not the PR status — which of #412''s acceptance criteria does the code satisfy?'
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: 'Issue #733 lists six acceptance criteria; which does main actually meet?'
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: '#1022 got closed but were its acceptance criteria really delivered? check the code, not the thread'
    confusable_with: [daintree.workflow.follow-up-on-issue]
  - query: Compare every acceptance requirement in docs/tenant-prd.md with main and report implemented, partial, missing or unverified evidence.
    confusable_with:
      - daintree.explore.repository
      - daintree.edits.spawn-visible-agent
      - daintree.orchestration.verify-agent-work
    run: 2026-10-16-synthetic-audit
followups:
