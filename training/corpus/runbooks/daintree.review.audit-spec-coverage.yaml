    history:
      - 'user: how much of docs/billing.md is actually built?'
      - 'assistant: Snapshot main@4f2c1e9, spec hash 7d01ac2. The extractor numbered R1-R18 (listed above). Auditors launched: codex-1 has R1-R9, claude-2 has R10-R18; I''ll check their evidence when they report.'
    active: [daintree.review.audit-spec-coverage]
    run: 2026-09-28-round6-stateful
  - query: codex-1 says R3 is implemented. did you actually run the test it cited or just take its word?
    history:
      - 'user: how much of docs/billing.md is actually built?'
      - 'assistant: Snapshot main@4f2c1e9, spec hash 7d01ac2. The extractor numbered R1-R18 (listed above). Auditors launched: codex-1 has R1-R9, claude-2 has R10-R18; I''ll check their evidence when they report.'
      - 'assistant: codex-1 is back: R1-R6 implemented, R7 partial, R8 missing, R9 unverified. Still waiting on claude-2.'
    active: [daintree.review.audit-spec-coverage]
    run: 2026-09-28-round6-stateful
  - query: 'also fold in the acceptance criteria on issue #412, they''re part of the same spec'
    history:
      - 'user: how much of docs/billing.md is actually built?'
      - 'assistant: Snapshot main@4f2c1e9, spec hash 7d01ac2. The extractor numbered R1-R18 (listed above). Auditors launched: codex-1 has R1-R9, claude-2 has R10-R18; I''ll check their evidence when they report.'
    active: [daintree.review.audit-spec-coverage]
    run: 2026-09-28-round6-stateful
  - query: count my uncommitted webhook handler too, I haven't committed it yet
    history:
      - 'user: how much of docs/billing.md is actually built?'
      - 'assistant: Snapshot main@4f2c1e9, spec hash 7d01ac2. The extractor numbered R1-R18 (listed above). Auditors launched: codex-1 has R1-R9, claude-2 has R10-R18; I''ll check their evidence when they report.'
    active: [daintree.review.audit-spec-coverage]
    run: 2026-09-28-round6-stateful
  - query: 'on R12: ''refund'' in the spec means partial refunds as well, not just full ones'
    history:
      - 'user: how much of docs/billing.md is actually built?'
      - 'assistant: Snapshot main@4f2c1e9, spec hash 7d01ac2. The extractor numbered R1-R18 (listed above). Auditors launched: codex-1 has R1-R9, claude-2 has R10-R18; I''ll check their evidence when they report.'
      - 'assistant: codex-1 is back: R1-R6 implemented, R7 partial, R8 missing, R9 unverified. Still waiting on claude-2.'
    active: [daintree.review.audit-spec-coverage]
    run: 2026-09-28-round6-stateful
  - query: Both auditors have replied on the RFC-0042 coverage audit; downgrade anything whose test does not assert the requirement and give the per-status counts.
    history:
      - 'user: check RFC-0042 against the code requirement by requirement'
      - 'assistant: Numbered R1-R22 from docs/rfc/0042-sync.md at main@b81e0f3. Auditors claude-4 (R1-R11) and codex-5 (R12-R22) launched read-only.'
    active: [daintree.review.audit-spec-coverage]
    run: 2026-09-28-round6-stateful
topic_shifts:
  - query: wait, before we build anything — half of this might already exist. check it requirement by requirement against the code
    history:
      - 'user: split docs/search-v2.md into parallel work units'
      - 'assistant: Proposed 5 units (index schema, query parser, ranking, API, UI) with file ownership; waiting for your go before launching.'
    active: [daintree.orchestration.decompose-work]
    run: 2026-09-28-round6-stateful
  - query: 'forget CI — which of #412''s acceptance criteria are actually done in the code?'
    history:
      - 'user: what''s happening with #412?'
      - 'assistant: PR #430 links #412; CI is red on the lint job, one review requesting changes.'
    active: [daintree.workflow.follow-up-on-issue]
    run: 2026-09-28-round6-stateful
  - query: ok, and how much of docs/prd/notifications.md is actually built?
    history:
      - 'user: how does the notifications module work?'
      - 'assistant: Explorer claude-3 traced it: events go through src/notify/dispatcher.ts to email and push adapters; digests run from a cron job.'
    active: [daintree.explore.repository]
    run: 2026-09-28-round6-stateful
  - query: 'fine, that task checks out. bigger question: of the whole export RFC, what''s implemented and what''s still missing, with test evidence?'
    history:
      - 'user: claude-4 says it finished the CSV export task, check it'
      - 'assistant: Verified: the diff matches the task, the 3 new tests pass when I run them.'
    active: [daintree.orchestration.verify-agent-work]
    run: 2026-09-28-round6-stateful
  - query: 'separate thing: audit docs/api-v3.md against main, requirement by requirement'
    history:
      - 'user: review PR #501'
      - 'assistant: Reviewer codex-1 returned 3 findings on PR #501; two confirmed, one was a false positive.'
    active: [daintree.review.review-change]
    run: 2026-09-28-round6-stateful
  - query: for the update I also need how much of the onboarding spec is covered — each requirement, implemented or not
    history:
      - 'user: summarize this week''s activity for standup'
      - 'assistant: 23 commits across 4 branches; onboarding flow landed on main, billing work still on feat/billing.'
    active: [daintree.git.summarize-activity]
    run: 2026-09-28-round6-stateful
