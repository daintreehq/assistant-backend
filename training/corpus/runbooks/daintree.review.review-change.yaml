# Training examples whose answer is `daintree.review.review-change` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.review.review-change
run: pre-split
positives:
  - review this
  - code review the branch before i merge it
  - can you get a couple of agents to go through the diff on this branch properly and tell me what's actually wrong with it, i don't want style nitpicks
  - is PR 412 any good?
  - check this for sql injection
  - what would you change about this diff
  - look over what the agent just wrote
  - revew the uncommited changes pls
  - run a security review over the auth changes in this worktree
  - i want two independent reviewers on this, one on correctness against the ticket and one on error handling, then dedupe what they find
  - do the same review on the other two branches
  - give me severity ranked findings with file:line evidence for the current diff
  - is there anything dodgy in what claude did in tab 3?
  - critique this PR
  - any edge cases missed in this change?
  - have someone check the perf implications of this diff
  - 'pls review #88 and focus on api compatibility, we have external consumers on that endpoint'
  - second opinion on this branch
  - i pushed a load of stuff over the weekend and honestly have no idea if any of it is sane, can you get someone to read through it properly and tell me what's broken
  - code reveiw pls
  - spawn a reviewer on the staged changes and tell me what it finds
  - how bad is this diff
  - look at the tests in this change, are they actually testing anything or just asserting true
  - review that one too
  - audit the changes in this worktree for security holes
  - claude churned through the storage refactor overnight. i want proper eyes on it before it goes anywhere near main
  - the new upload endpoint takes a filename straight off the request. go through that change and find me anything exploitable
  - put two reviewers on the diff, one on error handling and one on the tests
  - ok now judge it
  - go through feat/rate-limiter and tell me what's wrong with it
  - can you do a proper pass over PR 412 please, i've only skimmed it myself
  - revew teh diff pls, anythign dodgy in there
  - that last pass was useless, it just listed style nits. do it again properly with independent agents and give me actual severities
  - i've got a pile of uncommitted changes sitting in the worktree, worth someone going over them before i commit?
  - this touches the render loop. i mostly care whether it's going to be slow — go over it with that in mind
  - does anything in this branch break callers of the public client? need someone to actually check rather than guess
  - review
  - so the migration script got rewritten by the agent and i honestly can't tell if it's safe. we run this against prod data once and there is no undo. can you get someone independent to go through it and flag anything that could lose rows
  - have a look over pr 88 — or 89? whichever one is the websocket one — and tell me if it's solid
  - the implementer pushed fixes for those two findings. get a different agent to check the fixes, not the one that raised them
  - the tests it added all pass but they look like they assert nothing. i want a judgement on whether that test file is worth anything
  - tear this diff apart
  - the three worktrees each have a diff now. i want each of them reviewed properly, not compared — just tell me what's wrong in each
  - checks are all green on this but green doesn't mean good. someone go through it properly
  - explain to me everything that's wrong with what landed in this branch
  - before this goes up as a PR i want to know what a reviewer is going to shout about
  - spin up a couple of read only agents on the diff and bring me back what they find, deduped
  - it says the auth rewrite is done. i don't care that it's done, i care whether the code is any good — go look
  - external contributor opened a pr on the parser. i don't know them at all. worth a careful read?
  - do the second one now, same criteria
  - just the changes in src/auth/session.py — anything unsafe in there?
  - when you get a moment could you organise a proper review of the branch? severity ranked would be ideal
  - he's introduced a global mutex in this change. get an independent read on whether that's a mistake
