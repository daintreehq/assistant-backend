# daintree.hosts.diagnose-messaging: this Shell's hub finding which gate stops messages or
# starts reaching the assistant on a Remote Host it can see (tool set, the per-host
# switches, the link, a pause, a missing or stale enrollment, a rate limit), and naming
# the person's fix, sending nothing.
# Boundaries hold it against the hosts foundation (how messaging works, first-time setup;
# the refusal-diagnosis rows it held before this runbook existed were moved here),
# adding or reconnecting a host, the lane handling a hub message, Daintree's own health
# here, the account of exchanges that never came back, readying a swarm, asking a host a
# question, usage checks and delegating work.
runbook: daintree.hosts.diagnose-messaging
run: runbook-2026-10-issue-103

positives:
  - Identify which gate makes host.sendMessage to the studio return paused when this Shell's own messaging is not paused
  - Find the gate behind lane_unavailable from host.sendMessage after the remote assistant was relaunched this morning
  - Determine why host.startAssistant on the render host returns unsupported and what has to be updated there
  - Figure out why every lane on every remote host lists available false at the same moment
  - Find out why host.sendMessage is missing from this session's tools while host.list works
  - Report which messaging gate blocks the hub from the assistant on the second Mac; the host is connected and the project is listed, but no assistant there carries a generation
  - Messages to one host began coming back opted_out right after the person edited that host's SSH target; explain why and what has to be switched on again
  - query: host.sendMessage keeps returning rate_limited with a retryAfterMs while the hub messages five hosts in a row; explain the limits and when sends can go again
    docs: true
  - Diagnose why a remote assistant has a generation but available false while this Shell is not paused
  - query: >-
      Hub session on Full. host.list shows the Linux build host connected and
      host.listAssistants lists the api project with one Codex assistant, generation set,
      available false. The person says nobody paused anything on this machine. Work out
      which gate it is and what they should check on that host, without sending or
      starting anything.
  - query: >-
      A send to the studio host just came back lane_unavailable, although
      host.listAssistants showed its Codex assistant with a generation a minute ago.
      Nothing has restarted on either machine. Find out which gate it is and who has to
      act.
  - every send to the linux box says lane_unavailable, what's wrong
  - the hub says my old laptop doesn't support assistant messaging
  - it says unsupported when I try to message the imac host
  - why does it say policy_rejected when I message the studio
  - i changed my server's ssh address and now messaging it says opted out
  - my tower shows connected but listing its assistants says nothing is enrolled for me
  - why does every new message to the linux host bounce before it's even sent
  - the hub can see my laptop but says it can't message anything there, check what's off
  - figure out why the mac studio won't take messages, don't resend anything
  - the hub's sends started failing with a tier error
  - is it a pause or a setting? the other machine stopped taking messages
  - are my messages to the server being throttled?
  - every message to every host fails since this morning
  - morning! the build box is up but the hub can't get through to its assistant, can you see why?
  - sorry to bug you again, the laptop host keeps refusing messages from here, which gate is it this time
  - sends to the build box come back conflict; is that a messaging gate or something about that one message?
  - the old intel mac host answers unsupported to every send while my other hosts work fine; what's different about it?
  - pause is off on this machine but the build box's assistant still reads available false; is it paused over there or just stopped?
  - the hub can't message the laptop's assistant, and the laptop's own window says another machine turned messages on for it; what does that mean for my hub?
  - query: >-
      Ten sends went to the render host in under a minute and the eleventh came back
      rate_limited. The person wants to know how long to wait, whether the hub's reads are
      limited too, and whether anything is wrong with the host itself.
    docs: true
  - query: >-
      I pointed the mini's host entry at its new tailnet name this morning, nothing else.
      Since then the hub can't reach the assistant there, although the mini shows up as
      connected. Which setting did that change undo, and where do I put it back?
  - Find out why sends to the linux tower come back policy_rejected after its person enrolled the assistant from a different Shell this morning
  - query: see what's in the way
    history:
      - "user: ask the tower to rerun the flaky test"
      - "assistant: The send came back policy_rejected; nothing was sent."
  - query: >-
      I've got the Mac mini showing as connected in Remote Hosts and I can open its
      projects from here, but whenever the assistant here tries to message the one over
      there it fails. I haven't changed anything on either machine. Can you check what's
      actually blocking it and tell me what to flip, without sending it anything?
  - query: >-
      Yesterday I moved the Linux tower to a new address and updated it in the hosts
      settings. Since then the hub can't message it at all. Messaging was definitely on
      before. What happened, and what do I need to do?
  - query: >-
      The hub tried to start an assistant on my old iMac host and got unsupported. I think
      it is still on an older Daintree. Is that the reason, and is there anything else to
      check before I update it?
  - query: why not?
    history:
      - "user: send the build box the lint fix"
      - "assistant: The send came back lane_unavailable; nothing was sent."
  - query: so what is stopping it then
    history:
      - "user: ask the studio what it thinks of the PR"
      - "assistant: The studio's assistant is listed with no generation for this Shell, so I couldn't message it."
  - query: check why, and don't try it again yet
    history:
      - "user: send the docs task to the mini"
      - "assistant: The send came back paused; nothing was sent."

boundaries:
  - query: the hub can list the laptop but none of its assistants has a generation, find out which switch is missing on which machine
    confusable_with: [daintree.hosts.foundation]
  - query: messages to my linux host stopped going through this afternoon, check what changed
    confusable_with: [daintree.hosts.foundation]
  - query: tell me whether it's this Shell's pause or the host's that is holding my messages to the mini
    confusable_with: [daintree.hosts.foundation]
  - query: the build box keeps answering lane_unavailable to the hub, what do I change on my side
    confusable_with: [daintree.hosts.foundation, daintree.hosts.handle-hub-message]
  - query: from my main machine, why does every message to the studio get policy_rejected
    confusable_with: [daintree.hosts.foundation, daintree.hosts.handle-hub-message]
  - query: the hub's send to the mini is refused with lane_unavailable every time, even right after listing it; which gate is it
    confusable_with: [daintree.hosts.foundation, daintree.hosts.handle-hub-message]
  - query: is something wrong with daintree? it shows my linux host but messages to it all fail
    confusable_with: [daintree.hosts.foundation, daintree.diagnostics]
  - query: the hub's host tool says not permitted for the core tier when I message a host
    confusable_with: [daintree.hosts.foundation, daintree.diagnostics]
  - query: a fresh send to the tower was turned away at once; I need the gate behind it, not a rundown of open tasks
    confusable_with: [daintree.hosts.recover-and-clean-up]
  - query: why does the hub's start on the tower keep failing with no window here shows this host
    confusable_with: [daintree.hosts.start-swarm]
  - query: why does every start the hub tries on the render host fail? I only want the reason, not a swarm
    confusable_with: [daintree.hosts.start-swarm]
  - query: I tried to ask the laptop's assistant a question and it came back paused, find out where the pause is
    confusable_with: [daintree.hosts.foundation, daintree.hosts.ask-host-assistant]
  - query: the question for the build box was refused with policy_rejected, so which machine needs a setting changed?
    confusable_with: [daintree.hosts.foundation]
  - query: my usage check to the hosts came back rate_limited on two of them, is that the agents' allowance or the message limit
    confusable_with: [daintree.hosts.check-usage-limits]
  - query: the bug fix I handed to the mini bounced with lane_unavailable, why did it bounce
    confusable_with: [daintree.hosts.delegate-to-host]
  - query: A send to the Linux tower returned disconnected while host.list shows it connecting; separate the link problem from any messaging setting
    confusable_with: [daintree.hosts.connect-host]
  - query: the mini connects fine now and its projects show up here, but the hub still can't message its assistant
    confusable_with: [daintree.hosts.connect-host]
  - query: 'the hub says the other mac''s assistant isn''t enrolled, is something broken'
    confusable_with: [daintree.hosts.foundation, daintree.diagnostics]
    run: runbook-2026-10-issue-103
  - query: 'host.listAssistants shows nothing with a generation for the build box'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'is it a bug that the other machine''s assistant shows unavailable for every project'
    confusable_with: [daintree.hosts.foundation, daintree.diagnostics]
    run: runbook-2026-10-issue-103
  - query: 'sending to the remote host keeps coming back opted out, is daintree broken'
    confusable_with: [daintree.hosts.foundation, daintree.diagnostics]
    run: runbook-2026-10-issue-103
  - query: 'the remote host is up but its assistant won''t accept anything from me'
    confusable_with: [daintree.hosts.foundation, daintree.diagnostics]
    run: runbook-2026-10-issue-103
  - query: 'the hub''s start on my other mac came back opted out, how do I fix that'
    confusable_with: [daintree.hosts.foundation, daintree.hosts.start-swarm]
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'the question I sent the mini came back opted out'
    confusable_with: [daintree.hosts.foundation, daintree.hosts.ask-host-assistant]
    run: runbook-2026-10-issue-103
  - query: 'my question to the linux host came back paused, what does that mean'
    confusable_with: [daintree.hosts.foundation, daintree.hosts.ask-host-assistant]
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'both machines are already set up in daintree, why can''t their assistants talk to each other'
    confusable_with: [daintree.hosts.foundation, daintree.hosts.connect-host]
    run: runbook-2026-10-issue-103
  - query: 'the hub says only the enrolled hub can reach other hosts, what does that mean'
    confusable_with: [daintree.hosts.foundation]
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'the assistant on my other machine isn''t showing up as something I can message'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'my assistant can list the hosts but can''t send them anything, what''s missing'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'why is every assistant on my remote host marked unavailable'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'I''ve got the Mac mini added under Remote Hosts and it shows connected, but when I ask the assistant here to message the one on the mini it says only the enrolled hub can reach other hosts. I haven''t changed any messaging settings yet. What do I turn on, and on which machine?'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'Work out why host.sendMessage is not offered in this sidebar assistant session'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'Explain why a host''s assistant is listed with no generation and cannot be messaged'
    confusable_with: [daintree.hosts.foundation]
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'Resolve a NOT_ELIGIBLE refusal from the host messaging tools'
    confusable_with: [daintree.hosts.foundation, daintree.hosts.handle-hub-message]
    run: runbook-2026-10-issue-103
  - query: 'Interpret an opted_out result from a send to a remote host and say how the person fixes it'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'The user''s Shell lists a second Mac as a connected Remote Host, but host.listAssistants shows its project with no assistant carrying a generation. Starting assistants there is not allowed and the user does not want it allowed. Explain how they enroll the assistant already running there for this Shell.'
    confusable_with: [daintree.hosts.foundation]
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'Hub session at Tool set Full. A host.sendMessage to one remote host came back opted_out with no taskId, and the user insists messaging with that host was on yesterday. Work out which setting governs this and what the user should check, without sending again.'
    confusable_with: [daintree.hosts.foundation]
    run: runbook-2026-10-issue-103
  - query: 'the mini is listed but its assistant shows no generation and every send to it fails; which gate is it? I''m not moving its work yet'
    confusable_with: [daintree.hosts.reassign-host-work]
    run: runbook-2026-10-issue-113
  - query: "one host answers my messages and the other never does, what's different about the second one"
    confusable_with: [daintree.hosts.diagnose-host-differences]
    run: runbook-2026-10-issue-119
  - query: "sends reach the mac host but the linux host's come back lane_unavailable, why"
    confusable_with: [daintree.hosts.diagnose-host-differences]
    run: runbook-2026-10-issue-119
  - query: 'I can see the Linux host in the list but its assistant shows as unavailable, which switch do I flip'
    confusable_with: [daintree.hosts.postmortem-swarm]
    run: runbook-2026-10-issue-121
  - query: 'the second machine says paused every time I try to send it a message, which gate is that'
    confusable_with: [daintree.hosts.postmortem-swarm]
    run: runbook-2026-10-issue-121
  - query: 'my messages to that host''s assistant are refused as not enrolled, work out why and what the person does'
    confusable_with: [daintree.hosts.postmortem-swarm]
    run: runbook-2026-10-issue-121

  - query: "the assistant on my second Mac shows as unavailable and my messages to it bounce; which setting is in the way?"
    confusable_with: [daintree.hosts.survey-hosts]
    run: runbook-2026-10-issue-87
  - query: "my send to the build box came back paused, what do I need to switch on?"
    confusable_with: [daintree.hosts.survey-hosts]
    run: runbook-2026-10-issue-87
  - query: "the tower is listed but its assistant has no generation and nothing reaches it; find out which gate is blocking"
    confusable_with: [daintree.hosts.survey-hosts]
    run: runbook-2026-10-issue-87
followups:
  - query: check the other hosts the same way
    history:
      - "user: why are my messages to the tower paused?"
      - "assistant: Every assistant on the tower reads unavailable; the other hosts are unchecked."
  - query: look into it
    history:
      - "user: send the docs fix to the build box"
      - "assistant: The send came back policy_rejected; nothing was sent."
  - query: 'where do I change that'
    history:
      - 'user: message the assistant on the build machine'
      - 'assistant: Sending to another host needs the Full tool set, and this session is on Core.'
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'which setting is that exactly'
    history:
      - 'user: ask the laptop''s assistant something for me'
      - 'assistant: The send came back opted_out: assistant messaging is turned off for that host in this Shell''s host settings.'
    docs: true
    run: runbook-2026-10-issue-103
  - query: 'how do I give it one'
    history:
      - 'user: who can I message on the mac mini?'
      - 'assistant: There''s an assistant in that project, but none has a generation for this Shell yet.'
    docs: true
    run: runbook-2026-10-issue-103

topic_shifts:
  - query: different thing, the linux host won't take messages at all now, check why
    history:
      - "user: ask the mini how the build went"
      - "assistant: The mini's assistant says the build passed and the branch is pushed."
  - query: forget the question for now, why does the build box say lane_unavailable
    history:
      - "user: ask the build box whether the migration finished"
      - "assistant: The send came back lane_unavailable; nothing was sent."
