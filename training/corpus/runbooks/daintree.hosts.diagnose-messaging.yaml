# daintree.hosts.diagnose-messaging: this Shell's hub finding which gate stops messages or
# starts reaching the assistant on a Remote Host it can see (tool set, the per-host
# switches, the link, a pause, a missing or stale enrollment, a rate limit), and naming
# the person's fix, sending nothing.
# Boundaries hold it against the hosts foundation (how messaging works, first-time setup),
# adding or reconnecting a host, the lane handling a hub message, Daintree's own health
# here, the account of exchanges that never came back, readying a swarm, asking a host a
# question, usage checks and delegating work.
runbook: daintree.hosts.diagnose-messaging
run: runbook-2026-10-issue-103

positives:
  - Identify which gate makes host.sendMessage to the studio return paused when this Shell's own messaging is not paused
  - Find the gate behind lane_unavailable from host.sendMessage after the remote assistant was relaunched this morning
  - Determine why host.startAssistant on the render host returns unsupported and what has to be updated there
  - Figure out why every lane on every remote host lists available false at the same moment
  - Find out why host.sendMessage is missing from this session's tools while host.list works
  - Report which messaging gate blocks the hub from the assistant on the second Mac; the host is connected and the project is listed, but no assistant there carries a generation
  - Messages to one host began coming back opted_out right after the person edited that host's SSH target; explain why and what has to be switched on again
  - query: host.sendMessage keeps returning rate_limited with a retryAfterMs while the hub messages five hosts in a row; explain the limits and when sends can go again
    docs: true
  - Diagnose why a remote assistant has a generation but available false while this Shell is not paused
  - query: >-
      Hub session on Full. host.list shows the Linux build host connected and
      host.listAssistants lists the api project with one Codex assistant, generation set,
      available false. The person says nobody paused anything on this machine. Work out
      which gate it is and what they should check on that host, without sending or
      starting anything.
  - query: >-
      The person can see their spare MacBook under Remote Hosts and its projects list
      fine, but the question the hub sent there came back policy_rejected and none of its
      assistants has a generation. They want to know why and what to do on that laptop,
      and they do not want the question sent again.
  - query: >-
      A send to the studio host just came back lane_unavailable, although
      host.listAssistants showed its Codex assistant with a generation a minute ago.
      Nothing has restarted on either machine. Find out which gate it is and who has to
      act.
  - every send to the linux box says lane_unavailable, what's wrong
  - the hub says my old laptop doesn't support assistant messaging
  - it says unsupported when I try to message the imac host
  - why does it say policy_rejected when I message the studio
  - i changed my server's ssh address and now messaging it says opted out
  - my tower shows connected but listing its assistants says nothing is enrolled for me
  - why does every new message to the linux host bounce before it's even sent
  - the hub can see my laptop but says it can't message anything there, check what's off
  - figure out why the mac studio won't take messages, don't resend anything
  - the hub's sends started failing with a tier error
  - is it a pause or a setting? the other machine stopped taking messages
  - are my messages to the server being throttled?
  - every message to every host fails since this morning
  - morning! the build box is up but the hub can't get through to its assistant, can you see why?
  - sorry to bug you again, the laptop host keeps refusing messages from here, which gate is it this time
  - the old intel mac host answers unsupported to every send while my other hosts work fine; what's different about it?
  - pause is off on this machine but the build box's assistant still reads available false; is it paused over there or just stopped?
  - the hub can't message the laptop's assistant, and the laptop's own window says another machine turned messages on for it; what does that mean for my hub?
  - query: >-
      Ten sends went to the render host in under a minute and the eleventh came back
      rate_limited. The person wants to know how long to wait, whether the hub's reads are
      limited too, and whether anything is wrong with the host itself.
  - query: >-
      I pointed the mini's host entry at its new tailnet name this morning, nothing else.
      Since then the hub can't reach the assistant there, although the mini shows up as
      connected. Which setting did that change undo, and where do I put it back?
  - Find out why sends to the linux tower come back policy_rejected even though its project lists an assistant with a generation for another Shell
  - query: see what's in the way
    history:
      - "user: ask the tower to rerun the flaky test"
      - "assistant: The send came back policy_rejected; nothing was sent."
  - query: >-
      I've got the Mac mini showing as connected in Remote Hosts and I can open its
      projects from here, but whenever the assistant here tries to message the one over
      there it fails. I haven't changed anything on either machine. Can you check what's
      actually blocking it and tell me what to flip, without sending it anything?
  - query: >-
      Yesterday I moved the Linux tower to a new address and updated it in the hosts
      settings. Since then the hub can't message it at all. Messaging was definitely on
      before. What happened, and what do I need to do?
  - query: >-
      The hub tried to start an assistant on my old iMac host and got unsupported. I think
      it is still on an older Daintree. Is that the reason, and is there anything else to
      check before I update it?
  - query: why not?
