# Training examples whose answer is `daintree.runtime.measure-performance` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.runtime.measure-performance
run: 2026-09-28-catalog-expansion
positives:
  - Benchmark feature/lazy-routes against origin/main on cold start to the ready line, release builds, interleaved runs.
  - Is perf/json-streaming faster than main at parsing the 200MB fixture? Measure both with warmups and report median and spread.
  - Check codex's claimed 30% speedup in the query-planner worktree against its merge-base.
  - Measure the production bundle size of feature/charts against main and report the byte delta.
  - Compare peak memory of the CSV import job between HEAD of fix/leak-csv and the v2.3.0 tag.
  - Did the memoization change in claude-2's worktree actually cut render time? Measure before versus after.
  - Requests per second of the Go API on perf/pool-tuning vs main, same load profile, 5% threshold.
  - Run the criterion benches for the tokenizer on main and on feature/simd and say whether the gap is beyond noise.
  - 'Perf regression check: p50 of the list-orders endpoint on feature/new-orm versus main.'
  - Wall time of `mycli build` on the candidate worktree versus the baseline at abc1234, touching no files.
  - Docker image size, main vs the alpine-base branch
  - Using gemini, time the pytest-benchmark suite for the resampler on both this branch and main.
  - Benchmark Electron app startup on refactor/preload against main without changing any files.
  - benchmark this against main pls
  - did that change actually speed it up
  - how much did the bundle grow with the date-fns swap
  - feels slower since the orm bump, can u measure feature/orm-7 vs main
  - check the agent's claimed 2x speedup on the image resizer
  - is there a perf regression on this branch vs main?
  - I don't need the culprit commit, just whether v3.1 starts slower than v3.0 and by how much.
  - claude-1 says its caching patch cut the build from 90s to 40s; measure both revisions and confirm the number.
  - The contest is over and the winning version is merged into feature/fast-diff; benchmark that branch against main.
  - Don't run the test suite, just benchmark the render loop on this worktree versus main.
  - The build isn't failing, it's just slower - measure build time on this branch against main.
  - Before anyone starts optimising, measure how much slower feature/rich-text loads the editor than main does.
  - query: 'Benchmark the lexer rewrite at 9d41e07 against the 2.8.0 release on each connected host: same build flags, interleaved runs on every machine, a ratio per host, and flag any host that was busy while it ran.'
    run: runbook-2026-10-issue-139
  - query: Measure peak memory of the image pipeline before and after the pooling change on every Remote Host, each host comparing its own baseline build with its own candidate build.
    run: runbook-2026-10-issue-139
  - query: Run a controlled performance comparison across the three hosts at two pinned commits; each machine runs both sides itself and the result is per-host medians and spread, never pooled seconds.
    run: runbook-2026-10-issue-139
  - query: Have each host's assistant time the old and new startup path in ABBA order, record its CPU model, OS and load average with timestamps, and send back the raw pairs.
    run: runbook-2026-10-issue-139
  - query: For each host, the ratio of candidate build time to baseline build time, with the thermal state sampled before and after; give a combined statement only if every host agrees in direction.
    run: runbook-2026-10-issue-139
  - query: Verify the claimed 2x speedup of the SIMD path on every host separately, since the hosts have different CPUs and absolute numbers will not line up.
    run: runbook-2026-10-issue-139
  - query: 'The hub wants two commits of this project timed on this machine, baseline and candidate: send back the raw run pairs with the load and temperature readings taken while they ran.'
    run: runbook-2026-10-issue-139
  - query: 'Measure the candidate branch against the baseline commit here for the hub: build both the same way, interleave warmed runs, and return the ratio and what else was running on this machine.'
    run: runbook-2026-10-issue-139
  - query: Benchmark both revisions locally and reply with the paired timings; the hub will set them beside the other machines' ratios, not their raw seconds.
    run: runbook-2026-10-issue-139
  - query: Pair the old and new binary on each machine's own hardware and report whether the speedup holds on the slow server as well as on the laptop.
    run: runbook-2026-10-issue-139
  - query: my laptop says the new serializer is 20% faster, check it on the build server too but don't compare the two machines' raw numbers
    run: runbook-2026-10-issue-139
  - query: is it actually faster on the Linux host as well? the Mac is way quicker so the absolute times mean nothing
    run: runbook-2026-10-issue-139
  - query: run the benchmark old vs new on every machine I've connected and tell me per machine
    run: runbook-2026-10-issue-139
  - query: did the allocator swap help on all my hosts or just the fast one
    run: runbook-2026-10-issue-139
  - query: benchmark this PR on the two servers, one is mid-build so say so
    run: runbook-2026-10-issue-139
  - query: perf test across my hosts, same two commits everywhere, per-host results first
    run: runbook-2026-10-issue-139
  - query: check bundle size and startup time for the new loader on each host separately
    run: runbook-2026-10-issue-139
  - query: before I trust the new cache, compare it to the old one on each of my computers, individually
    run: runbook-2026-10-issue-139
  - query: Thanks for the earlier update. Now could you find out whether the refactor made the importer slower on any of my machines? Compare before and after on each one.
    run: runbook-2026-10-issue-139
  - query: I've got three remote hosts of different ages. After the dependency bump the end-to-end test took 41s on my Mac, but I want to know whether the bump itself slowed things. Please run the pre-bump and post-bump commits on each host, interleaved, and tell me per host whether the difference is beyond noise. One of the hosts is also running a nightly job.
    run: runbook-2026-10-issue-139
  - query: 'We think the new query planner is a win, but the CI box and my laptop disagree wildly on absolute timings. Measure planner-off versus planner-on at the same two commits on every machine I''ve connected: warm up first, repeat a lot, and give me a table with one row per machine and a verdict per machine.'
    run: runbook-2026-10-issue-139
  - query: Speed check of two release candidates across all hosts; mark a host unreliable if its CPU was busy or hot during the runs.
    run: runbook-2026-10-issue-139
  - query: 'Hey, quick one: our parser benchmark improved 35% on the dev laptop after the rewrite. Can you confirm it on the other hosts too, each against its own old build? A faster machine shouldn''t count as a win.'
    run: runbook-2026-10-issue-139
  - query: 'Per-host regression check for the connection-pool change: old commit and new commit, same workload, on every machine, ratios side by side.'
    run: runbook-2026-10-issue-139
  - query: On every host, compare the previous commit and HEAD for cold-start time using identical setup, and tell me which hosts show a change beyond their own noise.
    run: runbook-2026-10-issue-139

boundaries:
  - query: The build isn't broken, only slower. Compare its build time on this branch against main.
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: Is feature/lazy-load actually faster than main at cold start? Benchmark both and give me a verdict.
    confusable_with: [daintree.git.bisect-regression]
  - query: don't bisect, I just want startup time on v2.4 vs v2.3 compared
    confusable_with: [daintree.git.bisect-regression]
  - query: Which is faster at cold start, main or release/3.2? Benchmark both.
    confusable_with: [daintree.git.bisect-regression]
  - query: First confirm feature/x is actually slower than main on the render benchmark, with numbers for both sides.
    confusable_with: [daintree.git.bisect-regression]
  - query: No contest needed - just tell me whether codex's branch beats main on the ingest benchmark.
    confusable_with: [daintree.orchestration.competition]
  - query: The contest winner is merged to feature/fast-json; benchmark that against main.
    confusable_with: [daintree.orchestration.competition]
  - query: Measure peak memory of perf/arena vs main, one agent doing the runs.
    confusable_with: [daintree.orchestration.competition]
  - query: claude-4 claims its change makes the parser 3x faster; benchmark it against main.
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: the agent says the bundle is 20% smaller now, measure it vs main
    confusable_with: [daintree.orchestration.verify-agent-work]
  - query: Is my branch faster than main on the import benchmark?
    confusable_with: [daintree.review.audit-codebase]
  - query: Is feat/lazy-load's bundle smaller than main's? Measure both builds.
    confusable_with: [daintree.runtime.relieve-resource-contention]
    run: 2026-09-28-round6
  - query: Check the agent's claimed 30% memory reduction in the parser against main.
    confusable_with: [daintree.runtime.relieve-resource-contention]
    run: 2026-09-28-round6
  - query: "benchmark whether this branch leaves more memory headroom than main does"
    confusable_with: [daintree.agents.check-usage-limits]
    run: runbook-2026-10-issue-91
  - query: Same two commits, timed on every machine as a before-and-after pair per machine; tell me which commit is faster on each one
    confusable_with:
    - daintree.hosts.run-validation-matrix
    run: runbook-2026-10-issue-139
  - query: Measure startup time of the release candidate against the last release on each connected host; what I care about is the change in speed, not whether the tests pass
    confusable_with:
    - daintree.hosts.run-validation-matrix
    run: runbook-2026-10-issue-139
  - query: How long does the full test suite take on the old commit versus the new one on each machine? Same whole suite both times, no splitting it up.
    confusable_with:
    - daintree.hosts.shard-test-suite
    run: runbook-2026-10-issue-139
  - query: 'Check whether the new test runner made our suite quicker on every host: run it before and after on each, the whole suite every time'
    confusable_with:
    - daintree.hosts.shard-test-suite
    run: runbook-2026-10-issue-139
  - query: The new build looks slower on the Linux box, but that box is older. Time old and new there and on the laptop and compare each machine's own ratio.
    confusable_with:
    - daintree.hosts.diagnose-host-differences
    run: runbook-2026-10-issue-139
  - query: Is the regression real or is host B just a weaker machine? Run the old commit and the new commit on both and compare within each host.
    confusable_with:
    - daintree.hosts.diagnose-host-differences
    run: runbook-2026-10-issue-139
  - query: Benchmark both commits on all my hosts; the build server is busy with other jobs, so mark how reliable its numbers are rather than moving anything
    confusable_with:
    - daintree.hosts.rebalance-load
    run: runbook-2026-10-issue-139
  - query: one host is hot and loaded while I measure the speedup, don't touch the load, just qualify that host's result
    confusable_with:
    - daintree.hosts.rebalance-load
    run: runbook-2026-10-issue-139
  - query: Peak memory of the old and new importer on each host separately, the machines have different amounts of RAM
    confusable_with:
    - daintree.agents.check-usage-limits
    run: runbook-2026-10-issue-139
  - query: Compare the memory footprint of the previous and current build on every connected host and report it per host
    confusable_with:
    - daintree.agents.check-usage-limits
    run: runbook-2026-10-issue-139
  - query: Time the baseline against the candidate on both remote machines and tell me per machine whether it got faster
    confusable_with:
    - daintree.hosts.race-and-review
    run: runbook-2026-10-issue-139
  - query: Give every host the same two commits to benchmark against each other and bring back each host's own ratio, no pooled seconds
    confusable_with:
    - daintree.hosts.swarm-fan-out
    run: runbook-2026-10-issue-139
  - query: Compare heap use and throughput on main versus feature/batched-index with repeated matched builds and report uncertainty.
    confusable_with:
      - daintree.edits.spawn-visible-agent
      - daintree.orchestration.verify-agent-work
      - daintree.runtime.relieve-resource-contention
    run: 2026-10-16-synthetic-audit

topic_shifts:
  - query: is migrate/date-fns faster than main? the bundle feels bigger — measure it
    history:
      - 'user: move moment to date-fns, one agent per package'
      - 'assistant: Integrated and residual-free; checks pass on migrate/date-fns.'
    active: [daintree.orchestration.migration-sweep]
    run: 2026-09-28-catalog-expansion-stateful
  - query: it also claims a 30% speedup — check that against main with real numbers
    history:
      - 'user: is claude-3 actually done with the parser refactor?'
      - 'assistant: Verified: the diff matches its claim, the tests I ran pass at 5e5e1a0. It also says parsing is ''30% faster''.'
    active: [daintree.orchestration.verify-agent-work]
    run: 2026-09-28-catalog-expansion-stateful
  - query: does this PR actually make parsing faster? benchmark it against main
    history:
      - 'user: review PR #220'
      - 'assistant: Two reviewers read PR #220 at head 6c2f0aa: no blocking findings, one nit about a magic constant.'
    active: [daintree.review.review-change]
    run: 2026-09-28-catalog-expansion-stateful
  - query: the fix is on fix/startup — benchmark it against main and tell me if startup's back to normal
    history:
      - 'user: find the commit that made startup slow'
      - 'assistant: First bad commit b81f3c0 (startup 1.9s vs 1.1s on its parent); verified myself.'
    active: [daintree.git.bisect-regression]
    run: 2026-09-28-catalog-expansion-stateful
  - query: how much did the bundle grow from the vite upgrade? compare against main
    history:
      - 'user: upgrade vite to 7'
      - 'assistant: claude-4 upgraded vite in deps/vite7 (commit 3a4b5c6); I reran build and tests there and both pass.'
    active: [daintree.deps.upgrade-dependency]
    run: 2026-09-28-catalog-expansion-stateful
  - query: different question — is feat/lazy-images faster than main at first paint? measure it properly
    history:
      - 'user: what did I ship last week?'
      - 'assistant: You merged 5 PRs (#401, #403, #410, #411, #415) and have feat/lazy-images in progress with 2 unpushed commits.'
    active: [daintree.git.summarize-activity]
    run: 2026-09-28-catalog-expansion-stateful
  - query: 'separate question: is codex-1''s branch actually faster to build than main? benchmark it'
    history:
      - 'user: my machine is crawling, sort it out'
      - 'assistant: Reading 2 (13:30): load down from 26 to 5 after serializing the builds; codex-1 is next in line to run its build.'
    active: [daintree.runtime.relieve-resource-contention]
    run: 2026-09-28-round6-stateful
  - query: measure whether the new query layer is slower than the old one on the orders endpoints
    history:
      - 'user: we picked the Drizzle spike on spike/drizzle, now build it properly'
      - 'assistant: Pinned spike/drizzle@9c1a7e2, base main@55de10a. Reviewer codex-3 listed S1-S11 (hardcoded DATABASE_URL, no migrations, mocked repo layer in src/db, no error handling on writes, 4 TODOs...) and recommends hardening in place on a new branch. Approve the plan?'
      - 'assistant: Created feat/drizzle off spike/drizzle in a new worktree; builder claude-5 launched with S1-S11 as acceptance criteria. Waiting on its notice.'
      - 'assistant: Done: S1-S8 and S10-S11 verified by me, S9 deferred; checks pass on feat/drizzle; the spike is untouched.'
    active: [daintree.orchestration.productionize-prototype]
    run: 2026-09-28-round6-stateful
  - query: now check whether that branch is faster than main on each of my hosts, per host
    history:
    - 'user: have the build box add the --json flag and push it'
    - 'assistant: The build box pushed feature/json (9ac3e1f); checks pass there and the commit is on the remote.'
    active:
    - daintree.hosts.delegate-to-host
    run: runbook-2026-10-issue-139
  - query: 'different thing: is the new scheduler actually faster on every host? measure old against new per machine'
    history:
    - 'user: rebalance the swarm, the Linux host is swapping'
    - 'assistant: Moved two unstarted units to the Mac; the Linux host''s load fell from 91% to 40% on a second reading.'
    active:
    - daintree.hosts.rebalance-load
    run: runbook-2026-10-issue-139
  - query: the machine's calm again. was the new parser actually faster than the release version, or just noise?
    history:
      - 'user: Ease the local build overload.'
      - 'assistant: Authorized jobs are now serialized; memory pressure is green and CPU has settled.'
    active: [daintree.runtime.relieve-resource-contention]
    confusable_with: [daintree.runtime.relieve-resource-contention]
    run: 2026-10-16-synthetic-audit

followups:
  - query: does that hold on my other machines too?
    history:
    - 'user: is perf/cache faster than main? measure it'
    - 'assistant: On this Mac the candidate is 14% faster, spread 3%, beyond the 5% threshold; 20 interleaved pairs, release builds.'
    active:
    - daintree.runtime.measure-performance
    run: runbook-2026-10-issue-139
  - query: the Linux host came out smaller, is that the change or just the hardware?
    history:
    - 'user: benchmark the new tokenizer against main on both of my hosts'
    - 'assistant: Mac: 14% faster (spread 3%). Linux host: 4% faster (spread 5%), inconclusive against the 5% threshold. Each ratio is from that host''s own pairs.'
    active:
    - daintree.runtime.measure-performance
    run: runbook-2026-10-issue-139
  - query: rerun the loaded one when it's quiet
    history:
    - 'user: measure old vs new on all three hosts'
    - 'assistant: Host B''s run overlapped a build: load reached 92% mid-run, so its verdict is inconclusive. Hosts A and C are clean: 11% and 9% faster.'
    active:
    - daintree.runtime.measure-performance
    run: runbook-2026-10-issue-139
  - query: now the same pair on the third machine
    history:
    - 'user: compare the baseline and candidate on host A and host B'
    - 'assistant: A: 7% faster, B: 8% faster, each beyond its own spread; hosts compared by ratio only.'
    active:
    - daintree.runtime.measure-performance
    run: runbook-2026-10-issue-139
