  - how does messaging between the assistants on my two macs work
  - can the sidebar assistant here talk to the one on my mac mini
  - what do I need to switch on so my main machine's assistant can message the one on the other machine
  - I added the build box as a remote host, now how do I get its assistant talking to this one
  - the hub says only the enrolled hub can reach other hosts, what does that mean
  - the assistant on my other machine isn't showing up as something I can message
  - is it possible for daintree's assistant to hand things off to the assistant on another computer
  - what does accept messages from other machines actually do
  - my assistant can list the hosts but can't send them anything, what's missing
  - do I need the full tool set to message assistants on other hosts
  - can a claude agent in one of my panes message the assistant on another host
  - explain hub and lane in the remote hosts messaging setup
  - I paused messages between machines, does the work on the other mac stop too
  - what setting lets my assistant start an assistant on the mac mini by itself
  - why is every assistant on my remote host marked unavailable
  - hook up the assistant on my desktop to the one on my laptop
  - does the assistant on the remote machine act on the hub's messages without asking me
  - turn on cross machine assistant messaging
  - which settings decide whether this shell can message the assistants on its hosts
  - can my two remote hosts talk to each other directly or does it all go through this machine
  - the remote mac's assistant never gets my messages, where do I even start
  - is the other machine's assistant enrolled for this shell yet
  - when I message the other machine's assistant how does its answer get back to me
  - what happens if I message the other machine while it's offline
  - how can I tell whether a message to the other mac actually arrived
  - can the assistant on my other mac message me first
  - what's the safe way to let my main mac's assistant direct the one on the build box
  - get my linux box's daintree assistant reachable from the assistant here
  - what does it mean that the reply from the other machine is just a claim
  - i want the assistant here and the one on the second mac to work together, set that up
  - query: ok so how does my assistant talk to its assistant
    history:
      - "user: I just added the mac mini under hosts"
      - "assistant: It's added and connected."
  - query: how do I stop my assistant from starting new assistants over there
    history:
      - "user: what can the assistant here do on my other mac?"
      - "assistant: It can message the assistant enrolled there, and start one if you allow that for the host."

boundaries:
  - query: messaging tools are missing from my sidebar assistant even though I added a remote host
    confusable_with: [daintree.diagnostics]
  - query: the hub says the other mac's assistant isn't enrolled, is something broken
    confusable_with: [daintree.diagnostics]
  - query: why can't my assistant see any assistant it can message on my second mac
    confusable_with: [daintree.diagnostics]
  - query: host.listAssistants shows nothing with a generation for the build box
    confusable_with: [daintree.diagnostics]
  - query: is it a bug that the other machine's assistant shows unavailable for every project
    confusable_with: [daintree.diagnostics]
  - query: sending to the remote host keeps coming back opted out, is daintree broken
    confusable_with: [daintree.diagnostics]
  - query: is the remote machine's assistant ready to take work from this shell
    confusable_with: [daintree.worktree.manage-resource]
  - query: connect the assistant on my remote mac to the one here
    confusable_with: [daintree.worktree.manage-resource]
  - query: get the remote box's assistant set up so this shell can send it tasks
    confusable_with: [daintree.worktree.manage-resource]
  - query: the remote host is up but its assistant won't accept anything from me
    confusable_with: [daintree.worktree.manage-resource, daintree.diagnostics]

