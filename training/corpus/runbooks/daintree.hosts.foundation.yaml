    confusable_with: [daintree.worktree.manage-resource, daintree.diagnostics]
  - query: "before I hand work to my other mac's assistant, what has to be switched on for this shell to reach it"
    docs: true
    confusable_with: [daintree.hosts.delegate-to-host]
    run: runbook-2026-10-issue-89
