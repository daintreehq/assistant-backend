  - query: I added the build box as a remote host, now how do I get its assistant talking to this one
    docs: true
  - query: the hub says only the enrolled hub can reach other hosts, what does that mean
    docs: true
  - the assistant on my other machine isn't showing up as something I can message
  - query: is it possible for daintree's assistant to hand things off to the assistant on another computer
    docs: true
  - query: what does accept messages from other machines actually do
    docs: true
  - my assistant can list the hosts but can't send them anything, what's missing
  - query: do I need the full tool set to message assistants on other hosts
    docs: true
  - query: can a claude agent in one of my panes message the assistant on another host
    docs: true
  - query: explain hub and lane in the remote hosts messaging setup
    docs: true
  - query: I paused messages between machines, does the work on the other mac stop too
    docs: true
  - query: what setting lets my assistant start an assistant on the mac mini by itself
