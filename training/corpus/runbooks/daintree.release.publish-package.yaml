boundaries:
  - query: We own the logger package. Release 2.0.0 of it to npm so the other teams can upgrade to it.
    confusable_with: [daintree.deps.upgrade-dependency]
  - query: publish a new version of our shared eslint-config to the registry, 9.1.0
    confusable_with: [daintree.deps.upgrade-dependency]
  - query: Other repos are waiting on the new major of our http client; get 4.0.0 onto PyPI from this repo.
    confusable_with: [daintree.deps.upgrade-dependency]
  - query: Release notes for 2.3.0 are already in CHANGELOG.md; now cut the actual 2.3.0 release of the package to npm.
    confusable_with: [daintree.forge.draft-release-notes]
  - query: notes are drafted on the github release. what's left is uploading 0.8.1 to pypi
    confusable_with: [daintree.forge.draft-release-notes]
  - query: Skip the changelog, it's done. Publish the logging crate 1.2.0 to crates.io and check it resolves from a new cargo project.
    confusable_with: [daintree.forge.draft-release-notes]
  - query: The release PR is merged. Publish 3.1.0 to npm from that merge commit.
    confusable_with: [daintree.forge.land-pull-request]
  - query: don't merge anything, just publish the version already on main to the registry, 0.5.0
    confusable_with: [daintree.forge.land-pull-request]
  - query: 'PR #77 bumped the version and landed; push the matching tag so the workflow publishes to PyPI, and confirm the upload.'
    confusable_with: [daintree.forge.land-pull-request]
  - query: Publish 2.5.0 of the Python SDK to PyPI and check it installs.
    confusable_with: [daintree.release.assess-readiness]
  - query: The tarball is packed and checked; publish it to npm as 2.4.0.
    confusable_with: [daintree.release.test-distributable]
  - query: The tests pass on Linux and Windows for the 1.3.0 tag. Publish 1.3.0 to npm from the Linux host only and prove the registry has it.
    confusable_with:
    - daintree.hosts.run-validation-matrix
    run: runbook-2026-10-issue-138
  - query: the machine that was publishing the SDK dropped offline right after the upload. don't have another one publish it, check the registry for that version.
    confusable_with:
    - daintree.hosts.reassign-host-work
    run: runbook-2026-10-issue-138
  - query: Don't reassign the publish. Look at the registry for the version the unreachable host was uploading and report what is there.
    confusable_with:
    - daintree.hosts.reassign-host-work
    run: runbook-2026-10-issue-138
  - query: my linux and mac machines both have the npm login; make the linux one the only publisher of 1.6.0 and have it publish now, the mac one just builds
    confusable_with:
    - daintree.hosts.resolve-task-collisions
    run: runbook-2026-10-issue-138
  - query: Ask the build box's assistant to publish 0.7.2 to PyPI and tell me what the index shows.
    confusable_with:
    - daintree.hosts.delegate-to-host
    run: runbook-2026-10-issue-138
  - query: 'hub message: you are the publisher for the sdk this round. build 2.1.0 from the SHA in the message, upload it, reply with the registry''s checksum'
    confusable_with:
    - daintree.hosts.handle-hub-message
    - daintree.hosts.do-delegated-work
    run: runbook-2026-10-issue-138
  - query: Every host agrees the 3.0 package is ready; publish it to npm from the release host.
    confusable_with:
    - daintree.release.assess-readiness
    run: runbook-2026-10-issue-138
  - query: the hub says another machine already built and inspected 2.3.0; this host is the publisher, so upload it to the registry and report the hash
    confusable_with:
    - daintree.hosts.verify-for-hub
    run: runbook-2026-10-issue-138
  - query: last night's release run left the publish unconfirmed. don't review the run, look at the registry for the version that host uploaded
    confusable_with:
    - daintree.hosts.postmortem-swarm
    run: runbook-2026-10-issue-138
  - query: release the new sdk version 3.1.0 to npm under latest from the release host; it is a library, nothing gets deployed to any environment
    confusable_with:
    - daintree.release.deploy-and-verify
    run: runbook-2026-10-issue-138
