# Training examples whose answer is `daintree.release.publish-package` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.release.publish-package
run: 2026-09-28-round6
positives:
  - Publish @acme/sdk 1.4.0 to npm from the tip of main under the latest tag, then confirm a fresh project can install and import it.
  - Release the python client in packages/client-py to PyPI as 0.9.2; the user will type the 2FA code themselves.
  - cut a crates.io release of the tokenizer crate, 0.3.1
  - push 2.0.0-beta.3 of the cli to npm under the next dist-tag, latest must stay on 1.9.4
  - Build and push version 5.2.0 of the billing gem to RubyGems, then check `gem install` of that exact version works in an empty directory.
  - hey can u publish the new version of our client lib? patch bump per the changelog
  - ship 1.12.0 of the react component library to npm and make sure no .env or .pem files end up in the tarball
  - npm publish @org/parser 2.3.0, dist-tag latest, verify from a clean consumer afterwards
  - Release pydantic-extras 1.1.0 to PyPI; build wheel and sdist from a clean checkout, run twine check, and have me type the token prompt in a visible terminal.
  - packages/schema in the monorepo needs a new minor on npm; pick the version from our conventional-commit history and publish it exactly once.
  - publish the sdk. 2fa is on my phone, I'll type the otp when it asks
  - Push the v4.2.0 tag so our publish workflow uploads the package to npm, then confirm the registry holds 4.2.0 with the hash of the file CI built.
  - The changelog entry for 0.8.0 is already merged; now get 0.8.0 of the crate onto crates.io and prove `cargo add` of that version builds.
  - 'I merged the version-bump PR #231 myself an hour ago. Publish what''s on main as 3.4.0 to npm.'
  - Our design-system package needs 7.1.0 on the private Verdaccio registry so the storefront repo can pick it up; release it from this repo.
  - 'ship the new client library version: it''s an npm package, not the web service. 2.6.0 under latest'
  - pack the wheel, make sure twine check passes and nothing from tests/fixtures is inside, then upload 1.0.0 to PyPI
  - Release the JS SDK 5.0.0-rc.1 on the rc channel of npm; a scratch project must be able to import it afterwards.
  - 'Only the registry part is left: build and publish vendor-sync 0.4.0 to PyPI. Notes and PR are done.'
  - The publish of @acme/ui 1.9.0 got cut off at the OTP prompt. Find out whether it reached npm and finish the release without publishing twice.
  - Publish the protobuf bindings package 0.12.0 to our internal Artifactory npm registry from commit a1b9e4f on main.
  - Publish the Android SDK 3.1.0 to Maven Central using the project's gradle publish task, then check a clean gradle project resolves it.
  - bump and publish a patch for the eslint config pkg pls
  - Put 1.0.0 of the parser on PyPI as our first stable release and confirm `pip install parser==1.0.0` in a new venv imports it.
  - Publish the next canary of the CLI to npm under the canary tag, leaving latest pointing at 3.8.2.
