# Training examples whose answer is `daintree.ci.run-e2e-suite` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.ci.run-e2e-suite
run: 2026-09-28-catalog-expansion
positives:
  - Run the Playwright suite headless in the feature/checkout-v2 worktree against that worktree's own dev server; report pass/fail counts and trace paths.
  - Run Cypress e2e for fix/login-redirect, making sure the server it hits is started from that worktree and not whatever is already on :3000.
  - Run the API integration tests that need the Express server and Postgres up, in the orders-service worktree.
  - Run only tests/e2e/checkout.spec.ts headless in the payments-ui worktree and collect screenshots for any failures.
  - Run the end-to-end suite for claude-2's worktree; another worktree already serves on 5173, so don't reuse that server.
  - Run e2e against feature/teams and report which base URL the tests actually hit.
  - Have codex run the Playwright tests in the admin-dashboard worktree and report failures with their trace zip paths.
  - 'Run the Rails system tests (Capybara, app must be booted) in the worktree for issue #618.'
  - Cypress headless run for the billing-v3 worktree; stop whatever server it starts once it's done.
  - Run the integration tests under test/integration that boot the Next.js app, in feature/i18n.
  - Full e2e run on HEAD of feature/cart-rework, with proof the server under test came from that checkout.
  - Run the @smoke-tagged Playwright tests against the release-2.4 worktree's own app.
  - run the playwright tests in this worktree
  - can you run e2e on my branch
  - run the cypress suite headless pls
  - run the integration tests that need the server running, on the api wt
  - e2e run for feature/search, just tell me what fails + screenshots
  - kick off the browser tests against wt onboarding
  - Unit tests are already green in feature/export; now run the Playwright end-to-end suite there against its own server.
  - The dashboard worktree's preview looks fine; run the Cypress specs headless against that worktree's server and report counts.
  - Worktrees already have their own ports set up; run the e2e tests in the reports worktree against its port 4012.
  - Start whatever the browser tests need in feature/profile, run them, then shut the server down again.
  - Port 3000 belongs to another worktree's server; run the Playwright tests for feature/login without touching it.
  - Run the e2e suite in the checkout worktree and report which specs fail - no fixing yet.
  - No exploratory poking needed, just run the existing Playwright suite against the release branch worktree.
  - playwright on the auth worktree pls - careful, my main checkout's dev server is sitting on 3000
  - query: "Run the Playwright specs under e2e/billing in the invoices worktree on the build host, and tell me which process was listening on the app's port, its working directory and the commit it was built from, plus where the HTML report ended up."
    run: runbook-2026-10-issue-135
  - query: "feature/export-csv's worktree on the other machine still has something from an older checkout bound to 5174. Run its smoke specs against a server started fresh from that tree and say whether the result can be trusted."
    run: runbook-2026-10-issue-135
  - query: "got a green e2e on the mac mini but I don't believe it hit the right app. redo it so the server is provably from that checkout"
    run: runbook-2026-10-issue-135
  - query: "Run the Cypress specs in the remote worktree for the loyalty branch and give me the video and screenshot locations in a form that says which machine and which commit they belong to."
    run: runbook-2026-10-issue-135
  - query: "Task: on the machine that holds the orders-service checkout, run the integration tests that need the API and its Postgres running, headless, only the files under test/integration/payments. Confirm the API process serving them was started from that worktree at its current commit instead of reused from another branch, keep the HTML report, and tell me exactly where it lives and on which machine."
    run: runbook-2026-10-issue-135
  - query: "can you rerun the browser tests on the remote box, same worktree, and actually check it isn't hitting the dev server somebody left running yesterday"
    run: runbook-2026-10-issue-135
  - query: "Browser tests run on this Mac but the app they exercise lives on the remote host and gets here through a forwarded port; confirm that port really leads to the server of the worktree under test, at the commit I pushed."
    run: runbook-2026-10-issue-135
  - query: "run signup.spec.ts and nothing else against the remote worktree's app and list the screenshot paths with the host name"
    run: runbook-2026-10-issue-135
  - query: "Execute the Playwright suite for worktree wt-claims at its HEAD on the host, pin the base URL to a free port, and return the listener pid, working directory and build id along with pass and fail counts."
    run: runbook-2026-10-issue-135
  - query: "the e2e job on the linux host finished in forty seconds which is suspiciously quick. rerun it and make sure it isn't testing an old build that is already running"
    run: runbook-2026-10-issue-135
  - query: "Hey, quick favour: run the end-to-end tests against the remote worktree's own server and show me which build served them."
    run: runbook-2026-10-issue-135
  - query: "On the Linux machine's checkout of this repo, run the end-to-end checks and make sure the app they hit was started from that checkout at the commit I just pushed."
    run: runbook-2026-10-issue-135
  - query: "The reviewers' worktree on the build box has a long-lived dev server on 3000 that belongs to the main checkout. Run the browser specs for the review branch without touching it, and show the run used its own."
    run: runbook-2026-10-issue-135
  - query: "run the integration suite that boots the API on the other host, then tell me what served it and give me the report location with the host named"
    run: runbook-2026-10-issue-135
  - query: "I'm about to sign off on a remote e2e result. Re-run just the failing checkout spec in that worktree and attach evidence that the server was the branch's build, not a cached bundle."
    run: runbook-2026-10-issue-135
  - query: "need the cypress run for the remote feature worktree, headless, with the exact base URL it used and the host, the worktree and the sha written next to every trace path"
    run: runbook-2026-10-issue-135
  - query: "run the browser tests against the dashboard worktree on the remote host; the preview on my side forwards a different local port, so make clear which URL is which"
    run: runbook-2026-10-issue-135
  - query: "Start whatever the end-to-end tests need in the remote worktree for the search feature, run only the cart spec, and stop exactly what you started."
    run: runbook-2026-10-issue-135
boundaries:
  - query: Run the e2e tests in the checkout worktree and just list failures with screenshots, no fixing.
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: Run the Playwright tests against my branch with the dev server up and report failures with traces.
    confusable_with: [daintree.ci.hunt-flaky-test]
  - query: Run the Playwright specs in the checkout worktree against that worktree's own dev server.
    confusable_with: [daintree.ci.run-local-checks]
  - query: Rather than clicking through the preview, run the Playwright suite against the dashboard worktree's own server.
    confusable_with: [daintree.runtime.debug-web-app]
  - query: the preview renders fine, run the cypress specs headless against this worktree
    confusable_with: [daintree.runtime.debug-web-app]
  - query: Run the browser integration tests in feature/ssr, making sure they hit that worktree's server and not the preview's.
    confusable_with: [daintree.runtime.debug-web-app]
  - query: 'Run the Playwright tests in wt checkout: start the server it needs, then kill it when done.'
    confusable_with: [daintree.terminals.run-visible-command]
  - query: Before I open the PR, run the Playwright suite for this branch against its own server.
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: Launch an agent immediately to run the integration suite
    confusable_with: [daintree.edits.spawn-visible-agent, daintree.orchestration.watch-outcome]
    run: 2026-09-09-mission-2-timers
  - query: Run the Cypress suite headless against the feature/checkout worktree's own server.
    confusable_with: [daintree.release.test-distributable]
    run: 2026-09-28-round6
  - query: end-to-end tests in the browser against this branch's running app on node 22, failures with their traces
    confusable_with: [daintree.hosts.run-validation-matrix]
    run: runbook-2026-10-issue-117
  - query: "run the end-to-end suite in the second host's worktree; its database and port are its own already, just give me the pass and fail list"
    confusable_with: [daintree.worktree.provision-local-environment]
    run: runbook-2026-10-issue-132
  - query: "run the Playwright suite for this commit on the Linux host and prove which server it exercised"
    confusable_with: [daintree.hosts.run-validation-matrix]
    run: runbook-2026-10-issue-135
  - query: "on the mac host alone, run only the e2e specs for this branch and show the server was its own"
    confusable_with: [daintree.hosts.run-validation-matrix]
    run: runbook-2026-10-issue-135
  - query: "run the whole e2e suite on the remote worktree in one piece, no splitting between machines, and prove which server answered"
    confusable_with: [daintree.hosts.shard-test-suite]
    run: runbook-2026-10-issue-135
  - query: "the preview on the host looks fine; run the browser specs against that worktree's own server and tell me which listener they hit"
    confusable_with: [daintree.runtime.debug-web-app]
    run: runbook-2026-10-issue-135
  - query: "make sure the integration tests on the other machine really hit this checkout's server and not another worktree's"
    confusable_with: [daintree.orchestration.verify-agent-work]
    run: runbook-2026-10-issue-135
  - query: "keep readable trace references for the e2e run on the remote worktree and show which server it used"
    confusable_with: [daintree.worktree.manage-resource]
    run: runbook-2026-10-issue-135
  - query: "check the end-to-end provenance of that remote worktree's server and give me the report locations, written with the host, worktree and commit"
    confusable_with: [daintree.worktree.manage-resource]
    run: runbook-2026-10-issue-135
  - query: "run the cypress spec for this worktree at the commit named and prove the server was this checkout's, then reply with the report location"
    confusable_with: [daintree.hosts.verify-for-hub]
    run: runbook-2026-10-issue-135
  - query: "run the e2e specs on the other machine's worktree; those need the app up, so prove which server served them"
    confusable_with: [daintree.ci.run-local-checks]
    run: runbook-2026-10-issue-135
  - query: "rerun the integration tests on the remote machine and demonstrate they reach only this worktree's app"
    confusable_with: [daintree.orchestration.verify-agent-work]
    run: runbook-2026-10-issue-135
  - query: "the worktree on the build host already has its own port and database configured; just run the browser specs against it once with a temporary server and stop what you start"
    confusable_with: [daintree.worktree.provision-local-environment]
    run: runbook-2026-10-issue-135
  - query: "I don't need ports or a database set up for that remote worktree, only the end-to-end specs run against a server started for the run"
    confusable_with: [daintree.worktree.provision-local-environment]
    run: runbook-2026-10-issue-135
