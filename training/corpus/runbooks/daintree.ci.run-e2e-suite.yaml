# Training examples whose answer is `daintree.ci.run-e2e-suite` and nothing else.
#
# Sections name what kind of evidence a row is; see ../README.md. An example is
# either a bare query string or a mapping (query/history/active/confusable_with).
# Rows whose answer is several runbooks, or none, live in ../shared/.
runbook: daintree.ci.run-e2e-suite
run: 2026-09-28-catalog-expansion
positives:
  - Run the Playwright suite headless in the feature/checkout-v2 worktree against that worktree's own dev server; report pass/fail counts and trace paths.
  - Run Cypress e2e for fix/login-redirect, making sure the server it hits is started from that worktree and not whatever is already on :3000.
  - Run the API integration tests that need the Express server and Postgres up, in the orders-service worktree.
  - Run only tests/e2e/checkout.spec.ts headless in the payments-ui worktree and collect screenshots for any failures.
  - Run the end-to-end suite for claude-2's worktree; another worktree already serves on 5173, so don't reuse that server.
  - Run e2e against feature/teams and report which base URL the tests actually hit.
  - Have codex run the Playwright tests in the admin-dashboard worktree and report failures with their trace zip paths.
  - 'Run the Rails system tests (Capybara, app must be booted) in the worktree for issue #618.'
  - Cypress headless run for the billing-v3 worktree; stop whatever server it starts once it's done.
  - Run the integration tests under test/integration that boot the Next.js app, in feature/i18n.
  - Full e2e run on HEAD of feature/cart-rework, with proof the server under test came from that checkout.
  - Run the @smoke-tagged Playwright tests against the release-2.4 worktree's own app.
  - run the playwright tests in this worktree
  - can you run e2e on my branch
  - run the cypress suite headless pls
  - run the integration tests that need the server running, on the api wt
  - e2e run for feature/search, just tell me what fails + screenshots
  - kick off the browser tests against wt onboarding
  - Unit tests are already green in feature/export; now run the Playwright end-to-end suite there against its own server.
  - The dashboard worktree's preview looks fine; run the Cypress specs headless against that worktree's server and report counts.
  - Worktrees already have their own ports set up; run the e2e tests in the reports worktree against its port 4012.
  - Start whatever the browser tests need in feature/profile, run them, then shut the server down again.
  - Port 3000 belongs to another worktree's server; run the Playwright tests for feature/login without touching it.
  - Run the e2e suite in the checkout worktree and report which specs fail - no fixing yet.
  - No exploratory poking needed, just run the existing Playwright suite against the release branch worktree.
  - playwright on the auth worktree pls - careful, my main checkout's dev server is sitting on 3000
boundaries:
  - query: Run the e2e tests in the checkout worktree and just list failures with screenshots, no fixing.
    confusable_with: [daintree.ci.diagnose-and-fix]
  - query: Run the Playwright tests against my branch with the dev server up and report failures with traces.
    confusable_with: [daintree.ci.hunt-flaky-test]
  - query: Run the Playwright specs in the checkout worktree against that worktree's own dev server.
    confusable_with: [daintree.ci.run-local-checks]
  - query: Rather than clicking through the preview, run the Playwright suite against the dashboard worktree's own server.
    confusable_with: [daintree.runtime.debug-web-app]
  - query: the preview renders fine, run the cypress specs headless against this worktree
    confusable_with: [daintree.runtime.debug-web-app]
  - query: Run the browser integration tests in feature/ssr, making sure they hit that worktree's server and not the preview's.
    confusable_with: [daintree.runtime.debug-web-app]
  - query: 'Run the Playwright tests in wt checkout: start the server it needs, then kill it when done.'
    confusable_with: [daintree.terminals.run-visible-command]
  - query: Before I open the PR, run the Playwright suite for this branch against its own server.
    confusable_with: [daintree.workflow.prep-branch-for-review]
  - query: Launch an agent immediately to run the integration suite
    confusable_with: [daintree.edits.spawn-visible-agent, daintree.orchestration.watch-outcome]
    run: 2026-09-09-mission-2-timers
  - query: Run the Cypress suite headless against the feature/checkout worktree's own server.
    confusable_with: [daintree.release.test-distributable]
    run: 2026-09-28-round6
