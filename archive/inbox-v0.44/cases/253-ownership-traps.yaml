# Ownership traps across the hosts wave (#144): which machine, and which side of an exchange,
# owns the request. Six boundaries, both directions: a Remote Host against the same ask on this
# machine (usage, placement, cleanup, steering, verifying, undo), a Remote Host against a
# worktree's cloud devbox, a dev stack spread over hosts against one dev server here and a port
# clash, and the hub's side of an exchange against the lane's side.
#
# Written blind for the measurement: every string was drafted before any was ranked, and each
# is kept whether or not the shipped selector passes it (one optional added after ranking, on
# review, to own-linux-box-port-busy-preview; it passed strict either way). The owner comes from the routing text
# (each note quotes the deciding clause), never from what the selector picked. Paraphrases, not
# training strings: screened against every case suite and the corpus (queries and history).
# Two probes from the same set are not here because their owner is genuinely split in the
# routing text: "is messaging even turned on there" (daintree.hosts.foundation's "why one is
# not reachable" and daintree.hosts.diagnose-messaging's "which gate is in the way") and "ready
# to take work" (the foundation's "whether it is set up" and daintree.hosts.start-swarm).

cases:
  # --- a Remote Host against the same ask on this machine ---

  - id: own-usage-each-other-mac
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.check-usage-limits: "agent usage checked on OTHER MACHINES". It fences the
      local twin: "Do not use for the usage of agents on this machine
      (daintree.agents.check-usage-limits)".
    messages:
      - role: user
        content: what's the codex quota situation across my other macs, machine by machine
    expect:
      required: [daintree.hosts.check-usage-limits]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: own-usage-remote-box-most-allowance
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.check-usage-limits: "or which machine has the most usage headroom", against
      the local daintree.agents.check-usage-limits.
    messages:
      - role: user
        content: which of my remote boxes has the most claude allowance remaining today
    expect:
      required: [daintree.hosts.check-usage-limits]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: own-usage-remote-hosts-before-sending
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.check-usage-limits: "how much Claude Code or Codex allowance each Remote Host
      this Shell reaches has left", against the local daintree.agents.check-usage-limits.
    messages:
      - role: user
        content: check claude usage on the remote hosts before I send more work
    expect:
      required: [daintree.hosts.check-usage-limits]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: own-lane-test-sha-no-fixes
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.verify-for-hub: "the hub asks this lane to TEST or VERIFY a commit ... with no
      fixes", not a findings-only review (daintree.hosts.review-for-hub).
    messages:
      - role: user
        content: "hub just pinged: run the whole suite on c41d07e here, report results, don't touch the code"
    expect:
      required: [daintree.hosts.verify-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-lint-unit-test-sha
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.verify-for-hub: "hub message: verify this SHA with lint and the unit tests",
      not the person's own checks here (daintree.ci.run-local-checks).
    messages:
      - role: user
        content: the main machine wants me to lint and unit test that sha here and send the counts
    expect:
      required: [daintree.hosts.verify-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-review-request-payments
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.review-for-hub: daintree.hosts.handle-hub-message says "Do not use for ... the
      review the hub asked of this machine itself (daintree.hosts.review-for-hub)".
    messages:
      - role: user
        content: the hub sent over a review request for the payments branch, look at it on this box
    expect:
      required: [daintree.hosts.review-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-show-billing-settings
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.demo-for-hub: daintree.hosts.handle-hub-message says "Do not use for ... a demo
      it asks this host to prepare (daintree.hosts.demo-for-hub)". Nothing here adds a machine
      (daintree.hosts.connect-host).
    messages:
      - role: user
        content: my main shell messaged this host asking to show the new billing settings page running here
    expect:
      required: [daintree.hosts.demo-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-serve-checkout-redesign
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.demo-for-hub, the host's own side; daintree.hosts.prepare-remote-demo fences
      "the host's own side of a demo the hub asked for (daintree.hosts.demo-for-hub)".
    messages:
      - role: user
        content: the hub wants this box to serve the checkout redesign so the person can click through it
    expect:
      required: [daintree.hosts.demo-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-hub-message-search-url
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.demo-for-hub: the message is the envelope, the demo is the work
      (daintree.hosts.handle-hub-message: "Do not use for ... a demo it asks this host to prepare").
    messages:
      - role: user
        content: "hub message: get the search feature running on this machine and tell me the url"
    expect:
      required: [daintree.hosts.demo-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-halt-hub-agents
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.steer-for-hub: "stop, pause or correct only the agents this lane launched for
      the run the hub names", not parking a run from the hub (daintree.hosts.park-swarm).
    messages:
      - role: user
        content: the hub wants the agents it started here halted until further notice
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: own-lane-delete-hub-worktrees
    host_model: inbox
    category: routing-trap
    note: >-
      daintree.hosts.clean-up-for-hub: "remove exactly the panes and worktrees this lane made for
      the run the hub names", not the hub's own recovery (daintree.hosts.recover-and-clean-up).
    messages:
      - role: user
        content: hub asked us to delete the worktrees it created on this machine for the old run
    expect:
      required: [daintree.hosts.clean-up-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  # --- the hub's side of the same work ---
