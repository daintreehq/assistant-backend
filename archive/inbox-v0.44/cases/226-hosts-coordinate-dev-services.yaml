# daintree.hosts.coordinate-dev-services: the hub gets development services that run on
# DIFFERENT Remote Hosts reaching each other, with each connection's caller and address written
# down and checked from where the caller runs, dependencies started first, and one marked request
# proving the end-to-end path. Recall cases are the issue's three requests plus agent- and
# user-phrased stacks and a deliberately broken address.
# Routing traps: this runbook wins against each declared neighbour (a dependent code plan, the
# interface contract, one hand-over, a host's own demo, a port clash, a preview's own failure,
# per-worktree resources). Reverse traps: the neighbour wins and this runbook must not ride
# along. The hosts foundation may ride along (optional).

cases:
  # ------------------------------------------------------------------- recall
  - id: coordinate-dev-services-reverse-demo-for-hub
    host_model: inbox
    category: routing-trap
    note: >-
      The lane's own side: the hub asked THIS host to serve one service with sample data. Decided
      by the neighbour's "when the hub asks THIS machine to prepare a DEMO of a feature".
    messages:
      - role: user
        content: >-
          Hub message: start the orders API here with sample data and reply with the port and the
          commit you are serving.
    expect:
      required: [daintree.hosts.demo-for-hub]
      optional: [daintree.hosts.foundation]
