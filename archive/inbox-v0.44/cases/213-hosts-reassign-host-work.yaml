# daintree.hosts.reassign-host-work: the hub moves ONE unit already delegated to a Remote Host
# that cannot carry on (dropped, unreachable, stuck, out of allowance or missing the CLI the
# work needs) to a DIFFERENT host as a new task, after checking what the first host pushed and
# settling who owns the result. Recall cases are the issue's three requests plus agent- and
# user-phrased outcomes and the first host coming back after a move. Routing traps: this
# runbook wins against each declared neighbour. Reverse traps: the neighbour wins and this
# runbook must not ride along. The hosts foundation may ride along (optional).

cases:
  # ------------------------------------------------------------------- recall
  - id: reassign-host-work-not-recover-and-clean-up
    host_model: inbox
    category: routing-trap
    note: >-
      Not an account of open exchanges: the unit is to MOVE. Fence: "Do not use for
      where delegated exchanges stand with nothing moved, a resend to the same host,
      or cleanup (daintree.hosts.recover-and-clean-up)".
    messages:
      - role: user
        content: the link to the build box is gone for the day; rather than an account of its open exchanges, get its half-finished unit onto another machine
    expect:
      required: [daintree.hosts.reassign-host-work]
      optional: [daintree.hosts.foundation]

  - id: reassign-host-work-not-place-work
    host_model: inbox
    category: routing-trap
    note: >-
      A placed piece that stalled is moved, not placed afresh. Fence: "first placement
      of new pieces (daintree.hosts.place-work)".
    messages:
      - role: user
        content: the piece the hub placed on the second host stopped moving; give that piece to a different host, carrying over what it pushed
    expect:
      required: [daintree.hosts.reassign-host-work]
      optional: [daintree.hosts.foundation]

  - id: reassign-host-work-reverse-recover-and-clean-up
    host_model: inbox
    category: routing-trap
    note: >-
      Status only, nothing moved: recover-and-clean-up's "where things stand with the
      work handed to another machine" and "the link to a Remote Host dropped". This
      runbook's fence: "where delegated exchanges stand with nothing moved".
    messages:
      - role: user
        content: the link to my remote hosts dropped for twenty minutes; just tell me which delegated exchanges are still open
    expect:
      required: [daintree.hosts.recover-and-clean-up]
      optional: [daintree.hosts.foundation]

  - id: reassign-host-work-reverse-steer-for-hub
    host_model: inbox
    category: routing-trap
    note: >-
      The lane's side: steer-for-hub's "Use on a Remote Host's lane to STOP, PAUSE or
      CHANGE the work of the AGENTS it launched for one of the hub's runs". This
      runbook is the sender's side: "a piece of work ALREADY SENT to one Remote Host
      has to MOVE TO A DIFFERENT MACHINE".
    messages:
      - role: user
        content: I'm the assistant on this host; the hub says it is moving its unit elsewhere, so stop the agent I launched for it and keep its changes
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.foundation]
