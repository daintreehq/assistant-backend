[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daintree-assistant-server"
version = "1.0.0"
description = "Daintree runbooks - a stateless MCP server of procedures for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Daintree" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
    # Local runbook selection. These three, and deliberately nothing else — no
    # torch, no transformers, no sentence-transformers. The training stack is
    # ~2GB and lives in .venv-train; what ships is an ONNX graph, a tokenizer
    # vocabulary and the numpy needed to take a dot product against the index.
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "jsonschema>=4.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daintree_assistant_server = [
    "runbooks/catalog/*/*.md",
    # The local two-stage runbook selector — the SHIPPED selector. The ranking
    # encoder ships int8 only (its fp32 graph is gitignored and exists locally so
    # the export can measure what quantisation costs); the retriever ships fp32,
    # which is what serving loads. The head is fp32 (~10MB) because it is
    # 1% of the parameters and quantising it would trade numerical slack for
    # memory nobody is short of. vectors.npz is a build-time CACHE of the
    # catalog's embeddings — serving re-derives it from the live catalog, so a
    # stale copy costs milliseconds, not correctness.
    "runbooks/local/artifacts/selector/meta.json",
    "runbooks/local/artifacts/selector/labels.json",
    "runbooks/local/artifacts/selector/head.onnx",
    "runbooks/local/artifacts/selector/vectors.npz",
    "runbooks/local/artifacts/selector/retriever/model.onnx",
    "runbooks/local/artifacts/selector/retriever/tokenizer*.json",
    "runbooks/local/artifacts/selector/ranking/model_int8.onnx",
    "runbooks/local/artifacts/selector/ranking/tokenizer*.json",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "ARG001",    # unused function arguments (common for interfaces)
    "SIM108",    # ternary vs if/else
    "B008",      # Depends() in argument defaults is the idiomatic FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",
    "ARG002",
    "E501",   # long lines in test fixtures/data are fine
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
plugins = ["pydantic.mypy"]

# onnxruntime and tokenizers ship no py.typed marker, so --strict cannot see
# through them. Scoped to these two modules rather than relaxed globally: every
# value crossing the boundary is immediately narrowed to a concrete type on our
# side (np.asarray(..., dtype=np.float32), int(), float()), so the untyped region
# ends at the call rather than propagating Any into the ranker.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." so `benchmarks/` imports under the bare `pytest` console script, which
# unlike `python -m pytest` does not put the working directory on sys.path.
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
]

[tool.coverage.report]
# A floor, not a target: set just under the measurement so ordinary churn does
# not trip it while a real drop still does.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
