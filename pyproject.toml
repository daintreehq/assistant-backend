[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daintree-assistant-server"
version = "1.0.0"
description = "Daintree Assistant Server - Backend orchestration service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Daintree" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx[http2]>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
    # Local runbook selection. These three, and deliberately nothing else — no
    # torch, no transformers, no sentence-transformers. The training stack is
    # ~2GB and lives in .venv-train; what ships is an ONNX graph, a tokenizer
    # vocabulary and the numpy needed to take a dot product against the index.
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    # Account-token verification. The `crypto` extra is what pulls in
    # `cryptography` for RS256/ES256 — without it PyJWT installs happily and then
    # refuses every asymmetric algorithm at runtime, which would present as "every
    # login is rejected" rather than as a missing dependency.
    #
    # Only the library. JWKS is fetched over the httpx client this service already
    # owns rather than through PyJWT's `PyJWKClient`, which is synchronous and
    # would block the event loop on every key rotation.
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "jsonschema>=4.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daintree_assistant_server = [
    "prompts/main/*.md",
    "prompts/main/base/*.md",
    # The sub-agent persona. Listed explicitly like base/ because package-data
    # globs do NOT recurse: omitting it shipped a wheel whose PromptLoader raised
    # `missing prompt dir` at import — and because the loader reads it EAGERLY at
    # startup, that broke every request, not merely sub-agent ones.
    "prompts/main/subagent/*.md",
    "prompts/main/*.j2",
    "prompts/tasks/*.md",
    # The fast-response stage's own prompts. Eagerly loaded at startup like
    # the task prompts, so a missing glob here is a container that fails
    # readiness rather than a feature that quietly degrades.
    "prompts/fast_response/*.md",
    "prompts/fast_response/*.j2",
    "runbooks/files/*.md",
    # The local two-stage runbook selector — the SHIPPED selector. Both encoders
    # ship int8 only: fp32 is gitignored and exists locally so the export can
    # measure what quantisation costs. The head is fp32 (~10MB) because it is
    # 1% of the parameters and quantising it would trade numerical slack for
    # memory nobody is short of. vectors.npz is a build-time CACHE of the
    # catalog's embeddings — serving re-derives it from the live catalog, so a
    # stale copy costs milliseconds, not correctness.
    "runbooks/local/artifacts/selector/meta.json",
    "runbooks/local/artifacts/selector/labels.json",
    "runbooks/local/artifacts/selector/head.onnx",
    "runbooks/local/artifacts/selector/vectors.npz",
    "runbooks/local/artifacts/selector/retriever/model_int8.onnx",
    "runbooks/local/artifacts/selector/retriever/tokenizer*.json",
    "runbooks/local/artifacts/selector/ranking/model_int8.onnx",
    "runbooks/local/artifacts/selector/ranking/tokenizer*.json",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The CLI submodule (Go project) is not part of this package; keep its vendored
# files — including a stray .claude skill .py — out of our lint scope.
extend-exclude = ["cli"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "ARG001",    # unused function arguments (common for interfaces)
    "SIM108",    # ternary vs if/else
    "B008",      # Depends() in argument defaults is the idiomatic FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
# LocalSelector.select must keep the upstream Selector.select signature exactly —
# that parity is what lets the orchestrator and the benchmark harness drive
# either one unchanged, which is the only way the two can be compared on
# identical evidence. Several of those parameters are meaningless to a local
# model (there is no credential to spend and no endpoint to route to) and are
# deliberately accepted and ignored. Same reasoning as the global ARG001 ignore
# above, which already exempts the plain-function form of this.
"src/daintree_assistant_server/runbooks/local/selector.py" = ["ARG002"]
# Null objects: every argument is unused BY DESIGN — that is what makes them null.
# Naming them anyway is what keeps the signature checkable against the Protocol,
# and mypy --strict does check it, so the arguments are load-bearing even though
# no body reads them.
"src/daintree_assistant_server/tracing/sinks/null.py" = ["ARG002"]
"src/daintree_assistant_server/tracing/recorder.py" = ["ARG002"]
"tests/**/*.py" = [
    "ARG001",
    "ARG002",
    "E501",   # long lines in test fixtures/data are fine
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
plugins = ["pydantic.mypy"]

# onnxruntime and tokenizers ship no py.typed marker, so --strict cannot see
# through them. Scoped to these two modules rather than relaxed globally: every
# value crossing the boundary is immediately narrowed to a concrete type on our
# side (np.asarray(..., dtype=np.float32), int(), float()), so the untyped region
# ends at the call rather than propagating Any into the ranker.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." so `tools/` imports under the bare `pytest` console script, not just under
# `python -m pytest`. Only the latter puts the working directory on sys.path, and
# CI runs the former — so `test_baseline.py` (which imports tools.baseline)
# collected fine on every developer machine and failed on every push.
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
]

[tool.coverage.report]
# A floor, not a target. Set just under the measurement at the time it was
# introduced (93% with branch coverage) so ordinary churn does not trip it while
# a real drop still does. Per-MODULE floors for the security and reliability
# surfaces live in `tools/coverage_floors.py`, because one global number can stay
# green while exactly the code that must not regress does.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
