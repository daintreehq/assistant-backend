# Deterministic multi-turn traces through the REAL ChatOrchestrator with a replay
# provider. Each turn scripts what the (replayed) selector and main model return and
# asserts the orchestrator's non-model behavior: selector cadence, active-set
# trajectory (topic-shift replacement vs continuation reuse), and the signed
# state token's round-trip across turns.
#
# Turn fields:
#   turn_id      — reuse the previous turn_id to model a CONTINUATION round (selector
#                  must NOT run); bump it to model a new instruction (selector runs).
#   user         — a new user message (a fresh instruction round)
#   tool_result  — a tool result for the pending tool call (a continuation round)
#   selector_pick— the skill ids the replayed selector returns THIS turn (ignored on
#                  rounds where cadence skips the selector)
#   main         — {tool_calls: [name]} (model asks for a tool → continuation) or
#                  {final: "text"} (model gives the final answer → turn complete)
#   expect       — {selector_ran, active: [ids]}
cases:
  - id: single-skill-two-rounds
    session_id: s-rename
    turns:
      # An authoritative selection admits specific+foundation UNITS: the top-level
      # daintree.foundation is auto-paired with every daintree.* specific on the
      # same turn (_admit_with_domain_foundations), and a continuation round then
      # reuses that already-closed set verbatim.
      - turn_id: t1
        user: "Rename my terminals so I can tell the agents apart."
        selector_pick: [daintree.terminals.rename]
        main: {tool_calls: [terminal__read]}
        expect:
          selector_ran: true
          active: [daintree.terminals.rename, daintree.foundation]
      - turn_id: t1                       # SAME turn_id → continuation, selector must NOT run
        tool_result: "term-1: build agent\nterm-2: test agent"
        main: {final: "Renamed both terminals to match their agents."}
        expect:
          selector_ran: false
          active: [daintree.terminals.rename, daintree.foundation]

  - id: topic-shift-replaces-active
    session_id: s-shift
    turns:
      - turn_id: t1
        user: "Rename my terminals."
        selector_pick: [daintree.terminals.rename]
        main: {final: "Done."}
        expect:
          selector_ran: true
          active: [daintree.terminals.rename, daintree.foundation]
      - turn_id: t2                        # new instruction → selector runs, replaces the set
        user: "Now run a competition between three agents on this task."
        selector_pick: [daintree.orchestration.competition, daintree.foundation]
        main: {final: "Spinning up the competition."}
        expect:
          selector_ran: true
          active: [daintree.orchestration.competition, daintree.foundation]

  - id: no-task-clears-active
    session_id: s-clear
    turns:
      - turn_id: t1
        user: "Prep this branch for review."
        selector_pick: [daintree.workflow.prep-branch-for-review]
        main: {final: "Branch prepared."}
        expect:
          selector_ran: true
          active: [daintree.workflow.prep-branch-for-review, daintree.foundation]
      - turn_id: t2                        # a chit-chat turn with no real task → selector clears
        user: "Thanks, that's all for now."
        selector_pick: []
        main: {final: "You're welcome!"}
        expect: {selector_ran: true, active: []}
