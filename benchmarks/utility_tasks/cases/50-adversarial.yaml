# Harder cross-task cases with rock-solid ground truth: negation, compound
# conditions, state/tail conflict, strict thresholds, and contradiction traps.
# These deliberately probe the three tasks that were already 100% on the easy set.
cases:
  # ---- terminal_judge: later state wins, conflicts, absence, compound ------
  - id: judge-recovered-after-error
    task: terminal_judge
    category: judge-hard
    note: An early error then a clear recovery; the final state answers the question.
    input:
      goal: Start the API server.
      question: Is the server currently listening for connections?
      terminal_state: {agent_state: idle, runtime_status: running, last_output_at: "2026-07-07T10:00:00Z"}
      tail: |
        Error: EADDRINUSE :8080, retrying on next free port...
        Server listening on http://0.0.0.0:8081
    expect: {matched: true}

  - id: judge-state-tail-conflict
    task: terminal_judge
    category: judge-hard
    note: State still says running, but the tail explicitly shows a clean shutdown; trust the evidence.
    input:
      goal: Run the batch job to completion.
      question: Has the batch job process finished?
      terminal_state: {agent_state: working, runtime_status: running, last_output_at: "2026-07-07T10:00:00Z"}
      tail: |
        batch: 5000/5000 rows written
        shutting down cleanly
        process exited with code 0
    expect: {matched: true}

  - id: judge-zero-warnings-absence
    task: terminal_judge
    category: judge-hard
    note: The question asks about the ABSENCE of warnings; the tail shows some.
    input:
      goal: Compile the project cleanly.
      question: Did the build finish with zero warnings?
      terminal_state: {agent_state: idle, runtime_status: exited, last_output_at: "2026-07-07T10:00:00Z"}
      tail: |
        Build finished in 6.1s.
        3 warnings, 0 errors.
    expect: {matched: false}

  - id: judge-compound-one-fails
    task: terminal_judge
    category: judge-hard
    note: A compound question; one half is not met, so the answer is NO.
    input:
      goal: Gate the merge on tests and coverage.
      question: Did the tests pass AND coverage stay at or above 90%?
      terminal_state: {agent_state: idle, runtime_status: exited, last_output_at: "2026-07-07T10:00:00Z"}
      tail: |
        ================== 100 passed in 5.0s ==================
        coverage: 87.4%
    expect: {matched: false}

  - id: judge-succeeded-then-rolled-back
    task: terminal_judge
    category: judge-hard
    note: The deploy step reported success but a failed health check rolled it back.
    input:
      goal: Ship the new version to production.
      question: Is the new version now live in production?
      terminal_state: {agent_state: idle, runtime_status: running, last_output_at: "2026-07-07T10:00:00Z"}
      tail: |
        Deploy succeeded: v5 released to prod.
        [post-deploy] health check FAILED (503 for 90s)
        Automatic rollback complete — prod is back on v4.
    expect: {matched: false}

  # ---- extraction_verdict: OR, negation, strict threshold, paraphrase -----
  - id: verdict-or-condition
    task: extraction_verdict
    category: verdict-hard
    note: "'URL or IP' is satisfied by an IP:port even with no URL."
    input:
      condition: The result contains a URL or an IP address.
      result: |
        db connection target: 10.0.0.5:5432
    expect: {pass: true}

  - id: verdict-negated-contains-secret
    task: extraction_verdict
    category: verdict-hard
    note: A NOT condition violated by the result present in it.
    input:
      condition: The result does NOT contain any API keys or secrets.
      result: |
        config loaded ok; api_key=sk-live-abc123DEF456
    expect: {pass: false}

  - id: verdict-strict-inequality
    task: extraction_verdict
    category: verdict-hard
    note: "'strictly above 80' is NOT satisfied by exactly 80."
    input:
      condition: Coverage is strictly above 80%.
      result: |
        TOTAL coverage: 80%
    expect: {pass: false}

  - id: verdict-semantic-paraphrase
    task: extraction_verdict
    category: verdict-hard
    note: The condition is satisfied semantically, not lexically.
    input:
      condition: The result indicates the user is authenticated.
      result: |
        session established for uid=42, role=admin, mfa=verified
    expect: {pass: true}

  # ---- runbook_step_consistency: failure vs finished, self-contradiction ----
  - id: consistency-run-failed-incomplete
    task: runbook_step_consistency
    category: consistency-hard
    note: A run marked FAILED with incomplete progress is legitimate, NOT a consistency mistake.
    input:
      runbook_id: daintree.workflow.start-work-on-issue
      completed_step: 2
      status: done
      requested_next: null
      current_step_before: 2
      current_step_after: 2
      run_status_before: active
      run_status_after: failed
      notes: aborting — upstream dependency is broken, cannot continue
      progress_before: [{step: 1, status: done}, {step: 2, status: running}, {step: 3, status: pending}, {step: 4, status: pending}]
      progress_after: [{step: 1, status: done}, {step: 2, status: done}, {step: 3, status: pending}, {step: 4, status: pending}]
    expect: {matched: false}

  - id: consistency-progress-contradicts-completed
    task: runbook_step_consistency
    category: consistency-hard
    note: The recorded progress array marks the just-completed step as still pending — a self-contradiction.
    input:
      runbook_id: daintree.orchestration.competition
      completed_step: 3
      status: done
      requested_next: "4"
      current_step_before: 3
      current_step_after: 4
      run_status_before: active
      run_status_after: active
      progress_before: [{step: 1, status: done}, {step: 2, status: done}, {step: 3, status: running}]
      progress_after: [{step: 1, status: done}, {step: 2, status: done}, {step: 3, status: pending}, {step: 4, status: running}]
    expect: {matched: true}
