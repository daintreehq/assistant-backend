cases:
- id: hG-p1-rolling-queue
  category: single-runbook
  note: A list of issues plus a concurrency cap and backfill is the rolling-queue case of fan-out-work.
  active: []
  messages:
  - role: user
    content: 'queue #412 #415 #418 #420 #431 #433 #440. codex, own wt each, max 4 live, backfill as they
      finish'
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: hG-p1-relocate-running
  category: routing-trap
  note: Terminals already exist and are mid-task; the ask is to relocate them, not spawn new ones or make
    a bare worktree.
  active: []
  messages:
  - role: user
    content: claude-2 through claude-5 are all stomping on the same checkout. split them out, one wt each,
      and tell them to keep going where they were
  expect:
    required:
    - daintree.worktree.relocate-agents
    optional:
    - daintree.foundation
- id: hG-p1-shared-postgres
  category: routing-trap
  note: Worktrees colliding over one shared database is the per-worktree resource problem, not worktree
    creation or relocation.
  active: []
  messages:
  - role: user
    content: all the wts point at the same local postgres. migrations on feat/billing just wiped the seed
      data feat/search depends on. need each wt on its own db
  expect:
    required:
    - daintree.worktree.provision-local-environment
    optional:
    - daintree.foundation
- id: hG-p1-answer-two
  category: single-runbook
  note: Two healthy agents blocked on prompts; the user supplies the answer. That is answer-waiting-agent.
  active: []
  messages:
  - role: user
    content: claude-3 and codex-1 are both sitting on y/n prompts about overwriting the lockfile. yes
      to both
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
- id: hG-p1-hung-agent
  category: routing-trap
  note: Silent for 20 minutes with no question showing is a hang to triage, not a waiting prompt.
  active: []
  messages:
  - role: user
    content: codex-4 hasn't printed a thing in 20 min, no prompt, cursor just sitting there. hung or thinking?
  expect:
    required:
    - daintree.agents.recover-agent
    optional:
    - daintree.foundation
- id: hG-p1-sweep
  category: single-runbook
  note: Sweep of an already-running fleet with action is supervise-fleet.
  active: []
  messages:
  - role: user
    content: sweep the fleet. who's done, who's stuck, anything need me?
  expect:
    required:
    - daintree.orchestration.supervise-fleet
    optional:
    - daintree.foundation
- id: hG-p1-verify-claim
  category: single-runbook
  note: Checking an agent's done-claim before an irreversible merge is verify-agent-work, not review-change.
  active: []
  messages:
  - role: user
    content: claude-2 says the migration's done and the suite is green. don't trust it. confirm before
      i merge
  expect:
    required:
    - daintree.orchestration.verify-agent-work
    optional:
    - daintree.foundation
- id: hG-p1-retitle
  category: single-runbook
  note: Several same-named tabs to be retitled by what they do is terminals.rename, not a supervise report.
  active: []
  messages:
  - role: user
    content: every tab just says Claude. figure out what each one's on and retitle them
  expect:
    required:
    - daintree.terminals.rename
    optional:
    - daintree.foundation
- id: hG-p1-wake-on-exit
  category: single-runbook
  note: 'Be woken later when a terminal''s run finishes: watch-outcome.'
  active: []
  messages:
  - role: user
    content: ping me when the e2e run in build-1 exits. heading into standup
  expect:
    required:
    - daintree.orchestration.watch-outcome
    optional:
    - daintree.foundation
- id: hG-p1-delayed-spawn
  category: routing-trap
  note: A spawn scheduled for later is a deferred action, which is watch-outcome, not spawn-visible-agent.
  active: []
  messages:
  - role: user
    content: in 15 min spawn a codex in wt-perf and have it rerun the bench suite. box is pegged right
      now
  expect:
    required:
    - daintree.orchestration.watch-outcome
    optional:
    - daintree.foundation
- id: hG-p1-usage-two
  category: single-runbook
  note: Remaining plan allowance for two agent CLIs is check-usage-limits.
  active: []
  messages:
  - role: user
    content: how much weekly is left on claude code and codex? about to launch another batch and don't
      want to hit the cap mid-run
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
- id: hG-p1-state-read
  category: foundation-only
  note: 'Plain what-exists-now read of worktrees and terminals, no action: foundation alone.'
  active: []
  messages:
  - role: user
    content: which wts exist rn and which ones have a terminal attached
  expect:
    required:
    - daintree.foundation
    optional: []
- id: hG-p1-close-one
  category: foundation-only
  note: Closing ONE named terminal is a direct control-plane action owned by foundation, not workspace-cleanup.
  active: []
  messages:
  - role: user
    content: close term-7, it's the dead shell from earlier
  expect:
    required:
    - daintree.foundation
    optional: []
- id: hG-p1-teardown
  category: single-runbook
  note: Explicit request to close all terminals and delete worktrees after a fan-out is workspace-cleanup.
  active: []
  messages:
  - role: user
    content: fan-out's merged. close every one of those terminals and nuke the worktrees
  expect:
    required:
    - daintree.orchestration.workspace-cleanup
    optional:
    - daintree.foundation
- id: hG-p1-queue-continue
  category: continuation
  note: Mid-flow adjustment to a running fan-out chain stays with fan-out-work.
  active:
  - daintree.orchestration.fan-out-work
  - daintree.foundation
  messages:
  - role: user
    content: 'queue #412 #415 #418 #420, max 3 live, implement then review then pr for each'
  - role: assistant
    content: 'Three chains running (#412, #415, #418); #420 is queued. #418''s review step failed: the
      review command exited non-zero after the implementer''s commit.'
  - role: user
    content: 'drop #418, start #420 in its slot, carry on with the rest'
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: hG-p1-shift-to-memory
  category: topic-shift
  note: Explicit topic shift to saving a durable project fact while a fan-out is active.
  active:
  - daintree.orchestration.fan-out-work
  - daintree.foundation
  messages:
  - role: user
    content: 'queue #412 #415 #418, max 3 live'
  - role: assistant
    content: All three chains are running in their own worktrees.
  - role: user
    content: 'unrelated: remember that this repo runs pnpm -r test, never npm test. keep telling agents
      the wrong one'
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
- id: hG-p1-wt-plus-memory
  category: multi-runbook
  note: 'Two separate procedures: create a plain worktree with no agent, and save a durable fact.'
  active: []
  messages:
  - role: user
    content: 'make a plain wt for spike/otel off main, no agent. and save this: spike/* branches never
      get PRs, they get deleted after the writeup'
  expect:
    required:
    - daintree.memory.manage-project-memory
    - daintree.worktree.create-plain-worktree
    optional:
    - daintree.foundation
- id: hG-p1-relay-review
  category: single-runbook
  note: Reading one existing reviewer agent's output and sending it to another existing implementer, with
    calibration.
  active: []
  messages:
  - role: user
    content: codex-rev finished its pass on claude-1's branch. point claude-1 at it, weight the perf notes
      heavily, ignore the style nits
  expect:
    required:
    - daintree.agents.relay-review-feedback
    optional:
    - daintree.foundation
- id: hG-p1-converge
  category: routing-trap
  note: 'Agents cross-check each other toward ONE merged plan: multi-agent, not conversation or poll.'
  active: []
  messages:
  - role: user
    content: put claude and codex on the lock contention in the job scheduler. have them cross-check each
      other's reads and hand me one merged fix plan
  expect:
    required:
    - daintree.orchestration.multi-agent
    optional:
    - daintree.foundation
- id: hG-p1-durable-plan
  category: single-runbook
  note: 'Dependent phases that must survive turns and resume tomorrow: execute-durable-workflow.'
  active: []
  messages:
  - role: user
    content: 'track this as a plan: move auth to jose, then swap the session store, then rip out the legacy
      middleware. each step blocks the next and i''ll resume tomorrow'
  expect:
    required:
    - daintree.orchestration.execute-durable-workflow
    optional:
    - daintree.foundation
- id: hG-p1-ack
  category: no-task
  note: A bare acknowledgement mid-flow needs no procedure.
  active:
  - daintree.orchestration.supervise-fleet
  - daintree.foundation
  messages:
  - role: user
    content: sweep the fleet
  - role: assistant
    content: 'Six agents: four working, claude-2 finished (commit a41f9e2), codex-3 waiting on nothing.
      Nothing needs you right now.'
  - role: user
    content: k cool
  expect:
    required: []
    optional: []
- id: hG-p2-what-repo
  category: single-runbook
  note: 'Orientation in an inherited codebase with nothing changed: explore.repository.'
  active: []
  messages:
  - role: user
    content: Hi there! I'm pretty new to all this. I inherited this project from a friend and honestly
      have no idea what it does. Could you give me an overview?
  expect:
    required:
    - daintree.explore.repository
    optional:
    - daintree.foundation
- id: hG-p2-where-emails
  category: single-runbook
  note: Locating code in the project is explore.repository.
  active: []
  messages:
  - role: user
    content: Sorry, quick one, where's the code that actually sends the welcome emails when someone signs
      up? I've looked everywhere
  expect:
    required:
    - daintree.explore.repository
    optional:
    - daintree.foundation
- id: hG-p2-dark-mode
  category: single-runbook
  note: 'One visible agent to change files, no issue or recipe involved: spawn-visible-agent.'
  active: []
  messages:
  - role: user
    content: Would you be able to get an agent to add a dark mode toggle to my settings page? No rush,
      and thank you!
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
- id: hG-p2-ask-claude
  category: routing-trap
  note: 'The deliverable is one agent''s answer relayed back, not work: ask-and-relay rather than spawn-visible-agent.'
  active: []
  messages:
  - role: user
    content: Could you ask Claude what it thinks of my database schema and just tell me what it says?
      I want a second opinion before I launch
  expect:
    required:
    - daintree.agents.ask-and-relay
    optional:
    - daintree.foundation
- id: hG-p2-plain-worktree
  category: single-runbook
  note: 'New branch in its own worktree, explicitly no agent: create-plain-worktree.'
  active: []
  messages:
  - role: user
    content: I'd like to try out a pricing change without messing up main. Can you make a worktree on
      a new branch called experiment-pricing? I don't need an agent yet, I'll poke at it myself
  expect:
    required:
    - daintree.worktree.create-plain-worktree
    optional:
    - daintree.foundation
- id: hG-p2-blank-preview
  category: single-runbook
  note: 'Runtime rendering failure in an already-open dev preview: debug-web-app, not ci.'
  active: []
  messages:
  - role: user
    content: The dev preview panel just shows a blank white page since I changed the header component.
      It was working this morning! Can you figure out what's going on?
  expect:
    required:
    - daintree.runtime.debug-web-app
    optional:
    - daintree.foundation
- id: hG-p2-red-tests
  category: single-runbook
  note: 'Project tests failing after an upgrade: ci.diagnose-and-fix.'
  active: []
  messages:
  - role: user
    content: I bumped React to the latest version and now a bunch of my tests are failing :( Could you
      help me get them passing again?
  expect:
    required:
    - daintree.ci.diagnose-and-fix
    optional:
    - daintree.foundation
- id: hG-p2-howto-setting
  category: no-task
  note: A plain how-to about a Daintree setting is a documentation question; retrieved docs answer it
    and no runbook applies.
  active: []
  messages:
  - role: user
    content: How do I change which agent Daintree opens by default? I keep getting Claude when I'd prefer
      Codex
  expect:
    required: []
    optional: []
- id: hG-p2-mcp-disconnected
  category: routing-trap
  note: 'Daintree itself reported broken (MCP disconnected, nothing happens): diagnostics, not recipe.'
  active: []
  messages:
  - role: user
    content: Something weird is happening. I clicked to run my recipe and nothing happened at all, and
      there's a little banner saying the MCP is disconnected. Is it me?
  expect:
    required:
    - daintree.diagnostics
    optional:
    - daintree.foundation
- id: hG-p2-find-recipe
  category: single-runbook
  note: Listing and running an existing workspace recipe.
  active: []
  messages:
  - role: user
    content: I think my friend set up a recipe that starts the frontend and backend together? Could you
      find it and run it for me?
  expect:
    required:
    - daintree.recipe.run-or-create
    optional:
    - daintree.foundation
- id: hG-p2-author-recipe
  category: routing-trap
  note: Creating a recipe routes to recipe.run-or-create so the assistant can say no tool authors one.
  active: []
  messages:
  - role: user
    content: Could you make me a brand new recipe that opens three terminals, one for the api, one for
      the web app and one for the worker?
  expect:
    required:
    - daintree.recipe.run-or-create
    optional:
    - daintree.foundation
- id: hG-p2-remember-url
  category: single-runbook
  note: Saving a durable project fact.
  active: []
  messages:
  - role: user
    content: Oh, can you please remember that my staging site is staging.lanternbooks.dev? I always forget
      and have to dig through my notes
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
- id: hG-p2-recall-decision
  category: routing-trap
  note: Asking what was decided before is a memory recall, not a where-were-we session resume.
  active: []
  messages:
  - role: user
    content: Hmm, did we decide something about Stripe vs Paddle a while back? I remember talking about
      it but not what we landed on
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
- id: hG-p2-bundle
  category: single-runbook
  note: A curated context file of checkout-related code for pasting elsewhere is copytree bundle.
  active: []
  messages:
  - role: user
    content: I want to ask a chatbot for help with my checkout flow. Could you gather up all the files
      related to checkout, including the tests, into one file and copy it to my clipboard?
  expect:
    required:
    - daintree.context.curate-copytree-bundle
    optional:
    - daintree.foundation
- id: hG-p2-poll
  category: single-runbook
  note: 'Several agents vote among options the user supplied, no scoring of their own submissions: poll.'
  active: []
  messages:
  - role: user
    content: I can't decide between Postgres and SQLite for a small app. Could you ask all my agents which
      they'd pick and tell me what the consensus is?
  expect:
    required:
    - daintree.agents.poll-pinned-agents
    optional:
    - daintree.foundation
- id: hG-p2-name-contest
  category: routing-trap
  note: 'Each agent submits its own entry, then they peer-vote on each other''s: competition, not poll.'
  active: []
  messages:
  - role: user
    content: Fun idea! Could Claude, Codex and Gemini each come up with a name for my app, then vote on
      each other's suggestions? Give points and tell me who wins
  expect:
    required:
    - daintree.orchestration.competition
    optional:
    - daintree.foundation
- id: hG-p2-chat
  category: single-runbook
  note: 'Open-ended visible dialogue between agents with no synthesis or winner: conversation.'
  active: []
  messages:
  - role: user
    content: Could you get Claude and Gemini talking to each other about my onboarding flow? I'd love
      to just watch them go back and forth and see where it ends up
  expect:
    required:
    - daintree.orchestration.conversation
    optional:
    - daintree.foundation
- id: hG-p2-thanks
  category: no-task
  note: Pleasantry after an answer; nothing to do.
  active:
  - daintree.explore.repository
  - daintree.foundation
  messages:
  - role: user
    content: Where's the code that sends welcome emails?
  - role: assistant
    content: 'It''s in src/mail/welcome.ts: sendWelcome() is called from the signup handler in src/routes/auth.ts
      line 88.'
  - role: user
    content: Oh perfect, thank you so much!! That's exactly what I needed.
  expect:
    required: []
    optional: []
- id: hG-p2-where-were-we
  category: single-runbook
  note: 'Reconstructing what was in flight in an earlier session: status-and-resume.'
  active: []
  messages:
  - role: user
    content: Good morning! I closed my laptop in a hurry yesterday and can't remember what I was in the
      middle of. Where were we?
  expect:
    required:
    - daintree.orchestration.status-and-resume
    optional:
    - daintree.foundation
- id: hG-p2-signin
  category: single-runbook
  note: Wanting sign-in confirmed before relying on it is the diagnostics sign-in case even with nothing
    broken.
  active: []
  messages:
  - role: user
    content: Before I start a big job, could you check that I'm actually signed in properly? I don't want
      it to fail halfway through
  expect:
    required:
    - daintree.diagnostics
    optional:
    - daintree.foundation
- id: hG-p2-devbox
  category: single-runbook
  note: 'Pausing a worktree''s cloud devbox to save cost: manage-resource.'
  active: []
  messages:
  - role: user
    content: My cloud devbox for the feature worktree is costing me more than I expected. Could you pause
      it for now? I'll resume tomorrow
  expect:
    required:
    - daintree.worktree.manage-resource
    optional:
    - daintree.foundation
- id: hG-p2-setup-script
  category: single-runbook
  note: Configuring worktree lifecycle setup/teardown scripts for a per-worktree database.
  active: []
  messages:
  - role: user
    content: Is there a way to have a fresh database made automatically whenever I create a worktree,
      and dropped when I delete it? I keep wrecking my main one
  expect:
    required:
    - daintree.worktree.provision-local-environment
    optional:
    - daintree.foundation
- id: hG-p2-tests-continue
  category: continuation
  note: Continuing the fix-and-verify loop on the failing tests; independent verification is part of ci.diagnose-and-fix.
  active:
  - daintree.ci.diagnose-and-fix
  - daintree.foundation
  messages:
  - role: user
    content: My tests broke after updating React, can you help?
  - role: assistant
    content: The failures come from act() warnings turned into errors in React 19; three test files render
      without awaiting. I've had an agent update them to use await act(...).
  - role: user
    content: Great, thanks! Could you run them again and make sure they really pass now?
  expect:
    required:
    - daintree.ci.diagnose-and-fix
    optional:
    - daintree.foundation
- id: hG-p3-find-unassigned
  category: single-runbook
  note: Searching the backlog for unstarted work is find-issue-work.
  active: []
  messages:
  - role: user
    content: anything labeled good-first-issue that's unassigned and nobody's already got an agent on?
      want to hand one to the new hire
  expect:
    required:
    - daintree.workflow.find-issue-work
    optional:
    - daintree.foundation
- id: hG-p3-paste-ci
  category: single-runbook
  note: 'Pasted CI failure with a request to fix: ci.diagnose-and-fix.'
  active: []
  messages:
  - role: user
    content: "#391 went red overnight, fix it:\n\n--- FAIL: TestLedgerReconcile (0.42s)\n    ledger_test.go:118:\
      \ expected balance 1200, got 1180\nFAIL\nFAIL    github.com/acme/ledger/internal/reconcile  1.214s\n\
      Error: Process completed with exit code 1.\n"
  expect:
    required:
    - daintree.ci.diagnose-and-fix
    optional:
    - daintree.foundation
- id: hG-p3-approve-merge
  category: single-runbook
  note: 'Approve and squash-merge once required checks pass: land-pull-request.'
  active: []
  messages:
  - role: user
    content: 'approve #377 and squash it in once required checks are green'
  expect:
    required:
    - daintree.forge.land-pull-request
    optional:
    - daintree.foundation
- id: hG-p3-file-issue
  category: single-runbook
  note: Creating an issue with a label and assignee is manage-issue.
  active: []
  messages:
  - role: user
    content: 'file an issue: TestSyncRetry flakes about 1 in 20 on the linux runner. label it flaky and
      assign @mira'
  expect:
    required:
    - daintree.forge.manage-issue
    optional:
    - daintree.foundation
- id: hG-p3-start-one
  category: single-runbook
  note: 'One settled forge issue to start with an agent: start-work-on-issue.'
  active: []
  messages:
  - role: user
    content: 'start #402, put codex on it'
  expect:
    required:
    - daintree.workflow.start-work-on-issue
    optional:
    - daintree.foundation
- id: hG-p3-start-three
  category: routing-trap
  note: Several issues, one agent each, in parallel is fan-out-work rather than start-work-on-issue.
  active: []
  messages:
  - role: user
    content: 'kick off #402, #405 and #409 in parallel, one agent apiece'
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: hG-p3-security-review
  category: single-runbook
  note: 'Judging a PR on its merits for security problems: review-change.'
  active: []
  messages:
  - role: user
    content: 'review #395 for security problems before i look at it. it touches the token refresh path'
  expect:
    required:
    - daintree.review.review-change
    optional:
    - daintree.foundation
- id: hG-p3-reviewer-said
  category: single-runbook
  note: Reading a forge review decision is follow-up-on-issue.
  active: []
  messages:
  - role: user
    content: 'what did the reviewer say on #380? did they request changes?'
  expect:
    required:
    - daintree.workflow.follow-up-on-issue
    optional:
    - daintree.foundation
- id: hG-p3-open-pr
  category: single-runbook
  note: 'Wrap up the branch and open a PR: prep-branch-for-review.'
  active: []
  messages:
  - role: user
    content: 'the #402 branch looks done. wrap it up and open the PR'
  expect:
    required:
    - daintree.workflow.prep-branch-for-review
    optional:
    - daintree.foundation
- id: hG-p3-past-prs
  category: single-runbook
  note: Locating past pull requests by topic is find-issue-work.
  active: []
  messages:
  - role: user
    content: did we ever actually ship the rate limiter? find me the closed PRs about it
  expect:
    required:
    - daintree.workflow.find-issue-work
    optional:
    - daintree.foundation
- id: hG-p3-comment-close
  category: routing-trap
  note: Posting a closing comment and closing is follow-up-on-issue, not manage-issue.
  active: []
  messages:
  - role: user
    content: '#366 shipped in 2.4.1. comment with the release link and close it'
  expect:
    required:
    - daintree.workflow.follow-up-on-issue
    optional:
    - daintree.foundation
- id: hG-p3-reopen
  category: routing-trap
