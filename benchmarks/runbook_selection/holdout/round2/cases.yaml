cases:
- id: hD-waiting-sitting-there-prompt
  category: routing-trap
  note: '"Sitting there for ages" is recover-agent vocabulary, but the agent is showing a y/n prompt,
    i.e. healthy and ASKING. recover-agent: "Do not use when the agent is healthy and merely ASKING something
    — answer it with daintree.agents.answer-waiting-agent".'
  messages:
  - role: user
    content: codex in the third tab has been sitting there forever, turns out it's got a y/n prompt about
      overwriting package-lock.json. just tell it yes
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
  active: []
- id: hD-waiting-trust-dialog-cohort
  category: single-runbook
  note: Several agents blocked on a trust dialog (waitingReason "approval") and the user wants them answered.
    answer-waiting-agent covers "an agent blocked on a permission or trust dialog" and the fan-out case.
  messages:
  - role: user
    content: "roster says:\n  t-11 claude   waiting (approval)\n  t-12 codex    waiting (approval)\n \
      \ t-14 gemini   waiting (approval)\nthey all want to know if they can trust ~/work/ledger. yes,\
      \ they can. unblock them and tell me when they're moving again"
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
  active: []
- id: hD-recover-silent-no-prompt
  category: routing-trap
  note: Asking nothing, just silent — "hung, silent" is recover-agent, not answer-waiting-agent ("Do not
    use when the agent is asking nothing but is hung, silent...").
  messages:
  - role: user
    content: claude went quiet like 20 min ago. no question on screen, cursor isn't moving, last line
      is just 'Thinking…'. hung or just slow?
  expect:
    required:
    - daintree.agents.recover-agent
    optional:
    - daintree.foundation
  active: []
- id: hD-recover-did-it-start
  category: continuation
  note: The assistant's spawn apparently produced nothing visible; recover-agent covers "did that agent
    even start?", "nothing happened when you launched it", a launch with no terminalId.
  active:
  - daintree.edits.spawn-visible-agent
  - daintree.foundation
  messages:
  - role: user
    content: put codex on renaming the config loader to settings loader across the api package
  - role: assistant
    content: Launched Codex on the rename in the api worktree. I'll keep an eye on it and report when
      it finishes.
  - role: user
    content: uh, there's no new tab anywhere. did it even launch??
  expect:
    required:
    - daintree.agents.recover-agent
    optional:
    - daintree.foundation
- id: hD-complaint-about-own-spawn
  category: no-task
  note: 'A complaint about the assistant''s own handling while the agents are healthy. recover-agent:
    "a complaint about your own handling is not a broken agent, so answer it directly rather than opening
    a recovery".'
  active:
  - daintree.edits.spawn-visible-agent
  - daintree.foundation
  messages:
  - role: user
    content: get claude to tidy up the README
  - role: assistant
    content: Started two Claude agents in the docs worktree — one on the README structure and one on the
      install section — both are running.
  - role: user
    content: why did you start two?? i asked for one. just explain yourself
  expect:
    required: []
    optional: []
- id: hD-ask-relay-named-agent-code-question
  category: routing-trap
  note: 'Reads like repository exploration, but the user names a specific agent and wants its take relayed.
    explore.repository: "or when the user names a specific agent to ask and just wants its answer relayed
    back (use daintree.agents.ask-and-relay)".'
  messages:
  - role: user
    content: get claude to look at src/net/retry.ts and tell me if the jitter in the backoff is actually
      doing anything. dont want it touching files, i just want its opinion
  expect:
    required:
    - daintree.agents.ask-and-relay
    optional:
    - daintree.foundation
  active: []
- id: hD-poll-three-named-agents
  category: routing-trap
  note: '"Ask" vocabulary points at ask-and-relay, but it is several named agents voting among options
    with a consensus. ask-and-relay excludes polling; poll-pinned-agents covers "several named agents
    ... votes among options ... synthesized consensus".'
  messages:
  - role: user
    content: ask claude, codex and gemini which ORM they'd go with for the new service — drizzle, prisma
      or kysely — and tell me where they land overall
  expect:
    required:
    - daintree.agents.poll-pinned-agents
    optional:
    - daintree.foundation
  active: []
- id: hD-usage-weekly-cap
  category: single-runbook
  note: 'How close to a weekly cap — check-usage-limits: "how close they are to a weekly or five-hour
    cap".'
  messages:
  - role: user
    content: been hammering codex all day on the migration... am i about to run into the weekly wall?
      when does it reset
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
  active: []
- id: hD-usage-followup-other-agent
  category: continuation
  note: Terse follow-up asking the same about another agent — check-usage-limits covers "a follow-up asking
    the same about another agent".
  active:
  - daintree.agents.check-usage-limits
  - daintree.foundation
  messages:
  - role: user
    content: how much claude code usage have I got left?
  - role: assistant
    content: 'From Claude Code''s /usage screen: 41% of the current five-hour session used (resets 16:40),
      68% of the weekly limit used (resets Monday 09:00).'
  - role: user
    content: k. gemini?
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
- id: hD-usage-vs-diagnostics-trap
  category: routing-trap
  note: Mentions "credits" and "Copilot" but also "is it broken"; the ask is how many premium requests
    are left in the agent CLI — check-usage-limits ("premium requests or credits"), not diagnostics, which
    is Daintree's own health.
  messages:
  - role: user
    content: copilot keeps slowing down this afternoon, i suspect i've burned through my premium requests
      rather than anything being broken. can you find out how many are left
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
  active: []
- id: hD-relay-reviewer-to-implementer
  category: single-runbook
  note: One existing reviewer agent's notes forwarded to an existing implementer with calibration — relay-review-feedback.
  messages:
  - role: user
    content: gemini's finished its review pass on the parser branch. point the claude that's implementing
      it at those notes — style nits are optional, but the null-handling stuff is must-fix. and have it
      tell me afterwards whether the review was actually useful
  expect:
    required:
    - daintree.agents.relay-review-feedback
    optional:
    - daintree.foundation
  active: []
- id: hD-forge-review-to-agent-trap
  category: routing-trap
  note: 'Sounds like relaying review feedback, but the review lives on the forge. relay-review-feedback:
    "feedback that must first be fetched from the forge (a PR''s review decision ...) is a different job
    (use daintree.workflow.follow-up-on-issue)"; follow-up covers "forwarding forge-sourced blockers to
    the agent still working".'
  messages:
  - role: user
    content: 'sam requested changes on #412 over on github. grab what he said and pass it to the codex
      that''s still working that branch'
  expect:
    required:
    - daintree.workflow.follow-up-on-issue
    optional:
    - daintree.foundation
  active: []
- id: hD-ci-pasted-log
  category: single-runbook
  note: Pasted failing test output, user wants it working — ci.diagnose-and-fix.
  messages:
  - role: user
    content: 'FAILED tests/test_invoices.py::test_rounding_half_even - AssertionError: assert Decimal(''10.01'')
      == Decimal(''10.00'')

      FAILED tests/test_invoices.py::test_totals_with_discount - AssertionError

      ========== 2 failed, 311 passed in 41.2s ==========

      main has been red like this since yesterday''s merge. sort it out pls'
  expect:
    required:
    - daintree.ci.diagnose-and-fix
    optional:
    - daintree.foundation
  active: []
- id: hD-read-only-ci-status-trap
  category: routing-trap
  note: 'Mentions failing lint, but the user explicitly only wants the status read. follow-up-on-issue:
    "reading that a check is red is here, working out why and getting it green is daintree.ci.diagnose-and-fix".'
  messages:
  - role: user
    content: is 88 green yet or is lint still failing on it? don't fix anything, just tell me
  expect:
    required:
    - daintree.workflow.follow-up-on-issue
    optional:
    - daintree.foundation
  active: []
- id: hD-vitest-not-preview-trap
  category: routing-trap
  note: '"window is not defined" sounds like a browser runtime error, but it''s a unit test failing with
    no preview involved. debug-web-app: "Do not use for ordinary test/build CI failures without a browser
    runtime symptom (use daintree.ci.diagnose-and-fix)".'
  messages:
  - role: user
    content: 'vitest blows up with `ReferenceError: window is not defined` in Header.test.tsx, only in
      CI. can you get it passing'
  expect:
    required:
    - daintree.ci.diagnose-and-fix
    optional:
    - daintree.foundation
  active: []
- id: hD-preview-white-screen
  category: single-runbook
  note: Already-open dev preview broken at runtime with console errors — debug-web-app.
  messages:
  - role: user
    content: the dev preview panel just went white after i changed the nav component. console has a bunch
      of red about hydration mismatch. whats going on
  expect:
    required:
    - daintree.runtime.debug-web-app
    optional:
    - daintree.foundation
  active: []
- id: hD-copytree-clipboard
  category: single-runbook
  note: A curated context file for pasting elsewhere, explicitly to the clipboard — curate-copytree-bundle.
  messages:
  - role: user
    content: going to ask another tool about our billing flow. gather everything relevant — the billing
      module, the stripe webhook handler, and their tests — into one file and stick it on my clipboard
  expect:
    required:
    - daintree.context.curate-copytree-bundle
    optional:
    - daintree.foundation
  active: []
- id: hD-bundle-feeding-agent-trap
  category: routing-trap
  note: 'Uses "bundle" vocabulary, but context is only an input to launching one new agent on non-issue
    work. curate-copytree-bundle: "Do not use when context is merely an input to launching or feeding
    an agent — ... daintree.edits.spawn-visible-agent for one new agent".'
  messages:
  - role: user
    content: start claude on refactoring the billing module to use the new money type — give it a bundle
      of the billing files first so it has the context
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
  active: []
- id: hD-diagnostics-tools-vanished
  category: single-runbook
  note: Daintree's own tools are missing after an update — diagnostics ("why is this tool missing", "why
    can't I…").
  messages:
  - role: user
    content: since i updated daintree this morning you keep saying you can't see my terminals. did the
      terminal tools just disappear or something?
  expect:
    required:
    - daintree.diagnostics
    optional:
    - daintree.foundation
  active: []
- id: hD-diagnostics-signin-overnight
  category: routing-trap
  note: 'Nothing is wrong, which would suggest foundation''s "reading whether Daintree is connected",
    but the user wants SIGN-IN confirmed before relying on it. diagnostics: "wants sign-in confirmed before
    relying on it. Nothing has to be broken for the sign-in case".'
  messages:
  - role: user
    content: before i leave this running unattended overnight — can you confirm my account sign-in is
      actually good? don't want it dying at 2am
  expect:
    required:
    - daintree.diagnostics
    optional:
    - daintree.foundation
  active: []
- id: hD-foundation-connected-check
  category: foundation-only
  note: 'Plain connection check with nothing reported wrong — foundation ("reading whether Daintree is
    connected when nothing is reported wrong"); diagnostics: "A plain ''is Daintree connected?'' with
    nothing wrong is daintree.foundation".'
  messages:
  - role: user
    content: quick sanity check, nothing's wrong — are you hooked up to daintree right now?
  expect:
    required:
    - daintree.foundation
    optional: []
  active: []
- id: hD-foundation-list-worktrees
  category: foundation-only
  note: 'Plain what-exists-now read, no action. status-and-resume: "Do not use for a plain what-exists-now
    read of terminals, worktrees or queues (daintree.foundation)".'
  messages:
  - role: user
    content: which worktrees have i got at the moment? just the list, not looking to change anything
  expect:
    required:
    - daintree.foundation
    optional: []
  active: []
- id: hD-foundation-close-one-named
  category: routing-trap
  note: '"Close" is teardown vocabulary, but it is ONE named terminal. workspace-cleanup: "Do not use
    for closing ONE named terminal ... (daintree.foundation covers that)".'
  messages:
  - role: user
    content: close the terminal called scratch, i'm done with it
  expect:
    required:
    - daintree.foundation
    optional: []
  active: []
- id: hD-foundation-cancel-one-watcher
  category: routing-trap
  note: 'Watcher vocabulary points at watch-outcome, but it''s cancelling ONE watcher. watch-outcome:
    "Do not use to cancel ONE named watcher (daintree.foundation)".'
  active:
  - daintree.orchestration.watch-outcome
  - daintree.foundation
  messages:
  - role: user
    content: let me know when the e2e terminal finishes
  - role: assistant
    content: Watching the e2e terminal — I'll wake you when it completes or fails.
  - role: user
    content: actually never mind, i'm sitting here anyway. cancel that watcher
  expect:
    required:
    - daintree.foundation
    optional: []
- id: hD-spawn-watchable-change
  category: single-runbook
  note: One visible agent changing files, no forge issue, starting now — spawn-visible-agent.
  messages:
  - role: user
    content: have an agent add dark mode to the settings page. i want to watch it work in a tab
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
  active: []
- id: hD-explore-what-to-touch
  category: single-runbook
  note: Understanding, not changing — explore.repository ("what would I have to touch to add Y").
  messages:
  - role: user
    content: not asking you to build it yet, but if we wanted a second payment provider next to stripe,
      what would we actually have to touch?
  expect:
    required:
    - daintree.explore.repository
    optional:
    - daintree.foundation
  active: []
- id: hD-explore-long-paste-where
  category: single-runbook
  note: A pasted log is only context; the ask is where the code lives and how it works — the deliverable
    is an explanation. explore.repository ("find the code that does Z"); not ci because nothing is failing
    and the user wants understanding.
  messages:
  - role: user
    content: '[2026-09-20 10:14:02] INFO  sched: tick lag=3ms

      [2026-09-20 10:14:02] INFO  sched: requeued 4 jobs (lease expired)

      [2026-09-20 10:14:07] INFO  sched: tick lag=2ms

      this isn''t an error or anything, the system''s fine. i just have no idea what code produces the
      "requeued ... lease expired" line or how the lease thing works. can you find it and explain'
  expect:
    required:
    - daintree.explore.repository
    optional:
    - daintree.foundation
  active: []
- id: hD-land-squash
  category: single-runbook
  note: Merge action on a PR — land-pull-request ("merge, squash or rebase it").
  messages:
  - role: user
    content: reviews are in and it's all green. squash 214 in
  expect:
    required:
    - daintree.forge.land-pull-request
    optional:
    - daintree.foundation
  active: []
- id: hD-land-request-reviewers-trap
  category: routing-trap
  note: '"Review" vocabulary points at review-change/prep-branch, but the ask is a PR lifecycle action.
    land-pull-request: "request changes or reviewers, mark it ready or draft".'
  messages:
  - role: user
    content: take 219 out of draft and add priya and tom as reviewers
  expect:
    required:
    - daintree.forge.land-pull-request
    optional:
    - daintree.foundation
  active: []
- id: hD-issue-intake-from-paste
  category: single-runbook
  note: Turn a bug into an issue, label and assign — manage-issue.
  messages:
  - role: user
    content: "customer sent this:\n  TypeError: Cannot read properties of undefined (reading 'currency')\n\
      \    at formatTotal (checkout.ts:88)\nfile it on the storefront repo, label it bug + p1, assign\
      \ it to me"
  expect:
    required:
    - daintree.forge.manage-issue
    optional:
    - daintree.foundation
  active: []
- id: hD-comment-and-close-trap
  category: routing-trap
  note: 'Issue-editing vocabulary, but commenting and closing belongs elsewhere. manage-issue: "Do not
    use to ... add a closing comment and close it (use daintree.workflow.follow-up-on-issue)".'
  messages:
  - role: user
    content: 'drop a comment on #301 saying this is fixed in 2.4 and close it out'
  expect:
    required:
    - daintree.workflow.follow-up-on-issue
    optional:
    - daintree.foundation
  active: []
- id: hD-reopen-issue
  category: routing-trap
  note: Follows "is it fixed" territory (follow-up) but the ask is reopening — manage-issue ("reopen an
    issue").
  messages:
  - role: user
    content: 'welp, the fix for #301 didn''t take, same crash on 2.4.1. reopen it'
  expect:
    required:
    - daintree.forge.manage-issue
    optional:
    - daintree.foundation
  active: []
- id: hD-memory-save-rule
  category: single-runbook
  note: Durable project fact to remember — manage-project-memory.
  messages:
  - role: user
    content: 'from now on remember this: never run migrations against staging from a worktree, only from
      main'
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
  active: []
- id: hD-memory-recall-vs-resume-trap
  category: routing-trap
  note: '"A couple of weeks back" sounds like resuming past sessions, but the ask is what was DECIDED.
    manage-project-memory: "asks what was decided before (''what did we agree about the API shape?'')";
    status-and-resume is for what was in flight.'
  messages:
  - role: user
    content: what did we end up agreeing on for pagination in the public api a couple weeks back? cursor
      or offset?
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
  active: []
- id: hD-memory-topic-shift
  category: topic-shift
  note: Mid-fleet-sweep topic shift to a durable fact correction — manage-project-memory ("that's not
    true any more").
  active:
  - daintree.orchestration.supervise-fleet
  - daintree.foundation
  messages:
  - role: user
    content: how's everyone doing
  - role: assistant
    content: 'Four agents: two finished (tests green on both), one still working on the exporter, one
      waiting on nothing and idle. Nothing needs you right now.'
  - role: user
    content: cool. unrelated but the thing you have saved about us using yarn — that's not true any more,
      we moved to pnpm. fix it
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
- id: hD-competition-own-submissions
  category: single-runbook
  note: Each agent submits its own entry, then they peer-vote with points — competition.
  messages:
  - role: user
    content: get claude, codex and gemini to each come up with a name for the new CLI, then have them
      vote on each other's without knowing who wrote what. 3 pts for first, 1 for second
  expect:
    required:
    - daintree.orchestration.competition
    optional:
    - daintree.foundation
  active: []
- id: hD-scored-vote-supplied-options-trap
  category: routing-trap
  note: 'Points and a tally sound like a competition, but the options are user-supplied. competition:
    "A vote over options YOU supplied, even one scored and tallied, is a fleet poll, not a competition".'
  messages:
  - role: user
    content: 'four candidate names: forge, anvil, kiln, bellows. have the pinned agents rank them 3/2/1
      and tally up the points'
  expect:
    required:
    - daintree.agents.poll-pinned-agents
    optional:
    - daintree.foundation
  active: []
- id: hD-runoff-after-tie
  category: continuation
  note: Tie in a peer vote, user wants a runoff with the same voters — runoff-tiebreaker.
  active:
  - daintree.orchestration.competition
  - daintree.foundation
  messages:
  - role: user
    content: have the four agents each pitch a logo concept and peer vote
  - role: assistant
    content: 'Final tally: Claude 5, Codex 5, Gemini 3, Grok 1 — a tie between Claude and Codex.'
  - role: user
    content: ugh. do another round with just those two pitching again, same four voting
  expect:
    required:
    - daintree.orchestration.runoff-tiebreaker
    optional:
    - daintree.foundation
- id: hD-conversation-open-ended
  category: single-runbook
  note: Open-ended visible back-and-forth, no synthesis target — conversation ("let them talk to each
    other", "see where it goes").
  messages:
  - role: user
    content: let claude and codex chat about whether we should go monorepo. don't steer it, i just want
      to see where they end up going
  expect:
    required:
    - daintree.orchestration.conversation
    optional:
    - daintree.foundation
  active: []
- id: hD-multi-agent-converge-trap
  category: routing-trap
  note: '"Debate" vocabulary, but the target is one converged answer with no vote-off. multi-agent: "debate
    until they converge ... the deliverable is the ONE answer you assemble"; debate-elimination excludes
    "a collaborative debate that ends in one synthesized answer with no vote-off".'
  messages:
  - role: user
    content: have codex and claude debate the memory leak theory, cross-check each other until they actually
      agree, then give me the one explanation they converge on
  expect:
    required:
    - daintree.orchestration.multi-agent
    optional:
    - daintree.foundation
  active: []
- id: hD-elimination-mid-debate
  category: continuation
  note: Elimination request arriving mid-debate — debate-elimination ("including when the elimination
    request arrives mid-debate").
  active:
  - daintree.orchestration.conversation
  - daintree.foundation
  messages:
  - role: user
    content: get the three of them talking about sql vs nosql for the events store
  - role: assistant
    content: Round 2 done. Claude still argues Postgres with JSONB, Codex wants DynamoDB, Gemini is pushing
      ClickHouse for the analytics side.
  - role: user
    content: they're going in circles. have each one vote on whose position is weakest and kick that one
      out
  expect:
    required:
    - daintree.orchestration.debate-elimination
    optional:
    - daintree.foundation
- id: hD-interview-grill-verify
  category: single-runbook
  note: One agent grills the others, verifies claims, names a winner — interview.
  messages:
  - role: user
    content: i need a pair programmer for the caching rewrite. have opus grill codex and gemini on how
      they'd do it, check their claims against the actual code, and tell me who wins
  expect:
    required:
    - daintree.orchestration.interview
    optional:
    - daintree.foundation
  active: []
- id: hD-durable-migration
  category: single-runbook
  note: Multi-step dependent phases surviving turns — execute-durable-workflow.
  messages:
  - role: user
    content: we're ripping moment out for date-fns. shared utils first, then web and api (both depend
      on utils), then delete moment. i'll be dipping in and out over a few days so track it properly and
      let me resume
  expect:
    required:
    - daintree.orchestration.execute-durable-workflow
    optional:
    - daintree.foundation
  active: []
- id: hD-fanout-issue-list
  category: single-runbook
  note: A batch of independent issues, one agent per worktree — fan-out-work.
  messages:
  - role: user
    content: 'these are all independent:

      - #501 dark mode toggle flicker

      - #507 csv export drops unicode

      - #512 tooltip overflow on mobile

      - #518 missing alt text on avatars

      one agent each, own worktrees, go'
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
  active: []
- id: hD-rolling-queue-vs-timer-trap
  category: routing-trap
