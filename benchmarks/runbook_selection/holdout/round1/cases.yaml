cases:
- id: hA-waiting-overwrite-yes
  category: single-runbook
  note: A running agent is blocked on a typed question and the user wants it answered and the result reported
    — answer-waiting-agent ("the agent is asking something, tell it yes").
  messages:
  - role: user
    content: the codex one in tab 3 is sitting there asking if it should overwrite the old migration file.
      just tell it yes and let me know what it does after
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
- id: hA-waiting-trust-folder
  category: single-runbook
  note: An agent blocked on a trust dialog is waitingReason "approval", which answer-waiting-agent explicitly
    covers ("it's asking whether to trust the folder").
  messages:
  - role: user
    content: claude popped up one of those trust-this-directory things for the new packages folder. go
      ahead and ok it so it can carry on
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
- id: hA-ask-gemini-session-expiry
  category: single-runbook
  note: One named agent, one question, and the deliverable is its answer relayed back — ask-and-relay;
    review-change and explore.repository both carve out "the user names a specific agent to ask and just
    wants its answer relayed back".
  messages:
  - role: user
    content: can you get gemini to have a look at how we handle session expiry in src/auth and tell me
      whether anything seems off to it
  expect:
    required:
    - daintree.agents.ask-and-relay
    optional:
    - daintree.foundation
- id: hA-usage-codex-week
  category: single-runbook
  note: How much of an agent CLI's plan allowance is left against a weekly cap — check-usage-limits.
  messages:
  - role: user
    content: how much codex have i got left this week before it starts refusing me? been hammering it
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
- id: hA-usage-claude-refill
  category: single-runbook
  note: Remaining allowance and when it resets for Claude Code — check-usage-limits ("when an agent's
    usage resets").
  messages:
  - role: user
    content: claude code keeps nagging me that im close to the cap. whats actually remaining and when
      does it refill
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
- id: hA-poll-sqlite-postgres
  category: single-runbook
  note: Independent opinions from the pinned fleet synthesized into a consensus — poll-pinned-agents.
  messages:
  - role: user
    content: quick gut check — ask my pinned agents whether the local cache should be sqlite or postgres,
      and tell me where they land overall
  expect:
    required:
    - daintree.agents.poll-pinned-agents
    optional:
    - daintree.foundation
- id: hA-recover-blank-tab
  category: single-runbook
  note: A launched agent showing nothing and possibly never started — recover-agent ("nothing happened
    when you launched it", "is it hung or just slow?").
  messages:
  - role: user
    content: i kicked off that refactor agent like 10 mins ago and the tab is just blank. no output, nothing.
      did it even start or is it dead?
  expect:
    required:
    - daintree.agents.recover-agent
    optional:
    - daintree.foundation
- id: hA-relay-payment-review
  category: single-runbook
  note: Read an existing reviewer agent's output and point the implementer agent at it with calibration
    on how to weigh it — relay-review-feedback.
  messages:
  - role: user
    content: the reviewer codex is done going over the payment changes. point the claude that wrote them
      at its notes — the style nitpicks it can mostly ignore but take the concurrency stuff seriously.
      have it tell me if the review was actually useful
  expect:
    required:
    - daintree.agents.relay-review-feedback
    optional:
    - daintree.foundation
- id: hA-competition-cli-names
  category: single-runbook
  note: Each agent produces its own submission, then peer-votes on the others' and a winner is tallied
    — the two-stage signal of competition.
  messages:
  - role: user
    content: get claude, codex and gemini to each come up with a name for the new cli tool, then show
      each of them the other two's names and have them pick the best one (no voting for yourself). tell
      me who wins
  expect:
    required:
    - daintree.orchestration.competition
    optional:
    - daintree.foundation
- id: hA-conversation-monorepo-chat
  category: single-runbook
  note: An open-ended live back-and-forth between two agents with no judge, vote or synthesis target —
    conversation ("let them talk to each other", "see where it goes").
  messages:
  - role: user
    content: i want claude and gemini chatting about whether monorepos are worth the pain. keep passing
      what each says to the other for a while, im just curious where it goes
  expect:
    required:
    - daintree.orchestration.conversation
    optional:
    - daintree.foundation
- id: hA-debate-kick-weakest
  category: single-runbook
  note: Several agents debate, then vote off the weakest position — debate-elimination.
  messages:
  - role: user
    content: have the four agents argue it out over redux vs zustand vs signals vs plain context for the
      dashboard, then get them to boot whoever made the weakest case
  expect:
    required:
    - daintree.orchestration.debate-elimination
    optional:
    - daintree.foundation
- id: hA-interview-pair-programmer
  category: single-runbook
  note: One agent questions several others and a winner is picked — interview ("which of these should
    be my pair programmer?").
  messages:
  - role: user
    content: need to choose one agent to pair with on the rust rewrite. let codex grill claude, gemini
      and kimi about our codebase, check whether what they say is true, and pick one for me
  expect:
    required:
    - daintree.orchestration.interview
    optional:
    - daintree.foundation
- id: hA-multiagent-logging-proposal
  category: single-runbook
  note: Two agents collaborate and cross-check toward ONE merged deliverable — multi-agent ("the deliverable
    is the ONE answer you assemble").
  messages:
  - role: user
    content: get kimi and claude to jointly put together one proposal for the logging overhaul — have
      them cross check each others drafts and iterate, then hand me the single combined version
  expect:
    required:
    - daintree.orchestration.multi-agent
    optional:
    - daintree.foundation
- id: hA-runoff-two-two
  category: single-runbook
  note: A peer vote ended in a tie and the user wants a runoff with the same electorate — runoff-tiebreaker.
  messages:
  - role: user
    content: ugh 2-2 between gemini's entry and codex's. run it again just between those two, same voters
      as before
  expect:
    required:
    - daintree.orchestration.runoff-tiebreaker
    optional:
    - daintree.foundation
- id: hA-verify-migration-done
  category: single-runbook
  note: An agent claims done with tests passing and the next step (push) is irreversible — verify-agent-work
    ("it says the tests pass, confirm that").
  messages:
  - role: user
    content: the migration agent reckons it's finished and everything's green. before i push anything
      can you make sure that's actually true
  expect:
    required:
    - daintree.orchestration.verify-agent-work
    optional:
    - daintree.foundation
- id: hA-spawn-pagination
  category: single-runbook
  note: One visible agent to change project files now, with no issue, recipe or cohort involved — spawn-visible-agent
    is the fallback single-agent path.
  messages:
  - role: user
    content: open up a claude agent and have it add cursor pagination to the /orders endpoint. i'd like
      to watch it do it
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
- id: hA-trap-ask-codex-quota
  category: routing-trap
  note: '"Ask codex" reads like ask-and-relay, but the deliverable is account figures from the agent''s
    own usage screen — check-usage-limits ("never an answer the agent composes"), and check-usage-limits
    excludes putting a question about code to an agent.'
  messages:
  - role: user
    content: ask codex how many requests it has left on my plan
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
- id: hA-trap-pinned-agents-implement
  category: routing-trap
  note: Mentions the pinned agents, but each gets its own unit of real work — poll-pinned-agents says
    "Do not use when each agent is instead to be given its own unit of real work (use daintree.orchestration.fan-out-work)".
  messages:
  - role: user
    content: 'hand each of my pinned agents one of #412, #415 and #418 to implement, each in its own worktree'
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: hA-trap-scored-vote-on-my-options
  category: routing-trap
  note: 'Points and a tally sound like competition, but the options are the user''s own — competition:
    "A vote over options YOU supplied, even one scored and tallied, is a fleet poll".'
  messages:
  - role: user
    content: 'have the whole fleet vote: option A is redis, option B is an in-memory LRU. give a point
      per vote, tally it up and tell me which wins'
  expect:
    required:
    - daintree.agents.poll-pinned-agents
    optional:
    - daintree.foundation
- id: hA-trap-stuck-but-asking
  category: routing-trap
  note: 'The user says "stuck", but the agent is healthy and asking a question — recover-agent: "Do not
    use when the agent is healthy and merely ASKING something — answer it with daintree.agents.answer-waiting-agent".'
  messages:
  - role: user
    content: codex looks stuck... oh wait, scrolling up it's asking whether it's allowed to reset the
      dev db. yeah tell it that's fine
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
- id: hA-trap-debate-until-agree
  category: routing-trap
  note: '"Debate" suggests debate-elimination, but it ends in one synthesized answer with no vote-off
    — debate-elimination excludes "a collaborative debate that ends in one synthesized answer (use daintree.orchestration.multi-agent)".'
  messages:
  - role: user
    content: have claude and codex debate the cache invalidation design until they actually agree, then
      give me the one plan they settle on
  expect:
    required:
    - daintree.orchestration.multi-agent
    optional:
    - daintree.foundation
- id: hA-trap-forge-review-to-agent
  category: routing-trap
  note: 'Forwarding review feedback resembles relay-review-feedback, but the review lives on the forge
    — relay-review-feedback: "feedback that must first be fetched from the forge (a PR''s review decision...)
    is a different job (use daintree.workflow.follow-up-on-issue)".'
  messages:
  - role: user
    content: 'the reviewer left a bunch of comments on PR #88 on github. pull them and pass them along
      to the claude that''s still working on that branch'
  expect:
    required:
    - daintree.workflow.follow-up-on-issue
    optional:
    - daintree.foundation
- id: hA-trap-delayed-spawn
  category: routing-trap
  note: The verb is "spawn", but the action is deferred — watch-outcome covers "a delayed spawn is a scheduled
    action... do not fall through to daintree.edits.spawn-visible-agent".
  messages:
  - role: user
    content: in 20 minutes spin up a claude agent and have it run the e2e suite, i'll be in a meeting
  expect:
    required:
    - daintree.orchestration.watch-outcome
    optional:
    - daintree.foundation
- id: hA-trap-judge-agent-code
  category: routing-trap
  note: About an agent's output, but the ask is whether the code is good — verify-agent-work excludes
    judging "a change on its merits rather than check a claim about it (daintree.review.review-change)".
  messages:
  - role: user
    content: look over what the agent wrote for the parser rewrite — is it any good? anything you'd change?
  expect:
    required:
    - daintree.review.review-change
    optional:
    - daintree.foundation
- id: hA-trap-get-agent-to-refactor
  category: routing-trap
  note: '"Get an agent to look at the auth module" echoes ask-and-relay, but the deliverable is work —
    ask-and-relay: "Do not use when the deliverable is WORK rather than an answer — implementing, refactoring...
    (use daintree.edits.spawn-visible-agent)".'
  messages:
  - role: user
    content: get an agent to look at the auth module and refactor it onto the new TokenService, the old
      helper functions can go
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
- id: hA-trap-anyone-stuck-sweep
  category: routing-trap
  note: '"Stuck" suggests recover-agent, but this is a routine sweep of the running fleet — recover-agent
    excludes "routine triage of a fleet where nothing is broken (daintree.orchestration.supervise-fleet)",
    whose whenToUse lists "is anyone stuck?".'
  messages:
  - role: user
    content: how's everybody getting on? is anyone stuck or needing me for anything?
  expect:
    required:
    - daintree.orchestration.supervise-fleet
    optional:
    - daintree.foundation
- id: hA-cont-competition-collect-votes
  category: continuation
  note: The competition is mid-run with submissions in hand; asking for the peer votes and a winner is
    the second stage of the same loaded runbook.
  active:
  - daintree.orchestration.competition
  messages:
  - role: user
    content: have claude, codex and gemini each give me their single favourite obscure git trick, then
      score them
  - role: assistant
    content: 'All three have submitted: claude suggested `git worktree`, codex suggested `git rerere`,
      gemini suggested `git bisect run`. Ready for the peer vote.'
  - role: user
    content: cool, send each of them the other two and get the votes in, then who won
  expect:
    required:
    - daintree.orchestration.competition
    optional:
    - daintree.foundation
- id: hA-cont-debate-vote-off
  category: continuation
  note: debate-elimination explicitly covers "when the elimination request arrives mid-debate"; the loaded
    runbook keeps working.
  active:
  - daintree.orchestration.debate-elimination
  messages:
  - role: user
    content: get the three agents debating tabs vs spaces for the go codebase, and we'll vote one off
      at the end
  - role: assistant
    content: Round 2 is done — claude argues gofmt settles it, codex argues for tabs on accessibility
      grounds, gemini is holding out for spaces. Want another round?
  - role: user
    content: nah thats enough, time to vote someone off
  expect:
    required:
    - daintree.orchestration.debate-elimination
    optional:
    - daintree.foundation
- id: hA-shift-conversation-to-usage
  category: topic-shift
  note: A conversation between agents is loaded, but the new turn asks how much Claude allowance remains
    — check-usage-limits, not the loaded conversation runbook.
  active:
  - daintree.orchestration.conversation
  messages:
  - role: user
    content: let claude and gemini keep talking about the plugin architecture, i'll check in
  - role: assistant
    content: Round 6 relayed — gemini is now pushing back on claude's idea of a shared event bus.
  - role: user
    content: hold on, all these rounds must be chewing through claude. how much have i got left before
      the five hour limit
  expect:
    required:
    - daintree.agents.check-usage-limits
    optional:
    - daintree.foundation
- id: hA-shift-competition-tie-runoff
  category: topic-shift
  note: The competition ended tied and the user asks for a runoff with the same cohort — runoff-tiebreaker,
    and competition is not for continuing past a tie ("or a runoff after a tie (runoff-tiebreaker)").
  active:
  - daintree.orchestration.competition
  messages:
  - role: user
    content: have the four agents each suggest a mascot for the project and peer vote
  - role: assistant
    content: 'Votes tallied: claude''s axolotl and kimi''s pangolin got 2 votes each, the other two got
      none. It''s a tie.'
  - role: user
    content: lol ok, do a runoff between the axolotl and the pangolin with the same four voting
  expect:
    required:
    - daintree.orchestration.runoff-tiebreaker
    optional:
    - daintree.foundation
- id: hA-none-thanks-contest
  category: no-task
  note: Pure thanks after a finished contest; nothing asks for a procedure.
  messages:
  - role: user
    content: haha that was fun, thanks for running that!
  expect:
    required: []
    optional: []
- id: hA-none-signoff
  category: no-task
  note: Sign-off small talk with no request.
  messages:
  - role: user
    content: ok thats everything for today, cheers
  expect:
    required: []
    optional: []
- id: hA-foundation-which-agents-open
  category: foundation-only
  note: A plain what-exists-right-now read of agents with no action — daintree.foundation; supervise-fleet
    excludes "a plain state read with no action (daintree.foundation)".
  messages:
  - role: user
    content: which agents have i got open at the moment?
  expect:
    required:
    - daintree.foundation
    optional: []
- id: hA-foundation-focus-codex
  category: foundation-only
  note: Focusing ONE terminal is a single direct control-plane action covered by daintree.foundation.
  messages:
  - role: user
    content: bring the codex terminal to the front for me
  expect:
    required:
    - daintree.foundation
    optional: []
- id: hA-foundation-cancel-one-watcher
  category: foundation-only
  note: Cancelling ONE watcher is daintree.foundation; watch-outcome and workspace-cleanup both carve
    out "cancel ONE named watcher (daintree.foundation)".
  messages:
  - role: user
    content: cancel that watcher you set on the build agent, i dont need it anymore
  expect:
    required:
    - daintree.foundation
    optional: []
- id: hB-db-upgrade-phased-tracked
  category: single-runbook
  note: Multi-phase goal with ordered dependent steps that must survive the app closing — execute-durable-workflow
    ("substantial multi-step goal with dependent phases that must survive turns, restarts … migrations").
  messages:
  - role: user
    content: 'We have to move off Postgres 13 to 16. Order is: schema changes, then backfill the new columns,
      then flip the app over, then verify nothing broke. Each step depends on the last. I want this tracked
      properly so if I quit the app tonight we can pick it straight back up tomorrow at the right step.'
  expect:
    required:
    - daintree.orchestration.execute-durable-workflow
    optional:
    - daintree.foundation
- id: hB-four-unrelated-tickets-codex-each
  category: single-runbook
  note: Several independent issues, one agent per worktree running a command sequence — fan-out-work ("BATCH
    of independent issues … implement each issue, then review it, then prepare its PR").
  messages:
  - role: user
    content: '#412, #415, #419 and #420 have nothing to do with each other. put a codex on each one in
      its own worktree and have each do /implement then /review then /pr. if one blows up don''t hold
      the others back'
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: hB-lint-tickets-max-four
  category: single-runbook
  note: A list of work plus a concurrency cap and refill-on-finish is the rolling queue that fan-out-work
    owns ("no more than 6 at a time", "start the next one whenever one finishes").
  messages:
  - role: user
    content: there are ~25 tiny lint cleanup tickets labelled good-first-issue. grind through all of them,
      but never more than 4 agents going at the same time — when one wraps up kick off the next
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: hB-back-from-weekend
  category: single-runbook
  note: Reconstructing what was in flight in an earlier session is status-and-resume ("where were we …
    pick up / resume something from an earlier session").
  messages:
  - role: user
    content: ok back after the long weekend and my brain is empty. what was I in the middle of on friday
      and what's still hanging open?
  expect:
    required:
    - daintree.orchestration.status-and-resume
    optional:
    - daintree.foundation
- id: hB-six-claudes-sort-them-out
  category: single-runbook
  note: Agents already running, user wants the whole set swept and acted on — supervise-fleet ("anything
    need me?", "is anyone stuck?").
  messages:
  - role: user
    content: I've got like six claudes grinding away in different tabs. go through them all, deal with
      whatever you can, and just tell me the ones that actually need me
  expect:
    required:
    - daintree.orchestration.supervise-fleet
    optional:
    - daintree.foundation
- id: hB-e2e-ping-when-done
  category: single-runbook
  note: Wants to be woken later when a long run finishes — watch-outcome ("let me know when the build
    finishes").
  messages:
  - role: user
    content: the e2e suite in the build terminal takes about 40 mins. I'm going to grab lunch, give me
      a shout when it's finished and tell me if it passed
  expect:
    required:
    - daintree.orchestration.watch-outcome
    optional:
    - daintree.foundation
- id: hB-post-contest-teardown
  category: single-runbook
  note: Explicit teardown of several terminals and worktrees after a competition — workspace-cleanup ("shut
    it all down", "delete that worktree").
  messages:
  - role: user
    content: right, the bake-off is done and I've got what I need. close all those contestant terminals
      and get rid of the worktrees they were using
  expect:
    required:
    - daintree.orchestration.workspace-cleanup
    optional:
    - daintree.foundation
- id: hB-mcp-red-no-terminal-tools
  category: single-runbook
  note: Daintree itself misbehaving — missing tools and a disconnected MCP indicator — is diagnostics
    ("the MCP is disconnected", "why is this tool missing").
  messages:
  - role: user
    content: something's off with the app — you keep telling me you don't have any terminal tools, and
      the little MCP light in the corner is red. what's going on
  expect:
    required:
    - daintree.diagnostics
    optional:
    - daintree.foundation
- id: hB-errors-for-bug-report
  category: single-runbook
  note: Showing recent Daintree errors for a bug report is diagnostics ("show recent Daintree errors or
    notifications, wants diagnostics for a bug report").
  messages:
  - role: user
    content: I'm filing a bug with the daintree folks. can you dig out whatever errors the app has logged
      recently plus any notifications so I can paste them in?
  expect:
    required:
    - daintree.diagnostics
    optional:
    - daintree.foundation
- id: hB-we-deploy-with-fly-now
  category: single-runbook
  note: A durable project fact to keep for later sessions — manage-project-memory ("remember that we use
    pnpm").
  messages:
  - role: user
    content: 'heads up for the future: this project deploys to fly.io now, not vercel. we switched last
      month. don''t suggest vercel stuff anymore'
  expect:
    required:
    - daintree.memory.manage-project-memory
    optional:
    - daintree.foundation
- id: hB-billing-webhook-reference-file
  category: single-runbook
  note: The deliverable is a deliberately selected context file for a later handoff — curate-copytree-bundle
    ("bundle everything relevant to X, including supporting files and tests").
  messages:
  - role: user
    content: a contractor's picking up the stripe webhook stuff next week. can you put together one file
      with everything they'd need — the webhook handlers, the models they write to, the related tests.
      no need to do anything else, just the file
  expect:
    required:
    - daintree.context.curate-copytree-bundle
    optional:
    - daintree.foundation
- id: hB-tabs-all-say-claude
  category: single-runbook
  note: New tab titles for several same-named agents — terminals.rename ("several agents share the same
    name (e.g. all "Claude") and need to be told apart").
  messages:
  - role: user
    content: my tab bar is just claude claude claude claude claude. can you work out what each one is
      actually doing and label them so I can tell them apart
  expect:
    required:
    - daintree.terminals.rename
    optional:
    - daintree.foundation
- id: hB-list-saved-recipes-then-apply
  category: single-runbook
  note: Listing and running an existing workspace recipe is recipe.run-or-create ("list, inspect, load,
    run or apply an existing Daintree workspace recipe").
  messages:
  - role: user
    content: what recipes have i got saved in this workspace? whichever one has the storybook terminal
      in it, fire that up
  expect:
    required:
    - daintree.recipe.run-or-create
    optional:
    - daintree.foundation
- id: hB-trap-remind-to-check-agents
  category: routing-trap
  note: Mentions checking agents (supervise-fleet vocabulary) but asks for something LATER — watch-outcome
    ("remind me in an hour"); supervise-fleet excludes "watching past this turn".
  messages:
  - role: user
    content: remind me in an hour to go check on the agents, I'm heading into a meeting
  expect:
    required:
    - daintree.orchestration.watch-outcome
    optional:
    - daintree.foundation
- id: hB-trap-one-codex-frozen
  category: routing-trap
