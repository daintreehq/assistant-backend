  category: single-runbook
  host_state: {hosts: none}
  messages:
  - role: user
    content: The CSV importer chokes on files that start with a byte-order mark. Get an agent to fix it in this repo.
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
  note: 'Deciding clause: "any request to CHANGE project code or files that no more specific workflow owns" (daintree.edits.spawn-visible-agent).'
- id: refresh-signoff-control-local-with-hosts
  category: routing-trap
  host_state: {hosts: connected}
  messages:
  - role: user
    content: Rename the fetchUser helper to loadUser across this project and fix the call sites. Do it here on this Mac, not on the other machines.
  expect:
