    forbid:
    - daintree.agents.choose-agent-model
  note: 'Deciding clause: choose-agent-model excludes "the user having named the agent and any model or effort (daintree.edits.spawn-visible-agent)".'
- id: refresh-signoff-control-plain-feature
  category: single-runbook
  messages:
  - role: user
    content: The user wants a dark mode toggle in the dashboard header that persists across reloads.
  expect:
