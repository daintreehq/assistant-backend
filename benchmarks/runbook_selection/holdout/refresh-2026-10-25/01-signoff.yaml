  note: 'Deciding clause: "any request to CHANGE project code or files ... The work goes to ONE visible agent" (daintree.edits.spawn-visible-agent).'
- id: refresh-signoff-control-sign-off
  category: no-task
  messages:
  - role: user
    content: Great, thanks. That's all for today.
  expect:
    required: []
  note: 'No task: nothing to change, read or orchestrate; daintree.foundation is loaded "ALONE only when no runbook squarely matches" a Daintree request, and this is none.'
