# daintree.hosts.steer-swarm: the hub stopping or correcting a run it already sent to one or
# several Remote Hosts. Messages no host has read are withdrawn; each host that has read its
# task gets a scoped stop or correction for its own assistant to carry out; every host is
# reported as acknowledged, already finished, unresolved or disconnected from its assistant's
# answer, never from a canceled record.
#
# Recall: the issue's three requests, an agent-phrased task description, a casual line, and
# one case per situation the procedure has to get right (a host offline, a cancel already
# pressed, one host of several, a correction to one host). Traps: this runbook wins against the
# receiving machine's own steering (daintree.hosts.steer-for-hub), local steering
# (daintree.agents.steer-running-agent), local parking (daintree.orchestration.park-work),
# sending work (daintree.hosts.delegate-to-host, daintree.hosts.swarm-fan-out) and catching up
# or cleaning up (daintree.hosts.recover-and-clean-up); and the reverse traps, where each
# neighbour keeps its own request and this runbook must not ride along.

cases:
  # ------------------------------------------------------------------ recall
  - id: steer-swarm-issue-stop-confirm
    category: single-runbook
    note: >-
      The issue's first request. Decided by "wants work they ALREADY SENT to their other
      machines", "STOPPED, CALLED OFF or CHANGED while it is under way" and "each worker's
      state as its answer gives it". At base it selected daintree.hosts.steer-for-hub, the
      receiving lane's runbook.
    messages:
      - role: user
        content: Stop the work I delegated to every host and confirm the agents actually stopped.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-issue-acceptance-change
    category: single-runbook
    note: >-
      The issue's second request, a correction that keeps the rest of the brief: "STOPPED,
      CALLED OFF or CHANGED while it is under way" and "the stop or correction delivered to
      that host's own assistant". At base it went to daintree.edits.spawn-visible-agent,
      daintree.memory.manage-project-memory and daintree.forge.land-pull-request.
    messages:
      - role: user
        content: Change the swarm's acceptance criteria, keeping the rest of its brief.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-issue-cancel-acknowledged
    category: single-runbook
    note: >-
      The issue's third request: "STOPPED, CALLED OFF" and "each worker's state as its answer
      gives it (acknowledged, finished, unresolved, disconnected)". At base
      daintree.hosts.steer-for-hub, daintree.worktree.manage-resource and the foundation.
    messages:
      - role: user
        content: Cancel the remote run and show which workers acknowledged the stop.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-agent-phrased
    category: single-runbook
    note: >-
      How a hub agent describes the task to search_runbooks, with the run's state observed:
      "one run on one or several Remote Hosts, STOPPED, CALLED OFF" and "The deliverable is,
      per host, the stop or correction delivered to that host's own assistant and each
      worker's state as its answer gives it".
    messages:
      - role: user
        content: The person wants the cross-host run called off. One host hasn't read its task yet and two are working on it. Stop it everywhere and say, per host, what state each worker ended in.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-user-abort
    category: single-runbook
    note: >-
      Casual and short: "STOPPED, CALLED OFF or CHANGED while it is under way", every host. At
      base daintree.hosts.start-swarm, daintree.hosts.steer-for-hub and
      daintree.hosts.check-usage-limits were all selected.
    messages:
      - role: user
        content: abort the swarm on every host now
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-host-offline
    category: single-runbook
    note: >-
      One host disconnected while the rest are stopped: "each worker's state as its answer
      gives it (acknowledged, finished, unresolved, disconnected)".
    messages:
      - role: user
        content: Stop the export run on every host. The mini is offline right now, so tell me it's unresolved instead of guessing.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-one-host-of-several
    category: single-runbook
    note: >-
      Only one host's share is stopped: "one run on one or several Remote Hosts, STOPPED".
    messages:
      - role: user
        content: Stop just the server's part of the run I sent out; the laptop host can finish its share.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ traps
  - id: steer-swarm-not-steer-for-hub
    category: routing-trap
    note: >-
      Asked from the sending machine about the hosts' assistants, so the hub's runbook owns it:
      "the stop or correction delivered to that host's own assistant". Fence: "Do not use on
      the receiving machine itself (daintree.hosts.steer-for-hub)", which took stop requests
      like this at base.
    messages:
      - role: user
        content: Two of my Remote Hosts are still on the parser run I sent; have each of their assistants stop it and tell me what each one says.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-not-local-steer
    category: routing-trap
    note: >-
      The agents to stop are on the other machines, not in this window: "work they ALREADY
      SENT to their other machines". Fence: "for agents on this machine
      (daintree.agents.steer-running-agent; parking them, daintree.orchestration.park-work)".
    messages:
      - role: user
        content: "Not the agents in this window: the ones on my remote hosts working on the run I sent need to stop, and I want each host to confirm."
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-not-park-work
    category: routing-trap
    note: >-
      Leaving for the night, but the stop is of a run on other machines: "work they ALREADY
      SENT to their other machines" and "with their work left in place". Fence: "parking them,
      daintree.orchestration.park-work" is for agents on this machine.
    messages:
      - role: user
        content: I'm stopping for the night; call off the run on the remote machines and keep their worktrees as they are
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-not-new-delegation
    category: routing-trap
    note: >-
      A correction to work one host is already doing, keeping what it has done: "STOPPED,
      CALLED OFF or CHANGED while it is under way". Fence: "for sending new work or redoing
      finished work (daintree.hosts.delegate-to-host, daintree.hosts.swarm-fan-out)".
    messages:
      - role: user
        content: "Redirect the remote host's agent: the task I sent it this morning must keep the v1 endpoints. Keep what it has done."
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-not-swarm-fan-out
    category: routing-trap
    note: >-
      A correction to a run already on every host, not sending it again: "STOPPED, CALLED OFF
      or CHANGED while it is under way" and "the stop or correction delivered to that host's
      own assistant". Fence: "for sending new work or redoing finished work
      (daintree.hosts.delegate-to-host, daintree.hosts.swarm-fan-out)".
    messages:
      - role: user
        content: The run I sent to every host should use the new tokenizer API from here on; tell each host's assistant and confirm who took it.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-not-clean-up
    category: routing-trap
    note: >-
      A stop with nothing removed: "STOPPED, CALLED OFF or CHANGED while it is under way" and
      "with their work left in place". Fence: "for catching up on or cleaning up after a run
      (daintree.hosts.recover-and-clean-up)".
    messages:
      - role: user
        content: Stop the run on the remote hosts now; their worktrees and panes stay until I say otherwise.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ reverse traps
  - id: steer-swarm-trap-catch-up
    category: routing-trap
    note: >-
      Reverse: what became of work already sent, nothing to stop. recover-and-clean-up owns
      "which delegated exchanges finished, which are still open, which will never be answered".
    messages:
      - role: user
        content: Which of the tasks I sent to the Remote Hosts finished, and which will never be answered?
    expect:
      required: [daintree.hosts.recover-and-clean-up]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-trap-rework-finished-unit
    category: routing-trap
    note: >-
      Reverse: the unit is finished, so the rework is new work to that host. delegate-to-host
      owns "ONE piece of WORK done by the Daintree assistant on another machine"; this runbook
      fences "for sending new work or redoing finished work (daintree.hosts.delegate-to-host,
      daintree.hosts.swarm-fan-out)".
    messages:
      - role: user
        content: "Hand the other Mac a new task: rework the export it finished so it keeps the header row, and tell me the SHA."
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-trap-new-run
    category: routing-trap
    note: >-
      Reverse: the same work sent to every host, nothing under way yet. swarm-fan-out owns "the
      SAME WORK done on EVERY Remote Host this Shell reaches".
    messages:
      - role: user
        content: Run this same refactor on all my machines, each on its own branch.
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-swarm-trap-local-steer
    category: routing-trap
    note: >-
      Reverse: an agent on this machine. steer-running-agent owns "an agent that is ALREADY
      WORKING on a task, or paused mid-task at its prompt, must change course or stop"; this
      runbook fences "for agents on this machine (daintree.agents.steer-running-agent; parking
      them, daintree.orchestration.park-work)".
    messages:
      - role: user
        content: The Claude pane next to this one is rewriting the auth tests; stop its turn and tell it to keep the old fixtures.
    expect:
      required: [daintree.agents.steer-running-agent]
      optional: [daintree.foundation]

  - id: steer-swarm-trap-park-local
    category: routing-trap
    note: >-
      Reverse: the person's own agents on this machine, parked for the day. park-work owns "the
      user is walking away and wants in-flight work paused and made safe, not torn down"; this
      runbook fences "parking them, daintree.orchestration.park-work".
    messages:
      - role: user
        content: I'm done for the day, park the agents running here with resume notes.
    expect:
      required: [daintree.orchestration.park-work]
      optional: [daintree.foundation]
