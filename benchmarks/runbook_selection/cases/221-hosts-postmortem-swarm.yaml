# daintree.hosts.postmortem-swarm: the hub explaining WHY a finished run on the Remote Hosts went
# wrong or disappointed. It rebuilds a per-unit timeline from the exchange records (the hosts' own
# clocks, unobserved moments marked), checks each host's claim by branch and SHA, names the first
# evidenced divergence and the causes by class, and proposes fixes with a way to reproduce each. It
# resends, restarts, cancels, cleans up and files nothing.
#
# Recall: the issue's three requests, an agent-phrased task description, a casual line, and the
# seeded failure the live check uses (a person's slow approval beside a wrong-SHA report), plus one
# hunch-first phrasing the shipped selector does not yet carry (retrain owed). Traps: this runbook
# wins against a post-mortem of one local agent (daintree.agents.postmortem-run), following a run
# (daintree.hosts.supervise-swarm), catching up (daintree.hosts.recover-and-clean-up), a messaging
# gate (daintree.hosts.diagnose-messaging), the same code differing between hosts
# (daintree.hosts.diagnose-host-differences) and a production incident
# (daintree.debug.investigate-outage); and the reverse traps, where each neighbour keeps its own
# request and this runbook must not ride along.

cases:
  # ------------------------------------------------------------------ recall
  - id: postmortem-swarm-reverse-local-agent
    category: routing-trap
    note: >-
      One agent on this machine ignoring its brief stays with daintree.agents.postmortem-run, whose
      text carries "go off the rails"; the post-mortem of a run on the Remote Hosts is not offered
      for it.
    messages:
      - role: user
        content: Why did the agent on this machine ignore my brief and rewrite the config? Post-mortem that run.
    expect:
      required: [daintree.agents.postmortem-run]

  - id: postmortem-swarm-reverse-supervise
    category: routing-trap
    note: >-
      Work still out on the hosts is followed, not explained: daintree.hosts.supervise-swarm is for
      a run "followed to its end".
    messages:
      - role: user
        content: The hosts are partway through the migration; keep them going and answer what they ask.
    expect:
      required: [daintree.hosts.supervise-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: postmortem-swarm-reverse-host-differences
    category: routing-trap
    note: >-
      The same commit green on one host and red on another stays with
      daintree.hosts.diagnose-host-differences ("tests green on one machine and red on another").
    messages:
      - role: user
        content: The Mac host is red and the Linux host is green on the same commit. Find out why, change nothing.
    expect:
      required: [daintree.hosts.diagnose-host-differences]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: postmortem-swarm-reverse-outage
    category: routing-trap
    note: >-
      A live production failure stays with daintree.debug.investigate-outage ("errors or 500s since a
      deploy").
    messages:
      - role: user
        content: The checkout service is returning 500s since the last release. Get investigators on the logs and the diff.
    expect:
      required: [daintree.debug.investigate-outage]

  - id: postmortem-swarm-reverse-memory
    category: routing-trap
    note: >-
      Saving a standing rule stays with daintree.memory.manage-project-memory, which opens "Use when
      the user wants something remembered from now on"; no finished run is to be explained.
    messages:
      - role: user
        content: Add a standing note to the project that any brief we send the other machines has to carry the exact commit.
    expect:
      required: [daintree.memory.manage-project-memory]

  # Control twins (issue #159): the same requests against the control catalog,
  # merged runbooks mapped to what absorbed them and retired lane runbooks dropped.
  - id: postmortem-swarm-issue-stall-or-twice-control
    category: single-runbook
    host_model: control
    note: 'Control twin of postmortem-swarm-issue-stall-or-twice: the same request against the control catalog.
      The issue''s second request. Decided by "why it took so long, stalled or did the same work twice".
      At base it selected daintree.orchestration.status-and-resume.'
    messages:
    - role: user
      content: Why did the cross-host workflow stall or do the same work twice?
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-issue-preserve-partial-control
    category: single-runbook
    host_model: control
    note: 'Control twin of postmortem-swarm-issue-preserve-partial: the same request against the control
      catalog. The issue''s third request. Decided by "The deliverable is the evidence" and "salvageable
      commits and leftovers listed". At base it selected daintree.orchestration.multi-agent.'
    messages:
    - role: user
      content: Produce an evidence-based swarm post-mortem, preserving partial results.
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-agent-phrased-wrong-commit-control
    category: single-runbook
    host_model: control
    note: 'Control twin of postmortem-swarm-agent-phrased-wrong-commit: the same request against the control
      catalog. How a hub agent describes the task: a finished run, one wrong commit, one silent host, the
      records and what each host said as the evidence. Decided by "each host''s claim checked by branch
      and SHA" and "fixes each with a reproducible scenario".'
    messages:
    - role: user
      content: A finished job on three remote hosts delivered a wrong commit from one and nothing from another.
        Reconstruct what happened from their task records and what each host said, and give me fixes with
        a way to reproduce each.
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-user-took-hours-control
    category: single-runbook
    host_model: control
    note: 'Control twin of postmortem-swarm-user-took-hours: the same request against the control catalog.
      A person''s own words after a bad run. Decided by "which hosts'' reports turned out wrong" and "why
      it took so long".'
    messages:
    - role: user
      content: That run on my other machines took hours and one of them swore it pushed the fix. Work out
        what really happened and where the time went.
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-seeded-approval-and-wrong-sha-control
    category: single-runbook
    host_model: control
    note: 'Control twin of postmortem-swarm-seeded-approval-and-wrong-sha: the same request against the
      control catalog. The seeded failure of the live check: a person approving each host by hand and a
      host reporting the wrong SHA. Decided by "whether the delay was a person approving each host by hand
      or the machines".'
    messages:
    - role: user
      content: A person had to approve each host by hand and the run sat waiting on them for hours. Now
        that it is over, work out from the records how long each host waited and what was the machines'
        fault.
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-user-approval-hunch-control
    category: single-runbook
    host_model: control
    note: 'Control twin of postmortem-swarm-user-approval-hunch: the same request against the control catalog.
      A hunch-first phrasing: a person suspects slow approvals and asks the records of the finished run
      to settle it. Decided by "whether the delay was a person approving each host by hand or the machines".
      The shipped selector sends it to daintree.hosts.steer-swarm, the untrained neighbourhood; the corpus
      rows carry the lesson (retrain owed).'
    messages:
    - role: user
      content: Did the delay on the remote machines come from someone approving each one by hand, or from
        the machines? Check the task records of the finished run.
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-trap-not-local-agent-control
    category: routing-trap
    host_model: control
    note: 'Control twin of postmortem-swarm-trap-not-local-agent: the same request against the control catalog.
      A run on remote hosts, not one agent here. Decided by "Use on the hub when a run on the Remote Hosts
      is OVER", with "one agent on this machine (daintree.agents.postmortem-run)" carved out.'
    messages:
    - role: user
      content: The run on the two remote machines ended badly. Explain it from the records, don't start
        any of it again.
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-trap-not-supervise-control
    category: routing-trap
    host_model: control
    note: 'Control twin of postmortem-swarm-trap-not-supervise: the same request against the control catalog.
      Every host has finished and nothing is to be followed. Decided by "following a run still under way
      (daintree.hosts.supervise-swarm)" being carved out.'
    messages:
    - role: user
      content: The remote hosts are done, nothing is pending. Why did the run take three times as long as
        planned, and which host reports were false?
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-trap-not-recover-account-control
    category: routing-trap
    host_model: control
    note: 'Control twin of postmortem-swarm-trap-not-recover-account: the same request against the control
      catalog. Which reports were false and where the time went, not where exchanges stand. Decided by "catching
      up or cleaning up (daintree.hosts.recover-and-clean-up)" being carved out.'
    messages:
    - role: user
      content: 'Going through the failed run on two remote hosts: which of the hosts'' reports were false,
        and where did the time go?'
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-trap-not-outage-control
    category: routing-trap
    host_model: control
    note: 'Control twin of postmortem-swarm-trap-not-outage: the same request against the control catalog.
      A finished run on the user''s own machines, not production. Decided by "a production incident (daintree.debug.investigate-outage)"
      being carved out.'
    messages:
    - role: user
      content: this isn't an outage, it's a finished run across my remote hosts that went wrong; explain
        it
    expect:
      required:
      - daintree.agents.postmortem-run
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: postmortem-swarm-reverse-messaging-gate-control
    category: routing-trap
    host_model: control
    note: 'Control twin of postmortem-swarm-reverse-messaging-gate: the same request against the control
      catalog. A send refused right now is a gate to name, not a run to explain. It stays with daintree.hosts.diagnose-messaging
      ("came back opted_out, paused, lane_unavailable").'
    messages:
    - role: user
      content: Sending to the second machine's assistant keeps coming back paused. Which gate is that and
        who fixes it?
    expect:
      required:
      - daintree.hosts.survey-hosts
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
