# Paired hub/lane scenarios: one piece of work seen from both ends, with a wrong-role trap each.
#
# The hub end is the person's own request, worded as the app tells the assistant to search
# (one sentence, 8-15 words, specifics left out). The lane end is the receiving assistant's
# search for the work after it has read the hub's brief; the brief is carried beside the case
# (`brief`) and the query is drawn from its objective. Neither query names a runbook id: a
# search that is handed the id proves nothing about discovery.
#
# A case with `scenario` and `role` fails when it loads a runbook its caller cannot execute (a
# lane handed a hub baseline, the hub handed a lane's), on top of the usual recall check. The
# traps are the person asking on the machine itself (a local runbook owns it, and the hub and
# lane runbooks must stay out), a question rather than work, the lane's bare wake line, and a
# role the caller does not hold. `bench pairs` reports each end with what it loaded.
#
# Where a case misses on the shipped selector the note says where and why; none of these cases
# bends a runbook's text, and the misses are owed to the user's one retrain.
#
# The cohort scenario pairs the hub's placement of several pieces with the lane that receives
# several at once. Placement sends one message per piece, so no hub runbook yet produces the
# several-pieces message the lane's runbook is written for: that end is retrieval only, and the
# missing sender is pinned in tests/unit/test_paired_roles.py (HUB_NAMES_NO_RECEIVER).

# Every procedure a lane follows for a hub's work. A lane case whose right answer is the
# envelope alone (a wake line, a plain question, a role the lane does not hold) forbids all of
# them: none can be chosen before the message has been read, or when it asks for no work.
x-lane-work-procedures: &lane_work
  - daintree.hosts.do-delegated-work
  - daintree.hosts.verify-for-hub
  - daintree.hosts.review-for-hub
  - daintree.hosts.run-local-cohort
  - daintree.hosts.steer-for-hub
  - daintree.hosts.integrate-for-hub
  - daintree.hosts.demo-for-hub
  - daintree.hosts.clean-up-for-hub

cases:
  # ------------------------------------------------------------------ implement
  - id: pair-implement-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-implement-hub-request: the same request against the control catalog. The
      person''s request on the hub. Decided by "ONE piece of WORK done by the Daintree assistant on another
      machine" and "get the build box to fix the failing checkout test and open a PR".'
    messages:
    - role: user
      content: Have the other Mac's assistant repair the flaky login test and raise a PR
    expect:
      required:
      - daintree.hosts.delegate-to-host
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-implement-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-implement-lane-local-trap: a host''s assistant receiving the same brief
      follows the ordinary catalog and is never handed a hosts procedure. The person at the host''s own
      machine asks for the same work. A lane has no hub in it: "the same work asked by the person at this
      machine (daintree.edits.spawn-visible-agent" sends it to the local runbook, and the delegated-work
      procedure must stay out.'
    messages:
    - role: user
      content: Have Claude fix the login bug in a new worktree on this machine
    expect:
      required:
      - daintree.edits.spawn-visible-agent
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-implement-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-implement-hub-local-trap: the same request against the control catalog.
      Work for an agent on the hub''s own machine. Decided by "Do not use for work by an agent on THIS machine
      (daintree.edits.spawn-visible-agent", so neither the remote delegation nor the lane''s runbook may
      load.'
    messages:
    - role: user
      content: Have an agent on this machine fix the login bug in a new worktree
    expect:
      required:
      - daintree.edits.spawn-visible-agent
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-review-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-review-hub-request: the same request against the control catalog. Judging
      a pushed branch from another machine. Decided by "have another machine review what that host built"
      and "its findings reported as claims"; the single-unit delegation may ride along.'
    messages:
    - role: user
      content: Have another machine review the branch my other Mac just pushed, findings only
    expect:
      required:
      - daintree.hosts.race-and-review
      optional:
      - daintree.hosts.delegate-to-host
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-review-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-review-lane-local-trap: a host''s assistant receiving the same brief follows
      the ordinary catalog and is never handed a hosts procedure. The person''s own review on the host machine.
      Decided by "a review the person at this machine asks for (daintree.review.review-change)".'
    messages:
    - role: user
      content: Review my own branch for problems before I open a pull request
    expect:
      required:
      - daintree.review.review-change
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-review-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-review-hub-local-trap: the same request against the control catalog. A review
      by an agent on the hub''s own machine. Decided by "rival attempts or a review by agents on this machine
      (daintree.orchestration.competition, daintree.review.review-change)".'
    messages:
    - role: user
      content: Review my branch with an agent on this machine before I push
    expect:
      required:
      - daintree.review.review-change
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-verify-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-verify-hub-request: the same request against the control catalog. One commit
      tested on several hosts. Decided by "ONE EXACT COMMIT, tag or release candidate TESTED UNDER SEVERAL
      ENVIRONMENTS" and "test this SHA on the Linux host and the Mac host".'
    messages:
    - role: user
      content: Test this exact commit on my Linux host and my Mac host, no fixes
    expect:
      required:
      - daintree.hosts.run-validation-matrix
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-verify-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-verify-lane-local-trap: a host''s assistant receiving the same brief follows
      the ordinary catalog and is never handed a hosts procedure. The person''s own checks on the host machine.
      Decided by "the person''s own checks here (daintree.ci.run-local-checks)".'
    messages:
    - role: user
      content: Run the tests on my current branch before I push
    expect:
      required:
      - daintree.ci.run-local-checks
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-verify-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-verify-hub-local-trap: the same request against the control catalog. Checks
      on the hub''s own machine, with no remote host in the request. The matrix is for a commit "TESTED
      UNDER SEVERAL ENVIRONMENTS on the Remote Hosts this Shell reaches", and the suite-sharding runbook
      needs Remote Hosts too.'
    messages:
    - role: user
      content: Run the tests on this machine before I push
    expect:
      required:
      - daintree.ci.run-local-checks
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-cohort-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-cohort-hub-request: the same request against the control catalog. Different
      tickets spread over the person''s machines. Decided by "DIFFERENT, independent pieces of work" and
      "here are eight issues, split them across my machines".'
    messages:
    - role: user
      content: Split these five bug tickets across my machines by who has room
    expect:
      required:
      - daintree.hosts.place-work
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-cohort-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-cohort-lane-local-trap: a host''s assistant receiving the same brief follows
      the ordinary catalog and is never handed a hosts procedure. The person at the host''s machine splitting
      tickets over local agents. Decided by "the same split asked for by the person at this machine (daintree.orchestration.fan-out-work".'
    messages:
    - role: user
      content: Work these four tickets in parallel on this machine with separate agents
    expect:
      required:
      - daintree.orchestration.fan-out-work
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-cohort-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-cohort-hub-local-trap: the same request against the control catalog. Tickets
      for agents on the hub''s own machine. Decided by "independent pieces for agents on this machine (daintree.orchestration.fan-out-work".'
    messages:
    - role: user
      content: Give each of these four tickets its own agent on this machine
    expect:
      required:
      - daintree.orchestration.fan-out-work
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-steer-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-steer-hub-request: the same request against the control catalog. Work already
      sent, stopped from the hub. Decided by "work they ALREADY SENT to their other machines" and "STOPPED,
      CALLED OFF or CHANGED".'
    messages:
    - role: user
      content: Stop the work I sent to my remote hosts, and keep what they did
    expect:
      required:
      - daintree.hosts.steer-swarm
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-steer-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-steer-lane-local-trap: a host''s assistant receiving the same brief follows
      the ordinary catalog and is never handed a hosts procedure. The person changing their own agent''s
      course on the host machine. Decided by "the person at this machine changing an agent''s course (daintree.agents.steer-running-agent)".'
    messages:
    - role: user
      content: Change course on my running agent here and tell it to use the new API
    expect:
      required:
      - daintree.agents.steer-running-agent
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-steer-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-steer-hub-local-trap: the same request against the control catalog. An agent
      on the hub''s own machine. Decided by "for agents on this machine (daintree.agents.steer-running-agent".'
    messages:
    - role: user
      content: Tell the agent running on this machine to stop and keep its changes
    expect:
      required:
      - daintree.agents.steer-running-agent
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-integrate-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-integrate-hub-request: the same request against the control catalog. Hosts''
      finished work combined by one machine. Decided by "work that SEVERAL Remote Hosts finished has to
      end up on ONE branch and one machine is to do the combining".'
    messages:
    - role: user
      content: Put the branches my two remote hosts finished together on the build box
    expect:
      required:
      - daintree.hosts.integrate-host-branches
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-integrate-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-integrate-lane-local-trap: a host''s assistant receiving the same brief
      follows the ordinary catalog and is never handed a hosts procedure. The person''s own merge of local
      agents'' branches on the host machine. Decided by "the person''s own local merge (daintree.git.integrate-agent-branches)".'
    messages:
    - role: user
      content: Combine my local agents' finished work into one branch, testing after every merge
    expect:
      required:
      - daintree.git.integrate-agent-branches
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-integrate-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-integrate-hub-local-trap: the same request against the control catalog.
      Branches finished by agents on the hub''s own machine, no host involved. The hub''s integration is
      for "work that SEVERAL Remote Hosts finished has to end up on ONE branch".'
    messages:
    - role: user
      content: Merge the branches my agents here finished into one branch
    expect:
      required:
      - daintree.git.integrate-agent-branches
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-demo-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-demo-hub-request: the same request against the control catalog. A feature
      to look at on a host. Decided by "wants to SEE a feature running on another machine, a Remote Host
      this Shell reaches, and look at it from here".'
    messages:
    - role: user
      content: I want to click through the new checkout page running on my remote host
    expect:
      required:
      - daintree.hosts.prepare-remote-demo
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-demo-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-demo-lane-local-trap: a host''s assistant receiving the same brief follows
      the ordinary catalog and is never handed a hosts procedure. The person''s own demo on the host machine.
      Decided by "a demo the person asks for at this machine (daintree.workflow.prepare-feature-demo)".'
    messages:
    - role: user
      content: Prepare a demo of my feature branch on this machine for tomorrow
    expect:
      required:
      - daintree.workflow.prepare-feature-demo
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-demo-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-demo-hub-local-trap: the same request against the control catalog. A demo
      on the hub''s own machine. Decided by "Do not use for a demo on THIS machine (daintree.workflow.prepare-feature".'
    messages:
    - role: user
      content: Show me the new checkout page running on this machine with sample data
    expect:
      required:
      - daintree.workflow.prepare-feature-demo
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-cleanup-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-cleanup-hub-request: the same request against the control catalog. What
      a run left on the hosts, cleaned through each host''s assistant. Decided by "what a run left on the
      Remote Hosts, its panes (usage-check panes included), worktrees and branches, cleaned up through each
      host''s own assistant".'
    messages:
    - role: user
      content: Clean up what the swarm left on my remote hosts, panes and worktrees
    expect:
      required:
      - daintree.hosts.recover-and-clean-up
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-cleanup-lane-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-cleanup-lane-local-trap: a host''s assistant receiving the same brief follows
      the ordinary catalog and is never handed a hosts procedure. The person tidying their own machine.
      Decided by "the person tearing down panes and worktrees on their own machine (daintree.orchestration.workspace-cleanup)".'
    messages:
    - role: user
      content: Close my finished panes and remove the merged worktrees on this machine
    expect:
      required:
      - daintree.orchestration.workspace-cleanup
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-cleanup-hub-local-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-cleanup-hub-local-trap: the same request against the control catalog. Local
      tidying on the hub''s own machine. Decided by "Do not use for agents, terminals or worktrees on this
      machine".'
    messages:
    - role: user
      content: Tidy up the finished agents and merged worktrees on this laptop only
    expect:
      required:
      - daintree.orchestration.workspace-cleanup
      optional:
      - daintree.foundation
      forbid:
      - daintree.hosts.*
  - id: pair-question-hub-request-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-question-hub-request: the same request against the control catalog. One
      question for the host''s assistant. Decided by "ONE QUESTION answered by the Daintree assistant on
      ANOTHER MACHINE".'
    messages:
    - role: user
      content: Ask the assistant on my Linux host which branch its project is on
    expect:
      required:
      - daintree.hosts.ask-host-assistant
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-question-hub-work-trap-control
    category: routing-trap
    host_model: control
    note: 'Control twin of pair-question-hub-work-trap: the same request against the control catalog. A
      request for an opinion changes nothing. Decided by "the question asks it to change nothing" and "work
      that machine''s assistant should carry out (daintree.hosts.delegate-to-host)".'
    messages:
    - role: user
      content: Check what my Linux host's assistant thinks went wrong in the nightly job
    expect:
      required:
      - daintree.hosts.ask-host-assistant
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
      forbid:
      - daintree.hosts.delegate-to-host
  - id: pair-role-hub-names-integrator-control
    category: single-runbook
    host_model: control
    note: 'Control twin of pair-role-hub-names-integrator: the same request against the control catalog.
      The hub designates one host to do the combining. Decided by "one machine is to do the combining" and
      "coordinate one host integrating pinned artifacts from the other lanes".'
    messages:
    - role: user
      content: Have my Mac host be the integrator for what the other hosts finished
    expect:
      required:
      - daintree.hosts.integrate-host-branches
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
  - id: pair-role-hub-reads-host-message-control
    category: no-task
    host_model: control
    note: 'Control twin of pair-role-hub-reads-host-message: the same request against the control catalog.
      A host''s message arriving at the hub is the hub''s to answer within the user''s request; the app''s
      own messaging addendum says so, and the receiving lane''s envelope is not the hub''s ("On a Shell,
      a host''s message is the foundation''s."). Nothing to load beyond the messaging foundation, and never
      a lane''s runbook.'
    messages:
    - role: user
      content: My Linux host's assistant sent me a question, answer it for me
    expect:
      required: []
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
