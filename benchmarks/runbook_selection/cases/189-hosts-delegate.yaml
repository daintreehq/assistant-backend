# daintree.hosts.delegate-to-host: the hub hands one unit of work to the enrolled assistant on
# one Remote Host, verifies the branch, SHA or PR it reports, and relays a verified result to
# a second host when the next piece depends on it. Recall cases in agent and user words (the
# issue's three requests, scrubbed), a routing trap per declared neighbour where this runbook
# wins, and a reverse trap per neighbour where the local runbook wins and this one must not
# ride along. The hosts foundation may ride along (optional).

cases:
  # ------------------------------------------------------------------- recall
  - id: delegate-to-host-agent-phrased
    category: single-runbook
    note: >-
      The issue's agent-phrased request. Decided by "WORK done by the Daintree assistant on
      another machine, a Remote Host this Shell reaches" and "The deliverable is that host's
      commit, branch or PR, verified by reference".
    messages:
      - role: user
        content: Delegate a coding task to the assistant on a remote host and verify the branch it pushes
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-user-casual
    category: single-runbook
    note: >-
      Casual user words naming another machine and asking for the SHA back: "WORK done by
      the Daintree assistant on another machine" with "that host's commit" as the deliverable.
    messages:
      - role: user
        content: have the assistant on the linux box implement the pagination fix and tell me the sha
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-relay-user
    category: single-runbook
    note: >-
      The issue's relay request with the machine names scrubbed: "a second host starting
      once the first host's change lands" and "for that single dependency a deliberate relay
      of the verified result to the second host".
    messages:
      - role: user
        content: once the server box has pushed the API change, have the laptop host build the client against that commit
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-flaky-test-on-other-mac
    category: single-runbook
    note: >-
      The issue's second request, scrubbed. The work is a flaky test, but it is for another
      machine's assistant: "ONE piece of WORK done by the Daintree assistant on another
      machine ... whatever the work is (a bug, a flaky or failing test, a feature, docs)".
      This runbook is the answer; daintree.ci.hunt-flaky-test's know-how belongs to the host
      that does the work.
    messages:
      - role: user
        content: get my other mac to fix the flaky login test and open a pr
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  # -------------------------------------------- traps: this runbook wins
  - id: delegate-to-host-not-durable-workflow
    category: routing-trap
    note: >-
      A two-step dependency across machines is a relay ("a second host starting once the
      first host's change lands"), not a dependent plan on this machine
      (daintree.orchestration.execute-durable-workflow).
    messages:
      - role: user
        content: Delegate implementing the export endpoint to the remote host's assistant, then have a second host write the client once the first host's commit is verified
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-not-spawn-here
    category: routing-trap
    note: >-
      A code change, but for another machine's assistant: "Do not use for work by an agent
      on THIS machine (daintree.edits.spawn-visible-agent ...)" keeps spawn-visible-agent out.
    messages:
      - role: user
        content: get the build machine's assistant to add retries to the webhook sender and push a branch
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-not-hand-off
    category: routing-trap
    note: >-
      Passing a half-done task to another machine's assistant is delegation; moving a
      started task to another LOCAL agent in the same checkout is
      daintree.agents.hand-off-task ("a started task moved to another local agent").
    messages:
      - role: user
        content: pass the half-done auth refactor to the assistant on my other mac to finish on its own branch
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-not-watch-outcome
    category: routing-trap
    note: >-
      A start that waits on another host's pushed fix is "a second host starting once the
      first host's change lands", not "a later start or wake-up on this machine
      (daintree.orchestration.watch-outcome)".
    messages:
      - role: user
        content: after the remote host pushes its fix, get the second host to write the tests against that commit
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: delegate-to-host-not-fan-out
    category: routing-trap
    note: >-
      One issue to one remote assistant, not a batch of agents here
      (daintree.orchestration.fan-out-work, "several units here").
    messages:
      - role: user
        content: give just this one issue to the assistant on the remote host and have it open a PR
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  # ---------------------------------- reverse traps: the local runbook wins
  - id: delegate-to-host-trap-spawn-here
    category: routing-trap
    note: >-
      A code change by an agent here. spawn-visible-agent: "any request to CHANGE project
      code or files that no more specific workflow owns ... The work goes to ONE visible agent
      in the right worktree"; this runbook fences "work by an agent on THIS machine".
    messages:
      - role: user
        content: start claude in a fresh worktree and have it add request ids to every log line in the gateway
    expect:
      required: [daintree.edits.spawn-visible-agent]
      optional: [daintree.foundation]

  - id: delegate-to-host-trap-hand-off
    category: routing-trap
    note: >-
      A started task given to a different local agent. hand-off-task: "a task an agent has
      STARTED must be finished by a DIFFERENT agent or a fresh session, in the same
      checkout"; this runbook fences "a started task moved to another local agent".
    messages:
      - role: user
        content: the gemini pane keeps undoing its own fixes on the cache layer, have codex take over that task in the same checkout
    expect:
      required: [daintree.agents.hand-off-task]
      optional: [daintree.foundation]

  - id: delegate-to-host-trap-watch-outcome
    category: routing-trap
    note: >-
      A delayed start here, no other host. watch-outcome: "Any deferred action belongs
      here, INCLUDING one that spawns an agent"; this runbook fences "a later start or
      wake-up on this machine".
    messages:
      - role: user
        content: in an hour start an agent on the flaky export test
    expect:
      required: [daintree.orchestration.watch-outcome]
      optional: [daintree.foundation]

  - id: delegate-to-host-trap-fan-out
    category: routing-trap
    note: >-
      One agent per issue here. fan-out-work: "a BATCH of independent issues or tasks, one
      agent terminal per issue or worktree"; this runbook fences "several units here".
    messages:
      - role: user
        content: split the open typo and broken-link reports into one agent per report, each with its own worktree
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: delegate-to-host-trap-durable-workflow
    category: routing-trap
    note: >-
      Dependent phases tracked across sessions. execute-durable-workflow: "a substantial
      multi-step goal with dependent phases that must survive turns, restarts or
      asynchronous waits"; this runbook fences "a dependent plan on this machine".
    messages:
      - role: user
        content: run the payments migration as dependent phases and track the plan across sessions
    expect:
      required: [daintree.orchestration.execute-durable-workflow]
      optional: [daintree.foundation]

  - id: delegate-to-host-trap-local-flaky-test
    category: routing-trap
    note: >-
      The issue's flaky-test request with no other machine named: hunt-flaky-test. Guards the
      "whatever the work is (a bug, a flaky or failing test ...)" clause from pulling local
      flaky-test work to this runbook.
    messages:
      - role: user
        content: Get an agent to fix the flaky login test and open a PR.
    expect:
      required: [daintree.ci.hunt-flaky-test]
      optional: [daintree.workflow.prep-branch-for-review, daintree.foundation]
