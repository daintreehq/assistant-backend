# The caller reports its current host state through Daintree-Hosts. Search removes
# ineligible daintree.hosts.* runbooks before retrieval. Old lane headers do not
# affect this state. Retained cases cover none/configured/connected eligibility;
# historical inbox-role cases live under archive/inbox-v0.44/cases/.

cases:
  - id: host-state-fanout-no-hosts
    category: host-state
    note: >-
      fanout-six-issues-not-single for a caller with no Remote Host. Unreported, the
      ranking under daintree.orchestration.fan-out-work carried daintree.hosts.run-local-cohort
      and daintree.hosts.swarm-fan-out as neighbours; with hosts none every hub and lane
      runbook is off the ballot and local ones take their slots.
    host_state: {hosts: none}
    messages:
      - role: user
        content: Six bugs have been sitting in the tracker all week with nobody on them. Let's clear the lot in one go — put someone on each of them instead of grinding through them one after another.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: host-state-fanout-hosts-connected
    category: host-state
    note: >-
      ELIGIBILITY ONLY, not the issue's connected-host preference. The same request for a
      caller with a connected host: filtering admits the hub runbooks but cannot promote
      one, because the query carries no host signal, so the trained
      daintree.orchestration.fan-out-work still wins it (measured 0.998, with
      daintree.hosts.place-work at 0.001; it also wins "across my machines", a routing gap
      in its own text). This guards that a connected host does not cost the local fan-out
      its answer. Six different bugs spread over hosts would be daintree.hosts.place-work,
      allowed here; daintree.hosts.swarm-fan-out repeats the same work on every host, so
      it is not. When host routing lands, re-point `required` at place-work.
    host_state: {hosts: connected}
    messages:
      - role: user
        content: Six bugs have been sitting in the tracker all week with nobody on them. Let's clear the lot in one go — put someone on each of them instead of grinding through them one after another.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional:
        - daintree.foundation
        - daintree.hosts.place-work
        - daintree.hosts.foundation

  - id: host-state-delegate-hosts-connected
    category: host-state
    note: >-
      ask-host-reverse-delegate for a hub with a connected host and no lane: the lane's
      daintree.hosts.do-delegated-work, a neighbour when unreported, is left out.
    host_state: {hosts: connected}
    messages:
      - role: user
        content: get the linux host's assistant to write the migration and push a branch
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: host-state-connect-first-host
    category: host-state
    note: >-
      survey-hosts-reverse-add-machine for a caller with no hosts yet: adding the first one
      is daintree.hosts.connect-host, eligible in every state.
    host_state: {hosts: none}
    messages:
      - role: user
        content: Add my build server to Daintree as a Remote Host so I can open its projects here
    expect:
      required: [daintree.hosts.connect-host]
      optional: [daintree.hosts.foundation]
