# daintree.runtime.free-busy-port across machines: a port clash when this Shell drives a
# Remote Host. These pin the requests that now route to it because its whenToUse says the
# clash is "on this machine or a Remote Host, where a remote server's port and the same number
# on the local machine are two different ports": a remote worktree's server that cannot bind,
# a forward that took another local port, a browser panel refused because the port is taken here, and the hub and lane
# phrasings of the same ask. Traps hold its boundary with daintree.worktree.manage-resource
# (a worktree's cloud devbox) both ways, and with daintree.runtime.debug-web-app.

cases:
  - id: fbp-hosts-user-free-remote-worktree
    category: single-runbook
    note: >-
      The issue's own request. Decided by "on this machine or a Remote Host" and "a remote
      worktree's server that cannot bind".
    messages:
      - role: user
        content: Free the port blocking this remote worktree's server.
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-agent-diagnose-forward
    category: single-runbook
    note: >-
      The issue's own agent-phrased request. Decided by "a local port held by a forward or a
      local process". The hosts foundation may
      ride along: a hub asking this needs its addressing rules to reach the host.
    messages:
      - role: user
        content: Diagnose host-side listener versus Shell forwarding-port contention.
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: fbp-hosts-agent-remote-dev-server
    category: single-runbook
    note: >-
      Agent phrasing from a pane on the host. Decided by "on this machine or a Remote Host" and
      the deliverable "who holds the port and on which machine".
    messages:
      - role: user
        content: Dev server in a worktree on a Remote Host fails with EADDRINUSE on 5173; identify the process holding the port on that host and free it only if it is ours
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-user-forward-renumbered
    category: single-runbook
    note: >-
      A forward that kept no host number; the local listener is not in the way. Decided by "a
      local port held by a forward or a local process".
    messages:
      - role: user
        content: the forwarded port came up as 3001 instead of 3000, should I kill whatever has 3000 locally
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-user-browser-panel-in-use
    category: single-runbook
    note: >-
      The browser panel's refusal when the host's port is taken on this machine. Decided by "a
      local port held by a forward or a local process".
    messages:
      - role: user
        content: the browser panel says port 3000 is in use on this machine so the host's page can't open here
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-hub-holder-over-there
    category: single-runbook
    note: >-
      The hub's phrasing: the listener is on the other machine, not here. Decided by "a remote
      worktree's server that cannot bind" and "who holds the port and on which machine".
    messages:
      - role: user
        content: "From the Shell sidebar: the server in the worktree on my other machine says the port is taken; find the holder over there"
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-lane-request-from-hub
    host_model: inbox
    category: single-runbook
    note: >-
      An enrolled lane relaying the hub's request about its own machine. Decided by "on this
      machine or a Remote Host" and "who holds the port and on which machine".
    messages:
      - role: user
        content: The hub asked me to find what is holding port 3000 on this machine so the worktree server can start
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-remote-vs-local-same-number
    category: single-runbook
    note: >-
      The issue's own request, and the contested boundary: "remote server" pulls
      daintree.worktree.manage-resource ("a worktree's cloud devbox or remote resource"). The
      text decides it ("a remote server's port and the same number on the local machine are two
      different ports"), but two text attempts left it a rank miss: owed to a retrain on the
      boundary rows in both files.
    messages:
      - role: user
        content: The remote server uses 3000 but my local 3000 belongs to something else.
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-trap-not-cloud-resource
    category: routing-trap
    note: >-
      A server process on a Remote Host that cannot bind, not a worktree's cloud resource:
      daintree.worktree.manage-resource must not ride along. Decided by the fence "for a
      worktree's cloud devbox or configured remote resource (use
      daintree.worktree.manage-resource)" and "a remote worktree's server that cannot bind".
    messages:
      - role: user
        content: The api server in a worktree on the Remote Host cannot bind 4000. Identify the listener on that host, not on this machine, and free it only if it is ours.
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-trap-reverse-cloud-devbox
    category: routing-trap
    note: >-
      Reverse: the cloud devbox's status is daintree.worktree.manage-resource ("asks about a
      worktree's cloud devbox or remote resource status"); free-busy-port must not ride along.
    messages:
      - role: user
        content: the worktree's cloud devbox stopped answering, is the resource still up
    expect:
      required: [daintree.worktree.manage-resource]
      optional: [daintree.foundation]

  - id: fbp-hosts-trap-forward-not-preview
    category: routing-trap
    note: >-
      An ssh forward holding a port this machine's app wants, not a Dev Preview panel's own
      server: daintree.runtime.debug-web-app must not ride along. Decided by "a local port held
      by a forward or a local process" against the fence "for a Dev Preview panel's own server
      (use daintree.runtime.debug-web-app)".
    messages:
      - role: user
        content: ssh is sitting on 127.0.0.1:3000 here and my own app needs that port
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-hub-free-over-there-not-handoff
    category: routing-trap
    note: >-
      The hub asking another machine's assistant to free a port: free-busy-port's "on this
      machine or a Remote Host", not daintree.hosts.delegate-to-host, whose deliverable is "that
      host's commit, branch or PR". Two text attempts (a fence in delegate-to-host, the hub's ask
      in this text) left it a rank miss: owed to a retrain on the boundary rows in both files.
    messages:
      - role: user
        content: get the other Mac's assistant to free the port its api worktree needs, only if it's ours
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: fbp-hosts-trap-reverse-delegate-config-pr
    category: routing-trap
    note: >-
      Reverse of fbp-hosts-hub-free-over-there-not-handoff: a port made configurable in the
      code is delegated work, "ONE piece of WORK done by the Daintree assistant on another
      machine" whose deliverable is "that host's commit, branch or PR"; no port is held, so
      free-busy-port must not ride along.
    messages:
      - role: user
        content: have the workstation's assistant make the storybook port configurable through an env var, push a branch and send me the PR
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: fbp-hosts-trap-forward-not-messaging
    category: routing-trap
    note: >-
      A forward's local port held on this machine: free-busy-port's "a local port held by a
      forward or a local process". Nothing goes to "the Daintree assistant on ANOTHER MACHINE",
      so daintree.hosts.foundation must not ride along.
    messages:
      - role: user
        content: the host's server answers on its own machine, but the port this laptop forwards to it is busy here; who holds it?
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-trap-reverse-messaging-setup
    host_model: inbox
    category: routing-trap
    note: >-
      Reverse: switching messaging on is the hosts foundation's "how to switch it on"; the
      ports are only what the person means to ask about later, so free-busy-port must not ride
      along.
    messages:
      - role: user
        content: messaging with the other Mac's assistant is switched off; how do I turn it on so I can ask it about its ports?
    expect:
      required: [daintree.hosts.foundation]
      optional: [daintree.foundation]

  - id: fbp-hosts-trap-bare-port-not-issue
    category: routing-trap
    note: >-
      A bare number asked about as a listener is a port, free-busy-port's "what's running on 5173?",
      not daintree.workflow.follow-up-on-issue's "a one-off READ of an issue or PR's current
      forge state".
    messages:
      - role: user
        content: anything listening on 4321 here, and whose is it?
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation]

  - id: fbp-hosts-trap-reverse-pr-number
    category: routing-trap
    note: >-
      Reverse: a bare number with checks is an issue or PR, follow-up-on-issue's "did CI pass?"
      and "a one-off READ of an issue or PR's current forge state"; free-busy-port must not
      ride along.
    messages:
      - role: user
        content: where does 5174 stand, did its checks go green?
    expect:
      required: [daintree.workflow.follow-up-on-issue]
      optional: [daintree.foundation]

  - id: fbp-hosts-continuation-remote-holder
    category: continuation
    note: >-
      After a turn that put the failing server on another machine, the bare follow-up is
      free-busy-port's "a remote worktree's server that cannot bind". The hub asks that host's
      assistant, so the hosts foundation or daintree.hosts.ask-host-assistant may ride along.
    messages:
      - role: user
        content: the api in the feature worktree on the build machine won't start
      - role: assistant
        content: >-
          Its log on that host says "Error: listen EADDRINUSE: address already in use
          :::4000".
      - role: user
        content: find what has it over there, don't stop anything
    expect:
      required: [daintree.runtime.free-busy-port]
      optional: [daintree.foundation, daintree.hosts.foundation, daintree.hosts.ask-host-assistant]
