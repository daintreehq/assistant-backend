# Serving-shaped queries: one bare task description, the way Claude Code or Codex
# writes a `search_runbooks` query after reading the user's request (guide section
# 13.3). No prior active set and no conversation: exactly what the MCP search sends.
# Written for the MCP-era catalog without copying any runbook's whenToUse wording.
# Development cases, not a holdout: they informed the migration.

cases:
- id: host-ask-one-codex-flaw
  category: host-query
  note: 'Guide 13.2: an answer, not work; waits for a notice internally.'
  messages:
  - role: user
    content: Ask one Codex agent whether this retry design has a flaw and bring back its answer.
  expect:
    required:
    - daintree.agents.ask-and-relay
    optional:
    - daintree.foundation
- id: host-visible-agent-implement
  category: host-query
  note: 'Guide 13.2: visible work, not a question.'
  messages:
  - role: user
    content: Start a visible agent to implement the retry fix; the user wants to watch it work.
  expect:
    required:
    - daintree.edits.spawn-visible-agent
    optional:
    - daintree.foundation
- id: host-answer-stopped-agent
  category: host-query
  note: Guide 13.2.
  messages:
  - role: user
    content: An agent pane stopped and is asking which behaviour to preserve; answer it from the user's
      original brief.
  expect:
    required:
    - daintree.agents.answer-waiting-agent
    optional:
    - daintree.foundation
- id: host-notice-then-verify
  category: host-query
  note: 'Guide 13.2: the deliverable is verification; the wait is a phase of it, so watch-outcome is allowed
    but not owed.'
  messages:
  - role: user
    content: Get told when an already-running agent finishes, then check its changes actually do what
      was asked before reporting.
  expect:
    required:
    - daintree.orchestration.verify-agent-work
    optional:
    - daintree.orchestration.watch-outcome
    - daintree.foundation
- id: host-relay-notes-no-wait
  category: host-query
  note: 'Guide 13.2: a relay-only request.'
  messages:
  - role: user
    content: Send the reviewer agent's notes to the implementer agent; no need to wait for its reply.
  expect:
    required:
    - daintree.agents.relay-review-feedback
    optional:
    - daintree.foundation
- id: host-rolling-cap-three
  category: host-query
  note: 'Guide 13.2: a rolling queue under a concurrency cap.'
  messages:
  - role: user
    content: Work through the remaining backlog issues with agents, never more than three running at once.
  expect:
    required:
    - daintree.orchestration.fan-out-work
    optional:
    - daintree.foundation
- id: host-status-no-changes
  category: host-query
  note: 'Guide 13.2: a status-only sweep.'
  messages:
  - role: user
    content: Show which agents are still running and what each is doing; do not start or change anything.
  expect:
    required:
    - daintree.orchestration.supervise-fleet
    optional:
    - daintree.foundation
- id: host-issue-agent-worktree
  category: host-query
  messages:
  - role: user
    content: Launch a Claude Code agent in a new worktree for GitHub issue 214 and have it implement the
      fix.
  expect:
    required:
    - daintree.workflow.start-work-on-issue
    optional:
    - daintree.foundation
- id: host-rename-tabs
  category: host-query
  messages:
  - role: user
    content: Rename the Daintree terminal tabs so each says what its agent is working on.
  expect:
    required:
    - daintree.terminals.rename
    optional:
    - daintree.foundation
- id: host-launch-no-terminal-id
  category: host-query
  messages:
  - role: user
    content: The agent launch returned no terminal id; find out whether the agent actually started.
  expect:
    required:
    - daintree.agents.recover-agent
    optional:
    - daintree.foundation
- id: host-poll-pinned-migration
  category: host-query
  messages:
  - role: user
    content: Poll the pinned agents for which database migration strategy they prefer and summarise the
      consensus.
  expect:
    required:
    - daintree.agents.poll-pinned-agents
    optional:
    - daintree.foundation
- id: host-plain-worktree
  category: host-query
  messages:
  - role: user
    content: Create a worktree for branch feature/search-cache without launching any agent.
  expect:
    required:
    - daintree.worktree.create-plain-worktree
    optional:
    - daintree.foundation
- id: host-run-recipe
  category: host-query
  messages:
  - role: user
    content: Run the saved full-stack recipe in a fresh worktree.
  expect:
    required:
    - daintree.recipe.run-or-create
    optional:
    - daintree.foundation
- id: host-merge-when-green
