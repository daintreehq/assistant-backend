# daintree.hosts.integrate-for-hub: a Remote Host's lane chosen by the hub as integrator. It
# merges the exact commits the hub pinned from other hosts' and units' branches, in the hub's
# order, into one new integration branch here through a visible integrator agent, hands a
# conflict or a missing commit back to the hub, and replies with the resulting SHA.
#
# Recall: the issue's three requests, an agent-phrased outcome, and the situations the
# procedure has to get right (a source branch that moved past its pin, a conflict the brief
# gives no rule for). Traps where this runbook wins over a declared neighbour: one new unit
# (daintree.hosts.do-delegated-work), a test run (daintree.hosts.verify-for-hub), the person's
# own local merge (daintree.git.integrate-agent-branches) and the hub's side
# (daintree.hosts.integrate-host-branches); the envelope (daintree.hosts.handle-hub-message) may ride
# along, as with every receiver task. Reverse traps where a close neighbour wins and this
# runbook must not ride along: local integration, one unit, a test-only run, and a question
# back to the hub.

cases:
  # ------------------------------------------------------------------ recall
  - id: integrate-for-hub-trap-local-integration
    category: routing-trap
    note: >-
      The person's own worktrees, no hub: daintree.git.integrate-agent-branches ("Use when the
      work of SEVERAL agents, branches or worktrees must be combined into one branch"), fenced
      back with "on a host lane the hub chose as its integrator (use
      daintree.hosts.integrate-for-hub)".
    messages:
      - role: user
        content: Merge the branches my two worktrees produced into one integration branch before I open a PR.
    expect:
      required: [daintree.git.integrate-agent-branches]
      optional: [daintree.foundation]

  - id: integrate-for-hub-trap-hub-assigns-integration
    category: routing-trap
    note: >-
      The person, on the hub, wants another machine to do the integration: that is the
      hub's side, which this runbook fences off as "the hub's side
      (daintree.hosts.integrate-host-branches)"; that runbook owns "work that SEVERAL Remote
      Hosts finished has to end up on ONE branch and one machine is to do the combining".
      Until it landed this case required daintree.hosts.delegate-to-host, which now fences
      "several hosts' finished work combined into one branch".
    messages:
      - role: user
        content: Get the assistant on my other Mac to merge the two hosts' branches into one integration branch on its machine and report the SHA
    expect:
      required: [daintree.hosts.integrate-host-branches]
      optional: [daintree.hosts.foundation, daintree.foundation]
