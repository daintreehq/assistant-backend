# Genuinely compound requests spanning several distinct workflows: multiple
# specifics are correct, up to the cap of 3.

cases:
  - id: issue-plus-poll
    category: multi-runbook
    messages:
      - role: user
        content: >-
          Start work on issue 512, and while that runs, poll the pinned fleet for
          opinions on the release naming scheme.
    expect:
      required:
        - daintree.workflow.start-work-on-issue
        - daintree.agents.poll-pinned-agents
      optional: [daintree.foundation]

  - id: recipe-plus-rename
    category: multi-runbook
    messages:
      - role: user
        content: >-
          Spin up the review recipe, and once its terminals open give them all
          clear names.
    expect:
      required:
        - daintree.recipe.run-or-create
        - daintree.terminals.rename
      optional: [daintree.foundation]

  - id: issue-plus-prep-other-branch
    category: multi-runbook
    messages:
      - role: user
        content: >-
          Two things: kick off issue 77 in a fresh worktree, and prep the current
          branch for review so I can open the PR.
    expect:
      required:
        - daintree.workflow.start-work-on-issue
        - daintree.workflow.prep-branch-for-review
      optional: [daintree.foundation]

  - id: spawn-and-wait-single-workflow
    category: multi-runbook
    note: "The negative control of this file \u2014 one workflow, not two: fixing a flaky test while the user watches is daintree.ci.hunt-flaky-test (since 2026-09-28), which supervises its own agent."
    messages:
      - role: user
        content: >-
          Spawn an agent to fix the flaky integration test and stay with it — I'm
          sitting right here waiting on the result.
    expect:
      required: [daintree.ci.hunt-flaky-test]
      optional: [daintree.foundation]
