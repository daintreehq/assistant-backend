# One owner for a deploy or a package publish when the swarm builds and checks in
# parallel: the hub's brief to the one designated host, that host's own target check,
# and a lost reply read from the platform or registry instead of handed to another host.
# Targets: daintree.release.deploy-and-verify, daintree.release.publish-package.
# Neighbours the cases pin: daintree.hosts.run-validation-matrix (read-only checks),
# daintree.hosts.reassign-host-work (a unit moved to another machine), the release
# neighbours already fenced in their own files.
cases:
  # --- daintree.release.deploy-and-verify across hosts ---
  - id: release-owner-deploy-agent-hub
    category: single-runbook
    note: >-
      Agent-phrased hub request. The deploy clause "Also when a swarm of hosts shares the
      work and exactly one host is the deployer of a deploy authorised now: the hub's brief
      to it, its check of its own target, and its lost reply reconciled against the
      platform." names it; the matrix may ride along because the builds and checks are its
      deliverable.
    messages:
      - role: user
        content: >-
          Coordinate a release across my Remote Hosts: every host builds and tests the
          pinned SHA, but one designated host runs the deploy to staging and proves which
          revision is serving.
    expect:
      required: [daintree.release.deploy-and-verify]
      optional: [daintree.hosts.run-validation-matrix, daintree.hosts.foundation, daintree.hosts.delegate-to-host]

  - id: release-owner-deploy-user-one-host-only
    category: single-runbook
    note: >-
      Casual user wording, one host deploys and the others must not. The deploy clause "Also
      when a swarm of hosts shares the work and exactly one host is the deployer of a deploy
      authorised now: the hub's brief to it, its check of its own target, and its lost reply
      reconciled against the platform." is the signal.
    messages:
      - role: user
        content: deploy the api to production from the linux host only and make sure the other hosts do not run the deploy
    expect:
      required: [daintree.release.deploy-and-verify]
      optional: [daintree.hosts.foundation]

  - id: release-owner-deploy-trap-lost-reply-not-reassign
    category: routing-trap
    note: >-
      The deploy clause "Also when a swarm of hosts shares the work and exactly one host is
      the deployer of a deploy authorised now: the hub's brief to it, its check of its own
      target, and its lost reply reconciled against the platform." covers the lost reply;
      moving the work to another machine is reassign-host-work's job, which a submitted
      deploy must never get: it is read, not handed over.
    messages:
      - role: user
        content: >-
          the build box started the staging deploy and then went silent. don't let another
          machine run it, find out what staging is actually serving
    expect:
      required: [daintree.release.deploy-and-verify]
      optional: [daintree.hosts.foundation]

  - id: release-owner-deploy-trap-after-matrix
    category: routing-trap
    note: >-
      The matrix has already passed; what is asked now is the deploy from one host. Deploy
      clause: "The deliverable is the project's own deploy mechanism (its scripts, Makefile,
      CI workflow or platform CLI, never an invented one) run once for a pinned SHA to the
      named environment where the user can watch it". The matrix runbook tests under several
      environments and deploys nothing.
    messages:
      - role: user
        content: >-
          The matrix passed for tag v2.5.0 on every platform. Now deploy it to staging
          from the designated host only and prove staging serves it.
    expect:
      required: [daintree.release.deploy-and-verify]
      optional: [daintree.hosts.foundation]

  - id: release-owner-matrix-trap-nothing-deployed
    category: routing-trap
    note: >-
      Matrix clause: "ONE EXACT COMMIT, tag or release candidate TESTED UNDER SEVERAL
      ENVIRONMENTS on the Remote Hosts this Shell reaches, with nothing fixed". A release
      candidate checked on every host with no deploy or publish stays with the matrix.
    messages:
      - role: user
        content: >-
          Run the full checks for this release candidate SHA on the Linux, Mac and Windows
          hosts and give me one row per platform; nothing is to be deployed or published.
    expect:
      required: [daintree.hosts.run-validation-matrix]
      optional: [daintree.hosts.foundation]

  # --- daintree.release.publish-package across hosts ---
  - id: release-owner-publish-agent-designate
    category: single-runbook
    note: >-
      Agent-phrased. The publish clause "Also when a swarm of hosts shares the work and
      exactly one host is the publisher of a publish authorised now: the hub's brief to it,
      its check of its own registry account and channel, and its lost reply reconciled
      against the registry." names it.
    messages:
      - role: user
        content: >-
          Designate one host to publish sdk 2.1.0 to the registry under latest while the
          other hosts only build and compare tarball hashes; none of them may publish.
    expect:
      required: [daintree.release.publish-package]
      optional: [daintree.hosts.foundation]

  - id: release-owner-publish-user-only-machine
    category: single-runbook
    note: >-
      Casual user wording: one machine publishes while the others verify. The publish clause
      "Also when a swarm of hosts shares the work and exactly one host is the publisher of a
      publish authorised now: the hub's brief to it, its check of its own registry account
      and channel, and its lost reply reconciled against the registry." is the signal.
    messages:
      - role: user
        content: only the release machine may push 3.0.1 to npm, the other machines just verify the tarball
    expect:
      required: [daintree.release.publish-package]
      optional: [daintree.hosts.foundation]

  - id: release-owner-publish-trap-no-other-machine
    category: routing-trap
    note: >-
      A publish whose reply was lost is read from the registry, never handed to another
      host: the publish clause "Also when a swarm of hosts shares the work and exactly one
      host is the publisher of a publish authorised now: the hub's brief to it, its check of
      its own registry account and channel, and its lost reply reconciled against the
      registry.". Moving a unit to another machine is reassign-host-work, which this is not.
    messages:
      - role: user
        content: the publish from the release machine got no answer, have a different machine run npm publish now
    expect:
      required: [daintree.release.publish-package]
      optional: [daintree.hosts.foundation]

  - id: release-owner-publish-after-builds
    category: single-runbook
    note: >-
      The other hosts are done and one publisher goes. The publish clause "Also when a swarm
      of hosts shares the work and exactly one host is the publisher of a publish authorised
      now: the hub's brief to it, its check of its own registry account and channel, and its
      lost reply reconciled against the registry." names it.
    messages:
      - role: user
        content: >-
          the other hosts finished building and testing 4.2.0; the release host alone
          should now publish it to npm and the rest stay out of it
    expect:
      required: [daintree.release.publish-package]
      optional: [daintree.hosts.foundation]

  - id: release-owner-reassign-reverse-unfinished-build
    category: routing-trap
    note: >-
      A release build already sent to one host that cannot finish it moves to another
      machine. Reassign clause: "a piece of work ALREADY SENT to one Remote Host has to MOVE
      TO A DIFFERENT MACHINE because the first cannot finish it". The release runbooks cover
      the one designated writer, not moving unfinished build work.
    messages:
      - role: user
        content: >-
          the build host went silent partway through compiling the sdk for release, hand
          its unfinished build to a different machine
    expect:
      required: [daintree.hosts.reassign-host-work]
      optional: [daintree.hosts.foundation]

  # Control twins (issue #159): the same requests against the control catalog,
  # merged runbooks mapped to what absorbed them and retired lane runbooks dropped.
  - id: release-owner-deploy-issue-build-everywhere-control
    category: single-runbook
    host_model: control
    note: 'Control twin of release-owner-deploy-issue-build-everywhere: the same request against the control
      catalog. The issue''s own phrasing for the whole swarm job. The deploy clause "Also when a swarm of
      hosts shares the work and exactly one host is the deployer of a deploy authorised now: the hub''s
      brief to it, its check of its own target, and its lost reply reconciled against the platform." decides
      it; the plan runbooks (start-swarm, execute- distributed-workflow) carry the build side and may ride
      along.'
    messages:
    - role: user
      content: Build across the swarm but deploy once from the designated host.
    expect:
      required:
      - daintree.release.deploy-and-verify
      optional:
      - daintree.hosts.foundation
      - daintree.hosts.delegate-to-host
      - daintree.hosts.execute-distributed-workflow
      - daintree.hosts.swarm-fan-out
      - daintree.hosts.run-validation-matrix