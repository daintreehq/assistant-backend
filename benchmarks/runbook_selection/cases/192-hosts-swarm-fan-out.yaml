# daintree.hosts.swarm-fan-out: the hub sends the SAME work to the assistant on every chosen
# Remote Host at once, each on its own run branch, and brings back one table with a row per
# host, verified by artifact. Recall cases are the issue's five requests (the two bare "swarm"
# one-liners are honest measurements of an untrained runbook against trained local owners) plus
# an agent-phrased and a user-phrased outcome. Routing traps: this runbook wins against each
# declared neighbour. Reverse traps: the neighbour wins and this runbook must not ride along.
# The hosts foundation may ride along (optional).

cases:
  # ------------------------------------------------------------------- recall
  - id: swarm-fan-out-run-on-all-studios
    category: single-runbook
    note: >-
      The issue's first request. Decided by "the SAME WORK done on EVERY Remote Host this Shell
      reaches" and its own example "run this on all my machines".
    messages:
      - role: user
        content: Run this on all the studios.
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-each-machine-try
    category: single-runbook
    note: >-
      The issue's request, quoted as an example in the positive clause: "have each machine try
      this".
    messages:
      - role: user
        content: Have each machine try this.
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-every-host-compare
    category: single-runbook
    note: >-
      The issue's request with X filled in. Decided by "one copy per machine" and "show me what
      each got"; the table side by side is the deliverable, no winner picked.
    messages:
      - role: user
        content: Have every host try the new caching layer and compare.
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-swarm-this-task
    category: continuation
    note: >-
      The issue's bare request after the task and the hosts are on the table and every host
      getting the same brief is the option offered. Decided by "the SAME WORK done on EVERY
      Remote Host this Shell reaches" and "one copy per machine".
    messages:
      - role: user
        content: 'here is the job: add a --dry-run flag to the deploy script, with a test that covers it'
      - role: assistant
        content: Your three Remote Hosts each have an assistant in this repository. Should one host take it, or should every host get the same brief?
      - role: user
        content: Swarm this task.
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-agent-phrased
    category: single-runbook
    note: >-
      The outcome as an agent writes it. Decided by "The deliverable is one table with a row per
      host (project, agent CLI, branch, commit SHA, checks, pane), each result verified".
    messages:
      - role: user
        content: Send one brief to the assistant on every Remote Host to build the same change on a per-host branch, then return one table of each host's branch, SHA and checks
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-user-each-sha
    category: single-runbook
    note: >-
      A user's words. Decided by "one copy per machine" and "have every host build the parser on
      its own branch and show me what each got".
    messages:
      - role: user
        content: every one of my remote machines should write the retry helper on its own branch, then show me each sha
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  # ------------------------------------------------------------- routing traps
  - id: swarm-fan-out-not-delegate-to-host
    category: routing-trap
    note: >-
      Several hosts, the same fix. Decided by "or on the several they name, one copy per machine"
      against "one unit on one host or a hand-over between two (daintree.hosts.delegate-to-host)".
    messages:
      - role: user
        content: not just the build box, have all three remote hosts do the pagination fix, each on its own branch
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-not-ask-host
    category: routing-trap
    note: >-
      Work, not a question. Decided by "the SAME WORK done on EVERY Remote Host" against "one
      question to one host's assistant (daintree.hosts.ask-host-assistant)".
    messages:
      - role: user
        content: have every remote host's assistant actually implement the parser change on its own branch, not just answer a question about it
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-not-recover
    category: routing-trap
    note: >-
      A new run, not work already sent. Decided by "the SAME WORK done on EVERY Remote Host"
      against "what became of work already sent (daintree.hosts.recover-and-clean-up)".
    messages:
      - role: user
        content: 'start a new run on all the remote hosts: same lint autofix everywhere, and check each reported commit'
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-not-local-fan-out
    category: routing-trap
    note: >-
      Other machines, not agents here. Decided by "one copy per machine" against "independent
      units for agents on this machine (daintree.orchestration.fan-out-work)".
    messages:
      - role: user
        content: 'same task on each of my other machines rather than agents here: every host writes the csv exporter on its own branch'
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-not-do-delegated-work
    category: routing-trap
    note: >-
      Sent from the Shell to every host, not implemented on one lane. Decided by "EVERY Remote
      Host this Shell reaches" against "or carrying out its unit
      (daintree.hosts.do-delegated-work)".
    messages:
      - role: user
        content: from the Shell, have the assistant on every host implement the parser in a new worktree there and send me each one's sha
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-not-competition
    category: routing-trap
    note: >-
      Each host's own version, laid side by side with no winner. Decided by "have every host build
      the parser on its own branch and show me what each got"; daintree.orchestration.competition
      owns entries "compared and a winner picked".
    messages:
      - role: user
        content: every remote host should write its own version of the rate limiter so I can look at all of them side by side, nobody needs to win
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]

  # ------------------------------------------------------------ reverse traps
  - id: swarm-fan-out-reverse-delegate-to-host
    category: routing-trap
    note: >-
      One host alone. daintree.hosts.delegate-to-host owns "ONE piece of WORK done by the
      Daintree assistant on another machine"; this runbook fences "one unit on one host".
    messages:
      - role: user
        content: have the build box's assistant alone fix the date parsing bug and push a branch for it
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-reverse-local-fan-out
    category: routing-trap
    note: >-
      Agents on this machine. daintree.orchestration.fan-out-work owns "a BATCH of independent
      issues or tasks, one agent terminal per issue or worktree".
    messages:
      - role: user
        content: put a separate agent on each of these three bugs in its own worktree here on this mac
    expect:
      required: [daintree.orchestration.fan-out-work]

  - id: swarm-fan-out-reverse-local-competition
    category: routing-trap
    note: >-
      Rival entries on this machine with a winner. daintree.orchestration.competition owns
      "its own version of the same code change in its own worktree — and then wants the entries
      compared and a winner picked".
    messages:
      - role: user
        content: 'on this mac, run a contest: two agents each build the tokenizer their own way, then judge which is better'
    expect:
      required: [daintree.orchestration.competition]

  - id: swarm-fan-out-reverse-ask-host
    category: routing-trap
    note: >-
      A question to one host's assistant, not work. daintree.hosts.ask-host-assistant owns "ONE
      QUESTION answered by the Daintree assistant on ANOTHER MACHINE" where "The deliverable is
      that assistant's ANSWER, relayed with attribution and its caveats; the question asks it to
      change nothing".
    messages:
      - role: user
        content: ask the linux workstation's assistant why its nightly build got slower this week; it should only look, not change anything
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: swarm-fan-out-reverse-multi-agent
    category: routing-trap
    note: >-
      Agents here converging on one answer. daintree.orchestration.multi-agent owns "several
      agents must work ONE problem together and you relay between them until they CONVERGE on a
      single synthesized answer".
    messages:
      - role: user
        content: two agents here should argue the caching bug out together until they agree on one fix
    expect:
      required: [daintree.orchestration.multi-agent]

  # Control twins (issue #159): the same requests against the control catalog,
  # merged runbooks mapped to what absorbed them and retired lane runbooks dropped.
  - id: swarm-fan-out-reverse-start-swarm-control
    category: routing-trap
    host_model: control
    note: 'Control twin of swarm-fan-out-reverse-start-swarm: the same request against the control catalog.
      Ready, nothing sent. daintree.hosts.start-swarm owns "The deliverable is a ready table (host, project,
      slot, agent, generation) plus what needs the person, with no work sent".'
    messages:
    - role: user
      content: line up a Claude assistant per remote machine for the api project, nothing to do yet
    expect:
      required:
      - daintree.hosts.delegate-to-host
      optional:
      - daintree.hosts.foundation
  - id: swarm-fan-out-reverse-check-usage-control
    category: routing-trap
    host_model: control
    note: 'Control twin of swarm-fan-out-reverse-check-usage: the same request against the control catalog.
      Usage per host. daintree.hosts.check-usage-limits owns "how much Claude Code or Codex allowance each
      Remote Host this Shell reaches has left".'
    messages:
    - role: user
      content: which of my remote hosts still has Claude allowance this week? one row per machine
    expect:
      required:
      - daintree.agents.check-usage-limits
      optional:
      - daintree.hosts.foundation
