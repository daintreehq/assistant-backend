  # Combined-journey pane trials, 2026-10-24 (Claude Code haiku and Codex in an isolated
  # Daintree). Each query is the agent's search_runbooks query as sent, scrubbed. All
  # routed at 0.999 or better with a host connected; pinned because a host connected is
  # exactly where the local owner must keep these words.
  - id: tx-journey-restart-resume-batch
    category: routing-trap
    note: >-
      Session de571da1, 2026-10-24: after an app restart, the agent resumed a local fix
      batch from its checkpoint without relaunching the finished or running units.
      Decided by status-and-resume's "from run checkpoints, live Daintree state" and its
      fence "work sent to assistants on other machines
      (daintree.hosts.recover-and-clean-up)": everything here is on this machine.
    host_state: {hosts: connected}
    messages:
      - role: user
        content: >-
          Daintree restarted mid-way through a batch of fix agents in a project. Resume the
          batch from its saved state: report where each piece stands, without relaunching
          agents that are already running or finished.
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: tx-journey-restart-reconcile-batch
    category: single-runbook
    note: >-
      Codex session 01a16c31, 2026-10-24, the same restart in Codex's words. It read the
      checkpoint, reconciled each unit, then fetched the runbook that started the batch
      by id to continue it. Decided by status-and-resume's "pick up / resume something
      from an earlier session"; the body's "continuing happens under the runbook that
      started the work" is what the follow-up get_runbook obeyed.
    host_state: {hosts: connected}
    messages:
      - role: user
        content: >-
          Recover a fix batch in this project after Daintree restarted halfway through.
