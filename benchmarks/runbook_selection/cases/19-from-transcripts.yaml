# Cases taken from real sessions by /learn-from-transcript. Queries are the agent's
# query as sent (or the user's words), scrubbed of specifics with their shape kept.

cases:
  - id: tx-named-reviewer-then-named-fixer-agent-query
    category: routing-trap
    note: >-
      Live sidebar-assistant run, 2026-09-26: the agent's own query. Served
      spawn-visible-agent and review-change; relay-review-feedback ranked third
      unselected, and review-change's body sent the assistant to fingerprint and read
      the file itself instead of launching the named reviewer. Decided by
      relay-review-feedback's "or launch the reviewer the user names … and relay its
      findings to the named fixer".
    messages:
      - role: user
        content: >-
          Have Codex review a file for bugs without changing anything, then have Claude
          fix the findings
    expect:
      required: [daintree.agents.relay-review-feedback]
      optional: [daintree.foundation]

  - id: tx-named-reviewer-then-named-fixer-user-words
    category: routing-trap
    note: >-
      Same run, the user's own words. relay-review-feedback was 0.007 behind
      review-change and ask-and-relay. Decided by review-change's fence "when the user
      names a reviewer agent and a different agent to fix what it finds (use
      daintree.agents.relay-review-feedback)".
    messages:
      - role: user
        content: >-
          Ask Codex to review a source file for bugs without changing anything, then
          pass its findings to Claude and have Claude fix them here. Tell me what
          changed.
    expect:
      required: [daintree.agents.relay-review-feedback]
      optional: [daintree.foundation]

  - id: tx-plain-worktree-new-branch
    category: single-runbook
    note: >-
      Live sidebar-assistant run, 2026-09-26: routed correctly at 1.0; pinned so the
      body trim (no up-front or confirming listing) keeps its route. Decided by
      create-plain-worktree's "create, add, or set up a plain worktree for a new
      branch".
    messages:
      - role: user
        content: Create a new worktree on a fresh branch for me, nothing launched in it
    expect:
      required: [daintree.worktree.create-plain-worktree]
      optional: [daintree.foundation]

  - id: tx-rival-versions-in-separate-worktrees-agent-query
    category: routing-trap
    note: >-
      Live sidebar-assistant run, 2026-09-26: the agent's own query. Served
      multi-agent 0.96, relocate-agents 0.74 and fan-out-work 0.73; competition was
      0.40 and unselected, so the assistant fetched it by id. Decided by
      competition's "has each produce its OWN independent entry for the SAME task …
      its own version of the same code change in its own worktree".
    messages:
      - role: user
        content: >-
          have two different agents each write their own version in separate
          worktrees, then compare the results
    expect:
      required: [daintree.orchestration.competition]
      optional: [daintree.foundation]

  - id: tx-rival-versions-same-refactor-pick-better
    category: routing-trap
    note: >-
      Paraphrase measured with the same run: relocate-agents 0.99 and fan-out-work
      0.97 took it, competition 0.002. relocate-agents fences "to launch NEW agents
      into fresh worktrees … daintree.orchestration.competition when each does the
      same task to be compared".
    messages:
      - role: user
        content: >-
          Get Claude and Codex to each implement the same refactor independently in
          their own worktrees and pick the better one
    expect:
      required: [daintree.orchestration.competition]
      optional: [daintree.foundation]

  - id: tx-move-running-agent-to-new-worktree-agent-query
    category: routing-trap
    note: >-
      Live sidebar-assistant run, 2026-09-26: the agent's own query after a Claude
      had been started to wait for instructions. Served spawn-visible-agent 0.99,
      relocate-agents 0.001. Decided by relocate-agents' "an agent that ALREADY
      EXISTS … is to be moved into its own new or another worktree, optionally with a
      task to do there" and spawn-visible-agent's fence to it.
    messages:
      - role: user
        content: >-
          Move a running agent to a new worktree and have it implement a code change
    expect:
      required: [daintree.worktree.relocate-agents]
      optional: [daintree.foundation]

  - id: tx-move-running-agent-to-new-worktree-user-words
    category: routing-trap
    note: >-
      Same run, the user's second message. relocate-agents was 0.01 behind
      spawn-visible-agent. Decided by relocate-agents' "move Claude to a new worktree
      called X and have it fix Y there".
    messages:
      - role: user
        content: >-
          Actually, move Claude to a new worktree called fix-quotes and have it make
          the CSV parser handle quoted commas there.
    expect:
      required: [daintree.worktree.relocate-agents]
      optional: [daintree.foundation]

  - id: tx-fact-contest-peer-vote-agent-query
    category: routing-trap
    note: >-
      Live sidebar-assistant run (Codex), 2026-09-26, session 01a0dece: the agent's
      own query, served competition 0.9998 with poll-pinned-agents 0.003. Pinned so a
      fix for the user-words phrasing below cannot trade it away. Decided by
      competition's "has each produce its OWN independent entry for the SAME task —
      an interesting fact … send each agent the others' submissions to pick the best,
      tally, declare a winner".
    messages:
      - role: user
        content: >-
          Ask multiple agents for unique interesting facts and have them vote on the
          best fact
    expect:
      required: [daintree.orchestration.competition]
      optional: [daintree.foundation]

  - id: tx-fact-contest-peer-vote-user-words
    category: routing-trap
    note: >-
      Same run, the user's own words, trimmed. poll-pinned-agents took it at 0.9994
      with competition 0.004: named agents plus "tell me which agent gave the most
      interesting fact" read as a poll. The entries are the agents' own facts, then a
      verdict on them. Decided by poll-pinned-agents' fence "for a judged competition
      over the agents' own submissions … (use daintree.orchestration.competition)".
    messages:
      - role: user
        content: >-
          Ask Claude, Antigravity, Grok and Codex each for one interesting fact, pick
          the two best, have each vote on the others' facts, tally and tell me which
          agent gave the most interesting fact
    expect:
      required: [daintree.orchestration.competition]
      optional: [daintree.foundation]

  - id: tx-why-is-shipped-issue-still-open
    category: routing-trap
    note: >-
      Help-assistant session 58fe462a, 2026-09-24: the user's own words after a fix
      shipped and its issue stayed open. forge.manage-issue took it at 0.997 with
      follow-up-on-issue outside the top 5. Decided by manage-issue's fence "read an
      issue or PR's current status, ask why an issue is still open, or add a closing
      comment and close it (use daintree.workflow.follow-up-on-issue)".
    messages:
      - role: user
        content: Why is this open? https://github.com/acme/widgets/issues/1384
    expect:
      required: [daintree.workflow.follow-up-on-issue]
      optional: [daintree.foundation]

  - id: tx-reaudit-fix-with-codex-fresh-sessions
    category: routing-trap
    note: >-
      Help-assistant session 58fe462a, 2026-09-25: the user's words, trimmed. The
      assistant launched three read-only Codex reviewers, one lens each, and merged
      their findings; no fixer was named. relay-review-feedback took it at 0.999 with
      review-change 0.002. Decided by relay-review-feedback's fence "when you review
      the change yourself and no agent is named to fix it (use
      daintree.review.review-change)".
    messages:
      - role: user
        content: >-
          Reaudit the entire fix with Codex via brand new sessions, looking for all
          second and third order effects
    expect:
      required: [daintree.review.review-change]
      optional: [daintree.foundation]

  - id: tx-daintree-logs-for-bug-report
    category: single-runbook
    note: >-
      Help-assistant session 58fe462a, 2026-09-27: the user's words, verbatim. Nothing was
      selected (create-plain-worktree 0.86, diagnostics 0.46); a tidier phrasing
      selects diagnostics at 0.995. Decided by diagnostics' "wants diagnostics for a
      bug report".
    messages:
      - role: user
        content: >-
          Can you put daintree logs to send to author to look for bugs on desktop?
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  - id: tx-log-it-as-issue-for-later
    category: routing-trap
    note: >-
      Help-assistant session 58fe462a, 2026-09-23: "log" meaning file an issue, the
      user's "Ok log the e2e for this for later" with its referent filled in. "for
      later" pulled it to watch-outcome (0.63) beside the foundation, with
      manage-issue unranked. Decided by manage-issue's "file or create an issue …
      turn this bug into an issue"; nothing is to happen at a later time.
    messages:
      - role: user
        content: Ok log the missing e2e tests for this widget move as an issue for later
    expect:
      required: [daintree.forge.manage-issue]
      optional: [daintree.foundation]

  - id: tx-drive-release-checklist-in-browser-yourself
    category: no-task
    note: >-
      Help-assistant session 58fe462a, 2026-09-23: the user asked the assistant itself
      to run a plugin release checklist in its own browser tool. No Daintree agent
      or terminal is involved, yet spawn-visible-agent took it at 0.996. Its fence is
      "a direct visible agent to change project files … or to explore/investigate a
      project"; nothing here asks for an agent.
    messages:
      - role: user
        content: >-
          Please drive the checklist in Claude in Chrome. Spin up sites as needed with
          the release zip
    expect:
      required: []

  - id: tx-finish-gitflow-release
    category: no-task
    note: >-
      Help-assistant session 58fe462a, 2026-09-24: a git-flow chore in the user's own
      repository. execute-durable-workflow (0.97) and runoff-tiebreaker (0.96, on
      "ties") were selected. runoff-tiebreaker is for when "an agent competition, poll,
      or peer-vote ends in a tie"; this is one local git-flow command, not execute-durable-workflow's
      "substantial multi-step goal with dependent phases".
    messages:
      - role: user
        content: Finish the release flow in native gitflow so it all ties up
    expect:
      required: []

  - id: tx-where-are-we-mid-release
    category: single-runbook
    note: >-
      Help-assistant session 58fe462a, 2026-09-23: after hours away from a delegated
      pipeline. Routed at 0.985; pinned. Decided by status-and-resume's "where were
      we" across turns.
    messages:
      - role: user
        content: Where are we!
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation]

  - id: tx-who-is-doing-work
    category: single-runbook
    note: >-
      Help-assistant session 58fe462a, 2026-09-23: the delegated agent had stopped
      and nothing noticed. Routed at 0.9996; pinned. Decided by supervise-fleet's
      "agents are ALREADY running and the user wants the fleet swept and acted on"
      and its "is anyone stuck?".
    messages:
      - role: user
        content: Where are we!
      - role: assistant
        content: >-
          The fix agent is on its plan step and the checklist agent is waiting on
          you; nothing has landed yet.
      - role: user
        content: who is doing work? Anyone?
    expect:
      required: [daintree.orchestration.supervise-fleet]
      optional: [daintree.foundation]

  - id: tx-close-sessions-no-longer-in-use
    category: single-runbook
    note: >-
      Help-assistant session 58fe462a, 2026-09-25: the assistant closed three panels
      the user had opened with no proposed set. Routed at 0.958; pinned, since the
      runbook it reaches is the one whose body rule "A broad one gets the proposed set
      … then one question" would have stopped it.
    messages:
      - role: user
        content: close sessions no longer in use
    expect:
      required: [daintree.orchestration.workspace-cleanup]
      optional: [daintree.foundation]

  - id: tx-ask-codex-second-order-risks
    category: routing-trap
    note: >-
      Help-assistant session 58fe462a, 2026-09-25: one Codex agent, one read-only
      question, its answer relayed. ask-and-relay is selected (0.84) behind
      poll-pinned-agents (0.999), which wants "the SAME question put to several
      agents". Decided by ask-and-relay's "ONE agent asked ONE question and its
      answer brought back".
    messages:
      - role: user
        content: >-
          We've had lots of issues with allow lists in the past. Ask Codex what the
          potential issues are there, second and third order
    expect:
      required: [daintree.agents.ask-and-relay]
      optional: [daintree.foundation]

  - id: tx-rolling-queue-per-unit-teardown-agent-query
    category: routing-trap
    note: >-
      Help-assistant session 80156813, 2026-09-27: the agent's own query, served
      fan-out-work at 1.0 (workspace-cleanup 0.03); 20 agents ran to 20 PRs. The
      request asks for each unit's worktree to be deleted as it lands, which is the
      queue's own teardown, not a cleanup. Decided by fan-out-work's "a ROLLING QUEUE
      under a cap … including refilling it as each unit finishes" against
      workspace-cleanup's "tear down workspace state after a fan-out".
    messages:
      - role: user
        content: >-
          Run design review agents in parallel worktrees, keep six going, prompt them
          periodically, open PRs, delete worktrees when done
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: tx-rolling-queue-per-unit-teardown-user-words
    category: single-runbook
    note: >-
      Same session, the user's own words, scrubbed: routed at 0.999. Decided by
      fan-out-work's "a list of work plus a concurrency cap is this runbook".
    messages:
      - role: user
        content: >-
          Create new worktrees and branches for small, focused areas. In each, send a
          Claude Code agent on Opus running the design review command so it opens a pull
          request. Only 6 at a time; when one finishes, delete its worktree and start the
          next. Keep going until 20 to 30 are done.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: tx-delete-done-worktrees-mid-queue
    category: single-runbook
    note: >-
      Same session, 13:41: asked mid-queue after two deletes had timed out unanswered;
      five deletes then ran and were confirmed. Routed at 1.0. Decided by
      workspace-cleanup's "the user explicitly asks to tear down workspace state …
      'delete that worktree'".
    messages:
      - role: user
        content: Can you delete the worktrees that are done?
    expect:
      required: [daintree.orchestration.workspace-cleanup]
      optional: [daintree.foundation]

  - id: tx-per-launch-model-and-effort
    category: routing-trap
    note: >-
      Help-assistant session 566371c8, 2026-09-29: asked to spend Codex in proportion
      to the stakes, the assistant read the empty preset lists and told the user no
      model or effort could be set per launch; agent.launch takes both. Unsearched;
      before the fix check-usage-limits led this phrasing (0.82) and spike-options a
      paraphrase of the user's words (0.84). Decided by spawn-visible-agent's "ONE
      visible agent in the right worktree, on any model or effort named" and
      check-usage-limits' fence "to choose which model or reasoning effort an agent
      launches with, even to save budget (daintree.edits.spawn-visible-agent)".
    messages:
      - role: user
        content: Launch Codex with a specific model and reasoning effort for each task
    expect:
      required: [daintree.edits.spawn-visible-agent]
      optional: [daintree.foundation]

  - id: tx-continue-agents-cut-off-by-sleep
    category: routing-trap
    note: >-
      Same session: three coders' turns ended in "went to sleep mid-response". The
      assistant sent two of them a continue message, holding back the third because
      it shared a checkout, and the resumed coder's commits landed; this phrasing
      selected park-work at 0.99. Decided by recover-agent's "a turn cut off
      by an error (the machine slept, the network dropped) that must be told to
      continue" and park-work's fence "to get agents whose turn was cut off by sleep
      or an error going again (use daintree.agents.recover-agent)".
    messages:
      - role: user
        content: >-
          Tell the agents that were cut off when the machine went to sleep to continue
          where they stopped
    expect:
      required: [daintree.agents.recover-agent]
      optional: [daintree.foundation]


  - id: tx-waves-agent-query
    category: routing-trap
    note: >-
      Help-assistant session 7be17974, 2026-10-14: the agent's own query for a
      four-wave issue plan. It got fan-out-work alone, which has no merge between
      batches, and improvised the wave cycle across thirteen issues. Decided by
      work-in-waves' "WAVES … where the next wave starts only once the previous
      wave's pull requests are merged" and its fence "one batch, or a rolling queue
      under a cap, with no merge between waves (daintree.orchestration.fan-out-work)".
      fan-out-work still rides along (1.0000, waves 0.9971) until a retrain.
    messages:
      - role: user
        content: >-
          Work issues in waves: worktree per issue with recipe, merge PRs, delete
          worktrees, repeat
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional: [daintree.foundation]

  - id: tx-waves-user-words
    category: routing-trap
    note: >-
      Same session, the user's words with the issue list removed. Workspace-cleanup
      rides along on "delete those worktrees"; the teardown here is a step of the
      wave cycle. Decided by work-in-waves' "once every PR in the wave passes CI, merge
      them, delete the worktrees and start the next wave" and its fence "one batch …
      with no merge between waves (daintree.orchestration.fan-out-work)".
    messages:
      - role: user
        content: >-
          Work through all of these issues. For each one create a new worktree, assign
          the issue to me and start a Claude Code agent with /work on it; there's a
          recipe for this. Once every pull request in a wave is finished and its CI
          passes, delete those worktrees and run the merge command in a new Claude Code
          terminal in the root worktree, close it once it's done, then start the next
          wave the same way. Continue until all waves are done.
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional: [daintree.foundation]

  - id: tx-waves-start-next-wave
    category: single-runbook
    note: >-
      Same session: the user's go once a wave had merged. Without a waves runbook this
      selected audit-worktrees at 0.99. Decided by work-in-waves' "start the next
      wave".
    messages:
      - role: user
        content: Everything has merged so you can start the next wave
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional: [daintree.foundation]

  - id: tx-add-issues-to-waves-is-find-work
    category: routing-trap
    note: >-
      Same session, mid-run: the user asked for more ready issues to add. The agent
      screened unassigned, ready issues against the waves in flight and added two on
      a yes. Decided by work-in-waves' fence "finding more issues to add
      (daintree.workflow.find-issue-work)" and find-issue-work's "anything
      unassigned".
    messages:
      - role: user
        content: >-
          Please check all open issues and see if there's anything else we could add to
          the waves
    expect:
      required: [daintree.workflow.find-issue-work]
      optional: [daintree.foundation, daintree.forge.triage-issue-backlog]

  - id: tx-ten-minute-monitor-is-watch-outcome
    category: single-runbook
    note: >-
      Same session: the user asked for a periodic check on the running agents. On
      its own this is a deferred wake. Decided by watch-outcome's "keep an eye on it
      while I'm out" and its step 3, "your host's scheduler, only once confirmed to
      exist".
    messages:
      - role: user
        content: >-
          Set a timer for every 10 minutes or so just to monitor the terminals and
          figure out what's going on
    expect:
      required: [daintree.orchestration.watch-outcome]
      optional: [daintree.foundation, daintree.orchestration.supervise-fleet]

  - id: tx-batch-rounds-agent-query
    category: routing-trap
    note: >-
      Help-assistant session ee668b08, 2026-10-16: the agent's query for a batch run
      that merged each round's pull requests before picking the next. A deployment
      gap at the time: the served build predated work-in-waves and returned
      fan-out-work alone (1.0000), which has no merge between batches. Decided by
      work-in-waves' "WAVES (or rounds, or ordered batches) … where the next wave
      starts only once the previous wave's pull requests are merged" and its fence
      "one batch, or a rolling queue under a cap, with no merge between waves
      (daintree.orchestration.fan-out-work)".
    messages:
      - role: user
        content: >-
          Work batches of issues in parallel worktrees, merge their pull requests, then
          start the next batch
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional: [daintree.foundation]

  - id: tx-batch-drain-user-words
    category: routing-trap
    note: >-
      Same session, the user's words with the skill name removed, after one round had
      landed: rounds until the backlog is empty, each round's worktrees deleted. The
      history carries the merge between rounds that "the batch workflow" names.
      Verbatim, bench search put workspace-cleanup first (0.9946) on "delete
      worktrees"; here the teardown is a step of the round cycle. Decided by
      work-in-waves' "merge them, delete the worktrees and start the next wave" and
      "keep going until all the waves are done".
    messages:
      - role: user
        content: >-
          Run one batch: pick the ready issues, a worktree and agent for each, merge
          their pull requests once they're all done, then clean up
      - role: assistant
        content: >-
          The batch is done: all eight pull requests are merged and the worktrees are
          gone.
      - role: user
        content: >-
          Now do the full batch workflow again, but this time drain all available
          issues. So keep on going until there are none left. Make sure to delete
          worktrees between each batch.
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional: [daintree.foundation]

  - id: tx-issues-left-mid-run
    category: continuation
    note: >-
      Same session, mid-run: the user asked which open issues would still be left once
      the round in progress landed, and the assistant answered from its own pick
      report. The question continues the run. Read alone, the same words selected
      check-usage-limits at 0.9975 on "remaining", whose procedure launches an agent
      pane to read its plan allowance. Decided by work-in-waves' "keep going until all
      the waves are done" (a drain's remaining work is the run's) and check-usage-limits'
      fence "which issues or tasks are still left to do
      (daintree.workflow.find-issue-work)".
    active: [daintree.orchestration.work-in-waves]
    messages:
      - role: user
        content: >-
          Drain the ready issues in batches: worktree and agent per issue, merge each
          batch's pull requests, delete the worktrees, then pick the next batch
      - role: assistant
        content: >-
          Round 3 is under way: four issues, each with its own worktree and agent, all
          working.
      - role: user
        content: which 2 issues will be remaining by the time you're done with this batch?
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional: [daintree.foundation, daintree.workflow.find-issue-work]

  - id: tx-issues-left-after-batch-not-usage
    category: routing-trap
    note: >-
      Same words read alone, as a search query would arrive with no run in context: a
      tracker read of open issues, less those in flight. check-usage-limits took it at
      0.9975 on "remaining". Decided by find-issue-work's "check whether an issue is
      already being worked" and check-usage-limits' fence "which issues or tasks are
      still left to do (daintree.workflow.find-issue-work)"; status-and-resume's "what
      is still open" is allowed beside it.
    messages:
      - role: user
        content: which 2 issues will be remaining by the time you're done with this batch?
    expect:
      required: [daintree.workflow.find-issue-work]
      optional: [daintree.foundation, daintree.orchestration.status-and-resume]

  - id: tx-own-chat-history-file
    category: no-task
    note: >-
      Same session: the user asked for the assistant's own session transcript, which
      it found on disk. No catalog workflow covers locating an existing transcript;
      curate-copytree-bundle ranked first unselected (0.8946), but it curates project
      context into a bundle.
    messages:
      - role: user
        content: And can you please give me your chat history file?
    expect:
      required: []
