      delegate-to-host and swarm-fan-out. With no merge between rounds named, the
      text on disk gives it to fan-out-work ("keep going until all 30 are done"), not
      work-in-waves, which needs a merge between waves; the pick (find-issue-work) may
      ride along. Decided by
      place-work's fence "several issues all for ONE machine the person named,
      whatever they call it (a batch or merge-gated waves there".
      drain-issue-backlog (session f9a68c1f) splits work between two or more hosts:
