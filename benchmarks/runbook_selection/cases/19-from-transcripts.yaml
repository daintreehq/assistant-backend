      Read alone, the words selected status-and-resume, follow-up-on-issue and
      postmortem-run. Mid-run the question continues the drain, whose picks and skips
      are the run's own record. Decided by work-in-waves' "keep going until all the
      waves are done" (as tx-issues-left-mid-run).
    active: [daintree.orchestration.work-in-waves]
    messages:
      - role: user
        content: >-
          Drain the ready issues in rounds on my other machine: a worktree and agent per
