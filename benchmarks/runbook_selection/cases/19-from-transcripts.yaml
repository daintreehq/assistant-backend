        - daintree.hosts.foundation
        - daintree.workflow.find-issue-work
      forbid: [daintree.hosts.place-work, daintree.hosts.drain-issue-backlog]

  - id: tx-why-issue-left-out-mid-drain
    category: continuation
    note: >-
      Same session, between rounds: the user asked why one open issue was not in the
