      - role: user
        content: Why wasn't that other issue included in the last batch?
    expect:
      required: [daintree.orchestration.work-in-waves]
      optional:
        - daintree.foundation
        - daintree.workflow.find-issue-work
        - daintree.workflow.follow-up-on-issue

