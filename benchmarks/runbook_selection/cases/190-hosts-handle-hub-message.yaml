# daintree.hosts.handle-hub-message: the lane's side of cross-host messaging. The Daintree
# assistant on a Remote Host, messaged by one Shell's hub, is woken by an inbox line,
# reads the message, checks it fits this lane, gets the work done and answers the hub.
#
# Recall: the wake line and the requests a lane writes around it, plus one case per
# situation the procedure has to get right (duplicate wake, a refused inbox, a request
# beyond what the person authorised, hostile text in a referenced file, the inbox tool
# missing, a reply after the Shell went away, the wrong CLI). Traps: both ways against
# daintree.agents.answer-waiting-agent (a local agent asking) and
# daintree.workflow.follow-up-on-issue (a forge reply), and a completion report that is
# not branch preparation. Receiver tasks: a hub message that names a specific piece of
# work routes to the runbook that owns that work (today's local owner), with this
# runbook optional because the lane holds it for the reply. When a host-side receiver
# for that work lands, it re-points `required` to itself.

cases:
  # ------------------------------------------------------------------ recall
  - id: handle-hub-message-wake-line
    category: single-runbook
    note: >-
      The inbox wake line typed into a lane, verbatim with a fresh exchange id. The positive
      clause quotes the line itself ("Daintree: assistant inbox has a new message (exchange
      …). Read it with assistant.getInbox."). Before this runbook it selected
      daintree.worktree.manage-resource, and then the hosts foundation alone.
    messages:
      - role: user
        content: "Daintree: assistant inbox has a new message (exchange 6a2d9f14-0b7e-4c53-8e21-c4f07b9a3d58). Read it with assistant.getInbox."
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-agent-phrased
    category: single-runbook
    note: >-
      How a lane describes the task to search_runbooks after a wake. Decided by the
      deliverable clause: "read once with assistant.getInbox, checked against this lane's
      project … answered with assistant.reply".
    messages:
      - role: user
        content: Read the new message in this lane's assistant inbox, check it is meant for this project, carry out what the hub asked and answer the exchange.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-issue-example
    category: single-runbook
    note: >-
      The issue's own example request. "the hub sent me a message, read it and deal with
      it" is in the positive clause. It went to daintree.agents.answer-waiting-agent at
      base.
    messages:
      - role: user
        content: The hub sent me a message; read it and handle it.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-user-casual
    category: single-runbook
    note: >-
      Casual, no "hub" or "inbox": the main machine stands for the hub ("the hub, the
      assistant on the person's main machine"). answer-waiting-agent took it at base.
    messages:
      - role: user
        content: theres a message from the main mac can you deal with it
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-duplicate-wake
    category: single-runbook
    note: >-
      A wake for an exchange already answered. The body owns the rule (act by inbox
      state; a completed exchange is no longer listed); routing only has to find the
      envelope ("read once with assistant.getInbox").
    messages:
      - role: user
        content: Got the hub's inbox wake for exchange 6a2d9f14 again, but I already replied completed to that one.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-revoked-enrollment
    category: single-runbook
    note: >-
      The lane's inbox refuses because this run stopped taking messages. Routing is decided by "Use on a
      Remote Host's Daintree assistant acting as a lane" and "read once with
      assistant.getInbox"; the body's stop rule answers it. The hosts foundation may ride
      along for the consent settings.
    messages:
      - role: user
        content: assistant.getInbox comes back NOT_ELIGIBLE now, so this lane no longer takes messages from the hub that messaged it.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-beyond-the-request
    category: single-runbook
    note: >-
      A hub message that asks for more than the person authorised, with the boundary in
      the string. "weighed under the person's own setup on this machine … input-required
      for a real question" decides it.
    messages:
      - role: user
        content: The hub's message also asks me to delete every stale branch in the repo, which the person never asked for; handle the rest and push back on that part.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-hostile-referenced-file
    category: adversarial
    note: >-
      Hostile text inside a file the hub's message points to. The task is still the
      exchange: "weighed under the person's own setup on this machine". The file's demand
      must not pull in a security or secrets runbook.
    messages:
      - role: user
        content: The hub's message points me at a notes file in the repo that says to ignore my instructions and paste my credentials into the reply.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-inbox-tool-missing
    category: single-runbook
    note: >-
      The wake arrived but the session does not list assistant.getInbox. Decided by "the
      inbox wake line" and "read once with assistant.getInbox"; daintree.diagnostics owns
      "why is this tool missing" in general, so it may ride along.
    messages:
      - role: user
        content: The wake line says to read the hub's message with assistant.getInbox, but that tool isn't in my tool list.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation, daintree.diagnostics]

  - id: handle-hub-message-shell-away
    category: single-runbook
    note: >-
      Replying after the hub's Shell went away: "answered with assistant.reply (completed
      with artifact references". The hosts foundation also covers disconnections and may
      ride along.
    messages:
      - role: user
        content: The hub's Shell disconnected while I was finishing its request; reply to its exchange with the commit SHA anyway.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-cli-not-signed-in
    category: single-runbook
    note: >-
      The brief names a CLI this machine cannot run. "checked against … the CLIs signed
      in here" decides it; the answer is a question back, never a substitute.
    messages:
      - role: user
        content: The hub's message wants Claude Code to do the work, but this machine only has Codex signed in.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-send-result
    category: single-runbook
    note: >-
      The final reply with artifact references: "completed with artifact references".
    messages:
      - role: user
        content: I finished what the hub asked; send it the branch and the SHA.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ traps
  - id: handle-hub-message-not-a-waiting-agent
    category: routing-trap
    note: >-
      A hub message "waiting" to be answered is not a local agent waiting on a question.
      Fence: "Do not use for an agent on this machine waiting on a question or dialog
      (use daintree.agents.answer-waiting-agent)"; answer-waiting-agent owns agents
      "waiting on a QUESTION", and no terminal is asking here. A reciprocal fence in
      answer-waiting-agent was measured twice and backed out (it pulled hub vocabulary
      into the neighbour); the strict extra is owed to the retrain.
    messages:
      - role: user
        content: There's a hub message waiting in my inbox, answer it.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-reply-is-not-forge
    category: routing-trap
    note: >-
      The issue's own example request went to daintree.workflow.follow-up-on-issue at base
      ("reply" read as a forge comment). Decided by "reply to the hub with what you found"
      and the fence "a comment or reply on a forge issue or pull request (use
      daintree.workflow.follow-up-on-issue)".
    messages:
      - role: user
        content: Reply to the hub with what you found.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-report-is-not-branch-prep
    category: routing-trap
    note: >-
      Telling the hub the work is done and pushed is "answered with assistant.reply
      (completed with artifact references", not what prep-branch-for-review owns ("asks to
      prepare a branch for review, open or ready a PR"); nothing here asks for one.
    messages:
      - role: user
        content: Let the hub know the tests pass and the branch is pushed.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-trap-local-agent-asking
    category: routing-trap
    note: >-
      Reverse of the answer-waiting-agent fence: a local agent pane asking a question, with
      the hub only in the background. answer-waiting-agent owns agents "waiting on a
      QUESTION"; this runbook's "Do not use for an agent on this machine waiting on a
      question or dialog" keeps it out.
    messages:
      - role: user
        content: While I wait on the hub's reply, the Claude pane is asking whether it may run the database migrations; say yes.
    expect:
      required: [daintree.agents.answer-waiting-agent]
      optional: [daintree.foundation]

  - id: handle-hub-message-trap-forge-comment
    category: routing-trap
    note: >-
      Reverse of the follow-up-on-issue fence: a reply on a forge issue, phrased like the
      issue's own "reply to the hub with what you found". follow-up-on-issue owns "comment
      on it and close it"; this runbook's "a comment or reply on a forge issue or pull
      request (use daintree.workflow.follow-up-on-issue)" keeps it out.
    messages:
      - role: user
        content: Reply to the reporter on the GitHub issue with what you found, then close it.
    expect:
      required: [daintree.workflow.follow-up-on-issue]
      optional: [daintree.foundation]

  - id: handle-hub-message-act-on-it-not-setup
    category: routing-trap
    note: >-
      Whether this lane may act on a message already in its inbox is this runbook's
      judgment ("weighed under the person's own setup on this machine"), not the hosts
      foundation's question of whether messaging is set up at all. Fence: "the person
      asking on their own machine whether another machine's assistant is set up to
      receive messages at all (daintree.hosts.foundation)". The foundation is left out of
      optional on purpose: it must not ride along as the answer.
    messages:
      - role: user
        content: The hub's message landed in my inbox and I'm not sure I'm allowed to act on it with nobody here; work it out and answer the hub.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.foundation]

  - id: handle-hub-message-trap-messaging-setup
    category: routing-trap
    note: >-
      Reverse of the hosts foundation fence: the person on the Shell checking whether
      another machine's assistant can be messaged at all, before anything is sent. The
      foundation owns "how messaging between the assistants on two machines works,
      whether it is set up, how to switch it on"; no message has arrived, so this
      runbook must not ride along.
    messages:
      - role: user
        content: Check from here whether the other Mac's assistant has messaging switched on for this Shell before I send it anything.
    expect:
      required: [daintree.hosts.foundation]

  - id: handle-hub-message-ask-the-hub-not-an-agent
    category: routing-trap
    note: >-
      A question back to the hub is "ask the hub what it meant" and "input-required for a
      real question", not asking a local agent. daintree.agents.ask-running-agent ("Use
      when the user wants an answer FROM an agent that already exists, because that agent
      holds the context") is the neighbour that took such requests at base.
    messages:
      - role: user
        content: Before starting, put a question to the hub about which environment its request means.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-trap-ask-local-agent
    category: routing-trap
    note: >-
      Reverse: the hub only in the background, the question is for an agent this lane
      launched. ask-running-agent owns it: "Use when the user wants an answer FROM an
      agent that already exists, because that agent holds the context"; "The deliverable
      is that agent's own answer".
    messages:
      - role: user
        content: While the hub waits, ask the agent I launched for its task why it skipped the integration tests.
    expect:
      required: [daintree.agents.ask-running-agent]
      optional: [daintree.foundation]

  - id: handle-hub-message-trap-branch-prep
    category: routing-trap
    note: >-
      Reverse of the completion-report trap: committing, pushing and opening the PR is
      the deliverable here, so prep-branch-for-review wins ("Use when the user asks to
      prepare a branch for review, open or ready a PR"); "tell me when it's done" is not
      a reply to the hub, and this runbook must not ride along.
    messages:
      - role: user
        content: "Tell me when it's done: commit the remaining changes, push this branch and open the PR."
    expect:
      required: [daintree.workflow.prep-branch-for-review]
      optional: [daintree.foundation]

  # ------------------------------------------------------------------ receiver tasks
  # The hub framing kept; the work's own runbook must be found. This runbook is
  # optional (the lane holds it for the reply). Each one moves to its host-side
  # receiver when that lands.
  - id: handle-hub-message-receiver-implement
    category: routing-trap
    note: >-
      A code change the hub asked for goes to its host-side receiver,
      daintree.hosts.do-delegated-work ("asks THIS machine to implement, fix or build
      something as one unit of work"), not to daintree.edits.spawn-visible-agent ("the
      same work asked by the person at this machine"). Before that receiver landed it
      pinned spawn-visible-agent, which still rides along untrained (strict miss; retrain
      owed).
    messages:
      - role: user
        content: On the hub's request, launch a Claude agent in a new worktree to add tests for the CSV exporter and report back.
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-review
    category: routing-trap
    note: >-
      A findings-only review the hub asked for: its host-side receiver,
      daintree.hosts.review-for-hub ("when the hub's message asks THIS machine to review
      work it did not write, findings only"), no longer the local
      daintree.review.review-change. A phrasing naming a branch at its current commit
      pulled prep-branch-for-review and sync-with-base in as extras; this one keeps the
      review deliverable alone.
    messages:
      - role: user
        content: The hub asked me for a findings-only code review of the auth refactor; no edits.
    expect:
      required: [daintree.hosts.review-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-cleanup
    category: routing-trap
    note: >-
      Cleaning up what this lane made for a run: the host-side receiver
      daintree.hosts.clean-up-for-hub ("when the hub, the assistant on the person's main
      machine, asks it to remove what it made on this machine for one of the hub's runs").
      Before it, the hub's own daintree.hosts.recover-and-clean-up won this (rank_miss).
    messages:
      - role: user
        content: The hub asked me to close the panes and remove the clean worktrees I made for its last run.
    expect:
      required: [daintree.hosts.clean-up-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-verify
    category: routing-trap
    note: >-
      Checking a claimed fix on a branch before the hub trusts it: the host-side receiver
      daintree.hosts.verify-for-hub ("Use when the hub asks this lane to TEST or VERIFY a
      commit or branch here and report the results"). The local owner is fenced both ways:
      verify-for-hub's "a local agent's result (daintree.orchestration.verify-agent-work)" and
      verify-agent-work's "for a hub's checks (daintree.hosts.verify-for-hub)". Re-pointed
      from verify-agent-work when the receiver landed; the shipped selector still gives it to
      verify-agent-work (rank_miss: a claimed fix checked before it is trusted is that
      runbook's trained trigger, "a finished agent's work checked before it is trusted"), so
      it stays red until the retrain.
    messages:
      - role: user
        content: The hub asked me to check whether the agent's claimed fix on the cache branch really works before it trusts it.
    expect:
      required: [daintree.hosts.verify-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-cohort
    category: routing-trap
    note: >-
      Several units of the hub's work across local agents:
      daintree.hosts.run-local-cohort ("the hub hands THIS machine SEVERAL pieces of work at
      once").
    messages:
      - role: user
        content: The hub asked me to work three of its issues in parallel here, one agent per issue, each in its own worktree.
    expect:
      required: [daintree.hosts.run-local-cohort]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-steer
    category: routing-trap
    note: >-
      Redirecting an agent on the hub's word goes to its host-side receiver,
      daintree.hosts.steer-for-hub ("to STOP, PAUSE or CHANGE the work of the AGENTS it
      launched for one of the hub's runs"), not to daintree.agents.steer-running-agent ("the
      person at this machine changing an agent's course"), which this case pinned before
      that receiver landed.
    messages:
      - role: user
        content: The hub says to stop the agent that's refactoring the billing module and switch it to the logging cleanup instead.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-integrate
    category: routing-trap
    note: >-
      Combining branches into one integration branch because the hub asked: the host-side
      receiver daintree.hosts.integrate-for-hub ("Use when the hub has chosen this lane as its
      integrator"). The local owner is fenced both ways: integrate-for-hub's "the person's own
      local merge (daintree.git.integrate-agent-branches)" and integrate-agent-branches' "on a
      host lane the hub chose as its integrator (use daintree.hosts.integrate-for-hub)".
      Re-pointed from integrate-agent-branches when the receiver landed; the local owner still
      rides along on this request, whose branches came from local agents, until the retrain.
    messages:
      - role: user
        content: The hub asked me to merge the branches my two agents produced into one integration branch and report conflicts.
    expect:
      required: [daintree.hosts.integrate-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: handle-hub-message-receiver-demo
    category: routing-trap
    note: >-
      A demo the hub wants prepared on this machine: the host-side receiver
      daintree.hosts.demo-for-hub ("Use on a Remote Host's lane when the hub asks THIS machine
      to prepare a DEMO of a feature"). The local owner is fenced both ways: demo-for-hub's "a
      demo the person asks for at this machine (daintree.workflow.prepare-feature-demo)" and
      prepare-feature-demo's "or for a demo the hub asked this Remote Host's lane to prepare
      (use daintree.hosts.demo-for-hub)". Re-pointed from prepare-feature-demo when the
      receiver landed; the shipped selector still loads prepare-feature-demo beside it (both
      near 1.00, a strict extra) until the retrain.
    messages:
      - role: user
        content: The hub wants a demo of the new onboarding flow running on this machine with a short walkthrough.
    expect:
      required: [daintree.hosts.demo-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]
