# daintree.hosts.handle-hub-message: the lane's side of cross-host messaging. The Daintree
# assistant on a Remote Host, messaged by one Shell's hub, is woken by an inbox line,
# reads the message, checks it fits this lane, gets the work done and answers the hub.
#
# Recall: the wake line and the requests a lane writes around it, plus one case per
# situation the procedure has to get right (duplicate wake, a refused inbox, a request
# beyond what the person authorised, hostile text in a referenced file, the inbox tool
# missing, a reply after the Shell went away, the wrong CLI). Traps: both ways against
# daintree.agents.answer-waiting-agent (a local agent asking) and
# daintree.workflow.follow-up-on-issue (a forge reply), and a completion report that is
# not branch preparation. Receiver tasks: a hub message that names a specific piece of
# work routes to the runbook that owns that work (today's local owner), with this
# runbook optional because the lane holds it for the reply. When a host-side receiver
# for that work lands, it re-points `required` to itself.

cases:
  # ------------------------------------------------------------------ recall
  - id: handle-hub-message-trap-forge-comment
    category: routing-trap
    note: >-
      Reverse of the follow-up-on-issue fence: a reply on a forge issue, phrased like the
      issue's own "reply to the hub with what you found". follow-up-on-issue owns "comment
      on it and close it"; this runbook's "a comment or reply on a forge issue or pull
      request (use daintree.workflow.follow-up-on-issue)" keeps it out.
    messages:
      - role: user
        content: Reply to the reporter on the GitHub issue with what you found, then close it.
    expect:
      required: [daintree.workflow.follow-up-on-issue]
      optional: [daintree.foundation]

  - id: handle-hub-message-trap-branch-prep
    category: routing-trap
    note: >-
      Reverse of the completion-report trap: committing, pushing and opening the PR is
      the deliverable here, so prep-branch-for-review wins ("Use when the user asks to
      prepare a branch for review, open or ready a PR"); "tell me when it's done" is not
      a reply to the hub, and this runbook must not ride along.
    messages:
      - role: user
        content: "Tell me when it's done: commit the remaining changes, push this branch and open the PR."
    expect:
      required: [daintree.workflow.prep-branch-for-review]
      optional: [daintree.foundation]

  # ------------------------------------------------------------------ receiver tasks
  # The hub framing kept; the work's own runbook must be found. This runbook is
  # optional (the lane holds it for the reply). Each one moves to its host-side
  # receiver when that lands.
