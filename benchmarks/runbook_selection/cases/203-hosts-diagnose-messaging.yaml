# daintree.hosts.diagnose-messaging: this Shell's hub working out why a Remote Host it can
# see cannot have its assistant messaged or started (the per-host switches, this machine's
# or that assistant's acceptance, the link, a pause, a rate limit), sending nothing. Recall cases in agent and user words; traps where it
# must win against daintree.diagnostics (its one declared neighbour) and against
# daintree.hosts.handle-hub-message, daintree.hosts.start-swarm and
# daintree.hosts.recover-and-clean-up; reverse traps where each of those, or the hosts
# foundation alone, wins and this runbook must not ride along. Three cases (marked) miss on
# the shipped selector: the runbook is untrained against established neighbours, and they
# wait on the retrain.

cases:
  - id: diagnose-messaging-reverse-local-mcp-errors
    category: routing-trap
    note: >-
      Reverse trap. Daintree's own connection failing on this machine is
      daintree.diagnostics ("Use when the question is about DAINTREE'S OWN HEALTH",
      "the MCP is disconnected", "show recent Daintree errors"); no other machine is
      involved.
    messages:
      - role: user
        content: the Daintree MCP keeps dropping on this laptop, show me the recent errors
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  - id: diagnose-messaging-agent-reachability-control
    category: single-runbook
    host_model: control
    note: 'Control twin of diagnose-messaging-agent-reachability: the same request against the control catalog.
      The issue''s agent-phrased request. Decided by "wants to know which gate is in the way" and the deliverable
      ending "sending nothing".'
    messages:
    - role: user
      content: Diagnose host assistant reachability without resending the task.
    expect:
      required:
      - daintree.hosts.survey-hosts
      optional:
      - daintree.hosts.foundation
  - id: diagnose-messaging-rate-limited-user-control
    category: single-runbook
    host_model: control
    note: 'Control twin of diagnose-messaging-rate-limited-user: the same request against the control catalog.
      A user naming a refusal the positive clause lists: "rate_limited". The foundation''s one line on limits
      may ride along; the diagnosis is this runbook''s. RETRAIN OWED: the shipped selector picks the hosts
      foundation alone (rank_miss).'
    messages:
    - role: user
      content: sends to the render machine come back rate_limited; why?
    expect:
      required:
      - daintree.hosts.survey-hosts
      optional:
      - daintree.hosts.foundation
  - id: diagnose-messaging-see-server-not-assistant-control
    category: single-runbook
    host_model: control
    note: 'Control twin of diagnose-messaging-see-server-not-assistant: the same request against the control
      catalog. The issue''s user-phrased request: the user "can SEE another machine from this Shell" but
      "cannot message or start the Daintree assistant on it". RETRAIN OWED: the shipped selector selects
      nothing here (rank_miss); an untrained runbook does not reach the cut on this short question.'
    messages:
    - role: user
      content: Why can I see the server but not message its assistant?
    expect:
      required:
      - daintree.hosts.survey-hosts
      optional:
      - daintree.hosts.foundation
  - id: diagnose-messaging-machine-setting-not-diagnostics-control
    category: routing-trap
    host_model: control
    note: 'Control twin of diagnose-messaging-machine-setting-not-diagnostics: the same request against
      the control catalog. A refusal naming this machine''s own setting sounds like daintree.diagnostics,
      but it is a messaging gate, "a send or start that came back opted_out", while the hosts are listed.
      Diagnostics is fenced off: "Do not use for Daintree itself misbehaving on this machine (daintree.diagnostics)".'
    messages:
    - role: user
      content: My sidebar session can list the hosts but every send fails, saying this machine's setting
        is off. What is blocking it?
    expect:
      required:
      - daintree.hosts.survey-hosts
      optional:
      - daintree.hosts.foundation
  - id: diagnose-messaging-refused-not-recover-control
    category: routing-trap
    host_model: control
    note: 'Control twin of diagnose-messaging-refused-not-recover: the same request against the control
      catalog. New messages refused while the link is up and nothing restarted: the person "cannot message
      or start the Daintree assistant on it, and wants to know which gate is in the way". No exchange is
      being accounted for, so daintree.hosts.recover-and-clean-up ("why a task sent to a Remote Host never
      came back, usually after Daintree restarted") is an extra.'
    messages:
    - role: user
      content: Nothing restarted and the link is up, but every new message to the studio is refused. Which
        gate is it?
    expect:
      required:
      - daintree.hosts.survey-hosts
      optional:
      - daintree.hosts.foundation
  - id: diagnose-messaging-reverse-swarm-setup-control
    category: routing-trap
    host_model: control
    note: 'Control twin of diagnose-messaging-reverse-swarm-setup: the same request against the control
      catalog. Reverse trap. Readying assistants before work goes out is daintree.hosts.start-swarm ("wants
      a swarm SET UP across their other machines before handing out work"); nothing has been refused, so
      this runbook must not ride along.'
    messages:
    - role: user
      content: get a codex assistant ready on each of my remote hosts in this repo before I hand out work
    expect:
      required:
      - daintree.hosts.delegate-to-host
      optional:
      - daintree.hosts.foundation
