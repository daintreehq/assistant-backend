# daintree.hosts.steer-for-hub: a lane steering the hub's work on this host. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub, is asked to stop, pause or
# correct work it delegated here that an agent this lane launched is running or already
# finished, and answers the hub with each agent's actual state.
#
# Recall: the issue's three requests, an agent-phrased task description, a casual user line,
# and one case per situation the procedure has to get right (an agent mid-turn, one idle
# after its turn, one already finished, a cancelled exchange, an unrelated pane). Traps: this
# runbook wins against the person's own steering (daintree.agents.steer-running-agent),
# parking for the day (daintree.orchestration.park-work), a hung agent
# (daintree.agents.recover-agent) and the hub-side runbooks
# (daintree.hosts.recover-and-clean-up, daintree.hosts.delegate-to-host); and the reverse
# traps, where each neighbour keeps its own request and this runbook must not ride along.
# The receiver case in 190-hosts-handle-hub-message.yaml is re-pointed here.

cases:
  # ------------------------------------------------------------------ recall
  - id: steer-for-hub-trap-local-steer
    category: routing-trap
    note: >-
      Reverse: the person steering an agent on this machine, no hub. steer-running-agent
      owns "Use when an agent that is ALREADY WORKING on a task" that "must change course or
      stop"; its fence "on a Remote Host's lane steering work the hub delegated there
      (daintree.hosts.steer-for-hub)" keeps this runbook out.
    messages:
      - role: user
        content: Interrupt the claude pane I'm watching, it's rewriting the router; tell it to keep the old routes.
    expect:
      required: [daintree.agents.steer-running-agent]
      optional: [daintree.foundation]

  - id: steer-for-hub-trap-hub-side-redo
    category: routing-trap
    note: >-
      Reverse: the hub's own side, sending reworked acceptance to a Remote Host.
      delegate-to-host owns "ONE piece of WORK done by the Daintree assistant on another
      machine"; this runbook fences "the hub's own side (daintree.hosts.delegate-to-host)".
    messages:
      - role: user
        content: Get the assistant on my other Mac to rework the export feature with the new acceptance criteria and open a PR.
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation, daintree.foundation]
