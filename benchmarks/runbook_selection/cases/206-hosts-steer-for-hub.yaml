# daintree.hosts.steer-for-hub: a lane steering the hub's work on this host. The Daintree
# assistant on a Remote Host, enrolled for one Shell's hub, is asked to stop, pause or
# correct work it delegated here that an agent this lane launched is running or already
# finished, and answers the hub with each agent's actual state.
#
# Recall: the issue's three requests, an agent-phrased task description, a casual user line,
# and one case per situation the procedure has to get right (an agent mid-turn, one idle
# after its turn, one already finished, a cancelled exchange, an unrelated pane). Traps: this
# runbook wins against the person's own steering (daintree.agents.steer-running-agent),
# parking for the day (daintree.orchestration.park-work), a hung agent
# (daintree.agents.recover-agent) and the hub-side runbooks
# (daintree.hosts.recover-and-clean-up, daintree.hosts.delegate-to-host); and the reverse
# traps, where each neighbour keeps its own request and this runbook must not ride along.
# The receiver case in 190-hosts-handle-hub-message.yaml is re-pointed here.

cases:
  # ------------------------------------------------------------------ recall
  - id: steer-for-hub-issue-stop-and-report
    host_model: inbox
    category: single-runbook
    note: >-
      The issue's first request. Decided by "to STOP, PAUSE or CHANGE the work of the AGENTS
      it launched for one of the hub's runs" and "answer the hub with each agent's actual
      state rather than the exchange's". At base it selected
      daintree.hosts.recover-and-clean-up (hub side) with the envelope.
    messages:
      - role: user
        content: The hub asked me to stop the delegated agents and report their saved work.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-issue-acceptance-change
    host_model: inbox
    category: single-runbook
    note: >-
      The issue's second request, a correction that keeps the rest of the brief: "hub
      update: new acceptance criteria for the run, every other constraint stands". At base
      it went to daintree.memory.manage-project-memory, execute-durable-workflow and
      spawn-visible-agent.
    messages:
      - role: user
        content: "Hub update: change the acceptance criteria for this run; keep all other constraints."
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-issue-pause-checkpoint
    host_model: inbox
    category: single-runbook
    note: >-
      The issue's third request, after the lane has read the hub's message naming the panes:
      "pause the hub's child panes here". The bare string selected
      daintree.orchestration.park-work at base.
    messages:
      - role: user
        content: Anything new from the hub since the last run started?
      - role: assistant
        content: It names the two panes this lane launched for its parser and lexer units, both still working, and asks for them to be paused.
      - role: user
        content: Pause these named child panes and return a resumable checkpoint.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-agent-phrased
    host_model: inbox
    category: single-runbook
    note: >-
      How a lane describes the task to search_runbooks: "each of those agents stopped,
      redirected or found already done, confirmed from its own screen, with nothing it made
      thrown away".
    messages:
      - role: user
        content: Hub follow-up for a delegated unit, interrupt the agent this lane launched for it, keep its uncommitted work, and reply with the agent's verified state.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-user-cancelled-still-going
    host_model: inbox
    category: single-runbook
    note: >-
      Casual: the hub cancelled, the child is still working. "or an agent still working on a
      job the hub has called off" decides it; at base a similar line went to
      daintree.agents.recover-agent.
    messages:
      - role: user
        content: hub cancelled that job but the codex pane i started for it is still going, stop it
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-mid-turn-stop
    host_model: inbox
    category: single-runbook
    note: >-
      The live scenario of a stop mid-turn with the work kept: "each of those agents
      stopped" and "confirmed from its own screen, with nothing it made thrown away".
    messages:
      - role: user
        content: The hub wants the Claude agent on its search unit stopped mid-turn; leave its changes in the worktree and tell the hub where it got to.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-idle-child-correction
    host_model: inbox
    category: single-runbook
    note: >-
      The live scenario of a correction to a child idle after its turn: "to STOP, PAUSE or
      CHANGE the work of the AGENTS it launched for one of the hub's runs".
    messages:
      - role: user
        content: "The hub's new requirement is for the agent that already finished its turn on the export unit: keep the header row. Pass it on."
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-already-done
    host_model: inbox
    category: single-runbook
    note: >-
      The live scenario of a child that finished before the stop arrived: "found already
      done", reported rather than poked.
    messages:
      - role: user
        content: The hub asked me to stop its agent on unit 4, but that agent committed and went idle a while ago.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-unrelated-pane
    host_model: inbox
    category: single-runbook
    note: >-
      The live scenario with an unrelated pane that must stay untouched: "the AGENTS it
      launched for one of the hub's runs" and nothing else.
    messages:
      - role: user
        content: Stop just the hub's agent on the docs unit and leave the other panes in this project alone.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ traps
  - id: steer-for-hub-not-local-steer
    host_model: inbox
    category: routing-trap
    note: >-
      The agent is one this lane launched for the hub's unit and the answer goes to the hub,
      so the lane's runbook owns it: "to STOP, PAUSE or CHANGE the work of the AGENTS it
      launched for one of the hub's runs". Fence: "the person at this machine changing an
      agent's course (daintree.agents.steer-running-agent)", which took this string at base
      (0.999).
    messages:
      - role: user
        content: Stop the agent I launched for the hub's migration unit mid-turn, keep its uncommitted changes, and reply to the hub with where it stopped.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-not-park-work
    host_model: inbox
    category: routing-trap
    note: >-
      A stop of one hub unit with the other panes left alone is not wrapping up for the day:
      "to STOP, PAUSE or CHANGE the work of the AGENTS it launched for one of the hub's
      runs". Fence: "wrapping up their agents for the day
      (daintree.orchestration.park-work)", which took this string at base (0.99).
    messages:
      - role: user
        content: hub says stop work on unit-3 but leave the other panes alone
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-already-finished-not-local-steer
    host_model: inbox
    category: routing-trap
    note: >-
      The hub's stop for a unit whose agent already committed: "found already done",
      reported rather than poked. At base daintree.agents.steer-running-agent,
      answer-waiting-agent and timebox-attempt were all selected; the fence "the person at
      this machine changing an agent's course (daintree.agents.steer-running-agent)" keeps
      the local runbook out.
    messages:
      - role: user
        content: The hub wants its delegated work stopped here; the agent already finished and committed, so report that rather than stop anything.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-not-start-the-unit
    host_model: inbox
    category: routing-trap
    note: >-
      A change to a unit whose agent is already working is a steer, not starting the unit:
      "to STOP, PAUSE or CHANGE the work of the AGENTS it launched for one of the hub's
      runs". Fence: "starting the hub's unit of work (daintree.hosts.do-delegated-work)".
    messages:
      - role: user
        content: The hub now wants the unit it delegated here to keep the old config format too; the agent on it is partway through.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-not-hub-side-redo
    host_model: inbox
    category: routing-trap
    note: >-
      A change to a unit the hub already delegated here, received by this lane for the agent
      it launched: "to STOP, PAUSE or CHANGE the work of the AGENTS it launched for one of
      the hub's runs". Sending new or reworked work from the hub is "the hub's own side
      (daintree.hosts.delegate-to-host)", which must not be picked.
    messages:
      - role: user
        content: "The hub has amended the unit it delegated to this host: the agent already working on it here must keep the v1 endpoints. Redirect that agent; this is not a new job."
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-not-clean-up
    host_model: inbox
    category: routing-trap
    note: >-
      A stop with nothing removed is not the run's cleanup: "to STOP, PAUSE or CHANGE the
      work of the AGENTS it launched for one of the hub's runs".
      daintree.hosts.clean-up-for-hub owns removing "what it made on this machine for one of
      the hub's runs", and nothing here is removed.
    messages:
      - role: user
        content: The hub cancelled the run; stop its agents but don't delete anything yet.
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-not-hung-agent
    host_model: inbox
    category: routing-trap
    note: >-
      A healthy agent still working on a job the hub dropped is a stop, not a recovery: "or
      an agent still working on a job the hub has called off". recover-agent owns "a hung or
      unresponsive agent", which this one is not.
    messages:
      - role: user
        content: hub dropped the job it gave me; the codex pane for it is fine, just still working, halt it
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ reverse traps
  - id: steer-for-hub-trap-local-steer
    category: routing-trap
    note: >-
      Reverse: the person steering an agent on this machine, no hub. steer-running-agent
      owns "Use when an agent that is ALREADY WORKING on a task" that "must change course or
      stop"; its fence "on a Remote Host's lane steering work the hub delegated there
      (daintree.hosts.steer-for-hub)" keeps this runbook out.
    messages:
      - role: user
        content: Interrupt the claude pane I'm watching, it's rewriting the router; tell it to keep the old routes.
    expect:
      required: [daintree.agents.steer-running-agent]
      optional: [daintree.foundation]

  - id: steer-for-hub-trap-park-own-agents
    host_model: inbox
    category: routing-trap
    note: >-
      Reverse: the person parking their own agents for the day, the hub only mentioned to
      say its runs are done. park-work owns "Use when the user is walking away and wants
      in-flight work paused and made safe, not torn down".
    messages:
      - role: user
        content: Before I log off, park the agents I started myself today with resume notes; the hub's runs here are already finished.
    expect:
      required: [daintree.orchestration.park-work]
      optional: [daintree.foundation]

  - id: steer-for-hub-trap-answer-the-hub
    host_model: inbox
    category: routing-trap
    note: >-
      Reverse: the hub's message is a question about this lane's agents, not a request to
      change them. The envelope owns it: "The deliverable is the exchange handled: read once
      with assistant.getInbox".
    messages:
      - role: user
        content: The hub's message only asks which agents this lane has running; read it and reply.
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-trap-hung-agent
    host_model: inbox
    category: routing-trap
    note: >-
      Reverse: an agent launched for the hub that has gone quiet, not one the hub wants
      changed. recover-agent owns "a hung or unresponsive agent"; nothing here asks to stop
      or change the hub's work.
    messages:
      - role: user
        content: The agent I launched for the hub's unit has shown no output for half an hour; get it moving again.
    expect:
      required: [daintree.agents.recover-agent]
      optional: [daintree.foundation]

  - id: steer-for-hub-trap-start-the-unit
    host_model: inbox
    category: routing-trap
    note: >-
      Reverse: a new unit from the hub with nothing started yet. do-delegated-work owns
      "when the hub asks THIS machine to implement, fix or build something as one unit of
      work"; this runbook's "starting the hub's unit of work
      (daintree.hosts.do-delegated-work)" keeps it out.
    messages:
      - role: user
        content: The hub's message asks this machine to build the CSV export as one unit in a new worktree with Claude; nothing has started yet.
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-trap-hub-side-redo
    category: routing-trap
    note: >-
      Reverse: the hub's own side, sending reworked acceptance to a Remote Host.
      delegate-to-host owns "ONE piece of WORK done by the Daintree assistant on another
      machine"; this runbook fences "the hub's own side (daintree.hosts.delegate-to-host)".
    messages:
      - role: user
        content: Get the assistant on my other Mac to rework the export feature with the new acceptance criteria and open a PR.
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: steer-for-hub-trap-clean-up
    host_model: inbox
    category: routing-trap
    note: >-
      Reverse: the run's agents are finished and the hub wants what it left here removed.
      clean-up-for-hub owns "asks it to remove what it made on this machine for one of the
      hub's runs"; nothing is left to stop or correct.
    messages:
      - role: user
        content: hub says tear down what you made for the race, the agents are finished
    expect:
      required: [daintree.hosts.clean-up-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]
