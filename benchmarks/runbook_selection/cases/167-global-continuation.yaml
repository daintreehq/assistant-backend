# Continuing work across this machine's projects, as Daintree's global Assistant would be asked
# after a restart. Recall cases: picking up unfinished work across every local project, and
# continuing only the parts already authorised, both decided by status-and-resume's "pick up /
# resume something from an earlier session" and "what is still open or in flight"; the executing
# runbook may ride along. Traps, by deliverable: work sent to other machines is
# daintree.hosts.recover-and-clean-up; brand-new work across projects is a fan-out, not a resume;
# a bare what-exists-now listing is the foundation's; passing coordination to a successor is
# daintree.orchestration.hand-off-orchestration. Measured on the shipped selector: the mixed
# local-plus-remote request still loses daintree.hosts.recover-and-clean-up (rank_miss).

cases:
  # ------------------------------------------------------------------- recall
  - id: global-continue-unfinished-all-local-projects
    category: single-runbook
    note: >-
      The issue's request. Several projects on one machine, nothing on another: the local
      sweep ("pick up / resume something from an earlier session"), never the hosts recovery.
      Continuing the plan itself may bring execute-durable-workflow along.
    messages:
      - role: user
        content: Continue my unfinished work across all projects on this machine.
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation, daintree.orchestration.execute-durable-workflow]

  - id: global-continue-authorised-parts-still-running
    category: single-runbook
    note: >-
      What is still running, then only the already-authorised continuation: "what is still
      open or in flight" decides it; status-and-resume hands continuing back to the runbook
      that started the work. The restart is the earlier-session cue that keeps it off
      daintree.orchestration.supervise-fleet (agents running this minute).
    messages:
      - role: user
        content: back after the restart, show me what is still running and keep going with the parts I already said yes to
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation, daintree.orchestration.execute-durable-workflow]

  - id: global-reconcile-runs-every-local-project-after-restart
    category: single-runbook
    note: >-
      Agent-phrased: reconciling saved run checkpoints against live state in each local project
      after Daintree restarted. status-and-resume owns "the saved run checkpoint itself" and
      the reconciliation; nothing went to another machine.
    messages:
      - role: user
        content: After Daintree restarted, reconcile the saved run checkpoints with live terminals in every local project and resume the authorised units
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation, daintree.orchestration.execute-durable-workflow]

  # ------------------------------------------------------------------- traps
  - id: global-continuation-trap-remote-machines
    category: routing-trap
    note: >-
      Work sent to other machines, picked up after a restart: status-and-resume declines it
      ("work sent to assistants on other machines (daintree.hosts.recover-and-clean-up)").
    host_state: {hosts: configured}
    messages:
      - role: user
        content: after the restart, find out where the jobs I handed to my other machines got to
    expect:
      required: [daintree.hosts.recover-and-clean-up]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: global-continue-local-projects-and-remote-studios
    category: multi-runbook
    note: >-
      The issue's mixed request: this machine's projects are the local sweep
      (status-and-resume), the work sent to other machines is
      daintree.hosts.recover-and-clean-up; both load, neither stands in for the other.
    host_state: {hosts: configured}
    messages:
      - role: user
        content: Resume the plan across my local projects and remote studios after the restart.
    expect:
      required: [daintree.orchestration.status-and-resume, daintree.hosts.recover-and-clean-up]
      optional:
        - daintree.foundation
        - daintree.hosts.foundation
        - daintree.orchestration.execute-durable-workflow

  - id: global-continuation-trap-new-work-each-project
    category: routing-trap
    note: >-
      Brand-new work spread over several projects resumes nothing: one agent per item is
      daintree.orchestration.fan-out-work, so the status sweep must not be loaded.
    messages:
      - role: user
        content: start fresh, put an agent on the lint upgrade in each of my projects at once
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: global-continuation-trap-plain-inventory
    category: routing-trap
    note: >-
      A plain what-exists-now listing with nothing to resume is the foundation alone ("a plain
      what-exists-right-now read ... which terminals, agents"); status-and-resume declines "a
      plain what-exists-now read of terminals, worktrees or queues".
    messages:
      - role: user
        content: just list the agent terminals open in each project right now, nothing else
    expect:
      required: [daintree.foundation]

  - id: global-continuation-trap-explicit-handover
    category: routing-trap
    note: >-
      Explicitly passing coordination of a live run to a successor is
      daintree.orchestration.hand-off-orchestration, which status-and-resume fences ("to pass a
      live run's coordination to a successor session"); a saved file never transfers standing.
    messages:
      - role: user
        content: hand coordination of this whole multi-agent run over to a new coordinator session that picks up from your notes
    expect:
      required: [daintree.orchestration.hand-off-orchestration]
      optional: [daintree.foundation]

  # ------------------------------------------------------- Global Assistant hand-over
  - id: global-handover-coordination-to-global-assistant
    category: single-runbook
    note: >-
      The coordinator is being replaced and the successor is this machine's Global
      Assistant: still daintree.orchestration.hand-off-orchestration (freeze, handoff,
      the user's Hand to orchestrator → Global Assistant), never a fresh resume. The
      hosts hand-over may ride along on "carries on".
    messages:
      - role: user
        content: hand coordination of this run over to the Global Assistant so it carries on after I close this pane
    expect:
      required: [daintree.orchestration.hand-off-orchestration]
      optional: [daintree.foundation, daintree.hosts.hand-off-swarm]

  - id: global-handover-global-assistant-takes-over-agents
    category: single-runbook
    note: >-
      User-phrased: the Global Assistant takes over orchestrating these agents. A
      successor coordinator from a handoff is hand-off-orchestration, not status-and-resume
      (picking a run up yourself from its checkpoints).
    messages:
      - role: user
        content: let the global assistant take over orchestrating these agents from here
    expect:
      required: [daintree.orchestration.hand-off-orchestration]
      optional: [daintree.foundation]
