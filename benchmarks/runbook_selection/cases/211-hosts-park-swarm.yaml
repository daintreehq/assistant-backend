# daintree.hosts.park-swarm: the hub parking a run on the Remote Hosts for later and resuming it.
# Each host's own assistant stops its agents with their work left in place (through the hub's
# steering procedure); the hub keeps a resume record of what every host holds and which hosts
# never acknowledged, kept where the person chooses; a later hub session resumes the run from
# fresh host records, never from an old notice, with no second agent on any unit.
#
# Recall: the issue's three requests, an agent-phrased task description, a casual line, a resume
# after the hub restarted, and a host that does not answer the park. Traps: this runbook wins
# against stopping or changing a run with no comeback (daintree.hosts.steer-swarm), parking
# agents on this machine (daintree.orchestration.park-work), catching up after a restart
# (daintree.hosts.recover-and-clean-up) and the receiving machine stopping its own agents
# (daintree.hosts.steer-for-hub); and the reverse traps, where each neighbour keeps its own
# request and this runbook must not ride along.

cases:
  # ------------------------------------------------------------------ recall
  - id: park-swarm-issue-overnight-handoff
    category: single-runbook
    note: >-
      The issue's first request. Decided by "a run ALREADY SENT to their Remote Hosts must be
      PUT ON HOLD TO COME BACK TO, over a break or across a restart" and "a resume record kept
      where the person chooses". At base it selected daintree.orchestration.park-work, the local
      parking runbook.
    messages:
      - role: user
        content: Park my swarm overnight with a clear resume handoff.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-issue-keep-worktrees
    category: single-runbook
    note: >-
      The issue's second request, close to the quoted "pause the cross-machine run for the
      weekend and keep every worktree". At base it selected daintree.worktree.manage-resource
      alone ("remote" read as a worktree's remote resource); that runbook still rides along
      untrained, so this case passes recall and fails strict until a retrain.
    messages:
      - role: user
        content: Pause the remote run for tomorrow without deleting its worktrees.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-issue-restart-checkpoint
    category: single-runbook
    note: >-
      The issue's third request: "PUT ON HOLD TO COME BACK TO, over a break or across a restart"
      and "a resume record kept where the person chooses". At base it selected
      daintree.orchestration.execute-durable-workflow alone, the local dependent-plan checkpoint,
      which still rides along untrained.
    messages:
      - role: user
        content: Create a restart-surviving checkpoint for this cross-host run.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-agent-phrased
    category: single-runbook
    note: >-
      How a hub agent describes the task to search. Decided by "a resume record kept where the
      person chooses (per host: project, slot, branch, SHA, pushed or not, uncommitted files,
      panes, open questions, what must not be redone, and which hosts never acknowledged)".
    messages:
      - role: user
        content: >-
          Hub task: park the in-flight run on the Remote Hosts until tomorrow. Each host's
          assistant stops its agents with their work kept; record per host the branch, HEAD,
          whether it is pushed and the uncommitted files, and flag any host that never
          acknowledged.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-resume-after-shell-reboot
    category: single-runbook
    note: >-
      The resume half after the hub restarted. Decided by "the hub restarted, pick the parked
      remote run back up from its record" and "later the run resumed from fresh host task records
      with no second agent on any unit".
    messages:
      - role: user
        content: My Shell rebooted last night. Pick the parked run on the other machines back up from the resume record without doubling up any agents.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-unanswered-host
    category: single-runbook
    note: >-
      A park where one host may not answer: "which hosts never acknowledged" is part of the
      record, never folded into "parked".
    messages:
      - role: user
        content: Park the run on both hosts for tonight. If one of them doesn't answer, don't tell me it's parked.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ traps (this runbook wins)
  - id: park-swarm-trap-not-steer-swarm
    category: routing-trap
    note: >-
      A hold to come back to, not a stop: "PUT ON HOLD TO COME BACK TO" against this runbook's
      fence "a stop or change with no comeback planned (daintree.hosts.steer-swarm)".
    messages:
      - role: user
        content: can you put the remote swarm on hold till monday, i want to pick it back up exactly where each machine was
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-trap-not-park-work
    category: routing-trap
    note: >-
      The person's own laptop is mentioned, but the run being parked is on the remote machines:
      "a run ALREADY SENT to their Remote Hosts must be PUT ON HOLD TO COME BACK TO", against the
      fence "agents on this machine (daintree.orchestration.park-work)".
    messages:
      - role: user
        content: I'm closing my laptop for the weekend; park the run on the remote machines so each one can carry on from its own checkpoint on Monday.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-trap-not-recover
    category: routing-trap
    note: >-
      After a hub restart, the request is to resume a parked run, not an account of what
      happened: "the hub restarted, pick the parked remote run back up from its record", against
      the fence "an account of what happened while away, or cleanup
      (daintree.hosts.recover-and-clean-up)".
    messages:
      - role: user
        content: The hub restarted. Resume the remote run we parked yesterday from its record.
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-trap-not-steer-for-hub
    category: routing-trap
    note: >-
      The hub telling its hosts to pause, with a resume planned, is this runbook; the fence
      reads "the receiving machine stopping its own agents (daintree.hosts.steer-for-hub)".
    messages:
      - role: user
        content: tell each host to pause the agents it launched for the parser run so we can resume next week, and keep a note of what each one has
    expect:
      required: [daintree.hosts.park-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ reverse traps (neighbour wins)
  - id: park-swarm-reverse-steer-swarm-scrap
    category: routing-trap
    note: >-
      Reverse: a stop with no comeback. daintree.hosts.steer-swarm owns "work they ALREADY SENT
      to their other machines, one run on one or several Remote Hosts, STOPPED, CALLED OFF or
      CHANGED while it is under way"; this runbook fences "a stop or change with no comeback
      planned".
    messages:
      - role: user
        content: Stop the run on every remote host now and tell me which ones acknowledged; I'm scrapping it.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-reverse-park-work-local
    category: routing-trap
    note: >-
      Reverse: the person's own agents on this machine. daintree.orchestration.park-work owns
      "the user is walking away and wants in-flight work paused and made safe, not torn down";
      this runbook fences "agents on this machine".
    messages:
      - role: user
        content: wrap up the agents in this window for the night and leave resume notes
    expect:
      required: [daintree.orchestration.park-work]
      optional: [daintree.foundation]

  - id: park-swarm-reverse-recover-rebuild
    category: routing-trap
    note: >-
      Reverse: a catch-up after a restart with nothing parked. daintree.hosts.recover-and-clean-up
      owns "rebuild where every exchange with the Remote Hosts stands after a restart, a new hub
      or a dropped link, from each host's task records"; this runbook fences "an account of what
      happened while away".
    messages:
      - role: user
        content: Daintree restarted on this Mac. Rebuild where every delegated exchange with the remote hosts stands from their task records.
    expect:
      required: [daintree.hosts.recover-and-clean-up]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: park-swarm-reverse-steer-for-hub-lane
    category: routing-trap
    note: >-
      Reverse: the lane receiving the hub's pause. daintree.hosts.steer-for-hub owns "on a Remote
      Host's lane to STOP, PAUSE or CHANGE the work of the AGENTS it launched for one of the
      hub's runs"; this runbook fences "the receiving machine stopping its own agents".
    messages:
      - role: user
        content: "Message from the hub: pause the agents this lane launched for its parser run and report each one's HEAD and uncommitted files."
    expect:
      required: [daintree.hosts.steer-for-hub]
      optional: [daintree.hosts.foundation, daintree.foundation]
