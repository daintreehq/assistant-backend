# daintree.hosts.ask-host-assistant: this Shell's hub puts ONE question to the assistant on
# one Remote Host and relays its answer with attribution. Recall cases pin the requests the
# issue named, in an agent's and a person's words (machine names replaced), plus a host called
# by its nickname. Routing traps hold the boundary with each declared neighbour on this
# machine (an agent already open, a new local agent launched to answer, a local agent waiting
# on a question), with work handed to the host or a swarm set up across hosts, and with the
# content owners a question can sound like (CI diagnosis, flaky-test hunting, review, a forge
# read), both ways. The hosts foundation co-loads by design, so it is optional everywhere and
# has only the reverse trap: setting messaging up is the foundation's alone.

cases:
  - id: ask-host-agent-phrased
    category: single-runbook
    note: >-
      The issue's agent-phrased request. The positive clause claims it: "wants ONE QUESTION
      answered by the Daintree assistant on ANOTHER MACHINE, a Remote Host this Shell
      reaches". The hosts foundation rides along as the domain foundation.
    messages:
      - role: user
        content: Put one question to the assistant on a remote host and relay its answer
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-release-prep
    category: single-runbook
    note: >-
      The issue's first request, the host named by what it is. "The deliverable is that
      assistant's ANSWER, relayed with attribution and its caveats".
    messages:
      - role: user
        content: Ask the Mac mini how the release prep is going.
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-failing-build
    category: single-runbook
    note: >-
      The issue's second request. Its content words (a failing build) pull toward CI; the
      deciding words are "answered by the Daintree assistant on ANOTHER MACHINE" and "The
      deliverable is that assistant's ANSWER". Untrained, the count head selects nothing
      here: owed to the retrain.
    messages:
      - role: user
        content: What does the assistant on the other Mac make of the failing build?
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-named-host
    category: single-runbook
    note: >-
      A host called by its nickname, with what it is said in the same breath: "ONE
      QUESTION answered by the Daintree assistant on ANOTHER MACHINE, a Remote Host this
      Shell reaches". Without "my other Mac" a nickname could be a local agent or a
      person, so the case states it, as people do.
    messages:
      - role: user
        content: Ask Orion, my other Mac, how the release prep is going.
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-not-an-open-agent-here
    category: routing-trap
    note: >-
      An assistant on another machine, not an agent open here. The fence: "Do not use for a
      question to an agent on THIS machine (daintree.agents.ask-running-agent for one
      already open". ask-running-agent riding along is an extra.
    messages:
      - role: user
        content: ask the assistant on my other machine what branch it is working on
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-not-a-local-launch
    category: routing-trap
    note: >-
      Asking the remote host's own assistant, not launching an agent here to answer: the
      fence names "daintree.agents.ask-and-relay to launch one". ask-and-relay riding
      along is an extra.
    messages:
      - role: user
        content: check with the remote host's assistant whether its tests are green, just ask
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-not-a-waiting-agent
    category: routing-trap
    note: >-
      Waiting for another machine's answer is not answering an agent that waits here: "to
      answer a question an agent here is asking (daintree.agents.answer-waiting-agent)".
      answer-waiting-agent riding along is an extra.
    messages:
      - role: user
        content: Put a question to the remote host's assistant and wait for its answer
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-open-agent
    category: routing-trap
    note: >-
      Reverse trap. A terminal on this machine holds the context: ask-running-agent's
      "Use when the user wants an answer FROM an agent that already exists". Nothing
      crosses machines, so the hosts runbook must not ride along.
    messages:
      - role: user
        content: ask the codex agent in terminal 3 what it decided about the schema
    expect:
      required: [daintree.agents.ask-running-agent]

  - id: ask-host-reverse-local-launch
    category: routing-trap
    note: >-
      Reverse trap. A new agent launched here for its opinion is ask-and-relay's "ONE agent
      asked ONE question and its answer brought back"; no other machine is involved.
    messages:
      - role: user
        content: launch codex and get its opinion of the caching layer, read only
    expect:
      required: [daintree.agents.ask-and-relay]

  - id: ask-host-reverse-waiting-agent
    category: routing-trap
    note: >-
      Reverse trap. A local agent stopped on a prompt is answer-waiting-agent's "waiting on
      a QUESTION and the user wants them answered"; the hosts runbook must not ride along.
    messages:
      - role: user
        content: codex is stuck on a yes or no prompt in its pane, answer it with yes
    expect:
      required: [daintree.agents.answer-waiting-agent]

  - id: ask-host-not-work-for-the-host
    category: routing-trap
    note: >-
      A question about work, not the work itself: the deliverable is the host assistant's
      answer, not "for work that machine's assistant should carry out
      (daintree.hosts.delegate-to-host)". delegate-to-host riding along is an extra.
    messages:
      - role: user
        content: ask my other mac's assistant whether it could take on the docs update this week
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-delegate
    category: routing-trap
    note: >-
      Reverse trap. Work handed to the host's assistant is delegate-to-host's "ONE piece of
      WORK done by the Daintree assistant on another machine", whose deliverable is "that
      host's commit, branch or PR"; this runbook must not ride along.
    messages:
      - role: user
        content: get the linux host's assistant to write the migration and push a branch
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-foundation-setup
    category: routing-trap
    note: >-
      Reverse trap. Switching messaging on is the foundation's ("how to switch it on"), and
      this runbook fences it: "for setting up messaging with another machine or finding out
      why its assistant is unreachable (daintree.hosts.foundation)". No question is put to
      anyone, so this runbook must not ride along.
    messages:
      - role: user
        content: turn on messaging so this Shell can reach the assistant on my laptop host
    expect:
      required: [daintree.hosts.foundation]

  - id: ask-host-not-ci-diagnosis
    category: routing-trap
    note: >-
      The host's assistant is asked what broke and told to touch nothing: "The deliverable
      is that assistant's ANSWER", "the question asks it to change nothing". Nothing here is
      to be made working, so daintree.ci.diagnose-and-fix riding along is an extra.
    messages:
      - role: user
        content: ask the build box's assistant what it thinks broke its nightly build, it shouldn't touch anything
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-ci-diagnosis
    category: routing-trap
    note: >-
      Reverse trap. Red checks to be made green are diagnose-and-fix's "something is FAILING
      and the user wants it working"; the other machine is only where the branch came from.
    messages:
      - role: user
        content: the checks went red after merging the branch from my other machine, get them passing again
    expect:
      required: [daintree.ci.diagnose-and-fix]

  - id: ask-host-not-flaky-hunt
    category: routing-trap
    note: >-
      Asking whether a test is flaky over there is a question for that machine's assistant
      ("ONE QUESTION answered by the Daintree assistant on ANOTHER MACHINE"), not a
      measurement here; daintree.ci.hunt-flaky-test riding along is an extra.
    messages:
      - role: user
        content: check with the build box's assistant whether the date parsing test has been flaky on its machine too
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-flaky-hunt
    category: routing-trap
    note: >-
      Reverse trap. A test failing some runs, to be measured and explained here, is
      hunt-flaky-test's "a test passes SOMETIMES and fails other times, and the user wants
      that measured, explained or stabilised"; mentioning the build machine asks it nothing.
    messages:
      - role: user
        content: the cache eviction test is intermittent here and the build machine sees it too, run it until we know the rate and the cause
    expect:
      required: [daintree.ci.hunt-flaky-test]

  - id: ask-host-not-a-review
    category: routing-trap
    note: >-
      The author on another machine is asked why it made a choice: "The deliverable is that
      assistant's ANSWER". No change is judged here, so daintree.review.review-change riding
      along is an extra.
    messages:
      - role: user
        content: ask the build box's assistant why it chose a lock instead of a channel in its change
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-review
    category: routing-trap
    note: >-
      Reverse trap. Findings with severity on a pushed branch are review-change's "a change
      JUDGED on its merits"; the build box only pushed it.
    messages:
      - role: user
        content: code review the branch the build box pushed, I want findings with severity
    expect:
      required: [daintree.review.review-change]

  - id: ask-host-not-a-forge-read
    category: routing-trap
    note: >-
      What blocks the host's own part of the work is that assistant's to say ("ONE QUESTION
      answered by the Daintree assistant on ANOTHER MACHINE"); no issue or PR state is read,
      so daintree.workflow.follow-up-on-issue riding along is an extra.
    messages:
      - role: user
        content: ask the laptop host's assistant what is still blocking its part of the billing issue
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-forge-read
    category: routing-trap
    note: >-
      Reverse trap. A pull request's checks are forge state the hub reads itself:
      follow-up-on-issue's "a one-off READ of an issue or PR's current forge state", "did CI
      pass?". The build box opened it but is not asked anything.
    messages:
      - role: user
        content: did CI pass on the pull request the build box opened this morning
    expect:
      required: [daintree.workflow.follow-up-on-issue]

  - id: ask-host-not-swarm-setup
    category: routing-trap
    note: >-
      One question to one host's assistant about its own load, not getting assistants ready
      across hosts: "ONE QUESTION answered by the Daintree assistant on ANOTHER MACHINE".
      daintree.hosts.start-swarm riding along is an extra.
    messages:
      - role: user
        content: ask the assistant on the build box whether it is free to take another task
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]

  - id: ask-host-reverse-swarm-setup
    category: routing-trap
    note: >-
      Reverse trap. An enrolled assistant on every remote machine before work goes out is
      start-swarm's "a swarm SET UP across their other machines before handing out work";
      nothing is asked of any one host.
    messages:
      - role: user
        content: before anything goes out, make sure each of my remote machines has an assistant enrolled in this project
    expect:
      required: [daintree.hosts.start-swarm]
      optional: [daintree.hosts.foundation]
