# daintree.hosts.run-local-cohort: a Remote Host's lane given SEVERAL pieces by the hub at
# once (a batch of independent units for this project, or rival attempts the hub asked for)
# splits them across its own worktrees and visible agents, within the hub's cap and this
# project's running agents, verifies each piece and answers the hub once with a row per piece.
#
# Recall: the two issues' own requests, an agent-phrased and a user-phrased request, and the
# request as a second turn after the hub's message was read. Traps: this runbook wins against
# each declared neighbour (one unit, the envelope, the same split asked by the person here,
# rival entries, options to prototype, a spec to break down, agents already running for the hub,
# the hub side). Reverse traps: the neighbour wins and
# this runbook must not ride along; the one-fix trap pins the guard that a hub asking for one
# fix has not asked for attempts. The envelope and the hosts foundation may ride along on a
# hub-framed request (the lane holds the exchange for the reply).

cases:
  # ------------------------------------------------------------------ recall
  - id: run-local-cohort-reverse-fan-out-here
    category: routing-trap
    note: >-
      The person's own batch on this machine, no hub. daintree.orchestration.fan-out-work ("a
      BATCH of independent issues or tasks, one agent terminal per issue or worktree"); this
      runbook fences "the same split asked for by the person at this machine".
    messages:
      - role: user
        content: spin up an agent for each of these tickets in parallel, separate worktrees please
    expect:
      required: [daintree.orchestration.fan-out-work]

  - id: run-local-cohort-reverse-competition-here
    category: routing-trap
    note: >-
      The person's own contest. daintree.orchestration.competition ("and then wants the entries
      compared and a winner picked"); this runbook fences "rival entries".
    messages:
      - role: user
        content: I want claude, codex and gemini to each have a go at the rate limiter in separate worktrees, then you pick the winner
    expect:
      required: [daintree.orchestration.competition]

  - id: run-local-cohort-reverse-spike-options-here
    category: routing-trap
    note: >-
      The person's own options to try. daintree.orchestration.spike-options ("wants several
      OPTIONS tried hands-on before deciding"); this runbook fences "options to prototype".
    messages:
      - role: user
        content: Prototype three different caching approaches on this machine and recommend one
    expect:
      required: [daintree.orchestration.spike-options]

  - id: run-local-cohort-reverse-decompose
    category: routing-trap
    note: >-
      A spec to break down for approval. daintree.orchestration.decompose-work ("BROKEN DOWN into
      separately buildable pieces before anyone writes code"); this runbook fences "a spec to
      break down first".
    messages:
      - role: user
        content: break the billing PRD into units with owned files for my approval before anyone starts
    expect:
      required: [daintree.orchestration.decompose-work]

  - id: run-local-cohort-reverse-swarm-hub-side
    category: routing-trap
    note: >-
      The hub side. daintree.hosts.swarm-fan-out ("the SAME WORK done on EVERY Remote Host");
      this runbook fences "the hub sending work to every host".
    messages:
      - role: user
        content: give every remote host the identical parser task and line their commits up in a table for me
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation]
