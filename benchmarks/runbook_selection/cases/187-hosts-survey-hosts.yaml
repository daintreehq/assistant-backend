# daintree.hosts.survey-hosts: the hub's read-only report on the Remote Hosts (connection,
# observed load and agents, projects and assistants, open exchanges, what needs the
# person). The cases pin it against its neighbours by DELIVERABLE: it reads and reports,
# and starts, sends, recovers and follows nothing. Traps run both ways with
# daintree.orchestration.supervise-fleet (this machine's agents), daintree.hosts.start-swarm
# (readying assistants), daintree.hosts.check-usage-limits, daintree.hosts.diagnose-messaging,
# daintree.hosts.recover-and-clean-up, daintree.hosts.supervise-swarm and
# daintree.hosts.ask-host-assistant.

cases:
  - id: survey-hosts-agent-phrased
    category: single-runbook
    note: >-
      How an agent writes the issue's request. Decided by "The deliverable is ONE read-only
      report, host by host: what was observed and when, projects and assistants, open
      exchanges as recorded, and what needs the person".
    messages:
      - role: user
        content: "Survey the remote hosts: connection, load, enrolled assistants and open exchanges"
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-user-going-on
    category: single-runbook
    note: >-
      The issue's casual request. Decided by "Use on the hub when the person wants to know
      what is going on across their other machines".
    messages:
      - role: user
        content: What's going on across my other Macs?
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation, daintree.diagnostics]

  - id: survey-hosts-connected-and-waiting
    category: single-runbook
    note: >-
      The issue's second request, with the machine names scrubbed. Decided by "whether the
      Remote Hosts are connected" and "whether anything waits on the person".
    messages:
      - role: user
        content: Are my other Macs all connected, and is anything waiting on me?
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation, daintree.foundation, daintree.diagnostics]

  - id: survey-hosts-one-page-status
    category: single-runbook
    note: >-
      An agent-written outcome with the read-only constraint stated. Decided by "ONE
      read-only report, host by host" and "Nothing is sent, started or recovered".
    messages:
      - role: user
        content: >-
          Give me a one-page status of the remote machines: who is connected, how loaded,
          which assistants are available, and anything blocked on me. Don't send anything.
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-projects-without-assistants
    category: single-runbook
    note: >-
      The refinement's host to project to assistant slot view, read-only. Decided by "which
      projects have an assistant enrolled and taking messages" and "Nothing is sent, started or
      recovered".
    messages:
      - role: user
        content: >-
          Report each Remote Host's projects and whether each has an assistant enrolled and
          available, read-only, starting nothing
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-open-exchanges-needing-me
    category: single-runbook
    note: >-
      Open exchanges and the ones that wait on the person. Decided by "which exchanges with
      them are still open, and whether anything waits on the person".
    messages:
      - role: user
        content: List the exchanges still open with my other machines and which of them need my answer
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-load-and-agent-counts
    category: single-runbook
    note: >-
      Observed load and agent counts per host, with the sampling time. Decided by "how busy
      each is" and "what was observed and when".
    messages:
      - role: user
        content: >-
          For each remote host give me connection, load and how many agents are working,
          waiting or idle, with when it was sampled
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-bare-status-report
    category: single-runbook
    note: >-
      Short, no punctuation, no question form. Decided by "Use on the hub when the person
      wants to know what is going on across their other machines" and "ONE read-only report,
      host by host".
    messages:
      - role: user
        content: status report on the remote hosts
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-quiet-hosts-and-questions
    category: single-runbook
    note: >-
      Which hosts dropped, and whether any left something for the person. Decided by
      "whether the Remote Hosts are connected" and "whether anything waits on the person".
    messages:
      - role: user
        content: Which hosts have gone quiet or disconnected, and did any of them leave a question for me
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-not-supervise-fleet
    category: routing-trap
    note: >-
      Hosts, not this machine's agents. survey-hosts says "Do not use for agents and
      terminals on this machine (daintree.orchestration.supervise-fleet)"; the machines named
      are Remote Hosts, so supervise-fleet riding along is an extra.
    messages:
      - role: user
        content: Which of my remote hosts are connected right now and how many agents does each have working
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-not-start-swarm
    category: routing-trap
    note: >-
      Whether each host's assistant is enrolled, read-only. survey-hosts says "readying
      assistants or finding who can take work (daintree.hosts.start-swarm)";
      nothing is asked to be started or readied, so start-swarm is an extra.
    messages:
      - role: user
        content: >-
          Check each remote host and tell me whether its assistant is enrolled and taking
          messages, and which exchanges are still open
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-not-usage-limits
    category: routing-trap
    note: >-
      Load and agent counts are not allowance. survey-hosts says "agent usage
      left on each machine (daintree.hosts.check-usage-limits)"; the figures asked for
      are the ones host.list reports, not a usage screen.
    messages:
      - role: user
        content: Report which remote hosts are connected and which are not, and when each was last seen
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-not-supervise-swarm
    category: routing-trap
    note: >-
      A snapshot of open exchanges, not watching a run. survey-hosts says "watching the
      hosts while work runs, and answering what they ask (daintree.hosts.supervise-swarm)".
    messages:
      - role: user
        content: >-
          Read-only: list the open exchanges per remote host with their states and flag any
          that are waiting on a question to the user
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-not-ask-host-assistant
    category: routing-trap
    note: >-
      What the tools show about each host, not one question put to its assistant. survey-hosts
      says "a question for one host's
      assistant (daintree.hosts.ask-host-assistant)".
    messages:
      - role: user
        content: Don't change anything, just tell me how my remote hosts look right now
    expect:
      required: [daintree.hosts.survey-hosts]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-add-machine
    category: routing-trap
    note: >-
      Reverse trap. Adding a machine as a Remote Host is daintree.hosts.connect-host's "ANOTHER
      MAC OR LINUX MACHINE added to Daintree as a Remote Host"; survey-hosts says "adding a machine
      as a Remote Host (daintree.hosts.connect-host)" and reads only
      hosts already listed.
    messages:
      - role: user
        content: Add my build server to Daintree as a Remote Host so I can open its projects here
    expect:
      required: [daintree.hosts.connect-host]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-local-fleet
    category: routing-trap
    note: >-
      Reverse trap. The agents on THIS Mac are daintree.orchestration.supervise-fleet's
      ("Use when agents are ALREADY running and the user wants the fleet swept"); survey-hosts
      reads Remote Hosts only, so it must not ride along.
    messages:
      - role: user
        content: Which agents of mine are stuck or waiting right now?
    expect:
      required: [daintree.orchestration.supervise-fleet]
      optional: [daintree.foundation]

  - id: survey-hosts-reverse-start-assistants
    category: routing-trap
    note: >-
      Reverse trap. An assistant to be running on every host is daintree.hosts.start-swarm's "Claude Code
      or Codex ready on every Remote Host"; survey-hosts only reports and starts nothing.
    messages:
      - role: user
        content: Put a Claude assistant on every connected machine for this repo; none of them should be left without one
    expect:
      required: [daintree.hosts.start-swarm]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-usage
    category: routing-trap
    note: >-
      Reverse trap. Allowance left per host is daintree.hosts.check-usage-limits's
      deliverable, "one table of figures each host's assistant read off that machine's own
      usage screen"; survey-hosts reads no usage.
    messages:
      - role: user
        content: What's left of my Codex plan on the Mac mini and on the Linux tower? One figure per machine
    expect:
      required: [daintree.hosts.check-usage-limits]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-diagnose
    category: routing-trap
    note: >-
      Reverse trap. One listed assistant that will not take messages, with the gate wanted, is
      daintree.hosts.diagnose-messaging's "diagnosis per host and assistant"; survey-hosts
      reports state and does not diagnose.
    messages:
      - role: user
        content: The host assistant on my second Mac is listed as unavailable; tell me why messages to it don't go through
    expect:
      required: [daintree.hosts.diagnose-messaging]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-recover
    category: routing-trap
    note: >-
      Reverse trap. Rebuilding where sent work stands after the hub restarted is
      daintree.hosts.recover-and-clean-up's "per-host account of every exchange from the
      records"; survey-hosts says "where work already sent stands, finished or unanswered
      (daintree.hosts.recover-and-clean-up)".
    messages:
      - role: user
        content: >-
          The hub restarted and I lost track of what I sent to the other machines. Rebuild
          from the hosts' own records which exchanges finished, which are still open and which
          will never be answered.
    expect:
      required: [daintree.hosts.recover-and-clean-up]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-follow-run
    category: routing-trap
    note: >-
      Reverse trap. Keeping a run moving and answering what hosts ask is
      daintree.hosts.supervise-swarm's "the run kept moving: every update read, a host's
      question answered within the person's request"; survey-hosts takes one snapshot and ends.
    messages:
      - role: user
        content: Keep the swarm going and answer what the hosts can ask, tell me when every host is done
    expect:
      required: [daintree.hosts.supervise-swarm]
      optional: [daintree.hosts.foundation]

  - id: survey-hosts-reverse-ask-one
    category: routing-trap
    note: >-
      Reverse trap. One question to one host's assistant is daintree.hosts.ask-host-assistant's "ONE
      QUESTION answered by the Daintree assistant on ANOTHER MACHINE"; what a host's
      repository holds comes only from its assistant, never from the survey tools.
    messages:
      - role: user
        content: Ask the assistant on my second Mac what branch it has checked out
    expect:
      required: [daintree.hosts.ask-host-assistant]
      optional: [daintree.hosts.foundation]
