# daintree.security.respond-to-secret-exposure, extended to a credential that reached the
# Remote Hosts. The hub finds the recipients from the tasks it sent (task records hold no
# text), withdraws what is unread, sends each lane a containment message that carries ids and
# never the value, and reports every host as acknowledged or unresolved; a lane contains only
# its own project and replies with locations and statuses.
#
# Recall: the issue's three requests, an agent-phrased task, a casual line, a lane-side
# request. Traps: the hub-side stop of an ordinary run stays with daintree.hosts.steer-swarm
# (forward, with the leak named, and reverse, with a key only mentioned); a hub catching up
# on or cleaning up a run keeps daintree.hosts.recover-and-clean-up; two hosts doing the same
# work keeps daintree.hosts.resolve-task-collisions.

cases:
  # ------------------------------------------------------------------ recall
  - id: secret-exposure-swarm-issue-pasted-message
    category: single-runbook
    note: >-
      The issue's first request. Decided by "on the hub the Remote Hosts' assistants that
      received a message carrying it".
    messages:
      - role: user
        content: A secret was pasted into a swarm message; contain the known copies.
    expect:
      required: [daintree.security.respond-to-secret-exposure]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: secret-exposure-swarm-issue-stop-spread
    category: single-runbook
    note: >-
      The issue's second request. Decided by "running agents, local or on other hosts, told
      not to spread it; the owner told to rotate it first".
    messages:
      - role: user
        content: Stop remote agents spreading an exposed credential and tell its owner what needs rotation.
    expect:
      required: [daintree.security.respond-to-secret-exposure]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: secret-exposure-swarm-issue-host-local-evidence
    category: single-runbook
    note: >-
      The issue's third request, the vaguest. Decided by "every place the secret reached"
      and "on the hub the Remote Hosts' assistants that received a message carrying it".
    messages:
      - role: user
        content: Coordinate secret exposure response across host-local evidence.
    expect:
      required: [daintree.security.respond-to-secret-exposure]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: secret-exposure-swarm-user-casual
    category: single-runbook
    note: >-
      Casual panic about a note sent to other machines. Decided by "the Remote Hosts'
      assistants that received a message carrying it".
    messages:
      - role: user
        content: ugh i put my github token in the note i sent to the mini and the studio. can you get them to stop passing it around and tell me what i have to revoke
    expect:
      required: [daintree.security.respond-to-secret-exposure]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: secret-exposure-swarm-trap-steer-swarm-stop
    category: routing-trap
    note: >-
      An ordinary stop of a sent run stays with steer-swarm, even when the brief named a
      credential variable it was told to use. Decided by "Do not use for stopping or changing
      a run when nothing leaked (daintree.hosts.steer-swarm)".
    messages:
      - role: user
        content: Call off the remaining tasks I sent to the other machines, the brief just told them to read the deploy token from the environment, and tell me which hosts acknowledged.
    expect:
      required: [daintree.hosts.steer-swarm]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: secret-exposure-swarm-trap-resolve-collisions
    category: routing-trap
    note: >-
      Two hosts working the same ticket is a collision, not a leak, even when the ticket is
      about credentials. Decided by "COLLIDES BY ACCIDENT across its Remote Hosts" in
      daintree.hosts.resolve-task-collisions.
    messages:
      - role: user
        content: I sent the credential-rotation ticket to both the build box and the mini by mistake and each has its own branch with edits. Work out which one keeps it.
    expect:
      required: [daintree.hosts.resolve-task-collisions]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: secret-exposure-swarm-trap-audit
    category: routing-trap
    note: >-
      Looking for hardcoded keys across the code on the other machines is an audit of
      existing code, not a containment. Decided by "a security audit of existing code (use
      daintree.review.audit-codebase)".
    messages:
      - role: user
        content: Do a security audit of the services in this checkout and list any hardcoded keys and missing auth checks.
    expect:
      required: [daintree.review.audit-codebase]
      optional: [daintree.foundation]

  - id: secret-exposure-swarm-reverse-audit-host-workspaces
    category: routing-trap
    note: >-
      A read-only inventory of what a run left on the hosts, with no credential involved.
      Decided by "INSPECTED, read-only" in daintree.hosts.audit-host-workspaces.
    messages:
      - role: user
        content: I want a read-only look at what the run left behind on the other hosts and which of it is safe to let go
    expect:
      required: [daintree.hosts.audit-host-workspaces]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # Control twins (issue #159): the same requests against the control catalog,
  # merged runbooks mapped to what absorbed them and retired lane runbooks dropped.
  - id: secret-exposure-swarm-reverse-report-swarm-results-control
    category: routing-trap
    host_model: control
    note: 'Control twin of secret-exposure-swarm-reverse-report-swarm-results: the same request against
      the control catalog. The account of how a finished run turned out, with nothing leaked. Decided by
      "FINAL ACCOUNT of a swarm that has ENDED or been stopped" in daintree.hosts.report-swarm-results.'
    messages:
    - role: user
      content: 'Summarise how the run on my other machines turned out: which hosts delivered their part
        and which went quiet?'
    expect:
      required:
      - daintree.hosts.supervise-swarm
      optional:
      - daintree.hosts.foundation
      - daintree.foundation
