# The foundation is the WHOLE answer: a plain what-exists-right-now read, a single
# direct control-plane action, or a substantive task no runbook claims. These are the
# cases that test the foundation for RECALL — everywhere else it is auto-paired
# downstream by the backend, so on a case whose answer is a specific it belongs in
# `optional`, never `required` (cases.py enforces that).
#
# Re-validated against the 23-runbook catalog. The original timer / watcher / grant texts
# are now watch-outcome's own triggers ("remind me in an hour", "let me know when the
# build finishes", "pre-authorize an unattended action with a grant"), and the resume
# text is status-and-resume's ("pick up / resume something from an earlier session"), so
# demanding the foundation ALONE on those made a correct pick score as an extra. The
# resume case moved to 20-routing-traps.yaml re-pointed at status-and-resume; the rest
# were rewritten onto clauses the foundation claims outright and every runbook disclaims.

cases:
  - id: novel-connection-check
    category: foundation-only
    note: >-
      A SYMPTOM-FREE status read, which is the only connection question the foundation
      still owns. The wording used to lead with "nothing I click does anything and the
      workspace reads empty" — a reported failure, which is squarely daintree.diagnostics
      ("nothing is responding", "the MCP is disconnected"). Two cases in this corpus then
      demanded opposite answers for the same intent. Selector step 4 gives a reported
      failure to the specific and auto-pairs the foundation behind it; what is left here,
      and genuinely foundation-only, is a user with no complaint who just wants the link
      read. Nothing is running, so there is no cohort to sweep and nothing to leave
      watching.
    messages:
      - role: user
        content: Quick sanity check before I start — is Daintree connected?
    expect:
      required: [daintree.foundation]

  - id: novel-resolve-one-queue-item
    category: foundation-only
    note: >-
      A single direct control-plane action on the attention queue — foundation step 7
      owns inbox honesty and queue.resolve is one of its tools. Deliberately ONE named
      item: workspace-cleanup requires teardown of workspace state in the user's own
      words, and status-and-resume's hygiene clause is about the workflow ledger, not
      the queue badge. The word "stale" is deliberately absent from the user text —
      status-and-resume's SUMMARY (which the selector sees alongside whenToUse) reads
      "close the stale ledger rows nothing else will", so that one word pulled harder
      lexically than the ledger-vs-badge distinction pushes back.
    messages:
      - role: user
        content: >-
          That attention item about the parser agent is done with — I dealt with it
          myself an hour ago. Clear it off the badge for me.
    expect:
      required: [daintree.foundation]

  - id: novel-focus-one-terminal
    category: foundation-only
    note: >-
      "reading or focusing ONE terminal" is the foundation's own single-action clause
      and terminal.focus is UI only. supervise-fleet's navigation clause is "show me the
      NEXT one" across a cohort, and rename's deliverable is titles — neither is a
      request to put one named terminal on screen.
    messages:
      - role: user
        content: >-
          Put the deploy terminal up on screen for me — I just want to watch it scroll
          myself for a minute.
    expect:
      required: [daintree.foundation]

  - id: novel-branch-state-read
    category: foundation-only
    note: >-
      Plain what-exists read. The foundation's first whenToUse clause names worktrees and
      branches, and git.getProjectPulse is its tool. Nothing is being readied for review,
      which is what prep-branch-for-review requires, and no agent is involved.
    messages:
      - role: user
        content: >-
          Before I start anything — what branch is this worktree sitting on, and have I
          got uncommitted changes lying around?
    expect:
      required: [daintree.foundation]

  - id: novel-read-terminal-output
    category: foundation-only
    note: >-
      Reading ONE terminal and making sense of the tail — the foundation's own clause,
      with terminal.read and terminal.summarize among its tools. No agent has gone wrong
      (recover-agent needs a fault), and the earlier "while I was out ... tell me what
      happened" framing that now lands on status-and-resume is deliberately gone.
    messages:
      - role: user
        content: >-
          The test run in terminal 2 spat out a wall of output and I can't make sense of
          it. Read it back and tell me what actually failed.
    expect:
      required: [daintree.foundation]
