# daintree.hosts.foundation: the domain foundation for cross-host assistant messaging
# (this Shell's hub reaching the assistant on a Remote Host). Until the specific
# daintree.hosts.* runbooks land it owns every hosts request; these cases pin the
# requests it keeps once they do: how messaging works, switching it on, and why another
# machine's assistant cannot be reached. Traps hold its boundary with
# daintree.diagnostics (Daintree's own health on this machine) and
# daintree.worktree.manage-resource (a worktree's cloud devbox), both ways.

cases:
  - id: hosts-foundation-how-to-talk
    category: foundation-only
    note: >-
      The issue's own example of a hosts request no specific runbook owns. The positive
      clause claims it: "wants to know how messaging between the assistants on two
      machines works". It is also a documentation question, and a bare how-to usually
      selects nothing, so this case tells whether the foundation is reached cold.
    messages:
      - role: user
        content: how do I talk to the assistant on my other Mac?
    expect:
      required: [daintree.hosts.foundation]
      docs: true

  - id: hosts-foundation-local-tools-gone-is-diagnostics
    category: routing-trap
    note: >-
      Reverse trap. Tools missing from the sidebar assistant on THIS machine is
      Daintree's own health (daintree.diagnostics: "why is this tool missing"); nothing
      crosses machines, so the hosts foundation must not ride along.
    messages:
      - role: user
        content: The Daintree tools have vanished from my sidebar assistant on this Mac.
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  - id: hosts-foundation-remote-workspace-is-manage-resource
    category: routing-trap
    note: >-
      Reverse trap. A branch's provisioned remote workspace is
      daintree.worktree.manage-resource ("a worktree's cloud devbox or remote resource",
      fenced off in the foundation); "remote" here is a resource, not another machine's
      assistant.
    messages:
      - role: user
        content: my branch's provisioned remote workspace - still running or stopped?
    expect:
      required: [daintree.worktree.manage-resource]
      optional: [daintree.foundation]
