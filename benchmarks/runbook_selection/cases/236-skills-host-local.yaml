# daintree.skills.use-plugin-skill on a machine that is not the one the person is sitting at:
# plugin skills are per host (installed set, versions, trust), so the skill is looked up
# and loaded on the machine whose agent will follow it, a missing plugin is a blocker
# rather than something copied across, and a loaded skill never widens the request.
# Traps hold its boundary with the hub's delegation (daintree.hosts.do-delegated-work,
# daintree.hosts.delegate-to-host), a CLI's own command (daintree.agents.run-agent-command)
# and building a plugin (daintree.plugins.develop-project-plugin).
cases:
  # ------------------------------------------------------------------ recall
  - id: skills-host-resolve-agent-phrased
    category: single-runbook
    note: >-
      Agent-phrased: resolve and load the skill on the machine that executes it. Deciding
      clause: "the skill found by its exact id on the machine that will run it and loaded".
    messages:
      - role: user
        content: Resolve which plugin skills this host lists for the delegated review task, load the matching one by its listed id here, and have an agent in the task checkout follow it within the hub brief
    expect:
      required: [daintree.skills.use-plugin-skill]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: skills-host-remote-box-user
    category: single-runbook
    note: >-
      User wording from the issue family: the remote machine's copy, not the local one.
      Deciding clause: "use the project plugin skill on this remote host".
    messages:
      - role: user
        content: use the project plugin skill on the remote box, not the copy on my laptop
    expect:
      required: [daintree.skills.use-plugin-skill]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: skills-host-missing-plugin-blocker
    category: single-runbook
    note: >-
      The skill the hub named is not on this machine: the answer is the blocker, not a copy.
      Deciding clause: "or the blocker when that machine does not have, trust or support the
      plugin (never copied from another host)".
    messages:
      - role: user
        content: this machine does not list the release-kit plugin skill the hub asked for; tell the hub it is missing rather than copying my plugins folder across
    expect:
      required: [daintree.skills.use-plugin-skill]
      optional: [daintree.foundation, daintree.hosts.foundation, daintree.hosts.handle-hub-message]

  - id: skills-host-same-name-other-content
    category: single-runbook
    note: >-
      A skill of the same name may differ between machines; load the one this host lists.
      Deciding clause: "found by its exact id on the machine that will run it".
    messages:
      - role: user
        content: the review skill my plugin ships here is v2 but I think the host runs an older copy; load the one this host lists and use it for the diff in the task checkout
    expect:
      required: [daintree.skills.use-plugin-skill]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: skills-host-scope-expanding-skill
    category: single-runbook
    note: >-
      The loaded skill asks for publication the hub request never did. Deciding clause: "its
      steps carried out by an open or new agent briefed with that id and checked from its report".
    messages:
      - role: user
        content: the plugin skill this host loaded says to publish the package and delete the old tag, but the hub only asked for a local fix; keep the agent inside the hub request
    expect:
      required: [daintree.skills.use-plugin-skill]
      optional: [daintree.foundation, daintree.hosts.foundation, daintree.hosts.verify-for-hub]

  - id: skills-host-list-skills-and-commands
    category: single-runbook
    note: >-
      Listing both kinds on this machine; plugin skills are the owner, the command list may ride
      along. Deciding clause: "or the list of skills found there".
    messages:
      - role: user
        content: which plugin skills does this machine offer, and which project slash commands does the claude here have
    expect:
      required: [daintree.skills.use-plugin-skill]
      optional: [daintree.foundation, daintree.agents.run-agent-command]

  # ------------------------------------------------------------------ traps
  - id: skills-host-trap-hub-work-order
    category: routing-trap
    note: >-
      A work order the hub sent to this host that only mentions a skill is the delegated unit.
      Fence: "for a whole work unit the hub delegated to this host that only names a skill among
      its terms (daintree.hosts.do-delegated-work)".
    messages:
      - role: user
        content: "Hub work order for this machine: on a new branch, implement the export endpoint and follow the plugin skill for API design if it is installed here; reply with the commit"
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.foundation, daintree.hosts.foundation, daintree.hosts.handle-hub-message]

  - id: skills-host-trap-open-agent-command
    category: routing-trap
    note: >-
      A project command typed into an agent that is already open is a CLI command, not a plugin
      skill. Fence: "for an agent CLI's own slash commands (daintree.agents.run-agent-command)".
    messages:
      - role: user
        content: type the project release-notes command into the codex pane that is open here and tell me what it printed
    expect:
      required: [daintree.agents.run-agent-command]
      optional: [daintree.foundation]

  - id: skills-host-trap-develop-plugin
    category: routing-trap
    note: >-
      Validating and reloading a plugin in the project on a remote machine is plugin development.
      Fence: "for writing, debugging or loading a project plugin
      (daintree.plugins.develop-project-plugin)".
    messages:
      - role: user
        content: validate the plugin manifest in the project on this remote machine and reload it
    expect:
      required: [daintree.plugins.develop-project-plugin]
      optional: [daintree.foundation, daintree.hosts.foundation]

  - id: skills-host-trap-hub-delegates
    category: routing-trap
    note: >-
      From the hub, asking another machine's assistant to do a piece of work that merely prefers a
      skill is delegation. Fence: "for asking another machine's assistant to do the work from the
      hub (daintree.hosts.delegate-to-host)".
    messages:
      - role: user
        content: Have the assistant on the staging machine fix the flaky retry test in a new branch there, following the review plugin skill if it has one, and bring back the commit
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.foundation, daintree.hosts.foundation]
