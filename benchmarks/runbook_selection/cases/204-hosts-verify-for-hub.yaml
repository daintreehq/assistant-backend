# daintree.hosts.verify-for-hub: a lane's verification of one revision for the hub. The
# Daintree assistant on a Remote Host, enrolled for one Shell's hub, is asked to test an exact
# commit (or a branch, pinned to its head) without changing it, and to return evidence.
#
# Recall: the issue's own three requests, an agent-phrased and a user-phrased description,
# and one case per situation the procedure has to get right (a moved branch, a missing
# runner, one shard, one environment row). Traps: against the local owners of nearby
# deliverables (daintree.ci.run-local-checks for the person's own checks,
# daintree.orchestration.verify-agent-work for a local agent's result,
# daintree.review.review-change for findings) and the hub's own side
# (daintree.hosts.delegate-to-host), each with a reverse case where the neighbour wins. The
# envelope (daintree.hosts.handle-hub-message) is optional wherever a hub request is the
# frame: the lane holds it for the reply.

cases:
  # ------------------------------------------------------------------ recall
  - id: verify-for-hub-trap-person-local-checks
    category: routing-trap
    note: >-
      Reverse of the run-local-checks fence: the person's own checks on their worktree, with
      this runbook's own vocabulary (a commit, pass, fail and skip counts). run-local-checks
      owns "the project's checks RUN and the results reported"; no hub asked, so "the
      person's own checks here (daintree.ci.run-local-checks)" keeps this runbook out.
    messages:
      - role: user
        content: Before I push, run the project test suite in the invoices worktree at its current commit and give me the pass, fail and skip counts.
    expect:
      required: [daintree.ci.run-local-checks]
      optional: [daintree.foundation]

  - id: verify-for-hub-trap-local-agent-claim
    category: routing-trap
    note: >-
      Reverse of the verify-agent-work fence: a local agent's passing claim whose evidence
      came from the wrong checkout. verify-agent-work owns "a finished agent's work checked
      before it is trusted"; this runbook's "a local agent's result
      (daintree.orchestration.verify-agent-work)" and verify-agent-work's "for a hub's checks
      (daintree.hosts.verify-for-hub)" keep the two apart.
    messages:
      - role: user
        content: The agent says its tests pass, but its log shows it ran them in the main checkout instead of its own worktree; find out whether its change really holds.
    expect:
      required: [daintree.orchestration.verify-agent-work]
      optional: [daintree.foundation]

  - id: verify-for-hub-trap-hub-sends-check
    category: routing-trap
    note: >-
      Reverse of the delegate-to-host fence: the hub handing a test run to a host.
      delegate-to-host owns "ONE piece of WORK done by the Daintree assistant on another
      machine"; this runbook's "the hub's own side (daintree.hosts.delegate-to-host)" keeps it
      out.
    messages:
      - role: user
        content: Delegate a test run of commit 4e1f9a2c to the remote Linux host and bring its results back.
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation, daintree.foundation]
