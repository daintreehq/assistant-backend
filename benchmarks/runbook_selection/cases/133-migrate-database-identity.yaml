# Improvement to daintree.runtime.migrate-worktree-database: the database a worktree
# points at is proven to be its own on the machine that runs the operation, whoever
# asks (the person, or the hub through this host's lane), and a loopback address is
# never taken as ownership. Recall cases in agent, casual and hub-voiced wording, and
# traps against the neighbours the routing text fences.

cases:
- id: migrate-db-agent-tunnel-proof
  category: single-runbook
  note: 'Agent phrasing: the deliverable clause "proven on the machine that runs it to be its own and not shared", then the migration and the schema version.'
  messages:
  - role: user
    content: Apply the pending migrations to the database of the feature worktree, after proving that its localhost address is not a tunnel to a shared server; report the schema version before and after.
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-user-forward-check
  category: single-runbook
  note: 'Casual wording: "which database will this worktree migrate?" extended to a forward that may reach a shared one.'
  messages:
  - role: user
    content: is the db my worktree uses on localhost really mine or a forward to the shared staging one? i want to reseed it
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-loopback-proxy-shared
  category: single-runbook
  note: 'A loopback proxy that may reach a shared database: the migration runs only on proof, "wants a MIGRATION, SEED, ROLLBACK, DATABASE RESET or RESTORE FROM A BACKUP run against a worktree''s local database now".'
  messages:
  - role: user
    content: A proxy on 127.0.0.1:5433 may forward to a shared database. Run the migration for the worktree only if the proxy's target is its own, otherwise stop and say why.
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-sqlite-same-file
  category: single-runbook
  note: 'File identity, not a server: a hard link to the main checkout''s file is the same database, and the reset waits on that proof ("DATABASE RESET or RESTORE FROM A BACKUP run against a worktree''s local database now").'
  messages:
  - role: user
    content: reset the billing worktree's sqlite db, but check first that it's not hard-linked to the main checkout's
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-rollback-other-server
  category: single-runbook
  note: 'Rollback only after the server behind the connection string is compared with the main checkout''s ("wants a MIGRATION, SEED, ROLLBACK, DATABASE RESET or RESTORE FROM A BACKUP run against a worktree''s local database now").'
  messages:
  - role: user
    content: Roll back the last migration on the worktree's local postgres, but first confirm the server behind its connection string is not the one the main checkout talks to.
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-trap-cloud-devbox
  category: routing-trap
  note: 'A cloud devbox is a remote resource lifecycle: "for the worktree''s cloud devbox or remote resource lifecycle (use daintree.worktree.manage-resource)".'
  messages:
  - role: user
    content: Resume my worktree's cloud devbox that holds its database and show me its status
  expect:
    required:
    - daintree.worktree.manage-resource
    optional:
    - daintree.foundation
- id: migrate-db-trap-ci-green-then-apply
  category: routing-trap
  note: 'The CI check is not the ask here: only applying the migration is, so "to fix a migration test that fails in CI (use daintree.ci.diagnose-and-fix)" does not apply.'
  messages:
  - role: user
    content: CI is green for the schema change, so now apply its new migration to the database of my billing worktree and tell me the schema version.
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-trap-run-written-migrations
  category: routing-trap
  note: 'Running migrations that already exist is not code work: "to write a new migration as code work (use daintree.edits.spawn-visible-agent)" does not apply.'
  messages:
  - role: user
    content: Have codex run the migrations that are already written in the inventory worktree against its database; it should not touch any code.
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
- id: migrate-db-trap-one-step-of-a-plan
  category: routing-trap
  note: 'One immediate operation inside a larger plan is still this runbook: "for a multi-phase data migration plan tracked across sessions (use daintree.orchestration.execute-durable-workflow)" is for the tracked plan itself.'
  messages:
  - role: user
    content: "Part of a multi-step data migration plan, but right now I only need one thing: roll back the last migration on the worktree's local database."
  expect:
    required:
    - daintree.runtime.migrate-worktree-database
    optional:
    - daintree.foundation
