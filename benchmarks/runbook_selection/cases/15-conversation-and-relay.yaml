# Conversation / debate-elimination / relay-review-feedback and their neighbours.
#
# This cluster is where the catalog's agent-to-agent talk runbooks sit on top of each
# other. Three axes carry the routing, and every case below turns on exactly one:
#   * synthesis target  — multi-agent converges on ONE answer; conversation is an
#     open-ended visible dialogue with no deliverable.
#   * what the ballot is — competition peer-votes the agents' OWN independent
#     submissions for the BEST; debate-elimination votes a debated POSITION off.
#   * who already exists — relay-review-feedback moves an EXISTING reviewer's output
#     to an EXISTING implementer; ask-and-relay spawns a NEW agent to ask it something.
#
# The user text deliberately avoids lifting whenToUse trigger phrases, except where a
# lifted phrase IS the bait (see hash-it-out-is-multi-agent).

cases:
  # --- clean positives -------------------------------------------------------

  - id: conversation-three-agents-open
    category: single-runbook
    note: >-
      Open-ended dialogue among 2+ agents with no verdict and no merged answer —
      conversation's whenToUse says participant count is just a parameter.
    messages:
      - role: user
        content: >-
          I've got three agents up — nova, atlas and mercury. I want them actually
          speaking to one another about the auth rewrite, taking turns, and I want
          to watch it unfold. No writeup at the end, no verdict, just the discussion.
    expect:
      required: [daintree.orchestration.conversation]
      optional: [daintree.foundation]

  - id: debate-elimination-basic
    category: single-runbook
    note: Debate first, then the cohort removes the weakest position — the canonical shape.
    messages:
      - role: user
        content: >-
          Four of my agents should argue out whether we move off Postgres. After a
          few rounds, have them decide among themselves which position doesn't hold
          up and cut that one.
    expect:
      required: [daintree.orchestration.debate-elimination]
      optional: [daintree.foundation]

  - id: relay-review-to-implementer
    category: single-runbook
    note: >-
      Existing reviewer's output pointed at an existing implementer, with calibration
      on how to weigh the source — relay-review-feedback's exact whenToUse.
    messages:
      - role: user
        content: >-
          The reviewer agent in terminal 9 just finished its pass on the payments
          module. Read what it found and hand it to the agent in terminal 4 that
          wrote the code — tell it the security points are non-negotiable but it can
          use its own judgment on the naming nits.
    expect:
      required: [daintree.agents.relay-review-feedback]
      optional: [daintree.foundation]

  # --- conversation vs multi-agent, both directions ---------------------------

  - id: open-dialogue-not-multi-agent
    category: routing-trap
    note: >-
      Deciding signal is the ABSENCE of a synthesis target ("I don't need them to
      land anywhere") — multi-agent requires converging on ONE synthesized answer and
      its whenToUse excludes an open-ended visible dialogue.
    messages:
      - role: user
        content: >-
          I'd like to just listen in. Put nova and atlas on whether our end-to-end
          suite is worth keeping and let them bounce it off each other for a few
          rounds. I don't need them to land anywhere — I'm curious what comes up.
    expect:
      required: [daintree.orchestration.conversation]
      optional: [daintree.foundation]

  - id: hash-it-out-is-multi-agent
    category: routing-trap
    note: >-
      "hash it out" is a verbatim conversation trigger, but the deciding signal is the
      synthesis target that follows it — "keep going until they land on one approach"
      plus a reported settlement. conversation's whenToUse hands convergence to
      multi-agent. Different shape from debate-is-multi-agent (two existing named
      agents, no spawn, elimination-free).
    messages:
      - role: user
        content: >-
          nova and atlas disagree about the retry strategy. Let them hash it out
          between themselves and keep going until they land on one approach, then
          tell me what they settled on.
    expect:
      required: [daintree.orchestration.multi-agent]
      optional: [daintree.foundation]

  # --- elimination vs competition ---------------------------------------------

  - id: voteoff-not-competition
    category: routing-trap
    note: >-
      "peer vote" and "tally" are competition surface, but competition's ballot is the
      agents' OWN independent submissions judged for the BEST. Here the ballot is
      positions built through rounds of cross-talk and the vote REMOVES the weakest,
      which is debate-elimination; multi-agent is excluded because there is a vote.
    messages:
      - role: user
        content: >-
          Have the four agents go head to head on the caching design — a couple of
          rounds each, arguing against whatever the others said — and then run a peer
          vote to drop the weakest one. Give me the tally.
    expect:
      required: [daintree.orchestration.debate-elimination]
      optional: [daintree.foundation]

  # --- relay vs ask-and-relay / verify-agent-work ------------------------------

  - id: relay-not-ask-and-relay
    category: routing-trap
    note: >-
      "Ask the implementer..." baits ask-and-relay, which SPAWNS a new agent to put a
      fresh question to it. Deciding signal is that both agents are already running and
      the payload is another agent's review output, plus the calibration instruction
      ("tends to over-flag naming") that relay-review-feedback names explicitly.
    messages:
      - role: user
        content: >-
          Terminal 5's reviewer just posted its notes on the auth PR. Ask the
          implementer already running in terminal 2 to go through them and fix what's
          fair — mention that this reviewer tends to over-flag naming, so it shouldn't
          chase every point.
    expect:
      required: [daintree.agents.relay-review-feedback]
      optional: [daintree.foundation]

  - id: relay-not-verify
    category: routing-trap
    note: >-
      "came back with three problems" baits verify-agent-work. Deciding signal is that
      nothing is being judged — relay-review-feedback's whenToUse pushes judging
      whether the work is done or correct to verify-agent-work, and the user rules that
      out ("not asking you to grade it") leaving only the forward-to-implementer step.
    messages:
      - role: user
        content: >-
          I had an agent look over what the implementer did and it came back with
          three problems. I'm not asking you to grade the code yourself — just take
          the reviewer's list over to the implementer in terminal 8 and have it work
          through them.
    expect:
      required: [daintree.agents.relay-review-feedback]
      optional: [daintree.foundation]

  # --- mid-workflow takeover (prior runbook evicted) -----------------------------

  - id: elimination-mid-debate
    category: topic-shift
    note: >-
      topic-shift, not continuation: the prior active runbook must be EVICTED, which is
      this suite's topic-shift contract (continuation means KEEP the in-progress
      runbook). Same shape as shift-poll-to-runoff — same cohort, same subject, the
      workflow hands off to a follow-on runbook.
      Arguable case, decided by two clauses pointing the same way. debate-elimination's
      whenToUse covers this explicitly — "including when the elimination request
      arrives mid-debate" — and multi-agent's excludes "a debate that ends by voting a
      position off". The user also withdraws the synthesis target ("don't bother
      merging it"), which is multi-agent's own qualifying signal, so the active
      multi-agent must be EVICTED rather than kept alongside; it is deliberately not in
      optional.
    active: [daintree.orchestration.multi-agent, daintree.foundation]
    messages:
      - role: user
        content: >-
          Get alpha, bravo and cirrus arguing about the right rate-limiter design and
          relay between them until they land on one recommendation.
      - role: assistant
        content: Spawning the three agents now.
        tool_calls: [agentTask.spawnForEdits, agentTask.spawnForEdits, agentTask.spawnForEdits]
      - role: tool
        name: agentTask.spawnForEdits
        content: 'spawned terminals 14 "alpha", 15 "bravo", 16 "cirrus" (all running)'
      - role: assistant
        content: >-
          Round two is in. Alpha is holding out for a token bucket, bravo wants a
          sliding window, and cirrus has drifted toward alpha's position.
      - role: user
        content: >-
          Actually, don't bother merging it into one recommendation. Have them vote
          out whichever case held up worst and tell me who goes.
    expect:
      required: [daintree.orchestration.debate-elimination]
      optional: [daintree.foundation]
