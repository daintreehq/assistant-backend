# The five everyday-tester runbooks: diagnostics, memory, repository exploration,
# review, and CI. These cover intents that previously fell through to the permanent
# prompt and raw tool descriptions, so the routing risk is not "which specialist" but
# "does the selector reach for a runbook at all".
#
# The user text is deliberately NOT the runbook's own trigger phrasing. Echoing
# whenToUse back at the selector measures keyword overlap; these are meant to read
# like a tester who has never seen the catalog.

cases:
  # ---- diagnostics ---------------------------------------------------------
  - id: docs-how-do-worktrees-work
    category: docs-classification
    note: >-
      A plain product question, and the answer is NO runbook. The documentation is
      retrieved server-side and arrives with the turn, and the base instructions
      already say to answer from it and cite it — so there is nothing a runbook
      adds. No optional ids, so any pick fails the case.
    messages:
      - role: user
        content: I keep seeing "worktree" in the UI. What actually is one, and do I need more than one?
    expect:
      required: []
      docs: true

  - id: diagnostics-mcp-disconnected
    category: single-runbook
    note: >-
      "Nothing works" with no other signal. daintree.status answers it while
      disconnected, which is exactly when every other diagnosis is unavailable.
    messages:
      - role: user
        content: >-
          Every Daintree tool you try just errors out now — terminals, git, all of it.
          It was fine ten minutes ago.
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  - id: diagnostics-repair-imperative
    category: single-runbook
    note: >-
      A REPAIR imperative, not a why-question. The runbook's fence excludes ordinary
      working requests that merely name Daintree ("rename my tabs"), and an earlier
      draft of that fence read "do not use when the user wants you to DO the thing"
      — which would have pushed "fix it" to the foundation alone, even though the
      runbook's whole payoff is the exact remediation step. Wanting it fixed does
      not make it a different diagnosis.
    messages:
      - role: user
        content: Daintree's dropped its connection again. Just get it working.
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  - id: diagnostics-key-question
    category: single-runbook
    messages:
      - role: user
        content: >-
          Am I actually signed in properly? I want to be sure before I start
          burning credit on a big job.
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  # ---- memory --------------------------------------------------------------
  - id: memory-save-a-convention
    category: single-runbook
    messages:
      - role: user
        content: For future reference, we always use pnpm here, never npm. Don't forget that.
    expect:
      required: [daintree.memory.manage-project-memory]
      optional: [daintree.foundation]

  - id: memory-recall-a-decision
    category: single-runbook
    messages:
      - role: user
        content: Didn't we decide something about how the API returns dates? I can't remember what we landed on.
    expect:
      required: [daintree.memory.manage-project-memory]
      optional: [daintree.foundation]

  - id: memory-correct-a-stale-fact
    category: single-runbook
    note: >-
      A correction saves the replacement first and only then forgets the stale id —
      never a second, contradicting memory alongside the old one.
    messages:
      - role: user
        content: That thing you saved about us being on Postgres is out of date, we moved to SQLite months ago.
    expect:
      required: [daintree.memory.manage-project-memory]
      optional: [daintree.foundation]

  # ---- repository exploration ---------------------------------------------
  - id: explore-what-does-this-repo-do
    category: single-runbook
    messages:
      - role: user
        content: I've just been handed this codebase. Give me the tour — what is it, how is it put together?
    expect:
      # spawn-visible-agent is NOT optional here: both whenToUse texts now say
      # understanding-without-changing belongs to explore, so admitting it would
      # stop this case from testing the boundary it exists for.
      required: [daintree.explore.repository]
      optional: [daintree.foundation]

  - id: explore-where-is-it-implemented
    category: single-runbook
    messages:
      - role: user
        content: Where does the rate limiting actually happen? I've been grepping and I can't find it.
    expect:
      required: [daintree.explore.repository]
      optional: [daintree.foundation]

  # ---- review --------------------------------------------------------------
  - id: review-the-branch
    category: single-runbook
    messages:
      - role: user
        content: Before I put this up, can you go over what's on this branch and tell me what you'd push back on?
    expect:
      required: [daintree.review.review-change]
      optional: [daintree.foundation, daintree.workflow.prep-branch-for-review]

  - id: review-security-lens
    category: single-runbook
    note: A named concern becomes the criterion; it must not be diluted into a general pass.
    messages:
      - role: user
        content: >-
          Have a careful look at the upload handler on this branch for anything a
          hostile user could abuse.
    expect:
      required: [daintree.review.review-change]
      optional: [daintree.foundation]

  # ---- CI ------------------------------------------------------------------
  - id: ci-why-is-it-red
    category: single-runbook
    messages:
      - role: user
        content: The checks on my PR have gone red and I don't know why. Sort it out?
    expect:
      required: [daintree.ci.diagnose-and-fix]
      optional: [daintree.foundation, daintree.workflow.follow-up-on-issue]

  - id: ci-failing-test-fix
    category: single-runbook
    messages:
      - role: user
        content: test_checkout_totals is failing on main. Work out what broke it and fix it.
    expect:
      required: [daintree.ci.diagnose-and-fix]
      optional: [daintree.foundation]

  - id: ci-flaky-suspicion
    category: single-runbook
    note: "Suspected flakiness (fails sometimes, passes on re-run) is daintree.ci.hunt-flaky-test since the 2026-09-28 expansion; ci.diagnose-and-fix keeps checks that fail consistently."
    messages:
      - role: user
        content: >-
          Same test fails maybe one run in four, passes if I just re-run it.
          Nothing's changed in that file for weeks.
    expect:
      required: [daintree.ci.hunt-flaky-test]
      optional: [daintree.foundation]
