# Routing traps for the five everyday-tester runbooks.
#
# Each of these sits on a boundary the catalog text claims to resolve. The new runbooks
# are keyword-adjacent to a lot of the existing catalog — "review", "fix", "explore",
# "remember", "why isn't this working" — so these are the cases where an unverified
# carve-out would silently mis-route.
#
# Ground truth is decidable from the whenToUse lines on disk. Where it was not, the
# catalog text was fixed rather than the case bent to fit.

cases:
  # ---- verify vs review: "is the claim true" vs "is the change good" -------
  - id: verify-not-review
    category: routing-trap
    note: >-
      The user doubts the agent's REPORT, not the code's quality. verify-agent-work
      owns "did it actually do it"; review-change owns "is this any good". The tell is
      that they are quoting the agent back at you.
    messages:
      - role: user
        content: It says it added tests and they all pass. I'd like that confirmed before I merge it.
    expect:
      required: [daintree.orchestration.verify-agent-work]
      optional: [daintree.foundation]

  - id: review-not-verify
    category: routing-trap
    note: >-
      No claim to check and no agent in the picture — the user wants a judgement on the
      change itself, which is review-change's whole remit.
    messages:
      - role: user
        content: Read through this diff and tell me honestly whether it's any good.
    expect:
      required: [daintree.review.review-change]
      optional: [daintree.foundation]

  # ---- explore vs edit -----------------------------------------------------
  - id: explore-not-edit
    category: routing-trap
    note: >-
      spawn-visible-agent covers read-only investigation only when "no more specific
      workflow applies" — orientation IS the more specific workflow, and the deliverable
      here is an explanation, not a change.
    messages:
      - role: user
        content: Don't change anything yet. I just want to understand how the caching layer fits together first.
    expect:
      required: [daintree.explore.repository]
      optional: [daintree.foundation]

  - id: edit-not-explore
    category: routing-trap
    note: "The mirror: a concrete change request must not route to the read-only path."
    messages:
      - role: user
        content: Add a retry with backoff to the webhook sender.
    expect:
      required: [daintree.edits.spawn-visible-agent]
      optional: [daintree.foundation]

  # ---- docs (Daintree) vs explore (the project) ---------------------------
  - id: docs-not-explore
    category: routing-trap
    note: >-
      "How does X work" about DAINTREE, not about the user's code. The retrieved
      documentation answers it; an explore agent pointed at the project would find
      nothing. Doubles as a no-runbook assertion — with no optional ids, reaching for
      explore OR for a Daintree runbook fails the case.
    messages:
      - role: user
        content: >-
          In Daintree, how does the agent supervision decide something has finished?
          Is that documented anywhere?
    expect:
      required: []
      docs: true

  - id: explore-not-docs
    category: routing-trap
    note: "The mirror - same shape of question, aimed at the project's own code."
    messages:
      - role: user
        content: How does our job runner decide a task has finished? I can never remember.
    expect:
      required: [daintree.explore.repository]
      optional: [daintree.foundation]
      docs: false

  # ---- CI vs its neighbours ------------------------------------------------
  - id: ci-not-follow-up
    category: routing-trap
    note: >-
      follow-up-on-issue reads an existing PR's state and comments on it. Here there is
      a FAILURE to fix, which is the whole difference.
    messages:
      - role: user
        content: The build's broken on that PR. Can you get it green?
    expect:
      # follow-up is deliberately NOT optional: it is the neighbour this trap
      # exists to exclude, and admitting it would make the case unfalsifiable.
      required: [daintree.ci.diagnose-and-fix]
      optional: [daintree.foundation]

  - id: follow-up-not-ci
    category: routing-trap
    note: >-
      The mirror: an existing PR with nothing failing. Reading review state and closing
      out the issue is follow-up's job, and CI must not be pulled in.
    messages:
      - role: user
        content: >-
          That PR got approved yesterday. Can you leave a note on the issue saying it's
          done and close it out?
    expect:
      required: [daintree.workflow.follow-up-on-issue]
      optional: [daintree.foundation]

  - id: ci-not-diagnostics
    category: routing-trap
    note: >-
      "Why isn't this working" about the PROJECT's tests, not about Daintree.
      daintree.diagnostics fences itself to Daintree's own behaviour.
    messages:
      - role: user
        content: Three of my tests started failing after I rebased and I can't see what I broke.
    expect:
      required: [daintree.ci.diagnose-and-fix]
      optional: [daintree.foundation]

  - id: diagnostics-not-ci
    category: routing-trap
    note: "The mirror - the thing that is broken is Daintree, not the suite."
    messages:
      - role: user
        content: >-
          None of the terminal tools are showing up for you any more. Did something
          come unplugged on your end?
    expect:
      required: [daintree.diagnostics]
      optional: [daintree.foundation]

  # ---- memory vs its neighbours -------------------------------------------
  - id: memory-not-status-and-resume
    category: routing-trap
    note: >-
      "What did we decide" is a saved FACT, not a paused workflow. status-and-resume
      answers "where were we"; this asks what was concluded.
    messages:
      - role: user
        content: What did we settle on for the naming convention? I don't want to redo that argument.
    expect:
      required: [daintree.memory.manage-project-memory]
      optional: [daintree.foundation]

  - id: status-and-resume-not-memory
    category: routing-trap
    note: "The mirror - live in-flight work, not a stored fact."
    messages:
      - role: user
        content: I've been away since Friday. What's still running and what was I in the middle of?
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation]

  - id: memory-not-explore
    category: routing-trap
    note: >-
      A decision the code does not record. Sending an explore agent after it would
      search the repository for something that was only ever said out loud.
    messages:
      - role: user
        content: Remind me why we ruled out the queue-based approach?
    expect:
      required: [daintree.memory.manage-project-memory]
      optional: [daintree.foundation]

  # ---- review vs prep-branch ----------------------------------------------
  - id: prep-branch-not-review
    category: routing-trap
    note: >-
      The deliverable is a PR that exists, not a list of findings. prep-branch-for-review
      owns readying and opening; review-change owns judging.
    messages:
      - role: user
        content: I'm done with this. Get it pushed up and open the PR.
    expect:
      required: [daintree.workflow.prep-branch-for-review]
      optional: [daintree.foundation]

  # ---- review vs relay -----------------------------------------------------
  - id: relay-not-review
    category: routing-trap
    note: >-
      The review already exists in another agent's terminal; the job is forwarding it,
      not producing it.
    messages:
      - role: user
        content: >-
          The reviewer in the other tab has written up its notes. Point the implementer
          at them and have it work through the list.
    expect:
      required: [daintree.agents.relay-review-feedback]
      optional: [daintree.foundation]

  # ---- explore vs copytree -------------------------------------------------
  - id: copytree-not-explore
    category: routing-trap
    note: >-
      The deliverable is a BUNDLE of files to hand somewhere else, not an explanation.
      Both start by working out which files matter, which is the confusion.
    messages:
      - role: user
        content: >-
          Pull together the files someone would need to understand the payments flow so
          I can paste them into another tool.
    expect:
      required: [daintree.context.curate-copytree-bundle]
      optional: [daintree.foundation]
