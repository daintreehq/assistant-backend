# daintree.hosts.do-delegated-work: the lane's procedure for one unit of work the hub
# delegated. The Daintree assistant on a Remote Host, enrolled as a lane, has read the
# hub's message (daintree.hosts.handle-hub-message) and now has to do the work on this
# machine: a worktree on the brief's branch from its base commit, the named agent CLI
# launched there, the folder trust dialog answered, the commit and checks verified.
#
# Recall: the issue's own examples, an agent-phrased and a user-phrased request, and the
# situations the procedure must get right (a half-made worktree, a lost launch reply).
# Traps: this runbook wins against the same work asked by the person at this machine
# (daintree.edits.spawn-visible-agent), several units (daintree.orchestration.fan-out-work),
# a started task moved to another agent (daintree.agents.hand-off-task), the envelope
# (daintree.hosts.handle-hub-message) and the hub side (daintree.hosts.delegate-to-host);
# each neighbour wins its reverse trap. The envelope may ride along on a hub-framed request
# (the lane holds it for the reply).

cases:
  # ------------------------------------------------------------------ recall
  - id: do-delegated-work-issue-worktree-claude
    category: single-runbook
    note: >-
      The issue's first selection case, with X filled in. Decided by the positive clause
      "the hub asked me to create a worktree and have Claude write X".
    messages:
      - role: user
        content: The hub asked me to create a worktree and have Claude write a CSV parser with tests.
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-issue-implement-reply-sha
    category: single-runbook
    note: >-
      The issue's second selection case, machine name scrubbed. Decided by "hub message:
      implement this on its run branch and reply with the SHA"; the envelope may ride along
      for the reply.
    messages:
      - role: user
        content: "hub message: implement this on swarm/run-4-unit-3 and reply with the SHA"
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-agent-phrased
    category: single-runbook
    note: >-
      How a lane describes the unit to search_runbooks. Decided by the deliverable: "a new
      worktree on the brief's branch from its base commit, the agent CLI the brief names
      launched in it with the hub's objective and acceptance ... and the agent's commit
      checked by the lane".
    messages:
      - role: user
        content: Carry out the hub's delegated change on this host, a new worktree on the brief's branch from its base commit, the agent it names makes the change, and I verify the commit and the tests before answering
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-user-casual
    category: single-runbook
    note: >-
      Casual, with the main mac standing for the hub: "the hub asks THIS machine to
      implement, fix or build something as one unit of work".
    messages:
      - role: user
        content: the main mac wants the date parser fixed here on a new branch, get claude on it
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-half-made-worktree
    category: single-runbook
    note: >-
      Partial worktree creation on an earlier attempt at the unit: "a setup or launch that
      half happened picked up rather than repeated". The body reconciles before any second
      create. create-plain-worktree rides along on "worktree" today; retrain owed.
    messages:
      - role: user
        content: Setup failed partway through creating the worktree for the hub's unit, so its branch exists but the worktree may not; sort that out before launching the agent
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-lost-launch-reply
    category: single-runbook
    note: >-
      A lost launch reply inside the hub's unit: "a setup or launch that half happened
      picked up rather than repeated" (the body reconciles by the unit's requested pane id).
      daintree.agents.recover-agent, which owns "a launch that returned no terminalId or an
      ambiguous result" for any agent, may ride along. It takes the turn today (rank_miss):
      retrain owed.
    messages:
      - role: user
        content: The agent launch for the hub's change in its new worktree timed out with no reply, so I can't tell whether Codex started there.
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.agents.recover-agent, daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ traps
  - id: do-delegated-work-not-spawn-here
    category: routing-trap
    note: >-
      Hub-delegated work on this host, not a request from the person at this machine.
      Fence: "for the same work asked by the person at this machine
      (daintree.edits.spawn-visible-agent ...)".
    messages:
      - role: user
        content: "The hub's brief: add request ids to the gateway logs on its run branch here, then report the commit"
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-not-hub-side
    category: routing-trap
    note: >-
      This machine received the unit; it is not the hub sending one. Fence: "or for
      handing work to another machine from the hub (daintree.hosts.delegate-to-host)".
    messages:
      - role: user
        content: "This machine got the hub's unit: fix the login redirect bug on the branch it named and verify the commit"
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-not-fan-out
    category: routing-trap
    note: >-
      One unit, not a batch. "asks THIS machine to implement, fix or build something as one
      unit of work"; the fence names "several units, daintree.orchestration.fan-out-work".
    messages:
      - role: user
        content: the hub gave this machine one issue to implement in its own worktree
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-not-hand-off
    category: routing-trap
    note: >-
      New work from the hub, nothing started to move. Fence: "a started task moved to
      another agent, daintree.agents.hand-off-task".
    messages:
      - role: user
        content: The hub wants this host to build the export endpoint from scratch with Codex on the branch it named
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-not-envelope
    category: routing-trap
    note: >-
      Mid-unit, with the message long since read: the worktree is ready and the agent is
      next. "the agent CLI the brief names launched in it with the hub's objective and
      acceptance" decides it; the fence keeps "reading, judging or answering the hub's
      message itself (daintree.hosts.handle-hub-message)" out. start-work-on-issue rides
      along on "worktree ... start" today; retrain owed.
    messages:
      - role: user
        content: The worktree for the hub's unit is ready; start Codex there with the hub's objective and acceptance criteria
    expect:
      required: [daintree.hosts.do-delegated-work]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ reverse traps
  - id: do-delegated-work-trap-local-change
    category: routing-trap
    note: >-
      The person at this machine asking for a change, no hub anywhere:
      daintree.edits.spawn-visible-agent ("any request to CHANGE project code").
    messages:
      - role: user
        content: Have Codex make the CSV export stream rows instead of buffering them, on a fresh branch
    expect:
      required: [daintree.edits.spawn-visible-agent]
      optional: [daintree.foundation]

  - id: do-delegated-work-trap-hub-sends
    category: routing-trap
    note: >-
      The hub sending work to a host: daintree.hosts.delegate-to-host ("ONE piece of WORK
      done by the Daintree assistant on another machine"). This runbook is for the
      machine receiving it.
    messages:
      - role: user
        content: have the assistant on the other mac build the export endpoint on a new branch and send me the SHA
    expect:
      required: [daintree.hosts.delegate-to-host]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-trap-swap-agent
    category: routing-trap
    note: >-
      A started unit moved to another agent: daintree.agents.hand-off-task ("a task an
      agent has STARTED must be finished by a DIFFERENT agent").
    messages:
      - role: user
        content: The Gemini agent on the hub's unit keeps undoing its own fix; swap it for Claude and carry on from its work in that worktree
    expect:
      required: [daintree.agents.hand-off-task]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: do-delegated-work-trap-read-message
    category: routing-trap
    note: >-
      Reading the hub's message and deciding what it wants is the envelope:
      daintree.hosts.handle-hub-message ("read once with assistant.getInbox, checked
      against this lane's project").
    messages:
      - role: user
        content: Open the hub's latest message and work out which project here it is meant for before doing anything
    expect:
      required: [daintree.hosts.handle-hub-message]
      optional: [daintree.hosts.foundation, daintree.foundation]
