# daintree.hosts.shard-test-suite: the hub's side of one test suite split between Remote
# Hosts. This Shell's hub takes one suite at one exact commit, has each host's assistant run a
# disjoint part of it, and merges the parts into one report checked against the suite's own
# test list.
#
# Recall: the issue's own three requests, an agent-phrased and a long user-phrased
# description, and the follow-up shape (a shard that came back empty, run again and folded
# in). Traps: one per declared neighbour where this runbook wins (the same work on every host,
# different pieces placed per host, checks on this machine, a lane running its one shard),
# and a reverse case for each where the neighbour wins and this runbook must not ride along,
# plus one for several agents splitting tests on this machine
# (daintree.orchestration.fan-out-work).

cases:
  # ------------------------------------------------------------------ recall
  - id: shard-test-suite-issue-prove-covered
    category: single-runbook
    note: >-
      The issue's first request. Decided by "ONE test suite run faster by SPLITTING it between
      their Remote Hosts". At base daintree.hosts.swarm-fan-out took it (0.996), though its own
      body refuses a split suite.
    messages:
      - role: user
        content: Split the test suite across the hosts and prove every test was covered.
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-issue-bucket
    category: single-runbook
    note: >-
      The issue's second request. Decided by "each host taking a disjoint part of its tests at
      the same commit" and "one merged test report". At base daintree.hosts.swarm-fan-out
      took it (0.97).
    messages:
      - role: user
        content: Shard this allowed test bucket over three machines and combine the reports.
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-issue-manifest
    category: single-runbook
    note: >-
      The issue's third request. Decided by "one manifest of test ids divided between hosts"
      and "the union checked against that list". At base daintree.hosts.swarm-fan-out took it
      with daintree.worktree.provision-local-environment riding along.
    messages:
      - role: user
        content: Distribute one test manifest across hosts without coverage gaps.
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-agent-phrased
    category: single-runbook
    note: >-
      How a hub agent describes the task to search. Decided by "each shard (an index of a
      total, or a list of tests) run once on one host, and the union checked against that
      list".
    messages:
      - role: user
        content: Shard the backend test suite at one pinned commit across the connected remote hosts, one shard per host, then merge the per-host results and confirm no test was missed or ran twice
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-user-ci-timing-out
    category: single-runbook
    note: >-
      A long user message with the outcome spelled out. Decided by "ONE test suite run faster
      by SPLITTING it between their Remote Hosts" and "with a missing, empty, duplicate or
      retried shard, a timeout and skipped tests named".
    messages:
      - role: user
        content: I have three Macs on the network and a CI run that keeps timing out. I'd like the integration suite at the release commit divided between them, every test run exactly once, and one report at the end that says what failed, what was skipped, and whether any part never came back.
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-empty-shard-retry
    category: single-runbook
    note: >-
      The retry shape. Decided by "with a missing, empty, duplicate or retried shard, a timeout and
      skipped tests named". At base the sweep's version of this went to daintree.hosts.recover-and-clean-up
      with daintree.orchestration.multi-agent.
    messages:
      - role: user
        content: shard two of four came back with zero tests from the linux box, run it again properly and fold it into the combined results
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ traps: this runbook wins
  - id: shard-test-suite-not-swarm-slice
    category: routing-trap
    note: >-
      A different slice per host is not the same work on every host. Decided by "each host
      taking a disjoint part of its tests at the same commit"; daintree.hosts.swarm-fan-out is
      fenced as "the same work or change on every host" and must not ride along.
    messages:
      - role: user
        content: Each host should take a different slice of the unit tests at the same commit, not the whole suite, and I want one combined result
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-not-place-work-one-job
    category: routing-trap
    note: >-
      One suite is one job, not a list of pieces to place. Decided by "ONE test suite run
      faster by SPLITTING it between their Remote Hosts"; daintree.hosts.place-work is fenced
      as "different independent pieces placed one per host".
    messages:
      - role: user
        content: "the tests are one job, not several pieces of work: have the hosts split it at this commit and report one result"
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-not-local-checks
    category: routing-trap
    note: >-
      Checks run on the hosts, not here. Decided by "SPLITTING it between their Remote Hosts";
      daintree.ci.run-local-checks is fenced as "the checks run on this machine".
    messages:
      - role: user
        content: run our checks across the hosts in shards so the whole suite finishes faster, then one combined result
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-not-lane-shard
    category: routing-trap
    note: >-
      The hub's side: it hands out the parts and merges them. Decided by "Use on the hub" and
      "one merged test report"; daintree.hosts.verify-for-hub is fenced as "on a host lane
      running its one shard".
    messages:
      - role: user
        content: split the test run between the remote hosts, each takes its own part at commit 5e2a, then merge their results into one report
    expect:
      required: [daintree.hosts.shard-test-suite]
      optional: [daintree.hosts.foundation, daintree.foundation]

  # ------------------------------------------------------------------ reverse: the neighbour wins
  - id: shard-test-suite-reverse-lane-shard
    category: routing-trap
    note: >-
      This machine is the lane running one shard the hub assigned. daintree.hosts.verify-for-hub
      owns it ("one shard of a suite"); the hub's split must not ride along.
    messages:
      - role: user
        content: the hub assigned this machine the second of three test shards at commit 4b7e; run only that part in a clean worktree and send the counts back
    expect:
      required: [daintree.hosts.verify-for-hub]
      optional: [daintree.hosts.handle-hub-message, daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-reverse-swarm-tests
    category: routing-trap
    note: >-
      The same task on every machine, results compared: daintree.hosts.swarm-fan-out
      ("the SAME WORK done on EVERY Remote Host"). Tests are the subject, but nothing is split.
    messages:
      - role: user
        content: every remote machine should take a shot at adding property-based tests to the date utils, then I'll compare the results
    expect:
      required: [daintree.hosts.swarm-fan-out]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-reverse-place-tickets
    category: routing-trap
    note: >-
      Separate tickets, one host each by load: daintree.hosts.place-work ("DIFFERENT,
      independent pieces of work"). Test-related, but not one suite split.
    messages:
      - role: user
        content: put each of these three test-infrastructure tickets on whichever host is least busy
    expect:
      required: [daintree.hosts.place-work]
      optional: [daintree.hosts.foundation, daintree.foundation]

  - id: shard-test-suite-reverse-local-parallel
    category: routing-trap
    note: >-
      Parallel workers on this machine are still the person's own check run:
      daintree.ci.run-local-checks ("checks RUN and the results reported").
    messages:
      - role: user
        content: run the unit tests in parallel on this machine and list whatever fails
    expect:
      required: [daintree.ci.run-local-checks]
      optional: [daintree.foundation]

  - id: shard-test-suite-reverse-local-agents
    category: routing-trap
    note: >-
      Test files split between agents on this machine, each fixing its own:
      daintree.orchestration.fan-out-work ("split one goal into disjoint file-scoped tasks").
    messages:
      - role: user
        content: give each failing test file to its own agent in a separate worktree here and have it fix that file
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]
