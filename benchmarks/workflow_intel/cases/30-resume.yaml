# workflow_resume_digest cases — several workflow snapshots → a ranked, prompt-ready
# resume package. Objectively scorable (no labels): the workflow blocked on the user
# should be surfaced as the focus / top rank.
cases:
  - id: resume-focus-on-blocked
    task: workflow_resume_digest
    category: resume
    note: wf-b is blocked awaiting a user decision; it should be the suggested focus.
    input:
      user_message: "Where were we?"
      workflows:
        - id: wf-a
          goal: "Refactor the checkout module."
          status: active
          nodes:
            - {id: a1, title: "Read the module", status: done}
            - {id: a2, title: "Draft the refactor", status: active}
        - id: wf-b
          goal: "Choose a payments provider and wire it in."
          status: blocked
          blockers:
            - {reason: "Waiting for the user to choose Stripe vs Adyen."}
          nodes:
            - {id: b1, title: "Compare providers", status: done}
            - {id: b2, title: "Wire the SDK", status: pending}
    expect:
      suggested_focus_workflow_id: wf-b

  - id: resume-single-workflow
    task: workflow_resume_digest
    category: resume
    input:
      user_message: "resume"
      workflows:
        - id: only-1
          goal: "Prepare the branch for review."
          status: active
          nodes:
            - {id: x1, title: "Run the tests", status: done}
            - {id: x2, title: "Write the PR description", status: active}
    expect:
      suggested_focus_workflow_id: only-1
