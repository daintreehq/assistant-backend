# workflow_reconcile cases — a graph snapshot + recent events → a typed patch +
# next action. Scored on no 502 (structural validity survived, incl. terminal-status
# immutability) and first-try.
cases:
  - id: reconcile-node-completed
    task: workflow_reconcile
    category: reconcile
    input:
      reason: tool_result
      workflow:
        id: wf-1
        goal: "Fix the flaky test and open a PR."
        nodes:
          - {id: n1, title: "Reproduce the flake", status: done, depends_on: []}
          - {id: n2, title: "Patch the race", status: active, depends_on: [n1]}
          - {id: n3, title: "Open the PR", status: pending, depends_on: [n2]}
      recent_events:
        - {type: tool_result, node_id: n2, summary: "Patch applied; the test passes 50x."}
      tool_inventory:
        - {name: agentTask__spawnForEdits}
        - {name: terminal__awaitAll}
    expect: {}

  - id: reconcile-blocker-appears
    task: workflow_reconcile
    category: reconcile
    input:
      reason: failure
      workflow:
        id: wf-2
        goal: "Deploy the release."
        nodes:
          - {id: a, title: "Run the test suite", status: active, depends_on: []}
          - {id: b, title: "Deploy", status: pending, depends_on: [a]}
      recent_events:
        - {type: tool_result, node_id: a, summary: "Tests failed: 3 assertions in billing_test."}
      tool_inventory:
        - {name: terminal__run__async}
        - {name: terminal__awaitAll}
    expect: {}
