# memory_distill — turn a transcript into durable facts. No single ground-truth
# string, so scored by PHRASE-ANCHORED RECALL (each expected concept must appear,
# case-insensitively, in some distilled fact) plus a FALSE-CAPTURE guard (a phrase
# that must NOT be captured — an ephemeral detail the distiller should drop).
cases:
  - id: distill-project-facts
    task: memory_distill
    category: distill
    input:
      transcript: |
        User: We use pnpm here, not npm. And always run the linter before committing.
        Assistant: Got it. I ran `pnpm lint` and it passed.
        User: Also, the staging DB password rotates weekly — don't hardcode it.
    expect_recall: ["pnpm", "lint"]
    forbid_recall: []   # recall is the robust signal; substring "don't-capture" grading is too brittle

  - id: distill-preferences
    task: memory_distill
    category: distill
    input:
      transcript: |
        User: I prefer short PR descriptions, bullet points only, no emojis.
        Assistant: Understood.
        User: My timezone is CET.
    expect_recall: ["bullet", "CET"]
    forbid_recall: []
