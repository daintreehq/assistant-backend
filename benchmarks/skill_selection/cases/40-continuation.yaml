# Mid-workflow continuations: the active skill governs work still in progress and the
# new instruction continues it. Dropping the active skill strands the assistant
# (recall failure); the foundation may ride along.

cases:
  - id: continue-multi-agent-relay
    category: continuation
    active: [daintree.orchestration.multi-agent, daintree.orchestration.basic]
    messages:
      - role: user
        content: >-
          Spawn two agents — alpha to draft the parser refactor plan, bravo to
          critique it — and relay between them.
      - role: assistant
        content: Spawning both agents now.
        tool_calls: [agentTask.spawnForEdits, agentTask.spawnForEdits]
      - role: tool
        name: agentTask.spawnForEdits
        content: 'spawned terminal 12 "alpha" (running)'
      - role: assistant
        content: >-
          Both agents are up. Alpha produced a draft plan; bravo has written a
          critique flagging the error-recovery section.
      - role: user
        content: Great — now relay bravo's critique to alpha and get a revised plan.
    expect:
      required: [daintree.orchestration.multi-agent]
      optional: [daintree.orchestration.basic]

  - id: continue-issue-check-agent
    category: continuation
    active: [daintree.workflow.start-work-on-issue]
    messages:
      - role: user
        content: Start work on issue 231, the CSV export bug.
      - role: assistant
        content: Starting the workflow for issue 231.
        tool_calls: [workflow.startWorkOnIssue]
      - role: tool
        name: workflow.startWorkOnIssue
        content: >-
          worktree csv-export-231 created; agent spawned in terminal 7; supervisor
          watcher attached
      - role: assistant
        content: >-
          Issue 231 is underway — worktree csv-export-231, agent in terminal 7 with
          a supervisor watcher attached.
      - role: user
        content: How's the agent doing on the issue? Anything stuck?
    expect:
      required: [daintree.workflow.start-work-on-issue]
      optional: [daintree.orchestration.basic]

  - id: continue-competition-tally
    category: continuation
    active: [daintree.orchestration.competition, daintree.orchestration.basic]
    messages:
      - role: user
        content: >-
          Run a competition: four agents each design an onboarding flow, then they
          peer-vote for the best.
      - role: assistant
        content: >-
          All four submissions are in the scratch store. Ready to run the voting
          round.
      - role: user
        content: Do it — collect the votes and tally the winner now.
    expect:
      required: [daintree.orchestration.competition]
      optional: [daintree.orchestration.basic]

  - id: continue-rename-two-more
    category: continuation
    active: [daintree.terminals.rename, daintree.orchestration.basic]
    messages:
      - role: user
        content: Give my terminals clear names.
      - role: assistant
        content: 'Renamed four terminals: "build", "dev server", "agent: auth fix", "logs".'
      - role: user
        content: Also rename the two new ones that just opened.
    expect:
      required: [daintree.terminals.rename]
      optional: [daintree.orchestration.basic]

  - id: continue-recipe-supervise
    category: continuation
    note: The recipe skill covers supervising the LIVE agent the recipe spawned.
    active: [daintree.recipe.run-or-create]
    messages:
      - role: user
        content: Run the pr-review recipe.
      - role: assistant
        content: Running the recipe.
        tool_calls: [recipe.run]
      - role: tool
        name: recipe.run
        content: >-
          recipe pr-review started: terminal 4 (diff viewer), terminal 5 (review
          agent, running)
      - role: assistant
        content: >-
          The pr-review recipe is up — the review agent is working in terminal 5.
      - role: user
        content: Watch that review agent and tell me when it finishes.
    expect:
      required: [daintree.recipe.run-or-create]
      optional: [daintree.orchestration.basic]

  - id: continue-prep-after-verdict
    category: continuation
    active: [daintree.workflow.prep-branch-for-review, daintree.orchestration.basic]
    messages:
      - role: user
        content: Is this branch ready for review?
      - role: assistant
        content: Checking review readiness.
        tool_calls: [workflow.prepBranchForReview]
      - role: tool
        name: workflow.prepBranchForReview
        content: 'verdict: READY — tests green, lint clean, 2 commits ahead of main, no PR yet'
      - role: assistant
        content: >-
          The readiness check came back clean: tests green, lint clean, two commits
          ahead of main, no PR open yet.
      - role: user
        content: Go ahead — push and open the PR.
    expect:
      required: [daintree.workflow.prep-branch-for-review]
      optional: [daintree.orchestration.basic]
