# Neighbor-skill routing traps: the whenToUse lines route between skills that share
# keywords. Picking the trap skill is a precision failure (extra).

cases:
  - id: close-idle-terminals-is-cleanup
    category: routing-trap
    note: >-
      Re-pointed against the 23-skill catalog. The rename bait is unchanged, but the
      answer is no longer the foundation: workspace-cleanup's trigger list is the user's
      own teardown words ("close these", "tidy up the terminals") and this is a PLURAL
      close, while the foundation claims only "closing ONE the user named". The
      keep-the-build exception is the classify-safe/unsafe step of cleanup's own runbook.
    messages:
      - role: user
        content: Close all the idle terminals, but keep the one running the build.
    expect:
      required: [daintree.orchestration.workspace-cleanup]
      optional: [daintree.foundation]

  - id: resume-session-not-foundation
    category: routing-trap
    note: >-
      Moved here from 60-foundation-only.yaml. "Resume the session I closed yesterday" is
      status-and-resume's own trigger ("to pick up / resume something from an earlier
      session"), and the foundation now hands it over by name ('"where were we" across
      sessions is status-and-resume'). The trap is the auto-paired foundation winning by
      default on a request shaped like a state read — so the failure measured here is a
      MISS, not an extra.
    messages:
      - role: user
        content: Can we resume the session I closed yesterday afternoon? The parser one.
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation]

  - id: independent-poll-not-multi-agent
    category: routing-trap
    note: Independent opinions with no cross-talk -> poll, not multi-agent relay.
    messages:
      - role: user
        content: >-
          Get independent takes from my pinned agents on this API design — no
          discussion between them — then give me the consensus.
    expect:
      required: [daintree.agents.poll-pinned-agents]
      optional: [daintree.foundation]

  - id: debate-is-multi-agent
    category: routing-trap
    note: Genuine back-and-forth relay -> multi-agent, not poll/competition.
    messages:
      - role: user
        content: >-
          Spawn three agents and have them debate the best approach to the cache
          invalidation bug — relay the arguments between them until they converge.
    expect:
      required: [daintree.orchestration.multi-agent]
      optional: [daintree.foundation]

  - id: peer-vote-is-competition
    category: routing-trap
    note: Independent outputs + peer scoring -> competition, not interview.
    messages:
      - role: user
        content: >-
          Have four agents each write a release announcement, then have them
          peer-review each other's drafts and vote for the best one.
    expect:
      required: [daintree.orchestration.competition]
      optional: [daintree.foundation]

  - id: judge-led-interview
    category: routing-trap
    note: >-
      The LIGHT depth of the merged interview skill — a judge questions candidates and
      names a winner, with no codebase verification.
    messages:
      - role: user
        content: >-
          Spawn an interviewer agent to interview three candidate agents about
          testing strategy and pick a winner.
    expect:
      required: [daintree.orchestration.interview]
      optional: [daintree.foundation]

  - id: interview-with-verification
    category: routing-trap
    note: >-
      The DEEP depth of the same skill: the old verified-interview folded into
      daintree.orchestration.interview, whose whenToUse now claims both depths ("a deep
      one where the judge verifies candidates' claims against the codebase ... and
      narrows to a top 2"). Paired with judge-led-interview above, this checks the merge
      did not strand the deep phrasing.
    messages:
      - role: user
        content: >-
          Run an interview where the judge actually checks the candidates' claims
          against the codebase, asks challenging follow-ups, narrows to a top 2,
          and then picks the winner.
    expect:
      required: [daintree.orchestration.interview]
      optional: [daintree.foundation]

  - id: tie-needs-runoff
    category: routing-trap
    note: A tie in an existing vote -> runoff tie-breaker, not a fresh competition.
    messages:
      - role: user
        content: >-
          Earlier the four agents voted on the two logo taglines and it ended 2-2.
          Run a tie-breaker round with the same agents.
    expect:
      required: [daintree.orchestration.runoff-tiebreaker]
      optional: [daintree.foundation]

  - id: single-agent-not-poll
    category: routing-trap
    note: One named agent -> ask-and-relay, not a fleet poll.
    messages:
      - role: user
        content: Ask nova — just nova — what she thinks about the new queue design.
    expect:
      required: [daintree.agents.ask-and-relay]
      optional: [daintree.foundation]

  - id: finished-issue-is-prep
    category: routing-trap
    note: Wrapping up finished work -> prep-branch-for-review, not start-work-on-issue.
    messages:
      - role: user
        content: >-
          The work on issue 88 is finished. Wrap it up and get it in front of
          reviewers.
    expect:
      required: [daintree.workflow.prep-branch-for-review]
      optional: [daintree.foundation]

  - id: worktree-with-recipe
    category: routing-trap
    note: Worktree + startup recipe -> recipe skill, not start-work-on-issue.
    messages:
      - role: user
        content: Create a new worktree with the standard dev recipe.
    expect:
      required: [daintree.recipe.run-or-create]
      optional: [daintree.foundation]

  - id: label-tabs-not-fleet-report
    category: routing-trap
    note: >-
      Covers daintree.terminals.rename's carve-out against supervise-fleet, which had no
      trap. The bait is real: inspecting what every agent is on is supervise-fleet's own
      sweep ("how's everyone doing?", "catch me up on the agents"). The deciding clause is
      rename's "The deliverable is new TITLES. Do not use when the user wants a report on
      what the agents are doing rather than a retitle (use
      daintree.orchestration.supervise-fleet)" — here the inspection is only the means and
      the labels are the deliverable ("Not a rundown"). supervise-fleet agrees from its own
      side ("or for retitling tabs (daintree.terminals.rename)"), so picking it is an extra.
      Worded around "label" rather than rename/retitle/title so this measures routing, not
      keyword overlap with the whenToUse.
    messages:
      - role: user
        content: >-
          Third time today I've typed into the wrong terminal. Can you go along the
          row, work out what each one is on, and stick a short label on it? Not a
          rundown — I just want to read it off the tabs.
    expect:
      required: [daintree.terminals.rename]
      optional: [daintree.foundation]

  - id: no-ticket-change-not-issue-workflow
    category: routing-trap
    note: >-
      Covers daintree.edits.spawn-visible-agent's carve-outs, which had no trap at all. The
      bait is forge-workflow shaped — a backlog grievance about a known defect, the kind of
      thing that usually arrives as a ticket — but the deciding clause is
      start-work-on-issue's own "Do not use ... for a change with no forge issue behind it
      (use daintree.edits.spawn-visible-agent)", and the user says outright that nothing was
      ever filed. One unit of work, so fan-out-work's "signal is PLURALITY plus
      INDEPENDENCE" does not fire either; the deliverable is a code change landing, not an
      answer relayed back. Every declared neighbour is left out of required AND optional, so
      the case asserts the whole carve-out list rather than one clause of it.
    messages:
      - role: user
        content: >-
          This one never made it onto the board and I'm not going to file it now —
          the uploader retries three times back to back and hammers the API when the
          CDN blips. Put an agent on adding proper backoff.
    expect:
      required: [daintree.edits.spawn-visible-agent]
      optional: [daintree.foundation]
