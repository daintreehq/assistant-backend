# Fan-out, status/resume, verification and agent recovery — the four skills that
# sit closest to the "several agents" and "how is it going" neighbourhoods and had
# zero required coverage before this file.
#
# The collisions measured here:
#   * plurality      — a BATCH of issues is fan-out-work; ONE issue stays start-work-on-issue
#   * independence   — separate units of work is fan-out-work, not multi-agent/conversation/poll
#   * time horizon   — "where were we" across sessions is status-and-resume, not a plain
#                      foundation state read and not a right-now supervise-fleet sweep
#   * deliverable    — judging an agent's "done" is verify-agent-work, not branch prep or relay
#   * fault          — a hung/silent agent or a spawn that never landed is recover-agent, not
#                      answer-waiting-agent (which needs a QUESTION) and not a fleet sweep

cases:
  - id: fanout-six-issues-not-single
    category: routing-trap
    note: >-
      PLURALITY decides it. start-work-on-issue is scoped to ONE forge issue and its
      whenToUse hands "SEVERAL issues at once, an agent per ticket, working a batch in
      parallel" to fan-out-work. Picking start-work-on-issue here is the precision failure.
    messages:
      - role: user
        content: >-
          Six bugs have been sitting in the tracker all week with nobody on them.
          Let's clear the lot in one go — put someone on each of them instead of
          grinding through them one after another.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: single-issue-412-not-fanout
    category: routing-trap
    note: >-
      The singular counterpart to fanout-six-issues-not-single. A backlog is mentioned as
      scenery but exactly ONE issue is being started, which is start-work-on-issue's whole
      scope; fan-out-work requires PLURALITY of units, and there is one.
    messages:
      - role: user
        content: >-
          There's a pile of open bugs but I only care about one of them right now —
          412, the flaky upload test. Get a branch set up and an agent onto it.
    expect:
      required: [daintree.workflow.start-work-on-issue]
      optional: [daintree.foundation]

  - id: fanout-disjoint-subtasks-not-multi-agent
    category: routing-trap
    note: >-
      INDEPENDENCE decides it, not agent count. multi-agent requires a synthesis target —
      several agents on the SAME problem converging on ONE answer — while fan-out-work's
      summary explicitly covers "one goal split into disjoint file-scoped sub-tasks". The
      user rules out coordination and gives each agent its own files, so there is no shared
      deliverable. Picking multi-agent or conversation is the precision failure.
    messages:
      - role: user
        content: >-
          The auth rewrite is way too much for one agent. Carve it into four chunks
          that don't overlap — different files each — and have them all going at the
          same time. They shouldn't need to coordinate with each other.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: fanout-pinned-agents-get-work-not-poll
    category: routing-trap
    note: >-
      "my pinned agents" is the bait for poll-pinned-agents, whose own whenToUse decides
      against it - "The deliverable is opinions, not work. Do not use when each agent is
      instead to be given its own unit of real work (use daintree.orchestration.fan-out-work)".
      Backlog items being worked is work, one unit each, so fan-out-work wins.
    messages:
      - role: user
        content: >-
          Hand the next four things in the backlog out to my pinned agents — one
          item each, all of them worked at once.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: resume-yesterday-not-fleet-triage
    category: routing-trap
    note: >-
      TIME HORIZON decides it. The session was closed, so the question spans a session
      boundary — status-and-resume's stated trigger ("what was I working on", "catch me
      up", "to pick up / resume something from an earlier session"). The live neighbour
      is the FOUNDATION, which auto-pairs with everything and can win by default on a
      question shaped like a state read; its own whenToUse forbids that here ('"where
      were we" across sessions is status-and-resume'), and supervise-fleet carries the
      same redirect. Because the neighbour sits in optional, the failure this measures
      is a MISS (answering from a plain state read), not an extra. Deliberately phrased
      without lifting "where were we" or "what is still open" so the pick cannot ride on
      lexical overlap with the trigger list.
    messages:
      - role: user
        content: >-
          I closed the laptop halfway through something last night and I've completely
          lost the thread. Can you piece together what I had on the go before I stopped,
          and what I never got to the end of?
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation]

  - id: resume-stale-ledger-rows
    category: routing-trap
    note: >-
      Ledger hygiene is named in status-and-resume's whenToUse — "the workflow list or
      ledger itself — why it still shows finished work as active, tidying stale rows".
      workspace-cleanup is the neighbour ("mark those workflows done") but it demands
      teardown of workspace state in the user's own words and explicitly refuses status
      questions; nothing here closes a terminal or deletes a worktree, and the subject is
      the ledger being wrong.
    messages:
      - role: user
        content: >-
          The workflow list still says three things are in progress, but I merged all
          of those last week. Why does it think they're still running? Get the list
          honest again.
    expect:
      required: [daintree.orchestration.status-and-resume]
      optional: [daintree.foundation]

  - id: verify-agent-done-before-merge
    category: routing-trap
    note: >-
      DELIVERABLE decides it. The PR is already open, so prep-branch-for-review has real
      lexical pull ("PR", "branch") but nothing left to do — and its own whenToUse refuses
      the substance: "Do not use to judge whether an agent's work is actually correct or
      complete before trusting it (use daintree.orchestration.verify-agent-work)". The ask
      is a verdict on the agent's claim with an irreversible step next, which is
      verify-agent-work's stated trigger. Picking prep is the precision failure. Phrased
      to avoid lifting "verify this before I merge" or "it says the tests pass, confirm
      that" verbatim off verify-agent-work's own trigger list.
    messages:
      - role: user
        content: >-
          Terminal 5's agent has declared itself done on the migration and reckons it's
          all clean. The PR is sitting there already — one click and it's in main. I'm
          not clicking that on the agent's say-so, so go and satisfy yourself it really
          did what it claims.
    expect:
      required: [daintree.orchestration.verify-agent-work]
      optional: [daintree.foundation]

  - id: verify-review-claim-not-relay
    category: routing-trap
    note: >-
      A reviewer agent's output baits relay-review-feedback, but the user declines to
      forward it and asks for the work itself to be judged — relay-review-feedback's own
      whenToUse sends exactly that to verify-agent-work ("Do not use to judge whether the
      reviewed work is actually done or correct"). Closing the issue is the irreversible
      next step that verify-agent-work names.
    messages:
      - role: user
        content: >-
          One of the agents looked over the auth fix and came back saying it's
          complete and solid. I don't want to just take that at face value and close
          the issue — check the work itself first.
    expect:
      required: [daintree.orchestration.verify-agent-work]
      optional: [daintree.foundation]

  - id: recover-silent-agent-not-question
    category: routing-trap
    note: >-
      FAULT plus SCOPE decide it. answer-waiting-agent needs an agent asking a QUESTION and
      the user rules that out ("it's not asking me anything"); recover-agent's whenToUse
      claims the silent/hung/unresponsive case directly. supervise-fleet is the other bait
      but it is a whole-cohort sweep and its whenToUse hands "rescuing one broken or hung
      agent" to recover-agent — this is one named terminal.
    messages:
      - role: user
        content: >-
          Terminal 4 has been frozen on the same line of output for twenty minutes.
          It's not asking me anything, it's just stopped dead. Has it fallen over or
          is it still working?
    expect:
      required: [daintree.agents.recover-agent]
      optional: [daintree.foundation]

  - id: recover-spawn-no-terminal-id
    category: routing-trap
    note: >-
      The spawn already happened and went wrong, so this is recovery rather than a fresh
      launch — recover-agent's whenToUse covers "a launch that returned no terminalId or an
      ambiguous result", and spawn-visible-agent's own text defers ("if the agent is already
      running and has gone wrong use daintree.agents.recover-agent"). Re-picking
      spawn-visible-agent off the spawn keywords is the precision failure.
    messages:
      - role: user
        content: Get an agent going on the 2.4 changelog.
      - role: assistant
        content: Launching one now.
        tool_calls: [agentTask.spawnForEdits]
      - role: tool
        name: agentTask.spawnForEdits
        content: 'ok: true'
      - role: assistant
        content: That should be running now.
      - role: user
        content: >-
          Should be? There's no new tab anywhere and you never gave me a terminal for
          it. Did that thing actually launch?
    expect:
      required: [daintree.agents.recover-agent]
      optional: [daintree.foundation]

  - id: shift-resume-to-fanout-batch
    category: topic-shift
    note: >-
      The catch-up is answered and closed out; the new instruction is a batch hand-out, so
      status-and-resume must be evicted. status-and-resume reconstructs what is in flight —
      it does not start work — and the new ask carries fan-out-work's PLURALITY plus
      INDEPENDENCE signal.
    active: [daintree.orchestration.status-and-resume, daintree.foundation]
    messages:
      - role: user
        content: Where did we leave off yesterday?
      - role: assistant
        content: >-
          Two things were still open: the CSV export fix, which has a PR up waiting on
          review, and the parser refactor, which never got past its branch.
      - role: user
        content: >-
          Right, thanks. Park all that — there are five bugs in the sprint backlog I
          want worked through today, all at the same time rather than one by one.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]

  - id: wake-fanout-agent-reported-done
    category: background-wake
    note: >-
      No new user message; one supervisor watcher from the batch fired. fan-out-work owns
      supervising the fleet it launched ("then supervise the whole fleet in the background")
      and four of its agents are still running, so the batch skill is kept — the same shape
      as wake-issue-agent-finished. supervise-fleet is not warranted (nobody asked for a
      cohort sweep) and neither is verify-agent-work (no claim is being challenged).
    turn_context: >-
      Background wake: supervisor watcher fired for terminal 9 ("bug 214"), one of the
      five agents launched in this batch — it reports its work finished and a queue
      message is pending resolution. The other four batch agents are still running.
    active: [daintree.orchestration.fan-out-work, daintree.foundation]
    available_tools: [context.snapshot, queue.resolve, terminal.summarize, watcher.cancel, workflow.list]
    messages:
      - role: user
        content: >-
          Put an agent on each of the five bugs in the sprint backlog and let them run
          in the background.
      - role: assistant
        content: >-
          All five are up — one agent per bug, each in its own worktree, with a
          supervisor watcher attached. I'll follow up as they report in.
    expect:
      required: [daintree.orchestration.fan-out-work]
      optional: [daintree.foundation]
