# Utility-task shapes (POST /v1/daintree/tasks), measured against live endpoints.
#
# These are the small-model calls the CLI fires DURING a turn — a watcher polling a
# terminal, a summarize before feeding output back to the main model. They are not
# on the turn's first-byte path, but they are frequent and synchronous from the
# CLI's point of view, so their latency is felt as sluggishness.
#
# `tail` payloads are deliberately realistic in size: a watcher classifying two
# lines is not the call that hurts.
cases:
  - id: task_watcher_classify
    kind: task
    title: watcher_classify (json, tiny output)
    task: watcher_classify
    data:
      goal: "Wait for the test suite to finish and report pass/fail."
      terminal_state:
        agent_state: working
        runtime_status: running
        last_output_at: "2026-08-08T06:40:11Z"
      tail: |
        $ pytest -q
        ........................................................................ [ 32%]
        ........................................................................ [ 64%]
        ..............................F.........................................  [ 96%]
        ....                                                                      [100%]
        =================================== FAILURES ===================================
        _____________________ test_multi_currency_cart_totals __________________________
        cart = <acme.web.cart.Cart object at 0x10f3a2b40>

            def test_multi_currency_cart_totals(cart):
                cart.add("sku-1", currency="EUR", amount=1200)
                cart.add("sku-2", currency="USD", amount=800)
        >       assert cart.total("USD") == 2093
        E       assert 2000 == 2093
        tests/test_cart.py:88: AssertionError
        =========================== short test summary info ============================
        FAILED tests/test_cart.py::test_multi_currency_cart_totals - assert 2000 == 2093
        1 failed, 219 passed in 12.44s

  - id: task_terminal_summarize
    kind: task
    title: terminal_summarize (text, prose output)
    task: terminal_summarize
    data:
      purpose: "Tell the main model what happened so it can decide the next step."
      tail: |
        $ git status
        On branch feature/checkout-refactor
        Your branch is ahead of 'origin/feature/checkout-refactor' by 3 commits.

        Changes not staged for commit:
          modified:   src/acme/web/cart.py
          modified:   src/acme/web/currency.py
          modified:   tests/test_cart.py

        $ pytest -q tests/test_cart.py
        ..............................F....
        FAILED tests/test_cart.py::test_multi_currency_cart_totals - assert 2000 == 2093
        1 failed, 34 passed in 3.10s

        $ git log --oneline -3
        3f2a11c Convert cart totals to minor units
        9c8e004 Add currency conversion table
        1b77de2 Extract cart total calculation

  - id: task_terminal_extract_text
    kind: task
    title: terminal_extract_text (text, targeted extraction)
    task: terminal_extract_text
    data:
      terminal_ids: ["term-1"]
      instruction: "Extract the exact assertion failure and the file:line it came from."
      tail: |
        =================================== FAILURES ===================================
        _____________________ test_multi_currency_cart_totals __________________________
        >       assert cart.total("USD") == 2093
        E       assert 2000 == 2093
        tests/test_cart.py:88: AssertionError
        =========================== short test summary info ============================
        FAILED tests/test_cart.py::test_multi_currency_cart_totals - assert 2000 == 2093
