# The skill selector in isolation — the one call that sits directly on the turn's
# first-byte path, so its latency is added to EVERY cold turn before the main model
# is even opened.
#
# Measured separately from the turn cases because a turn's TTFT mixes selection with
# upstream open + prefill + generation, and the selector's failure mode (a JSON
# output that fails to parse, forcing a silent second round-trip) is invisible in
# that aggregate. `repair_rate` here is the metric the turn cases cannot see.
cases:
  - id: selector_greeting
    kind: selector
    title: Selector on a greeting (correct answer is "no skills")
    messages:
      - role: user
        content: "Hello!"

  - id: selector_work_request
    kind: selector
    title: Selector on a real work request (must route to skills)
    messages:
      - role: user
        content: "Start work on issue 412 — the checkout totals are wrong on multi-currency carts. Get a branch going."

  - id: selector_ambiguous
    kind: selector
    title: Selector on an ambiguous mid-session ask
    # The shape most likely to make the model ramble in its `reason` field, which is
    # where the length-truncation failure originates.
    messages:
      - role: user
        content: "That didn't work the way I expected. Can you look at what the agent in the second terminal actually did, and figure out whether the merge or the test setup is at fault?"
