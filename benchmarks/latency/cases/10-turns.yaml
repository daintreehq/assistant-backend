# Realistic /respond turn shapes, measured end-to-end against live endpoints.
#
# Every case drives ChatOrchestrator.complete with the captured CLI tool inventory
# and a representative startup/runtime block — the same bytes a real session sends.
# `prime` cases run a throwaway turn first to obtain a valid state token, so the
# continuation shape exercises the no-selector cadence rather than a cold turn.
cases:
  - id: cold_greeting
    kind: turn
    title: Cold greeting (first turn of a session)
    # The shape from the measured session log: no state token, full tool inventory,
    # a trivial message. Selector runs and picks nothing. This is the turn a user
    # judges the product's responsiveness by, and it is the worst first-byte case
    # because nothing can be reused.
    stream: true
    prime: false
    messages:
      - role: user
        content: "Hello!"

  - id: cold_work_request
    kind: turn
    title: Cold work request (first turn, selector must pick skills)
    # Same cold shape, but the selector has real routing work to do and the winning
    # skills' bodies are injected into the main prompt. Separates "selector is slow"
    # from "selector had nothing to do".
    stream: true
    prime: false
    messages:
      - role: user
        content: "Start work on issue 412 — the checkout totals are wrong on multi-currency carts. Get a branch going."

  - id: warm_continuation
    kind: turn
    title: Warm tool-result continuation (selector must NOT run)
    # Round 2 of the SAME turn: the assistant called a tool, the CLI is feeding the
    # result back under the same turn_id. `_should_run_selector` skips selection
    # entirely, so this isolates the main-model path from selection cost. It is also
    # the most FREQUENT shape in a real session — a working turn is mostly
    # continuation rounds, so its cost is paid over and over.
    stream: true
    prime: true
    reuse_turn_id: true
    messages:
      - role: user
        content: "Start work on issue 412 — the checkout totals are wrong on multi-currency carts."
      - role: assistant
        content: ""
        tool_calls:
          - id: call_1
            type: function
            function:
              name: worktree__list
              arguments: "{}"
      - role: tool
        tool_call_id: call_1
        content: '{"worktrees":[{"id":"main","path":"/Users/dev/Projects/acme/web","branch":"develop","isMain":true,"status":"stable"}]}'

  - id: cold_greeting_nonstream
    kind: turn
    title: Cold greeting, non-streaming (full-response latency)
    # The non-streaming path has no first-byte escape hatch: the client waits for the
    # whole generation. Measures the total the /tasks-style callers actually feel.
    stream: false
    prime: false
    messages:
      - role: user
        content: "Hello!"

  - id: warm_new_turn
    kind: turn
    title: Warm NEW turn (valid state, selector runs)
    # A follow-up instruction in an established session: the state token is valid and
    # names the current catalog, so the selector DOES run but the orchestrator can
    # speculatively open the main stream against the prior active set in parallel.
    # This is the shape that shows the full select->assemble->open sequence.
    stream: true
    prime: true
    messages:
      - role: user
        content: "Now check whether the currency conversion table is the actual source of the rounding error."
